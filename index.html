          '[발신번호] 카드사 발신번호 목록을 앱에서 등록하면 그 번호의 문자만 자동 등록',
          '[문자알림] 가족 코드 대신 무작위 신호 ID로 우리 가족 문자만 실시간 반영',
          '[취소상계] 카드사 파일의 취소 건은 60일 안의 짝 승인 건을 찾아 한 번만 상계',
          '[중복판정] 가게 이름 앞 두 글자 비교 제거 (GS25 ≠ GS칼텍스, 스타벅스 ≠ 스타필드)',
          '[분류] 쿠팡이츠는 배달음식, 링크·카드명 줄은 가맹점에서 제외, 분류는 가맹점 이름 기준'
        ]
      },
      {
        version: 'v1.0',
        date: '2026-10-29',
        title: '이전 개발 버전 (v0.1 ~ v1.0)',
        changes: ['v1.1부터 호환되지 않음. 기록은 이전 파일 참고']
      }
    ];
    // =====================================================================
    // ▲▲▲ [버전 히스토리 붙여넣는 공간 끝] ▲▲▲
    // =====================================================================

    function App() {
      const [familyPass, setFamilyPass] = useState(() => {
        try { return localStorage.getItem(STORAGE_KEY_PASS) || ''; } catch (e) { return ''; }
      });
      const [isUnlocked, setIsUnlocked] = useState(() => {
        try { return (localStorage.getItem(STORAGE_KEY_PASS) || '').length >= MIN_CODE_LENGTH; } catch (e) { return false; }
      });
      const [passInput, setPassInput] = useState('');

      const [showCodeMigrateModal, setShowCodeMigrateModal] = useState(false);
      const [newPassTarget, setNewPassTarget] = useState('');
      const [isMigrating, setIsMigrating] = useState(false);

      const [expenses, setExpenses] = useState([]);
      const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
      const [activeTab, setActiveTab] = useState('list');
      const [currentUser, setCurrentUser] = useState('남편');
      const [filterUser, setFilterUser] = useState('전체');
      const [selectedMonth, setSelectedMonth] = useState(() => getKSTDateTimeString().slice(0, 7));

      const [syncStatus, setSyncStatus] = useState('connecting');
      const [lastSyncTime, setLastSyncTime] = useState('');
      const [errorDetail, setErrorDetail] = useState('');

      const [showVersionModal, setShowVersionModal] = useState(false);
      const [showWebhookModal, setShowWebhookModal] = useState(false);
      const [toastMsg, setToastMsg] = useState('');

      const [editingId, setEditingId] = useState(null);
      const [editForm, setEditForm] = useState({ store: '', amount: 0, date: '', memo: '', payer: '남편', pay: 'none' });

      const [isScanning, setIsScanning] = useState(false);
      const [scanResult, setScanResult] = useState(null);   // AI가 읽은 결과 (등록 전 확인·수정용)
      const [scanError, setScanError] = useState('');
      const [scanPreview, setScanPreview] = useState('');
      const [smsText, setSmsText] = useState('');

      const [newCatName, setNewCatName] = useState('');
      const [selectedCatId, setSelectedCatId] = useState('c1');
      const [newSubName, setNewSubName] = useState('');

      // 문자 알림 ID(가족 코드 대신 쓰는 무작위 값)와 카드사 발신번호 목록
      const [signalId, setSignalId] = useState('');
      const [allowedSenders, setAllowedSenders] = useState([]);
      const [senderInput, setSenderInput] = useState('');
      const [dbSchemaVersion, setDbSchemaVersion] = useState(null);

      // 카드 목록 (가족 공용): 처음 보는 카드번호는 자동 등록, 같은 카드 연결·주인 지정
      const [cards, setCards] = useState([]);
      const [cardNameDrafts, setCardNameDrafts] = useState({});
      const [importPay, setImportPay] = useState('auto');   // 카드사 파일 가져올 때 이 파일의 카드

      // 안드로이드 크롬: 설치 가능하면 이벤트를 받아 두었다가 [📲앱 설치] 버튼으로 띄움
      const [installPrompt, setInstallPrompt] = useState(null);
      useEffect(() => {
        const onPrompt = (e) => { e.preventDefault(); setInstallPrompt(e); };
        const onInstalled = () => setInstallPrompt(null);
        window.addEventListener('beforeinstallprompt', onPrompt);
        window.addEventListener('appinstalled', onInstalled);
        return () => {
          window.removeEventListener('beforeinstallprompt', onPrompt);
          window.removeEventListener('appinstalled', onInstalled);
        };
      }, []);
      const handleInstall = async () => {
        if (!installPrompt) return;
        installPrompt.prompt();
        await installPrompt.userChoice.catch(() => null);
        setInstallPrompt(null);
      };

      const familyCode = `fam_${familyPass}`;
      const supabaseClient = useMemo(() => createSecuredClient(familyCode), [familyCode]);
      const syncTimerRef = useRef(null);
      const broadcastChannelRef = useRef(null);

      // 이전 알림의 타이머가 새 알림을 일찍 지우지 않도록 타이머를 하나만 유지
      const toastTimerRef = useRef(null);
      const showToast = (msg) => {
        setToastMsg(msg);
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        toastTimerRef.current = setTimeout(() => setToastMsg(''), 3800);
      };

      // ★ content:// (로컬 파일) 환경에서도 100% 작동하는 클립보드 복사 함수 (폴백 지원)
      const copyToClipboard = (text, label) => {
        const fallbackCopy = (str) => {
          try {
            const ta = document.createElement('textarea');
            ta.value = str;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast(`📋 [${label}] 복사 완료!`);
          } catch (err) {
            showToast('⚠️ 복사에 실패했습니다. 직접 선택해 복사해주세요.');
          }
        };

        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text)
            .then(() => showToast(`📋 [${label}] 복사 완료!`))
            .catch(() => fallbackCopy(text));
        } else {
          fallbackCopy(text);
        }
      };

      const moveMonth = (delta) => {
        if (selectedMonth === 'ALL') {
          setSelectedMonth(getKSTDateTimeString().slice(0, 7));
          return;
        }
        const [y, m] = selectedMonth.split('-').map(Number);
        const d = new Date(y, m - 1 + delta, 1);
        setSelectedMonth(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
      };

      const notifyPartner = () => {
        if (broadcastChannelRef.current) {
          broadcastChannelRef.current.send({
            type: 'broadcast',
            event: 'family_sync',
            payload: { sender: MY_DEVICE_ID, time: Date.now() }
          });
        }
      };

      // 1. 클라우드 데이터 불러오기
      //    순서: DB 스키마 버전 확인 → 가족 설정 확인(없으면 자동 생성하지 않고 확인 요청) → 내역 전부(1,000건씩)
      const fetchFromCloud = async (options = { showSpinner: false, showSuccessToast: false }) => {
        try {
          if (options.showSpinner) setSyncStatus('connecting');

          const { data: meta, error: metaErr } = await supabaseClient
            .from('schema_meta').select('value').eq('key', 'schema_version').maybeSingle();
          if (metaErr) throw metaErr;
          const ver = parseInt(meta?.value || '0', 10);
          setDbSchemaVersion(ver);
          if (ver < REQUIRED_SCHEMA_VERSION) {
            setSyncStatus('schema_old');
            setErrorDetail(`DB 스키마 버전 ${ver} → 앱은 ${REQUIRED_SCHEMA_VERSION} 필요. [⚡자동연동/SQL]의 설정 SQL을 실행해주세요.`);
            return;
          }

          const { data: cfgData, error: cfgErr } = await supabaseClient
            .from('family_config').select('*').eq('family_code', familyCode).maybeSingle();
          if (cfgErr) throw cfgErr;
          if (!cfgData) {
            // 코드 오타로 빈 가계부가 따로 생기지 않도록, 새로 만들지 사용자에게 묻는다
            setExpenses([]);
            setSyncStatus('no_family');
            setErrorDetail('');
            return;
          }

          let allExpenses = [];
          const pageSize = 1000;
          for (let from = 0; ; from += pageSize) {
            const { data: batch, error: expErr } = await supabaseClient
              .from('expenses').select('*').eq('family_code', familyCode)
              .order('date', { ascending: false }).order('id', { ascending: true })
              .range(from, from + pageSize - 1);
            if (expErr) throw expErr;
            allExpenses = allExpenses.concat(batch || []);
            if (!batch || batch.length < pageSize) break;
          }

          setExpenses(allExpenses);
          try { localStorage.setItem(STORAGE_KEY_CACHE, JSON.stringify(allExpenses)); } catch (e) {}

          const cats = Array.isArray(cfgData.categories) && cfgData.categories.length > 0 ? cfgData.categories : DEFAULT_CATEGORIES;
          setCategories(cats);
          try { localStorage.setItem(STORAGE_KEY_CATS, JSON.stringify(cats)); } catch (e) {}
          setAllowedSenders(Array.isArray(cfgData.allowed_senders) ? cfgData.allowed_senders : []);
          setSignalId(cfgData.signal_id || '');
          const cfgCards = Array.isArray(cfgData.cards) ? cfgData.cards : [];
          setCards(cfgCards);
          // 문자 자동등록 등으로 들어온 처음 보는 카드번호를 카드 목록에 추가
          if (registerNewCards(cfgCards, cardRefsOf(allExpenses))) {
            saveCards(cur => registerNewCards(cur, cardRefsOf(allExpenses)), { silent: true });
          }

          setSyncStatus('connected');
          setErrorDetail('');
          setLastSyncTime(new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
          if (options.showSuccessToast) showToast(`☁️ 총 ${allExpenses.length}건 동기화 완료!`);
        } catch (err) {
          const msg = err.message || '';
          if (err.code === '42P01' || err.code === 'PGRST205' || /relation|does not exist|schema cache/i.test(msg)) {
            setSyncStatus('table_missing');
            setErrorDetail('Supabase에 테이블이 없습니다. [⚡자동연동/SQL]의 초기화·설정 SQL을 실행해주세요.');
          } else {
            setSyncStatus('network_error');
            setErrorDetail(msg || '네트워크 연결을 확인해주세요.');
          }
          try {
            const cached = localStorage.getItem(STORAGE_KEY_CACHE);
            if (cached) setExpenses(JSON.parse(cached));
          } catch (e) {}
        }
      };

      // 이 코드로 새 가계부 만들기 (no_family 상태에서 사용자가 확인했을 때만)
      const createFamily = async () => {
        if (familyPass.length < MIN_CODE_LENGTH) return showToast(`⚠️ 가족 코드는 ${MIN_CODE_LENGTH}자 이상이어야 합니다.`);
        const { error } = await supabaseClient.from('family_config').insert({
          family_code: familyCode,
          categories: DEFAULT_CATEGORIES,
          updated_by: MY_DEVICE_ID
        });
        if (error) return showToast('⚠️ 가계부 생성 실패: ' + error.message);
        showToast('🎉 새 가계부를 만들었습니다. 배우자 폰에도 같은 코드를 입력하세요.');
        fetchFromCloud({ showSpinner: true });
      };

      // 2. 실시간 구독
      //    A. 부부 앱끼리: Broadcast 신호 (RLS 영향 없음)
      //    B. 문자 자동 등록: sync_signals에서 우리 가족 signal_id 행만 구독
      useEffect(() => {
        if (!isUnlocked) return;
        fetchFromCloud({ showSpinner: true, showSuccessToast: false });

        const onVisible = () => { if (document.visibilityState === 'visible') fetchFromCloud(); };
        document.addEventListener('visibilitychange', onVisible);
        return () => document.removeEventListener('visibilitychange', onVisible);
      }, [isUnlocked, familyCode]);

      useEffect(() => {
        if (!isUnlocked) return;

        const triggerDebouncedSync = (msg) => {
          if (syncTimerRef.current) clearTimeout(syncTimerRef.current);
          syncTimerRef.current = setTimeout(() => {
            fetchFromCloud({ showSpinner: false, showSuccessToast: false });
            if (msg) showToast(msg);
          }, 250);
        };

        let channel = supabaseClient
          .channel(`room:${familyCode}`)
          .on('broadcast', { event: 'family_sync' }, (payload) => {
            if (payload.payload?.sender !== MY_DEVICE_ID) {
              triggerDebouncedSync('🔄 상대방 스마트폰에서 변경한 내역이 실시간 반영되었습니다!');
            }
          });
        if (signalId) {
          channel = channel.on(
            'postgres_changes',
            { event: '*', schema: 'public', table: 'sync_signals', filter: `signal_id=eq.${signalId}` },
            () => triggerDebouncedSync('📩 새 카드 승인 문자가 자동 등록되었습니다!')
          );
        }
        channel.subscribe();
        broadcastChannelRef.current = channel;

        return () => {
          if (syncTimerRef.current) clearTimeout(syncTimerRef.current);
          supabaseClient.removeChannel(channel);
        };
      }, [isUnlocked, familyCode, signalId]);

      const ensureConnected = () => {
        if (syncStatus !== 'connected') {
          showToast('⚠️ 클라우드 미연결 상태입니다.');
          return false;
        }
        return true;
      };

      // 3. 가족 코드 변경: 서버 함수(migrate_family_code)로만 처리. 실패하면 아무것도 옮기지 않음
      const handleMigrateFamilyCode = async () => {
        const cleanNewPass = newPassTarget.trim();
        if (cleanNewPass.length < MIN_CODE_LENGTH) {
          return showToast(`⚠️ 새 보안 코드는 ${MIN_CODE_LENGTH}자 이상이어야 합니다.`);
        }
        if (cleanNewPass === familyPass) return showToast('ℹ️ 현재 사용 중인 코드와 같습니다.');
        if (!ensureConnected()) return;

        setIsMigrating(true);
        const newFamCode = `fam_${cleanNewPass}`;
        try {
          const { data: res, error } = await supabaseClient.rpc('migrate_family_code', {
            old_code: familyCode,
            new_code: newFamCode,
            device_id: MY_DEVICE_ID
          });
          if (error) throw error;
          if (!res || res.status !== 'success') {
            return showToast('⚠️ 코드 변경 실패: ' + (res?.reason || '알 수 없는 오류'));
          }
          try { localStorage.setItem(STORAGE_KEY_PASS, cleanNewPass); } catch (e) {}
          setFamilyPass(cleanNewPass);
          setShowCodeMigrateModal(false);
          window.alert(
            `✅ ${res.moved_count}건의 내역을 새 코드로 옮겼습니다.\n\n` +
            `⚠️ 꼭 해주세요\n` +
            `1. 배우자 폰: [🔒코드변경] → [다른 코드로 접속]에서 새 코드 입력\n` +
            `2. 문자 포워더·아이폰 단축어의 fam_code를 "${newFamCode}"로 변경\n` +
            `   (이전 코드로 오는 문자는 이제 등록되지 않습니다)`
          );
        } catch (err) {
          showToast('⚠️ 코드 변경 실패: ' + (err.message || err));
        } finally {
          setIsMigrating(false);
        }
      };

      const isDuplicateExpense = (candidate, existingList) => {
        const candNorm = normalizeDateString(candidate.date);
        const candDay = candNorm.slice(0, 10);
        const candTime = candNorm.slice(11, 16);

        return existingList.some(ex => {
          if (ex.amount !== candidate.amount) return false;

          const exNorm = normalizeDateString(ex.date);
          const exDay = exNorm.slice(0, 10);
          const exTime = exNorm.slice(11, 16);
          if (exDay !== candDay) return false;

          // 둘 다 결제 시각이 있으면: 같은 날·같은 금액·같은 분이면 가게 이름 표기가 달라도 중복
          // (문자 'KTX 승차권' vs 카드사 파일 '코레일(KTX)' 같은 경우)
          if (candTime !== '00:00' && exTime !== '00:00') return candTime === exTime;

          // 한쪽이라도 시각이 없으면(카드사 파일 등) 가게 이름이 비슷할 때만 중복
          return isSimilarStoreName(candidate.store, ex.store);
        });
      };

      const insertExpenseRows = async (rowsArray) => {
        if (!ensureConnected()) return false;
        const rowsWithMeta = rowsArray.map(r => ({
          ...r,
          date: normalizeDateString(r.date),
          family_code: familyCode,
          updated_by: MY_DEVICE_ID
        }));

        const chunkSize = 500;
        for (let i = 0; i < rowsWithMeta.length; i += chunkSize) {
          const chunk = rowsWithMeta.slice(i, i + chunkSize);
          const { error } = await supabaseClient.from('expenses').insert(chunk);
          if (error) {
            showToast('⚠️ 저장 실패: ' + error.message);
            return false;
          }
        }

        setExpenses(prev => [...rowsWithMeta, ...prev].sort((a, b) => b.date.localeCompare(a.date)));
        notifyPartner();
        registerCardsFrom(rowsWithMeta);
        return true;
      };

      const updateExpenseRow = async (id, patch) => {
        if (!ensureConnected()) return false;
        const patchWithMeta = { ...patch, updated_by: MY_DEVICE_ID };
        if (patchWithMeta.date) patchWithMeta.date = normalizeDateString(patchWithMeta.date);

        const { error } = await supabaseClient
          .from('expenses')
          .update(patchWithMeta)
          .eq('id', id)
          .eq('family_code', familyCode);

        if (error) {
          showToast('⚠️ 수정 실패: ' + error.message);
          return false;
        }
        setExpenses(prev => prev.map(e => e.id === id ? { ...e, ...patchWithMeta } : e));
        notifyPartner();
        if (patchWithMeta.card_num) registerCardsFrom([{ ...patchWithMeta, date: patchWithMeta.date || '' }]);
        return true;
      };

      const deleteExpenseRow = async (item) => {
        if (!ensureConnected()) return false;
        if (!window.confirm(`[${item.store} - ${item.amount.toLocaleString()}원]\n정말 삭제하시겠습니까?`)) return false;

        const { error } = await supabaseClient
          .from('expenses')
          .delete()
          .eq('id', item.id)
          .eq('family_code', familyCode);

        if (error) {
          showToast('⚠️ 삭제 실패: ' + error.message);
          return false;
        }
        setExpenses(prev => prev.filter(e => e.id !== item.id));
        notifyPartner();
        showToast('🗑️ 삭제되었습니다.');
        return true;
      };

      const saveEditForm = async (id) => {
        const amt = Number(editForm.amount) || 0;
        const ok = await updateExpenseRow(id, {
          store: editForm.store.trim() || '미상가맹점',
          amount: amt,
          tax: Math.round(amt / 11),
          date: normalizeDateString(editForm.date),
          memo: editForm.memo.trim(),
          payer: editForm.payer,
          ...payFieldsOf(editForm.pay)
        });
        if (ok) {
          setEditingId(null);
          showToast('✏️ 내역이 수정되었습니다!');
        }
      };

      const saveCategories = async (newCats) => {
        if (!ensureConnected()) return false;
        const { error } = await supabaseClient.from('family_config').update({
          categories: newCats,
          updated_by: MY_DEVICE_ID,
          updated_at: new Date().toISOString()
        }).eq('family_code', familyCode);
        if (error) {
          showToast('⚠️ 카테고리 저장 실패: ' + error.message);
          return false;
        }
        setCategories(newCats);
        try { localStorage.setItem(STORAGE_KEY_CATS, JSON.stringify(newCats)); } catch (e) {}
        notifyPartner();
        return true;
      };

      // =====================================================================
      // ★ 카드 목록 저장: 저장 직전에 서버의 최신 목록을 다시 읽어 그 위에 바꿈
      //   (두 폰이 동시에 고쳐도 상대가 바꾼 이름·주인이 덮어써지지 않도록)
      // =====================================================================
      const cardRefsOf = (rows) => rows.filter(r => r.card_num).map(r => ({ issuer: r.card_issuer || '', num: r.card_num, date: r.date }));

      const saveCards = async (mutator, opts = {}) => {
        const { data, error: readErr } = await supabaseClient
          .from('family_config').select('cards').eq('family_code', familyCode).maybeSingle();
        if (readErr || !data) {
          if (!opts.silent) showToast('⚠️ 카드 목록을 읽지 못했습니다: ' + (readErr?.message || '가족 정보 없음'));
          return false;
        }
        const fresh = Array.isArray(data.cards) ? data.cards : [];
        const next = mutator(fresh);
        if (!next) { setCards(fresh); return true; }
        const { error } = await supabaseClient.from('family_config').update({
          cards: next,
          updated_by: MY_DEVICE_ID,
          updated_at: new Date().toISOString()
        }).eq('family_code', familyCode);
        if (error) {
          if (!opts.silent) showToast('⚠️ 카드 목록 저장 실패: ' + error.message);
          return false;
        }
        setCards(next);
        notifyPartner();
        return true;
      };

      const registerCardsFrom = (rows) => {
        const refs = cardRefsOf(rows);
        if (refs.length && registerNewCards(cards, refs)) saveCards(cur => registerNewCards(cur, refs), { silent: true });
      };

      const updateCard = (id, patch) => saveCards(cur => cur.map(c => c.id === id ? { ...c, ...patch } : c));

      // 카드 A(묶음 전체)를 카드 B의 묶음으로 합침. 이름·주인은 B에 없을 때만 A 것을 가져감
      const mergeCardInto = (id, targetId) => saveCards(cur => {
        const a = cur.find(c => c.id === id), t = cur.find(c => c.id === targetId);
        if (!a || !t) return null;
        const rootA = cardRoot(cur, a).id, rootT = cardRoot(cur, t).id;
        if (rootA === rootT) return null;
        const ra = cur.find(c => c.id === rootA);
        return cur.map(c => {
          if (c.id === rootT) return { ...c, name: c.name || ra.name || '', owner: c.owner || ra.owner || '' };
          if (cardRoot(cur, c).id === rootA) return { ...c, link_to: rootT, auto_linked: false };
          return c;
        });
      });

      const unlinkCard = (id) => saveCards(cur => cur.map(c => c.id === id ? { ...c, link_to: null, auto_linked: false } : c));

      const deleteCard = (id) => saveCards(cur => cur.filter(c => c.id !== id).map(c => c.link_to === id ? { ...c, link_to: null } : c));

      // 카드 주인과 결제자가 다른 내역을 한꺼번에 주인으로 맞춤
      const alignPayers = async (ids, owner) => {
        if (!ensureConnected() || ids.length === 0) return;
        const { error } = await supabaseClient.from('expenses')
          .update({ payer: owner, updated_by: MY_DEVICE_ID })
          .in('id', ids).eq('family_code', familyCode);
        if (error) return showToast('⚠️ 결제자 변경 실패: ' + error.message);
        setExpenses(prev => prev.map(e => ids.includes(e.id) ? { ...e, payer: owner } : e));
        notifyPartner();
        showToast(`✅ ${ids.length}건의 결제자를 ${owner}(으)로 맞췄습니다.`);
      };

      // 카드사 발신번호 목록 저장 (비어 있으면 receive_sms가 번호 검사를 하지 않음)
      const saveAllowedSenders = async (list) => {
        if (!ensureConnected()) return false;
        const { error } = await supabaseClient.from('family_config').update({
          allowed_senders: list,
          updated_by: MY_DEVICE_ID,
          updated_at: new Date().toISOString()
        }).eq('family_code', familyCode);
        if (error) {
          showToast('⚠️ 발신번호 저장 실패: ' + error.message);
          return false;
        }
        setAllowedSenders(list);
        notifyPartner();
        return true;
      };

      const handleAddSender = async () => {
        const digits = senderInput.replace(/[^0-9]/g, '');
        if (digits.length < 7) return showToast('⚠️ 발신번호를 숫자로 입력해주세요 (예: 1544-7000).');
        if (allowedSenders.some(x => String(x).replace(/[^0-9]/g, '') === digits)) return showToast('ℹ️ 이미 등록된 번호입니다.');
        if (await saveAllowedSenders([...allowedSenders, senderInput.trim()])) {
          setSenderInput('');
          showToast('✅ 발신번호가 등록되었습니다.');
        }
      };

      const handleAddCategory = async () => {
        if (!newCatName.trim()) return;
        const newCat = { id: 'c-' + Date.now(), name: newCatName.trim(), subs: ['기타'] };
        const updated = [...categories, newCat];
        const ok = await saveCategories(updated);
        if (ok) {
          setSelectedCatId(newCat.id);
          setNewCatName('');
          showToast(`✅ [${newCat.name}] 대분류 추가됨`);
        }
      };

      const handleDeleteCategory = async (id, name) => {
        if (categories.length <= 1) return showToast('⚠️ 최소 1개는 유지해야 합니다.');
        if (!window.confirm(`[${name}] 대분류를 삭제하시겠습니까?`)) return;
        const updated = categories.filter(c => c.id !== id);
        const ok = await saveCategories(updated);
        if (ok) setSelectedCatId(updated[0].id);
      };

      const handleAddSubCategory = async () => {
        if (!newSubName.trim()) return;
        const updated = categories.map(c => {
          if (c.id === selectedCatId && !c.subs.includes(newSubName.trim())) {
            return { ...c, subs: [...c.subs, newSubName.trim()] };
          }
          return c;
        });
        const ok = await saveCategories(updated);
        if (ok) setNewSubName('');
      };

      const handleDeleteSubCategory = async (catId, subName) => {
        if (!window.confirm(`[${subName}] 세부 카테고리를 삭제하시겠습니까?`)) return;
        const updated = categories.map(c => {
          if (c.id === catId) return { ...c, subs: c.subs.filter(s => s !== subName) };
          return c;
        });
        await saveCategories(updated);
      };

      // =====================================================================
      // ★ AI 영수증 인식: 사진을 줄여서 Supabase 서버 함수(scan-receipt)로 보내고,
      //   Gemini가 읽은 가게·날짜·총액·품목을 확인·수정한 뒤 등록
      // =====================================================================
      const SCAN_MAX_SIDE = 1600;   // 긴 변 최대 픽셀 (글씨는 충분히 보이고 전송은 가볍게)
      const SCAN_TIMEOUT_MS = 60000; // 이 시간 안에 답이 없으면 중단 (정확 모델 한도 초과 시 보조 모델로 한 번 더 읽는 시간 포함)
      const scanRequestRef = useRef(0); // 늦게 도착한 이전 요청의 답은 무시하기 위한 번호

      const resizeImage = (file) => new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, SCAN_MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
          resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg', preview: dataUrl });
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('사진을 열 수 없습니다.')); };
        img.src = url;
      });

      // 서버 함수 오류를 사람이 읽을 수 있는 문장으로
      const describeScanError = async (error) => {
        try {
          const ctx = error?.context;
          if (ctx && typeof ctx.json === 'function') {
            const body = await ctx.json().catch(() => null);
            // 우리 함수가 보낸 오류(code 있음)는 그 문장을, Supabase 자체 오류는 한국어 안내를
            if (body?.code && body?.status === 'error' && body?.message) return body.message;
            if (ctx.status === 404) return '영수증 인식 서버 함수(scan-receipt)가 아직 배포되지 않았습니다.';
            if (ctx.status === 401) return '서버 함수 설정에서 JWT 확인(Verify JWT)을 꺼주세요.';
            if (body?.message) return body.message;
            return `서버 함수 오류 (${ctx.status})`;
          }
        } catch (e) {}
        return '서버 함수에 연결할 수 없습니다. 인터넷 연결과 함수 배포 상태를 확인해주세요.';
      };

      const handleReceiptFile = async (e) => {
        const file = e.target.files?.[0];
        e.target.value = '';
        if (!file) return;
        if (!ensureConnected()) return;
        setScanResult(null);
        setScanError('');
        setIsScanning(true);
        const requestId = ++scanRequestRef.current;
        const isCurrent = () => scanRequestRef.current === requestId;
        try {
          const { base64, mimeType, preview } = await resizeImage(file);
          if (!isCurrent()) return;
          setScanPreview(preview);
          let timer;
          const timeout = new Promise((_, reject) => { timer = setTimeout(() => reject(new Error('SCAN_TIMEOUT')), SCAN_TIMEOUT_MS); });
          let response;
          try {
            response = await Promise.race([
              supabaseClient.functions.invoke('scan-receipt', { body: { image: base64, mimeType } }),
              timeout
            ]);
          } finally {
            clearTimeout(timer);
          }
          if (!isCurrent()) return;   // 그 사이 취소했거나 새 사진을 보냈으면 이 답은 버림
          const { data, error } = response;
          if (error) { setScanError(await describeScanError(error)); return; }
          if (data?.status === 'not_receipt') { setScanError('영수증이 아닌 사진 같습니다. 영수증 전체가 보이게 다시 찍어주세요.'); return; }
          if (data?.status !== 'success' || !data.receipt) { setScanError(data?.message || '영수증을 읽지 못했습니다.'); return; }

          const r = data.receipt;
          const items = (r.items || []).filter(it => it.name);
          const itemsSum = items.reduce((sum, it) => sum + (Number(it.price) || 0), 0);
          const amount = r.total ?? itemsSum;
          const store = r.store || '영수증가맹점';
          // 가게 이름이 잘려 있어도(예: '…열우물주') 품목 이름(보통휘발유 등)으로 분류할 수 있게 함께 봄
          const { category, sub_category } = classifyStoreAndText(`${store} ${items.map(it => it.name).join(' ')}`, categories);
          // 결제 수단: 현금 / 카드(카드사·뒤 4자리) / 모름. 카드 주인이 정해져 있으면 결제자도 그 사람
          const cardIssuer = normalizeCardIssuer(r.card_issuer);
          const cardNum = normalizeCardNum(r.card_number);
          const pay = r.pay_method === '현금' ? 'cash'
            : (cardNum || cardIssuer || r.pay_method === '카드') ? `card:${cardIssuer}|${cardNum}` : 'none';
          const payFields = payFieldsOf(pay);
          setScanResult({
            pay,
            payer: cardOwner(cards, payFields.card_issuer, payFields.card_num) || currentUser,
            model: data.model || '',
            fallback: !!data.fallback,
            store,
            // 시각이 없으면 00:00 (= 시각 모름, 카드사 파일과 같은 규칙)
            date: r.date ? normalizeDateString(r.date) : getKSTDateTimeString(),
            amount: amount || 0,
            tax: r.tax ?? Math.round((amount || 0) / 11),
            items,
            itemsSum,
            category,
            sub_category,
            is_business: false
          });
        } catch (err) {
          if (!isCurrent()) return;
          setScanError(err.message === 'SCAN_TIMEOUT'
            ? `⏱️ ${SCAN_TIMEOUT_MS / 1000}초 동안 답이 없어 중단했습니다. 인터넷 연결을 확인하고 다시 찍어주세요.`
            : (err.message || String(err)));
        } finally {
          if (isCurrent()) setIsScanning(false);
        }
      };

      // 읽는 중에 사용자가 그만두기
      const cancelScan = () => {
        scanRequestRef.current++;
        setIsScanning(false);
        setScanPreview('');
        setScanError('');
      };

      // 같은 결제로 보이는 기존 내역 (카드 문자·카드사 파일, 아직 품목이 없는 것)
      const findScanMergeTarget = (sr) => {
        if (!sr) return null;
        const day = normalizeDateString(sr.date).slice(0, 10);
        const time = normalizeDateString(sr.date).slice(11, 16);
        const srCard = payFieldsOf(sr.pay || 'none');
        const candidates = expenses.filter(e => {
          if (e.amount !== Number(sr.amount)) return false;
          if (!['카드문자', '자동문자수신', 'CSV일괄등록', '엑셀일괄등록'].includes(e.source)) return false;
          if (e.items && e.items.length > 0) return false;
          // 둘 다 카드번호가 있는데 서로 안 맞으면 다른 결제 (카드사 표기는 문자·영수증마다 달라 번호만 비교)
          if (srCard.card_num && e.card_num && !cardNumMatch(srCard.card_num, e.card_num)) return false;
          if (srCard.pay_method === '현금' && e.pay_method === '카드') return false;
          const en = normalizeDateString(e.date);
          if (en.slice(0, 10) !== day) return false;
          const et = en.slice(11, 16);
          if (time !== '00:00' && et !== '00:00') return et === time || isSimilarStoreName(sr.store, e.store);
          return true;
        });
        // 같은 날 같은 금액이 여러 건이면 카드번호가 맞는 내역을 먼저
        return candidates.sort((a, b) => (cardNumMatch(srCard.card_num, b.card_num) ? 1 : 0) - (cardNumMatch(srCard.card_num, a.card_num) ? 1 : 0))[0] || null;
      };

      const confirmScan = async () => {
        if (!scanResult) return;
        const amount = Number(scanResult.amount) || 0;
        if (amount <= 0) return showToast('⚠️ 결제 금액을 확인해주세요.');
        const sr = { ...scanResult, amount, date: normalizeDateString(scanResult.date) };
        const target = findScanMergeTarget(sr);
        const payFields = payFieldsOf(sr.pay);
        let ok;
        if (target) {
          // 카드번호는 숫자가 더 많이 보이는 쪽을 남김 (문자 '1*3*' + 영수증 '1234' → '1234')
          const digits = (n) => (String(n || '').match(/[0-9]/g) || []).length;
          const keepTargetCard = target.card_num && digits(target.card_num) >= digits(payFields.card_num);
          ok = await updateExpenseRow(target.id, {
            store: sr.store,
            category: sr.category,
            sub_category: sr.sub_category,
            items: sr.items,
            payer: sr.payer,
            is_business: sr.is_business || !!target.is_business,
            ...(keepTargetCard || !payFields.pay_method ? {} : payFields),
            source: '영수증+내역병합',
            memo: ((target.memo || '') + ' (영수증 품목 병합)').trim()
          });
          if (ok) showToast('✨ 같은 결제의 카드 내역에 영수증 품목을 합쳤습니다.');
        } else {
          ok = await insertExpenseRows([{
            id: 'rcpt-' + Date.now(),
            date: sr.date,
            store: sr.store,
            category: sr.category,
            sub_category: sr.sub_category,
            amount,
            tax: Number(sr.tax) || Math.round(amount / 11),
            payer: sr.payer,
            ...payFields,
            is_business: sr.is_business,
            source: '영수증스캔',
            verified: sr.items.length === 0 || sr.itemsSum === amount,
            memo: '영수증 AI 인식',
            items: sr.items
          }]);
          if (ok) showToast('☁️ 영수증 내역이 등록되었습니다.');
        }
        if (ok) {
          setScanResult(null);
          setScanPreview('');
          setSelectedMonth(sr.date.slice(0, 7));
          setActiveTab('list');
        }
      };

      const handleBulkParseSMS = async () => {
        if (!smsText.trim()) return;
        const rawBlocks = smsText
          .split(/(?=\[Web발신\])|\n\s*\n/)
          .map(b => b.trim())
          .filter(Boolean);

        const parsedRows = [];
        let duplicateCount = 0;
        let spamIgnoredCount = 0;

        for (const block of rawBlocks) {
          const parsed = parseSingleSmsBlock(block, categories, currentUser, cards);
          if (parsed) {
            if (isDuplicateExpense(parsed, [...expenses, ...parsedRows])) {
              duplicateCount++;
            } else {
              parsedRows.push(parsed);
            }
          } else {
            spamIgnoredCount++;
          }
        }

        if (parsedRows.length === 0) {
          if (duplicateCount > 0) return showToast(`ℹ️ 이미 등록된 중복 내역(${duplicateCount}건)입니다.`);
          return showToast('⚠️ 카드 결제 승인 문자가 없습니다 (광고/설문/비결제 문자 자동 무시됨).');
        }

        const ok = await insertExpenseRows(parsedRows);
        if (ok) {
          setSmsText('');
          const extra = [
            duplicateCount > 0 ? `중복 ${duplicateCount}건 제외` : '',
            spamIgnoredCount > 0 ? `광고/설문 ${spamIgnoredCount}건 차단` : ''
          ].filter(Boolean).join(', ');
          showToast(`🎉 총 ${parsedRows.length}건 등록 완료!${extra ? ` (${extra})` : ''}`);
          setActiveTab('list');
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const fileName = file.name.toLowerCase();

        const reader = new FileReader();
        reader.onload = async (evt) => {
          const buffer = evt.target.result;
          let rows2D = [];

          try {
            if (fileName.endsWith('.xls') || fileName.endsWith('.xlsx')) {
              const uint8 = new Uint8Array(buffer);
              const sampleText = new TextDecoder('utf-8').decode(uint8.slice(0, 500));
              if (/<html|<table/i.test(sampleText)) {
                let htmlStr = new TextDecoder('utf-8').decode(uint8);
                if (htmlStr.includes('\uFFFD')) htmlStr = new TextDecoder('euc-kr').decode(uint8);
                const wb = window.XLSX.read(htmlStr, { type: 'string' });
                const firstSheet = wb.Sheets[wb.SheetNames[0]];
                rows2D = window.XLSX.utils.sheet_to_json(firstSheet, { header: 1, raw: false, defval: '' });
              } else {
                const wb = window.XLSX.read(uint8, { type: 'array', codepage: 949 });
                const firstSheet = wb.Sheets[wb.SheetNames[0]];
                rows2D = window.XLSX.utils.sheet_to_json(firstSheet, { header: 1, raw: false, defval: '' });
              }
            } else {
              let text = new TextDecoder('utf-8').decode(buffer);
              if (text.includes('\uFFFD')) text = new TextDecoder('euc-kr').decode(buffer);
              rows2D = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(splitCsvLine);
            }
          } catch (parseErr) {
            return showToast('⚠️ 파일을 읽는 중 오류가 발생했습니다.');
          }

          if (!rows2D || rows2D.length < 2) {
            return showToast('⚠️ 파일에서 유효한 표 데이터를 찾지 못했습니다.');
          }

          let headerIdx = 0;
          let dateCol = -1, timeCol = -1, storeCol = -1, amountCol = -1, cardCol = -1;

          for (let i = 0; i < Math.min(20, rows2D.length); i++) {
            const row = rows2D[i];
            if (!Array.isArray(row) || row.length < 2) continue;

            let hitCount = 0;
            let tmpDate = -1, tmpTime = -1, tmpStore = -1, tmpAmt = -1, tmpCard = -1;

            row.forEach((cell, idx) => {
              const cClean = String(cell || '').replace(/\s+/g, '');
              if (cClean.length > 15 || cClean.includes(':')) return;

              if (/이용일|승인일|결제일|거래일|매출일|일자|날짜|일시/.test(cClean) && tmpDate === -1) {
                tmpDate = idx; hitCount++;
              } else if (/시간|시각/.test(cClean) && tmpTime === -1) {
                tmpTime = idx;
              } else if (/가맹점|상호|이용처|내역|내용/.test(cClean) && tmpStore === -1) {
                tmpStore = idx; hitCount++;
              } else if (/이용금액|승인금액|결제금액|매출금액|거래금액|원금|^금액$/.test(cClean) && !/취소|할인|포인트|잔액|혜택/.test(cClean) && tmpAmt === -1) {
                tmpAmt = idx; hitCount++;
              } else if (/카드번호|이용카드|카드명/.test(cClean) && tmpCard === -1) {
                tmpCard = idx;
              }
            });

            if (hitCount >= 2) {
              headerIdx = i;
              dateCol = tmpDate;
              timeCol = tmpTime;
              storeCol = tmpStore;
              amountCol = tmpAmt;
              cardCol = tmpCard;
              break;
            }
          }

          const headerCols = rows2D[headerIdx] || [];
          const rawExtracted = [];

          for (let i = headerIdx + 1; i < rows2D.length; i++) {
            const cols = rows2D[i].map(c => String(c ?? '').trim());
            if (cols.length < 2) continue;
            if (cols.some(c => /^합계$|^총계$|^소계$/.test(c))) continue;

            const isCancelRow = cols.some(c => /취소/.test(c));
            let dateVal = '';
            let storeVal = '';
            let amountVal = 0;

            if (dateCol !== -1 && cols[dateCol]) {
              const rawDatePart = timeCol !== -1 && cols[timeCol] ? `${cols[dateCol]} ${cols[timeCol]}` : cols[dateCol];
              dateVal = normalizeDateString(rawDatePart);
            }
            if (storeCol !== -1 && cols[storeCol]) {
              storeVal = cols[storeCol];
            }
            if (amountCol !== -1 && cols[amountCol]) {
              const cleanedAmt = cols[amountCol].replace(/[^0-9\-]/g, '');
              if (cleanedAmt) amountVal = parseInt(cleanedAmt, 10);
            }

            if (amountVal === 0 || !storeVal || !dateVal) {
              cols.forEach((col, idx) => {
                const hName = String(headerCols[idx] || '');
                if (/승인번호|카드번호|사업자|연락처|전화|할부|번호/.test(hName)) return;

                if (!dateVal && /^(?:20\d{2}|\d{2})\s*[\-\.\/]?\s*\d{1,2}\s*[\-\.\/]?\s*\d{1,2}/.test(col) && col.replace(/[^0-9]/g, '').length >= 6) {
                  dateVal = normalizeDateString(col);
                } else if (amountVal === 0 && /^-?[0-9,]+원?$/.test(col)) {
                  const rawDigits = col.replace(/[^0-9]/g, '');
                  if (!col.includes(',') && rawDigits.length === 8) return;
                  const num = parseInt(col.replace(/[^0-9\-]/g, ''), 10);
                  if (Math.abs(num) >= 100) amountVal = num;
                } else if (
                  !storeVal &&
                  col.length >= 2 &&
                  !/승인|일시불|할부|정상|본인|가족|체크|신용|취소|국내|해외/.test(col) &&
                  isNaN(Number(col.replace(/[,.\-\/:\s]/g, '')))
                ) {
                  storeVal = col;
                }
              });
            }

            // 결제 카드: 파일의 카드번호 칸 → 없으면 화면에서 고른 '이 파일의 카드'
            let rowPay = { pay_method: '카드', card_issuer: '', card_num: '' };
            const chosen = importPay !== 'auto' ? payFieldsOf(importPay) : null;
            if (cardCol !== -1 && normalizeCardNum(cols[cardCol])) {
              rowPay = { pay_method: '카드', card_issuer: normalizeCardIssuer(cols[cardCol]) || chosen?.card_issuer || '', card_num: normalizeCardNum(cols[cardCol]) };
            } else if (chosen) {
              rowPay = chosen;
            }

            if (amountVal !== 0 && !isNaN(amountVal)) {
              rawExtracted.push({
                rowIdx: i,
                isCancelRow: isCancelRow || amountVal < 0,
                absAmount: Math.abs(amountVal),
                date: dateVal || getKSTDateTimeString(),
                store: storeVal || '카드사가맹점',
                pay: rowPay
              });
            }
          }

          const normalItems = rawExtracted.filter(r => !r.isCancelRow);
          const cancelItems = rawExtracted.filter(r => r.isCancelRow);

          const newRows = [];
          let dupCount = 0;
          let autoIgnoredCancelCount = 0;

          for (const item of normalItems) {
            const { category, sub_category } = classifyStoreAndText(item.store, categories);
            const candidate = {
              id: 'xls-' + Date.now() + '-' + item.rowIdx,
              date: item.date,
              store: item.store,
              category,
              sub_category,
              amount: item.absAmount,
              tax: Math.round(item.absAmount / 11),
              payer: cardOwner(cards, item.pay.card_issuer, item.pay.card_num) || currentUser,
              ...item.pay,
              is_business: false,
              source: fileName.endsWith('.csv') ? 'CSV일괄등록' : '엑셀일괄등록',
              verified: true,
              memo: '파일 일괄등록',
              items: []
            };

            if (isDuplicateExpense(candidate, [...expenses, ...newRows])) {
              dupCount++;
            } else {
              newRows.push(candidate);
            }
          }

          // ★ 취소 상계: 취소일 기준 60일 안(취소일 포함 이전)의 짝 승인 건을 찾아 한 번만 상계.
          //   짝 승인 건이 없으면(카드사가 원래 승인 행을 '취소'로 표시만 한 경우) 등록하지 않음
          const CANCEL_LOOKBACK_DAYS = 60;
          const dayNum = (ymd) => Date.UTC(+ymd.slice(0, 4), +ymd.slice(5, 7) - 1, +ymd.slice(8, 10)) / 86400000;
          const pairedApprovalIds = new Set();
          // 이미 등록된 취소(음수) 건이 상계한 승인 건은 다시 쓰지 않도록 먼저 표시
          const markPaired = (cancelRow, pool) => {
            const cDay = dayNum(normalizeDateString(cancelRow.date).slice(0, 10));
            const match = pool
              .filter(ex => ex.amount === Math.abs(cancelRow.amount) && !pairedApprovalIds.has(ex.id))
              .filter(ex => {
                const diff = cDay - dayNum(normalizeDateString(ex.date).slice(0, 10));
                return diff >= 0 && diff <= CANCEL_LOOKBACK_DAYS && isSimilarStoreName(cancelRow.store, ex.store);
              })
              .sort((x, y) => normalizeDateString(y.date).localeCompare(normalizeDateString(x.date)))[0];
            if (match) pairedApprovalIds.add(match.id);
            return match;
          };
          const approvalsPool = () => [...expenses, ...newRows].filter(ex => ex.amount > 0);
          expenses.filter(ex => ex.amount < 0).forEach(ex => markPaired(ex, approvalsPool()));

          for (const cItem of cancelItems) {
            const { category, sub_category } = classifyStoreAndText(cItem.store, categories);
            const cancelCandidate = {
              id: 'xls-cancel-' + Date.now() + '-' + cItem.rowIdx,
              date: cItem.date,
              store: cItem.store,
              category,
              sub_category,
              amount: -cItem.absAmount,
              tax: -Math.round(cItem.absAmount / 11),
              payer: cardOwner(cards, cItem.pay.card_issuer, cItem.pay.card_num) || currentUser,
              ...cItem.pay,
              is_business: false,
              source: fileName.endsWith('.csv') ? 'CSV일괄등록' : '엑셀일괄등록',
              verified: true,
              memo: '승인취소 상계',
              items: []
            };

            // 같은 취소가 이미 등록돼 있으면(예: 취소 문자) 건너뜀
            if (isDuplicateExpense(cancelCandidate, [...expenses, ...newRows])) {
              dupCount++;
              continue;
            }
            if (!markPaired(cancelCandidate, approvalsPool())) {
              autoIgnoredCancelCount++;
              continue;
            }
            newRows.push(cancelCandidate);
          }

          e.target.value = '';
          if (newRows.length === 0) {
            if (dupCount > 0 || autoIgnoredCancelCount > 0) {
              return showToast(`ℹ️ 신규 내역 없음 (중복 ${dupCount}건, 단독취소 ${autoIgnoredCancelCount}건 제외)`);
            }
            return showToast('⚠️ 파일에서 등록할 결제 내역을 찾지 못했습니다.');
          }

          const ok = await insertExpenseRows(newRows);
          if (ok) {
            const extraMsg = [
              dupCount > 0 ? `중복 ${dupCount}건 제외` : '',
              autoIgnoredCancelCount > 0 ? `단독취소 ${autoIgnoredCancelCount}건 자동제외` : ''
            ].filter(Boolean).join(', ');
            showToast(`📥 총 ${newRows.length}건 등록 완료!${extraMsg ? ` (${extraMsg})` : ''}`);
            setActiveTab('list');
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const exportCSV = (onlyBiz) => {
        const list = onlyBiz ? monthFiltered.filter(e => e.is_business) : monthFiltered;
        const headers = ['결제일시(KST)', '결제자', '결제수단', '상호명', '대분류', '세부카테고리', '공급가액', '부가세', '총금액', '구분', '품목', '메모'];
        const rows = list.map(e => [
          e.date, e.payer, `"${payLabel(cards, e).replace(/^\S+\s/, '')}"`, `"${e.store}"`, e.category, e.sub_category || '-',
          e.amount - (e.tax || 0), e.tax || 0, e.amount,
          e.is_business ? '업무경비' : '개인',
          `"${(e.items || []).map(i => i.name).join('/')}"`,
          `"${e.memo || ''}"`

        const csv = '\uFEFF' + [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });

            </div>

                </p>
                <div className="space-y-2">
                  <input
                    type="text"
                    value={passInput}
                    onChange={e => setPassInput(e.target.value)}

                  />

                <button

                        </button>

                      <p className="text-[11px] text-slate-400">헤더 <code>Content-Type: application/json</code>도 함께 넣어주세요.</p>
                    </div>

                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                      <span className="font-bold text-blue-300">3. 요청 본문(JSON)</span>
                      <div className="grid grid-cols-2 gap-2">
                        {['남편', '아내'].map(p => (
                          <button
                            key={p}
                            onClick={() =>
                              copyToClipboard(
                                JSON.stringify({ sms_text: '보낸사람 : {발신번호}\n{문자내용}', payer_name: p, fam_code: familyCode }, null, 2),
                                `${p}용 JSON`
                              )
                            }
                            className={`${p === '남편' ? 'bg-blue-600' : 'bg-pink-600'} text-white px-2.5 py-1.5 rounded font-bold`}
                          >
                            {p}용 복사
                          </button>
                        ))}
                      </div>
                      <p className="text-[11px] text-slate-400 leading-relaxed">
                        <code>{'{발신번호}'}</code>, <code>{'{문자내용}'}</code>은 포워더 앱이나 단축어에서 쓰는 자리표시자로 바꿔 넣으세요(앱마다 이름이 다릅니다).
                        코드를 바꾸면 <code>fam_code</code>도 꼭 새 값으로 바꿔야 합니다.
                      </p>
                    </div>
                  </div>
                </div>
              )}

              {showVersionModal && (
                <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
                  <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-4 space-y-3 max-h-[80vh] overflow-y-auto">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                      <h3 className="font-bold text-white text-sm">🕓 버전 히스토리 ({APP_VERSION})</h3>
                      <button onClick={() => setShowVersionModal(false)} className="text-slate-400">✕</button>
                    </div>
                    {VERSION_HISTORY.map(v => (
                      <div key={v.version} className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs space-y-1">
                        <div className="flex justify-between font-bold text-emerald-400">
                          <span>{v.version} - {v.title}</span>
                          <span>{v.date}</span>
                        </div>
                        <ul className="list-disc pl-4 text-slate-300 space-y-1 pt-1">
                          {v.changes.map((ch, i) => <li key={i}>{ch}</li>)}
                        </ul>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <nav className="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 z-30 safe-bottom">
                <div className="max-w-xl mx-auto grid grid-cols-5 py-2 text-[11px] font-bold">
                  <button onClick={() => setActiveTab('list')} className={activeTab === 'list' ? 'text-indigo-400' : 'text-slate-400'}>📋 내역</button>
                  <button onClick={() => setActiveTab('cats')} className={activeTab === 'cats' ? 'text-indigo-400' : 'text-slate-400'}>⚙️ 카드·분류</button>
                  <button onClick={() => setActiveTab('scan')} className={activeTab === 'scan' ? 'text-indigo-400' : 'text-slate-400'}>📷 영수증스캔</button>
                  <button onClick={() => setActiveTab('sms')} className={activeTab === 'sms' ? 'text-indigo-400' : 'text-slate-400'}>📩 문자/엑셀</button>
                  <button onClick={() => setActiveTab('stats')} className={activeTab === 'stats' ? 'text-indigo-400' : 'text-slate-400'}>📊 통계/엑셀</button>
                </div>
              </nav>
            </>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script id="sw-register">
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.warn('서비스 워커 등록 실패:', err));
      });
    }
  </script>
</body>
</html>
