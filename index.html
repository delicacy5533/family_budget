                        {field('만기일', <input type="date" value={d.maturity_date || ''} onChange={e => set({ maturity_date: e.target.value })} className={inp} />)}
                        {num('term_months', '대출 기간 (개월)')}
                      </div>
                      {expenseFromPick(d, set)}
                      <input value={d.memo || ''} onChange={e => set({ memo: e.target.value.slice(0, 200) })} placeholder="📝 메모 (선택)" className={inp} />
                      <p className="text-[0.625rem] text-slate-500">대출 계좌번호는 그 대출의 번호입니다 (자동이체 출금 계좌 아님). 📷 캡처로 읽은 번호가 같으면 이 대출에 반영합니다. 담보주택 주소는 넣지 않습니다.</p>
                      <div className="flex gap-2 pt-1">
                        <button onClick={saveLoan} disabled={loanBusy === 'saving'} className="flex-1 py-2 bg-amber-600 text-white font-bold rounded-lg disabled:opacity-50">{loanBusy === 'saving' ? '저장 중…' : '💾 저장'}</button>
                        {d.id && <button onClick={() => deleteLoan(d)} className="px-3 py-2 bg-slate-800 text-rose-300 rounded-lg">삭제</button>}
                        <button onClick={() => setLoanEdit(null)} className="px-3 py-2 bg-slate-800 text-slate-300 rounded-lg">취소</button>
                      </div>
                    </>
                  ));
                }

                // ── 캡처 읽은 결과 확인
                if (loanRead) {
                  const R = loanRead;
                  const d = R.draft;
                  const set = (patch) => setLoanRead(prev => ({ ...prev, draft: { ...prev.draft, ...patch } }));
                  const setPay = (i, patch) => setLoanRead(prev => ({ ...prev, pays: prev.pays.map((p, k) => k === i ? { ...p, ...patch } : p) }));
                  const fresh = R.pays.filter(p => !p.dup);
                  const picked = fresh.filter(p => p.on);
                  // 화면의 '상환금액 합계'와 저장될 기록 합계 비교 → 캡처에 안 보인 회차가 있는지
                  let check = null;
                  if (R.summary) {
                    const saved = R.targetId ? loanPays.filter(p => p.loan_id === R.targetId) : [];
                    const all = [...saved, ...picked];
                    const sum = (k) => all.reduce((t, p) => t + (Number(p[k]) || 0), 0);
                    const diffP = R.summary.principal - sum('principal'), diffI = R.summary.interest - sum('interest');
                    check = { ok: diffP === 0 && diffI === 0, diffP, diffI };
                  }
                  const info = [['최초 대출금액', d.principal && won(d.principal)], ['대출 잔액', d.balance && won(d.balance)], ['금리', d.rate && `${d.rate}% ${d.rate_type || ''}`],
                    ['상환 방법', d.repay_method], ['기간', d.start_date && `${d.start_date} ~ ${d.maturity_date || ''}`], ['대출 기간', d.term_months && `${d.term_months}개월`],
                    ['다음 납부', d.next_due?.date && `${d.next_due.date}${d.next_due.total ? ` · ${won(d.next_due.total)}` : ''}`]].filter(([, v]) => v);
                  return shell('🏠 읽은 내용 확인', () => setLoanRead(null), (
                    <>
                      {R.model && <p className="text-[0.6875rem] text-slate-500">🤖 {R.model}로 사진 {R.photos}장 읽음 · 틀린 곳은 저장한 뒤 고칠 수 있어요</p>}
                      <div className="bg-slate-950 rounded-xl border border-slate-800 p-2 space-y-1.5">
                        <div className="flex justify-between items-center">
                          <p className="font-bold text-amber-300">{R.targetId ? '기존 대출에 반영' : '새 대출로 등록'}</p>
                          {R.hasInfo && <span className="text-[0.625rem] text-sky-300">대출정보 화면 읽음</span>}
                        </div>
                        {field('대출 이름', <input value={d.name || ''} onChange={e => set({ name: e.target.value })} className={inp} />)}
                        {field(R.targetId && loans.find(l => l.id === R.targetId)?.account_no ? '대출 계좌번호' : '대출 계좌번호 (화면에서 읽음 · 틀리면 고치기)', <input value={d.account_no || ''} onChange={e => set({ account_no: e.target.value.replace(/[^0-9-]/g, '').slice(0, 30) })} inputMode="numeric" placeholder="(화면에 없음)" className={inp} />)}
                        {info.length > 0 && (
                          <div className="grid grid-cols-[auto_1fr] gap-x-3 gap-y-0.5 text-slate-300">
                            {info.map(([k, v]) => <React.Fragment key={k}><span className="text-slate-400">{k}</span><b className="text-right">{v}</b></React.Fragment>)}
                          </div>
                        )}
                        {!R.targetId && field('지출은 누구 이름으로', ownerPick(d.owner, o => set({ owner: o })))}
                        {!R.targetId && expenseFromPick(d, set)}
                        {!R.targetId && !R.hasInfo && <p className="text-[0.6875rem] text-amber-300">잔액·금리는 '대출정보 조회' 화면을 올리거나 저장 후 ✏️ 정보 고치기로 넣어주세요.</p>}
                      </div>
                      <div className="bg-slate-950 rounded-xl border border-slate-800 p-2 space-y-1">
                        <p className="font-bold text-amber-300">상환 기록 {R.pays.length}건 {R.pays.length > fresh.length && <span className="text-[0.625rem] text-slate-500 font-normal">· 이미 있는 {R.pays.length - fresh.length}건은 건너뜀</span>}</p>
                        {R.pays.length === 0 && <p className="text-slate-500">상환내역 화면은 없었습니다. (회차별 원금·이자는 '상환내역 조회' 화면을 캡처해 올리세요)</p>}
                        {R.pays.map((p, i) => (
                          <label key={p.key} className={`flex items-start gap-2 py-1 border-b border-slate-800/60 ${p.dup ? 'opacity-40' : ''}`}>
                            <input type="checkbox" disabled={p.dup} checked={p.on && !p.dup} onChange={e => setPay(i, { on: e.target.checked })} className="mt-0.5" />
                            <span className="flex-1">
                              <span className="flex justify-between">
                                <span className="text-slate-200">{p.pay_date}{timeTag(p.pay_time)}{p.seq ? ` · ${p.seq}회` : ''}{kindTag(p.kind)}{p.dup && <span className="ml-1 text-[0.625rem]">(이미 있음)</span>}</span>
                                <b className="text-slate-100">{won(p.total)}</b>
                              </span>
                              {payLine(p)}
                            </span>
                          </label>
                        ))}
                        {check && (check.ok
                          ? <p className="text-emerald-400">✓ 화면의 상환금액 합계(원금·이자)와 저장될 기록 합계가 같습니다.</p>
                          : <p className="text-amber-300">⚠️ 화면의 상환금액 합계보다 원금 {check.diffP.toLocaleString()}원 · 이자 {check.diffI.toLocaleString()}원이 모자랍니다. 캡처에 안 보인 회차가 있으면 그 부분도 캡처해서 올려주세요.</p>)}
                      </div>
                      <div className="flex gap-2 pt-1">
                        <button onClick={saveLoanRead} disabled={loanBusy === 'saving'} className="flex-1 py-2 bg-amber-600 text-white font-bold rounded-lg disabled:opacity-50">
                          {loanBusy === 'saving' ? '저장 중…' : `💾 저장${picked.length ? ` (상환 ${picked.length}건)` : ''}`}
                        </button>
                        <button onClick={() => setLoanRead(null)} className="px-3 py-2 bg-slate-800 text-slate-300 rounded-lg">취소</button>
                      </div>
                    </>
                  ));
                }

                const loanSummary = (l) => {
                  const pays = loanPays.filter(p => p.loan_id === l.id);
                  const bal = loanBalanceNow(l, pays);
                  const repaid = Number(l.principal) > 0 ? Math.max(0, Math.min(100, (1 - bal / Number(l.principal)) * 100)) : 0;
                  const left = monthsLeft(today, l.maturity_date);
                  const nd = l.next_due && l.next_due.date >= today ? l.next_due : null;
                  return { pays, bal, repaid, left, nd };
                };

                // ── 대출 1건 자세히
                const open = loans.find(l => l.id === loanOpenId);
                if (open) {
                  const { pays, bal, repaid, left, nd } = loanSummary(open);
                  const years = [...new Set([...pays.map(p => p.pay_date.slice(0, 4)), today.slice(0, 4)])].sort().reverse();
                  const yr = years.includes(loanYear) ? loanYear : years[0];
                  const yp = pays.filter(p => p.pay_date.startsWith(yr));
                  const sum = (arr, k) => arr.reduce((t, p) => t + (Number(p[k]) || 0), 0);
                  return shell(`🏠 ${open.name}`, () => setLoanOpenId(null), (
                    <>
                      <div className="bg-slate-950 rounded-xl border border-amber-800/60 p-2.5 space-y-1.5">
                        <div className="flex justify-between items-end">
                          <span className="text-slate-400">대출 잔액{open.balance_date ? <span className="text-[0.625rem] text-slate-500"> · {open.balance_date} 기준{bal !== Number(open.balance) ? ' + 이후 상환 반영' : ''}</span> : ''}</span>
                          <b className="text-lg text-amber-300">{won(bal)}</b>
                        </div>
                        {Number(open.principal) > 0 && (
                          <>
                            <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden"><div className="h-full bg-amber-500" style={{ width: `${repaid}%` }} /></div>
                            <p className="text-[0.6875rem] text-slate-400">최초 {won(open.principal)} 중 <b className="text-slate-200">{won(Number(open.principal) - bal)}</b> 갚음 ({repaid.toFixed(1)}%)</p>
                          </>
                        )}
                        <div className="grid grid-cols-2 gap-x-3 gap-y-0.5 text-slate-300">
                          {open.lender && <><span className="text-slate-400">취급기관</span><b className="text-right">{open.lender}</b></>}
                          {open.account_no && <><span className="text-slate-400">계좌번호</span><button onClick={() => copyAccountNo(open.account_no)} className="text-right font-bold underline decoration-dotted">{open.account_no}</button></>}
                          {Number(open.rate) > 0 && <><span className="text-slate-400">금리</span><b className="text-right">{Number(open.rate)}% {open.rate_type}</b></>}
                          {open.repay_method && <><span className="text-slate-400">상환 방법</span><b className="text-right">{open.repay_method}</b></>}
                          {open.maturity_date && <><span className="text-slate-400">만기</span><b className="text-right">{open.maturity_date}{left !== null ? ` (남은 ${left}개월)` : ''}</b></>}
                          {nd && <><span className="text-slate-400">다음 납부</span><b className="text-right text-sky-300">{nd.date}{nd.total ? ` · ${won(nd.total)}` : ''}</b></>}
                        </div>
                        {nd && nd.total > 0 && <p className="text-[0.625rem] text-slate-500 text-right">원금 {Number(nd.principal).toLocaleString()} · 이자 {Number(nd.interest).toLocaleString()}</p>}
                        <p className="text-[0.625rem] text-slate-500">가계부 지출: {open.expense_from ? `${open.expense_from}부터 상환액 전체를 주거/고정비 › 대출상환으로 (${mName(open.owner)})` : '넣지 않음'}</p>
                      </div>
                      <div className="grid grid-cols-3 gap-1.5">
                        {uploadBtn(open.id, '📷 캡처')}
                        <button onClick={() => setPayEdit(newPayDraft(open))} className="py-2 rounded-lg font-bold bg-slate-800 text-slate-200">✍️ 상환 입력</button>
                        <button onClick={() => setLoanEdit({ ...open })} className="py-2 rounded-lg font-bold bg-slate-800 text-slate-200">✏️ 정보</button>
                      </div>
                      <div className="bg-slate-950 rounded-xl border border-slate-800 p-2.5 space-y-1">
                        <div className="flex justify-between items-center">
                          <p className="font-bold text-amber-300">{yr}년 상환 · {yp.length}회</p>
                          <select value={yr} onChange={e => setLoanYear(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-slate-100">
                            {years.map(y => <option key={y} value={y}>{y}년</option>)}
                          </select>
                        </div>
                        <div className="grid grid-cols-2 gap-x-3 gap-y-0.5 text-slate-300">
                          <span>원금</span><b className="text-right">{won(sum(yp, 'principal'))}</b>
                          <span>이자 <span className="text-[0.625rem] text-slate-500">(연말정산 참고)</span></span><b className="text-right text-amber-300">{won(sum(yp, 'interest'))}</b>
                          {sum(yp, 'fee') > 0 && <><span>조기상환수수료</span><b className="text-right">{won(sum(yp, 'fee'))}</b></>}
                          {sum(yp, 'late_fee') > 0 && <><span>지연배상금</span><b className="text-right">{won(sum(yp, 'late_fee'))}</b></>}
                          <span>합계</span><b className="text-right">{won(sum(yp, 'total'))}</b>
                        </div>
                        {pays.length > yp.length && <p className="text-[0.625rem] text-slate-500">저장된 전체 {pays.length}회: 원금 {won(sum(pays, 'principal'))} · 이자 {won(sum(pays, 'interest'))}{sum(pays, 'fee') > 0 ? ` · 수수료 ${won(sum(pays, 'fee'))}` : ''}</p>}
                      </div>
                      <div className="space-y-1.5">
                        {yp.length === 0 && <p className="text-slate-500 text-center py-2">{yr}년 상환 기록이 없습니다.</p>}
                        {yp.map(p => (
                          <button key={p.id} onClick={() => setPayEdit({ ...p, principal: String(p.principal), interest: String(p.interest), fee: String(p.fee || ''), late_fee: String(p.late_fee || ''), seq: p.seq ?? '' })}
                            className="w-full text-left bg-slate-950 rounded-xl border border-slate-800 p-2.5 space-y-0.5">
                            <div className="flex justify-between">
                              <b className="text-slate-100">{p.pay_date}{timeTag(p.pay_time)}{p.seq ? ` · ${p.seq}회` : ''}{kindTag(p.kind)}</b>
                              <b className="text-slate-100">{won(p.total)}</b>
                            </div>
                            <p>{payLine(p)}{p.expense_id && expenses.some(e => e.id === p.expense_id) ? <span className="text-[0.625rem] text-slate-500"> · 🔗지출</span> : p.expense_id && trash.some(e => e.id === p.expense_id) ? <span className="text-[0.625rem] text-slate-500"> · 🗑️지출 휴지통</span> : ''}{p.memo ? <span className="text-[0.625rem] text-slate-400"> · 📝 {p.memo}</span> : ''}</p>
                          </button>
                        ))}
                      </div>
                      {pays.length > 0 && <button onClick={() => exportLoan(open)} className="w-full py-2 bg-slate-800 text-slate-200 font-bold rounded-lg">📥 상환 기록 엑셀 저장</button>}
                    </>
                  ));
                }

                // ── 대출 목록
                return shell('🏠 대출', () => setShowLoans(false), (
                  <>
                    <div className="grid grid-cols-2 gap-2">
                      {uploadBtn(null, '📷 캡처 올리기')}
                      <button onClick={() => setLoanEdit(newLoanDraft())} className="py-2 rounded-lg font-bold bg-slate-800 text-slate-200">✍️ 직접 등록</button>
                    </div>
                    <p className="text-[0.625rem] text-slate-500 leading-relaxed">
                      은행 앱의 '대출정보 조회'와 '상환내역 조회' 화면을 캡처해 함께(최대 10장) 올리면 AI가 잔액·금리와 회차별 원금·이자를 읽습니다. 이미 넣은 회차는 건너뜁니다.
                      대출 계좌번호도 읽습니다(자동이체 계좌·주소·담당자는 읽지 않음). 상환할 때마다 원금+이자 합계를 지출(주거/고정비 › 대출상환)로 넣습니다.
                    </p>
                    {loanState === 'loading' && <p className="text-slate-400 text-center py-4">불러오는 중…</p>}
                    {loanState === 'missing' && <p className="text-amber-300 py-2">서버에 대출 표가 아직 없습니다. Supabase SQL Editor에서 <b>v1.34 업데이트 SQL</b>을 실행해주세요.</p>}
                    {loanState && !['loading', 'missing'].includes(loanState) && <p className="text-rose-300 py-2">{loanState}</p>}
                    {!loanState && loans.length === 0 && <p className="text-slate-500 text-center py-4">등록된 대출이 없습니다.</p>}
                    {!loanState && loans.map(l => {
                      const { bal, repaid, left, nd } = loanSummary(l);
                      return (
                        <button key={l.id} onClick={() => setLoanOpenId(l.id)} className="w-full text-left bg-slate-950 rounded-xl border border-slate-800 p-2.5 space-y-1">
                          <div className="flex justify-between">
                            <b className="text-slate-100">{l.name}{l.lender || l.account_no ? <span className="text-[0.625rem] text-slate-500 font-normal">{l.lender ? ` · ${l.lender}` : ''}{l.account_no ? ` …${accountDigits(l.account_no).slice(-4)}` : ''}</span> : ''}</b>
                            <b className="text-amber-300">{won(bal)}</b>
                          </div>
                          {Number(l.principal) > 0 && <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden"><div className="h-full bg-amber-500" style={{ width: `${repaid}%` }} /></div>}
                          <p className="text-[0.625rem] text-slate-500">
                            {Number(l.principal) > 0 && `${repaid.toFixed(1)}% 상환`}
                            {Number(l.rate) > 0 && ` · ${Number(l.rate)}% ${l.rate_type || ''}`}
                            {left !== null && ` · 남은 ${left}개월`}
                            {nd && ` · 다음 ${nd.date.slice(5)}${nd.total ? ` ${Number(nd.total).toLocaleString()}원` : ''}`}
                          </p>
                        </button>
                      );
                    })}
                  </>
                ));
              })()}

              {(showGifts || giftRecEdit || giftEventEdit) && (() => {
                const won = (n) => `${Number(n || 0).toLocaleString()}원`;
                const today = getKSTDateTimeString().slice(0, 10);
                const dday = (d) => Math.round((Date.parse(d + 'T00:00:00Z') - Date.parse(today + 'T00:00:00Z')) / 86400000);
                const inp = 'w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-slate-100 text-xs';
                const field = (label, el) => (<div><label className="text-[0.6875rem] text-slate-400">{label}</label><div className="mt-0.5">{el}</div></div>);
                const chips = (list, val, onPick, on = 'bg-pink-700 text-white') => (
                  <div className="flex flex-wrap gap-1">{list.map(([k, label]) => (
                    <button key={k} onClick={() => onPick(k)} className={`px-2 py-1 rounded-full text-[0.6875rem] ${val === k ? on : 'bg-slate-800 text-slate-400'}`}>{label}</button>
                  ))}</div>
                );
                const shell = (title, onClose, body, z = 'z-50') => (
                  <div className={`fixed inset-0 ${z} bg-black/80 flex items-center justify-center p-3`}>
                    <div className="bg-slate-900 border border-pink-800/60 rounded-2xl max-w-md w-full p-4 space-y-2.5 max-h-[92vh] overflow-y-auto text-xs">
                      <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                        <h3 className="font-bold text-white text-sm">{title}</h3>
                        <button onClick={onClose} className="text-slate-400">✕</button>
                      </div>
                      {body}
                    </div>
                  </div>
                );
                const sideOpts = [...members.map(m => [m.key, `${m.emoji || ''} ${m.name}`.trim()]), ['공동', '👫 공동']];
                const sideLabel = (k) => (sideOpts.find(([x]) => x === k) || [k, k])[1];
                const recsOf = (pid) => giftRecs.filter(r => r.person_id === pid);
                const sumOf = (rs, dir) => rs.filter(r => r.direction === dir && r.status === '완료').reduce((t, r) => t + Number(r.amount), 0);
                const editRec = (r) => setGiftRecEdit({ ...r, amount: r.amount ? String(r.amount) : '', link: r.expense_id && !String(r.expense_id).startsWith('giftx-') ? 'exist' : 'auto' });
                const recLine = (r, showName) => {
                  const p = giftPerson(r.person_id);
                  const ex = r.expense_id ? expenses.find(e => e.id === r.expense_id) : null;
                  return (
                    <button key={r.id} onClick={() => editRec(r)} className={`w-full text-left bg-slate-950 rounded-xl border p-2 space-y-0.5 ${r.status === '예정' ? 'border-pink-800/70' : 'border-slate-800'}`}>
                      <div className="flex justify-between gap-2">
                        <span className="text-slate-200"><b className={r.direction === '보냄' ? 'text-pink-300' : 'text-emerald-300'}>{r.direction === '보냄' ? '↗ 보냄' : '↙ 받음'}</b> {showName ? `${p?.name || '?'} · ` : ''}{r.event_type}</span>

                  const fresh = R.pays.filter(p => !p.dup);
                  const picked = fresh.filter(p => p.on);
                  const info = R.info || {};
                  // 저장하면 자동 채우기가 넣을 납입 (적금 자동 납입·예금 가입 원금). 사진의 납입이 있는 달은 빼고
                  const haveIds = new Set(R.targetId ? savPays.filter(p => p.savings_id === R.targetId).map(p => p.id) : []);
                  const pickedMonths = new Set(picked.map(p => p.pay_date.slice(0, 7)));
                  const autoRows = d.kind === '자유' ? [] : savingsDueRows({ ...d, id: R.targetId || 'new', status: R.targetId ? (d.status || '진행') : '진행', skip_months: d.skip_months || [] }, today)
                    .filter(r => !haveIds.has(r.id) && !pickedMonths.has(r.pay_date.slice(0, 7)));
                  const autoSum = autoRows.reduce((t, r) => t + r.amount, 0);
                  const after = (R.targetId ? savPaidSum(R.targetId) : 0) + picked.reduce((t, p) => t + p.amount, 0) + autoSum;
                  const rows = [['은행', d.bank], ['월 납입액', d.kind === '적금' && Number(d.monthly) ? `${Number(d.monthly).toLocaleString()}원` : ''], ['원금', d.kind === '예금' && Number(d.principal) ? `${Number(d.principal).toLocaleString()}원` : ''],
                    ['금리', Number(d.rate) ? `${Number(d.rate)}%` : ''], ['기간', d.start_date ? `${d.start_date} ~ ${d.maturity_date || ''}` : ''], ['납입일', d.kind === '적금' && d.pay_day ? `매달 ${d.pay_day}일` : ''],
                    ['이자 세금', d.kind !== '자유' && !R.targetId ? d.tax_type : ''], ['우대 최고', Number(info.max_rate) > Number(info.rate || 0) ? `${Number(info.max_rate)}%${R.targetId ? '' : ' (메모에 남김)'}` : ''],
                    ['납입 회차', info.paid_count ? `${info.paid_count}${info.total_count ? ` / ${info.total_count}` : ''}회` : ''], ['통장 잔액', info.balance ? `${Number(info.balance).toLocaleString()}원` : '']].filter(([, v]) => v);

                    <>
                      {R.model && <p className="text-[0.6875rem] text-slate-500">🤖 {R.model}로 사진 {R.photos}장 읽음 · 틀린 곳은 저장한 뒤 ✏️ 정보에서 고칠 수 있어요</p>}

                            ))}
                          </div>

                        {rows.length > 0 && (
                          <div className="grid grid-cols-[auto_1fr] gap-x-3 gap-y-0.5 text-slate-300">

                        )}
                        {!R.targetId && field('누구 돈', ownerPick(d.owner, o => set({ owner: o })))}

                          <label className="flex items-start gap-2 text-slate-300">
                            <input type="checkbox" checked={!!d.auto} onChange={e => set({ auto: e.target.checked })} className="mt-0.5" />

                          </label>
                        )}
                        {!R.targetId && (
                          <label className="flex items-center gap-2 text-slate-300">
                            <input type="checkbox" checked={!!d.expense_from} onChange={e => set({ expense_from: e.target.checked ? today.slice(0, 7) : '' })} />
                            <span>납입액을 지출(저축/투자)로 {d.expense_from ? <input type="month" value={d.expense_from} onChange={e => set({ expense_from: e.target.value })} className="bg-slate-950 border border-slate-700 rounded px-1 text-[0.6875rem]" /> : ''}{d.expense_from ? '부터' : ''}</span>

                      <div className="bg-slate-950 rounded-xl border border-slate-800 p-2 space-y-1">

                        <button onClick={() => setSavClose(null)} className="px-3 py-2 bg-slate-800 text-slate-300 rounded-lg">취소</button>
                      </div>
                    </>
                  ));
                }

                // ── 납입 1건 입력·고치기
                if (savPayEdit) {
                  const d = savPayEdit;
                  const set = (patch) => setSavPayEdit(prev => ({ ...prev, ...patch }));
                  const fromInput = inputReturn === 'savings' && !d.id;
                  const act = savings.filter(a => a.status === '진행');
                  const a = savings.find(x => x.id === d.savings_id) || {};
                  return shell(`🏦 납입 ${d.id ? '고치기' : '입력'}`, () => setSavPayEdit(null), (
                    <>

                        <select value={d.savings_id} onChange={e => { const x = savings.find(y => y.id === e.target.value); if (x) setSavPayEdit({ ...newSavPayDraft(x), memo: d.memo }); }} className={inp}>

                      </div>
                      {exp && exp.principal > 0 && (
                        <p className="text-[0.6875rem] text-sky-200 bg-sky-950/40 border border-sky-800 rounded-lg p-2">

                        </label>
                      )}
                      <div className="space-y-1">

                        {d.expense_from && (

                        )}
                      </div>
                      <input value={d.memo || ''} onChange={e => set({ memo: e.target.value.slice(0, 200) })} placeholder="📝 메모 (선택)" className={inp} />
                      <p className="text-[0.625rem] text-slate-500">계좌번호는 그 저축 통장의 번호입니다 (자동이체 출금 계좌 아님). 📷 캡처로 읽은 번호가 같으면 이 저축에 반영합니다.</p>
                      <div className="flex gap-2 pt-1">
                        <button onClick={saveSavingsAccount} disabled={savBusy === 'saving'} className="flex-1 py-2 bg-sky-600 text-white font-bold rounded-lg disabled:opacity-50">{savBusy === 'saving' ? '저장 중…' : '💾 저장'}</button>
                        {d.id && <button onClick={() => deleteSavingsAccount(savings.find(x => x.id === d.id))} className="px-3 py-2 bg-slate-800 text-rose-300 rounded-lg">삭제</button>}
                        <button onClick={() => setSavEdit(null)} className="px-3 py-2 bg-slate-800 text-slate-300 rounded-lg">취소</button>
                      </div>
                    </>
                  ));
                }

                // ── 저축 1건 자세히
                const open = savings.find(a => a.id === savOpenId);
                if (open) {
                  const { paid, exp, n, prog } = summaryOf(open);
                  const pays = savPays.filter(p => p.savings_id === open.id);
                  const left = open.maturity_date ? monthsLeft(today, open.maturity_date) : null;
                  return shell(`🏦 ${open.name}`, () => setSavOpenId(null), (
                    <>
                      <div className="bg-slate-950 rounded-xl border border-sky-800/60 p-2.5 space-y-1.5">
                        <div className="flex justify-between items-end">
                          <span className="text-slate-400">넣은 돈 <span className="text-[0.625rem] text-slate-500">· {kindLabel(open)}{open.status !== '진행' ? ` · ${open.status} ${open.closed_date}` : ''}</span></span>
                          <b className="text-lg text-sky-300">{won(paid)}</b>
                        </div>
                        {prog !== null && (
                          <>
                            <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden"><div className="h-full bg-sky-500" style={{ width: `${prog}%` }} /></div>
                            <p className="text-[0.6875rem] text-slate-400">{exp.n}회 중 <b className="text-slate-200">{n}회</b> 납입 ({prog}%)</p>
                          </>
                        )}
                        <div className="grid grid-cols-2 gap-x-3 gap-y-0.5 text-slate-300">
                          {open.bank && <><span className="text-slate-400">은행</span><b className="text-right">{open.bank}</b></>}
                          {open.account_no && <><span className="text-slate-400">계좌번호</span><button onClick={() => copyAccountNo(open.account_no)} className="text-right font-bold underline decoration-dotted">{open.account_no}</button></>}
                          {open.kind === '적금' && <><span className="text-slate-400">월 납입</span><b className="text-right">{won(open.monthly)} · 매달 {open.pay_day}일{open.auto ? ' (자동)' : ''}</b></>}
                          {open.kind === '예금' && <><span className="text-slate-400">원금</span><b className="text-right">{won(open.principal)}</b></>}
                          {Number(open.rate) > 0 && <><span className="text-slate-400">금리</span><b className="text-right">{Number(open.rate)}% · {open.tax_type}</b></>}
                          {open.start_date && <><span className="text-slate-400">기간</span><b className="text-right">{open.start_date} ~ {open.maturity_date || ''}</b></>}
                          {left !== null && open.status === '진행' && <><span className="text-slate-400">만기까지</span><b className="text-right">{left}개월</b></>}
                          {exp && <><span className="text-slate-400">만기 예상 (세후)</span><b className="text-right text-sky-300">{won(exp.afterTax)}</b></>}
                          {exp && <><span className="text-slate-400 pl-2">└ 이자 (세전)</span><b className="text-right text-slate-400">{won(exp.interest)}</b></>}
                          {open.status !== '진행' && <><span className="text-slate-400">받은 돈</span><b className="text-right text-emerald-300">{won(open.payout)}</b></>}
                        </div>
                        <p className="text-[0.625rem] text-slate-500">가계부 지출: {open.expense_from ? `${open.expense_from}부터 납입액을 저축/투자 › ${savingsCat(open).sub_category}로 (${mName(open.owner)})` : '넣지 않음'}</p>
                      </div>
                      <div className="grid grid-cols-4 gap-1.5">
                        {capBtn(open.id, '📷 캡처')}
                        <button onClick={() => setSavPayEdit(newSavPayDraft(open))} disabled={open.status !== '진행'} className="py-2 rounded-lg font-bold bg-sky-600 text-white disabled:opacity-40">✍️ 납입</button>
                        <button onClick={() => setSavEdit({ ...open, monthly: String(open.monthly || ''), principal: String(open.principal || ''), pay_day: String(open.pay_day || ''), rate: String(open.rate || '') })} className="py-2 rounded-lg font-bold bg-slate-800 text-slate-200">✏️ 정보</button>
                        {open.status === '진행'
                          ? <button onClick={() => { const e = savingsExpected(open); setSavClose({ id: open.id, type: '만기', date: open.maturity_date && open.maturity_date <= today ? open.maturity_date : today, amount: String(e ? e.afterTax : paid), toIncome: true }); }} className="py-2 rounded-lg font-bold bg-slate-800 text-emerald-300">💰 만기·해지</button>
                          : <button onClick={() => reopenSavings(open)} className="py-2 rounded-lg font-bold bg-slate-800 text-slate-300">↩️ 진행으로</button>}
                      </div>
                      <div className="space-y-1.5">
                        {pays.length === 0 && <p className="text-slate-500 text-center py-2">납입 기록이 없습니다.</p>}
                        {pays.slice(0, 120).map(p => (
                          <button key={p.id} onClick={() => setSavPayEdit({ ...p, amount: String(p.amount) })} className="w-full text-left bg-slate-950 rounded-xl border border-slate-800 px-2.5 py-2 flex justify-between items-center">
                            <span className="text-slate-200">{p.pay_date}{timeTag(p.pay_time)}{p.seq ? <span className="text-slate-500"> · {p.seq}회</span> : ''}{p.auto ? <span className="text-[0.625rem] text-slate-500"> · 자동</span> : ''}
                              {p.expense_id && expenses.some(e => e.id === p.expense_id) ? <span className="text-[0.625rem] text-slate-500"> · 🔗지출</span> : p.expense_id && trash.some(e => e.id === p.expense_id) ? <span className="text-[0.625rem] text-slate-500"> · 🗑️지출 휴지통</span> : ''}
                              {p.memo ? <span className="text-[0.625rem] text-slate-400"> · 📝 {p.memo}</span> : ''}</span>
                            <b className="text-slate-100">{won(p.amount)}</b>
                          </button>
                        ))}
                        {(open.skip_months || []).length > 0 && <p className="text-[0.625rem] text-slate-500">자동 납입에서 뺀 달: {open.skip_months.join(', ')}</p>}
                      </div>
                    </>
                  ));
                }

                // ── 저축 목록 + 자산 요약
                const act = savings.filter(a => a.status === '진행');
                const done = savings.filter(a => a.status !== '진행');
                const saveSum = act.reduce((t, a) => t + savPaidSum(a.id), 0);
                const loanSum = loans.reduce((t, l) => t + loanBalanceNow(l, loanPays), 0);
                const row = (a) => {
                  const { paid, exp, n, prog } = summaryOf(a);
                  return (
                    <button key={a.id} onClick={() => setSavOpenId(a.id)} className={`w-full text-left bg-slate-950 rounded-xl border border-slate-800 p-2.5 space-y-1 ${a.status !== '진행' ? 'opacity-60' : ''}`}>
                      <div className="flex justify-between">
                        <b className="text-slate-100">{a.name}<span className="text-[0.625rem] text-slate-500 font-normal"> · {kindLabel(a)}{a.bank ? ` · ${a.bank}` : ''}{a.account_no ? ` …${accountDigits(a.account_no).slice(-4)}` : ''} · {mName(a.owner)}</span></b>
                        <b className="text-sky-300">{won(paid)}</b>
                      </div>
                      {prog !== null && a.status === '진행' && <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden"><div className="h-full bg-sky-500" style={{ width: `${prog}%` }} /></div>}
                      <p className="text-[0.625rem] text-slate-500">
                        {a.status !== '진행' ? `${a.status} ${a.closed_date} · 받은 돈 ${won(a.payout)}`
                          : [prog !== null ? `${n}/${exp.n}회` : '', a.kind === '적금' ? `월 ${Number(a.monthly).toLocaleString()}원` : '', a.maturity_date ? `만기 ${a.maturity_date}` : '', exp ? `예상 ${won(exp.afterTax)}` : ''].filter(Boolean).join(' · ')}
                      </p>
                    </button>
                  );
                };
                return shell('🏦 저축', () => setShowSavings(false), (
                  <>
                    <div className="bg-slate-950 rounded-xl border border-sky-800/60 p-2.5 space-y-0.5">
                      <div className="grid grid-cols-2 gap-x-3 gap-y-0.5 text-slate-300">
                        <span>저축 (넣은 돈)</span><b className="text-right text-sky-300">{won(saveSum)}</b>
                        {loanSum > 0 && <><span>대출 잔액</span><b className="text-right text-amber-300">−{won(loanSum)}</b></>}
                        {loanSum > 0 && <><span className="font-bold">순자산 (저축 − 대출)</span><b className={`text-right ${saveSum - loanSum >= 0 ? 'text-emerald-300' : 'text-rose-300'}`}>{(saveSum - loanSum).toLocaleString()}원</b></>}
                      </div>
                      <p className="text-[0.625rem] text-slate-500">이자는 만기 때 받은 돈으로 반영됩니다. 통장 잔고·집값은 들어가지 않아요.</p>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <button onClick={() => setSavEdit(newSavDraft('적금'))} className="py-2 rounded-lg font-bold bg-sky-600 text-white">＋ 저축 등록</button>
                      {capBtn(null, '📷 캡처 올리기')}
                    </div>
                    <p className="text-[0.625rem] text-slate-500">은행 앱의 적금·예금 가입 정보와 거래내역 화면을 캡처해 함께(최대 10장) 올리면 AI가 금리·만기·납입 내역을 읽습니다. 📷 사진으로 등록(➕ 입력)에 올려도 알아봐요.</p>
                    {savState === 'loading' && <p className="text-slate-400 text-center py-4">불러오는 중…</p>}
                    {savState === 'missing' && <p className="text-amber-300 py-2">서버에 저축 표가 아직 없습니다. Supabase SQL Editor에서 <b>v1.53 업데이트 SQL</b>을 실행해주세요.</p>}
                    {savState && !['loading', 'missing'].includes(savState) && <p className="text-rose-300 py-2">{savState}</p>}
                    {!savState && savings.length === 0 && <p className="text-slate-500 text-center py-4">등록된 저축이 없습니다.</p>}
                    {!savState && act.map(row)}
                    {!savState && done.length > 0 && <p className="text-slate-500 pt-1">끝난 저축</p>}
                    {!savState && done.map(row)}
                    <p className="text-[0.625rem] text-slate-500 leading-relaxed">납입액은 지출(저축/투자)로 들어가 지출 합계·예산에 포함됩니다. 만기·해지 때 받은 돈은 수입(금융 › 적금·예금 만기)으로 넣어요.</p>
                  </>
                ));
              })()}

              {showTrash && (
                <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
                  <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-4 space-y-3 max-h-[85vh] flex flex-col text-xs">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                      <h3 className="font-bold text-white text-sm">🗑️ 휴지통 ({trash.length}건)</h3>
                      <button onClick={() => setShowTrash(false)} className="text-slate-400">✕</button>
                    </div>
                    <p className="text-[0.6875rem] text-slate-400 leading-relaxed">
                      삭제한 내역은 {TRASH_KEEP_DAYS}일 동안 보관되고 그 뒤 자동으로 영구 삭제됩니다. 휴지통 내역은 통계·엑셀에 들어가지 않습니다.
                    </p>
                    <div className="overflow-y-auto space-y-2 flex-1 min-h-0">
                      {trash.length === 0 && <p className="text-slate-500 text-center py-6">휴지통이 비어 있습니다.</p>}
                      {trash.map(item => {
                        const left = Math.max(0, TRASH_KEEP_DAYS - Math.floor((Date.now() - new Date(item.deleted_at).getTime()) / 86400000));
                        return (
                          <div key={item.id} className="p-2.5 rounded-xl border border-slate-800 bg-slate-950 space-y-1.5">
                            <div className="flex justify-between gap-2">
                              <span className="font-bold text-slate-200 truncate">{item.store}</span>
                              <span className={`font-bold shrink-0 ${item.amount < 0 ? 'text-emerald-400' : 'text-slate-200'}`}>{Number(item.amount).toLocaleString()}원</span>
                            </div>
                            <p className="text-[0.625rem] text-slate-500">
                              {item.date} · {mName(item.payer)} · {item.category} › {item.sub_category} · {left}일 뒤 자동 삭제
                            </p>
                            {item.linked_backup?.label && <p className="text-[0.625rem] text-sky-300">🔗 함께 지운 {item.linked_backup.label} 보관 중 (복원할 때 같이 되살릴 수 있음)</p>}
                            <div className="flex gap-1.5 justify-end">
                              <button onClick={() => restoreExpenseRow(item)} className="px-2.5 py-1 bg-indigo-600 text-white font-bold rounded-lg">↩️ 복원</button>
                              <button onClick={() => purgeExpenseRows([item])} className="px-2.5 py-1 bg-slate-800 text-rose-300 rounded-lg">영구 삭제</button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                    {trash.length > 1 && (
                      <button onClick={() => purgeExpenseRows(trash)} className="w-full py-2 bg-slate-800 text-rose-300 font-bold rounded-lg">
                        🧹 휴지통 비우기 ({trash.length}건 영구 삭제)
                      </button>
                    )}
                  </div>
                </div>
              )}

              {showVersionModal && (
                <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
                  <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-4 space-y-3 max-h-[80vh] overflow-y-auto">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                      <h3 className="font-bold text-white text-sm">🕓 버전 히스토리 ({APP_VERSION})</h3>
                      <button onClick={() => setShowVersionModal(false)} className="text-slate-400">✕</button>
                    </div>
                    {VERSION_HISTORY.map(v => (
                      <div key={v.version} className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs space-y-1">
                        <div className="flex justify-between font-bold text-emerald-400">
                          <span>{v.version} - {v.title}</span>
                          <span>{v.date}</span>
                        </div>
                        <ul className="list-disc pl-4 text-slate-300 space-y-1 pt-1">
                          {v.changes.map((ch, i) => <li key={i}>{ch}</li>)}
                        </ul>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <nav className="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 z-30 safe-bottom">
                <div className="max-w-xl mx-auto grid grid-cols-5 font-bold" style={{ fontSize: `${0.75 * uiSize.nav}rem`, paddingTop: `${0.5 * uiSize.nav}rem`, paddingBottom: `${0.5 * uiSize.nav}rem` }}>
                  <button onClick={() => goTab('list')} className={activeTab === 'list' ? 'text-indigo-300' : 'text-slate-400'}>
                    <span className={`inline-block whitespace-nowrap px-[0.45em] py-[0.15em] rounded-full ${activeTab === 'list' ? 'bg-indigo-600/90 text-white' : ''}`}>📋 내역</span>
                  </button>
                  <button onClick={() => goTab('stats')} className={activeTab === 'stats' ? 'text-indigo-300' : 'text-slate-400'}>
                    <span className={`inline-block whitespace-nowrap px-[0.45em] py-[0.15em] rounded-full ${activeTab === 'stats' ? 'bg-indigo-600/90 text-white' : ''}`}>📊 통계</span>
                  </button>
                  <button onClick={() => goTab('input')} className={activeTab === 'input' ? 'text-indigo-300' : 'text-slate-400'}>
                    <span className={`inline-block whitespace-nowrap px-[0.45em] py-[0.15em] rounded-full ${activeTab === 'input' ? 'bg-indigo-600/90 text-white' : ''}`}>➕ 입력</span>
                  </button>
                  <button onClick={() => goTab('assets')} className={activeTab === 'assets' ? 'text-indigo-300' : 'text-slate-400'}>
                    <span className={`inline-block whitespace-nowrap px-[0.45em] py-[0.15em] rounded-full ${activeTab === 'assets' ? 'bg-indigo-600/90 text-white' : ''}`}>🏦 자산</span>
                  </button>
                  <button onClick={() => goTab('cats')} className={activeTab === 'cats' ? 'text-indigo-300' : 'text-slate-400'}>
                    <span className={`inline-block whitespace-nowrap px-[0.45em] py-[0.15em] rounded-full ${activeTab === 'cats' ? 'bg-indigo-600/90 text-white' : ''}`}>⚙️ 설정</span>
                  </button>
                </div>
              </nav>
            </>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script id="sw-register">
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.warn('서비스 워커 등록 실패:', err));
      });
    }
  </script>
</body>
</html>
