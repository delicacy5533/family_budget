                {activeTab === 'stats' && (
                  <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
                    <h3 className="font-bold text-white text-base">📊 카테고리별 통계 ({selectedMonth === 'ALL' ? '전체' : selectedMonth})</h3>
                    {categories.map(c => {
                      const sum = monthFiltered.filter(e => e.category === c.name).reduce((s, e) => s + e.amount, 0);
                      const pct = totalAmount > 0 ? Math.max(0, Math.round((sum / totalAmount) * 100)) : 0;
                      return (
                        <div key={c.id} className="text-xs space-y-1">
                          <div className="flex justify-between">
                            <span>{c.name}</span>
                            <span className="font-bold">{sum.toLocaleString()}원 ({pct}%)</span>
                          </div>
                          <div className="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                            <div className="h-full bg-indigo-500" style={{ width: `${Math.min(100, pct)}%` }} />
                          </div>
                        </div>
                      );
                    })}
                    {uncategorizedSum !== 0 && (
                      <div className="text-xs space-y-1 pt-1 border-t border-slate-800">
                        <div className="flex justify-between text-amber-300">
                          <span>삭제된 구 카테고리 내역</span>
                          <span className="font-bold">{uncategorizedSum.toLocaleString()}원</span>
                        </div>
                      </div>
                    )}
                    <div className="grid grid-cols-2 gap-2 pt-3">
                      <button onClick={() => exportCSV(true)} className="py-2.5 bg-amber-600 text-white font-bold rounded-xl text-xs">
                        💼 업무경비만 엑셀 저장
                      </button>
                      <button onClick={() => exportCSV(false)} className="py-2.5 bg-slate-800 text-white font-bold rounded-xl text-xs border border-slate-700">
                        📥 현재 월 엑셀 저장
                      </button>
                    </div>
                  </div>
                )}
              </main>

              {showCodeMigrateModal && (
                <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
                  <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-4 space-y-3.5 text-xs">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                      <h3 className="font-bold text-white text-sm">🔒 가족 보안 코드 변경</h3>
                      <button onClick={() => setShowCodeMigrateModal(false)} className="text-slate-400">✕</button>
                    </div>

                    <div className="bg-amber-950/40 border border-amber-700/50 rounded-xl p-2.5 text-[11px] text-amber-200 space-y-1">
                      <p className="font-bold">⚠️ 코드 이전 시 자동 보호 안내</p>
                      <p>• 전체 내역({expenses.length}건)을 서버에서 새 코드로 옮기고, 이전 코드는 바로 사용할 수 없게 됩니다.</p>
                      <p>• 이미 다른 가계부가 쓰는 코드로는 바꿀 수 없습니다.</p>
                      <p>• 이전 완료 후 <b>배우자 스마트폰</b>과 <b>자동 문자 포워더(fam_code)</b>도 반드시 새 코드로 변경해주세요!</p>
                    </div>

                    <div className="space-y-2 bg-slate-950 p-3 rounded-xl border border-slate-800">
                      <label className="text-slate-400 font-bold">새로 사용할 가족 보안 코드</label>
                      <input
                        type="text"
                        value={newPassTarget}
                        onChange={e => setNewPassTarget(e.target.value)}
                        placeholder={`새 보안 코드 (${MIN_CODE_LENGTH}자 이상)`}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white font-bold text-center tracking-wider"
                      />
                      <button
                        onClick={() => {
                          const generated = generateSecureFamilyPass();
                          setNewPassTarget(generated);
                          copyToClipboard(generated, '새 12자리 보안 코드');
                        }}
                        className="w-full py-1.5 bg-slate-800 text-emerald-300 font-bold rounded-lg border border-slate-700"
                      >
                        🎲 새 12자리 보안 코드 자동 생성 & 복사
                      </button>
                    </div>

                    <div className="space-y-2 pt-1">
                      <button
                        disabled={isMigrating}
                        onClick={handleMigrateFamilyCode}
                        className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl"
                      >
                        {isMigrating ? '⏳ 서버에서 데이터 이전 중...' : `🔄 기존 데이터(${expenses.length}건)를 새 코드로 모두 옮기기`}
                      </button>
                      <button
                        onClick={() => {
                          setShowCodeMigrateModal(false);
                          setPassInput('');
                          setIsUnlocked(false);
                        }}
                        className="w-full py-2 bg-slate-800 text-slate-300 rounded-xl border border-slate-700"
                      >
                        다른 코드로 접속 (배우자가 만든 가계부에 들어갈 때)
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {showWebhookModal && (
                <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
                  <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-4 space-y-3 max-h-[85vh] overflow-y-auto text-xs">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                      <h3 className="font-bold text-white text-sm">⚡ 문자 자동연동 & DB 설정</h3>
                      <button onClick={() => setShowWebhookModal(false)} className="text-slate-400">✕</button>
                    </div>

                    <div className="bg-slate-950 p-3 rounded-xl border border-amber-500/40 space-y-2">
                      <div className="flex justify-between items-center">
                        <span className="font-bold text-amber-300">🛠️ DB 설정 SQL (스키마 {REQUIRED_SCHEMA_VERSION})</span>
                        <button
                          onClick={() => copyToClipboard(EMBEDDED_SQL_SCRIPT, '설정 SQL')}
                          className="bg-amber-600 text-white px-2.5 py-1 rounded font-bold"
                        >
                          SQL 복사
                        </button>
                      </div>
                      <p className="text-[11px] text-slate-400 leading-relaxed">
                        Supabase SQL Editor에 붙여넣고 Run. 여러 번 실행해도 안전합니다. 현재 DB 스키마: {dbSchemaVersion ?? '확인 전'}.
                        처음 설치할 때는 함께 받은 <b>초기화 SQL</b>을 먼저 한 번 실행하세요.
                      </p>
                    </div>

                    <div className="bg-slate-950 p-3 rounded-xl border border-emerald-500/40 space-y-2">
                      <span className="font-bold text-emerald-300">📞 받을 카드사 발신번호</span>
                      <p className="text-[11px] text-slate-400 leading-relaxed">
                        등록하면 이 번호에서 온 문자만 자동 등록합니다. 비워 두면 번호는 검사하지 않고 문자 내용만 검사합니다.
                        포워더가 문자 앞에 <code>보낸사람 : 번호</code> 줄을 붙여 보내야 번호 검사가 됩니다.
                      </p>
                      <div className="flex gap-2">
                        <input
                          type="tel"
                          value={senderInput}
                          onChange={e => setSenderInput(e.target.value)}
                          placeholder="예: 1544-7000"
                          className="flex-1 min-w-0 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-white"
                        />
                        <button onClick={handleAddSender} className="bg-emerald-600 text-white font-bold px-3 py-1.5 rounded-lg whitespace-nowrap">+ 추가</button>
                      </div>
                      <div className="flex gap-1.5 flex-wrap">
                        {allowedSenders.length === 0 && <span className="text-slate-500">등록된 번호 없음 (번호 검사 안 함)</span>}
                        {allowedSenders.map(num => (
                          <span key={num} className="flex items-center gap-1.5 bg-slate-800 text-slate-200 px-2.5 py-1 rounded-md border border-slate-700">
                            {num}
                            <button
                              onClick={() => saveAllowedSenders(allowedSenders.filter(x => x !== num))}
                              className="text-rose-400 font-bold"
                            >
                              ✕
                            </button>
                          </span>
                        ))}
                      </div>
                    </div>

                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                      <div className="flex justify-between items-center">
                        <span className="font-bold text-indigo-300">1. 요청 URL (POST)</span>
                        <button
                          onClick={() => copyToClipboard(`${SUPABASE_URL}/rest/v1/rpc/receive_sms`, '요청 URL')}
                          className="bg-indigo-600 text-white px-2.5 py-1 rounded font-bold"
                        >
                          복사
                        </button>
                      </div>
                      <p className="text-[11px] text-slate-400 break-all">{SUPABASE_URL}/rest/v1/rpc/receive_sms</p>
                    </div>

                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                      <div className="flex justify-between items-center">
                        <span className="font-bold text-emerald-300">2. 헤더: apikey</span>
                        <button
                          onClick={() => copyToClipboard(SUPABASE_KEY, 'apikey 값')}
                          className="bg-emerald-600 text-white px-2.5 py-1 rounded font-bold"
                        >
                          복사
                        </button>
                      </div>
                      <p className="text-[11px] text-slate-400">헤더 <code>Content-Type: application/json</code>도 함께 넣어주세요.</p>
                    </div>

                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                      <span className="font-bold text-blue-300">3. 요청 본문(JSON)</span>
                      <div className="grid grid-cols-2 gap-2">
                        {['남편', '아내'].map(p => (
                          <button
                            key={p}
                            onClick={() =>
                              copyToClipboard(
                                JSON.stringify({ sms_text: '보낸사람 : {발신번호}\n{문자내용}', payer_name: p, fam_code: familyCode }, null, 2),
                                `${p}용 JSON`
                              )
                            }
                            className={`${p === '남편' ? 'bg-blue-600' : 'bg-pink-600'} text-white px-2.5 py-1.5 rounded font-bold`}
                          >
                            {p}용 복사
                          </button>
                        ))}
                      </div>
                      <p className="text-[11px] text-slate-400 leading-relaxed">
                        <code>{'{발신번호}'}</code>, <code>{'{문자내용}'}</code>은 포워더 앱이나 단축어에서 쓰는 자리표시자로 바꿔 넣으세요(앱마다 이름이 다릅니다).
                        코드를 바꾸면 <code>fam_code</code>도 꼭 새 값으로 바꿔야 합니다.
                      </p>
                    </div>
                  </div>
                </div>
              )}

              {showVersionModal && (
                <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
                  <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-4 space-y-3 max-h-[80vh] overflow-y-auto">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                      <h3 className="font-bold text-white text-sm">🕓 버전 히스토리 ({APP_VERSION})</h3>
                      <button onClick={() => setShowVersionModal(false)} className="text-slate-400">✕</button>
                    </div>
                    {VERSION_HISTORY.map(v => (
                      <div key={v.version} className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs space-y-1">
                        <div className="flex justify-between font-bold text-emerald-400">
                          <span>{v.version} - {v.title}</span>
                          <span>{v.date}</span>
                        </div>
                        <ul className="list-disc pl-4 text-slate-300 space-y-1 pt-1">
                          {v.changes.map((ch, i) => <li key={i}>{ch}</li>)}
                        </ul>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <nav className="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 z-30 safe-bottom">
                <div className="max-w-xl mx-auto grid grid-cols-5 py-2 text-[11px] font-bold">
                  <button onClick={() => setActiveTab('list')} className={activeTab === 'list' ? 'text-indigo-400' : 'text-slate-400'}>📋 내역</button>
                  <button onClick={() => setActiveTab('cats')} className={activeTab === 'cats' ? 'text-indigo-400' : 'text-slate-400'}>⚙️ 카테고리</button>
                  <button onClick={() => setActiveTab('scan')} className={activeTab === 'scan' ? 'text-indigo-400' : 'text-slate-400'}>📷 영수증스캔</button>
                  <button onClick={() => setActiveTab('sms')} className={activeTab === 'sms' ? 'text-indigo-400' : 'text-slate-400'}>📩 문자/엑셀</button>
                  <button onClick={() => setActiveTab('stats')} className={activeTab === 'stats' ? 'text-indigo-400' : 'text-slate-400'}>📊 통계/엑셀</button>
                </div>
              </nav>
            </>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script id="sw-register">
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.warn('서비스 워커 등록 실패:', err));
      });
    }
  </script>
</body>
</html>
