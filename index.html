 'id', fixed_id, 'store', v_store, 'amount', amt, 'date', d_str);\n    end if;\n  end if;\n\n  -- (6) 재전송 중복 방지\n  if exists (select 1 from public.expenses\n             where family_code = cfg.family_code and date = d_str and amount = amt and expenses.store = v_store) then\n    return json_build_object('status', 'duplicate_ignored', 'store', v_store, 'amount', amt, 'date', d_str);\n  end if;\n\n  -- (7) 카드 구분: 카드 목록에 주인이 정해진 카드면 결제자를 카드 주인으로\n  card := public.parse_card_ref(body);\n  v_payer := coalesce(public.card_owner(cfg.cards, card[1], card[2]), nullif(payer_name, ''), '남편');\n\n  -- (8) 저장 + 알림 신호 (새 카드는 앱을 열 때 카드 목록에 자동 등록됨)\n  cat := public.store_category(v_store);\n  new_id := 'auto-' || replace(gen_random_uuid()::text, '-', '');\n  insert into public.expenses (id, family_code, date, store, category, sub_category,\n                               amount, tax, payer, source, memo, updated_by,\n                               card_issuer, card_num, pay_method)\n  values (new_id, cfg.family_code, d_str, v_store, cat[1], cat[2],\n          amt, round(amt / 11.0), v_payer,\n          case when is_cancel then '승인취소문자' else '자동문자수신' end,\n          '',   -- 메모는 사용자가 쓰는 칸 (등록 경로는 source, 원문·발신번호는 문자 수신 기록에)\n          'AUTO_WEBHOOK', card[1], card[2], '카드');\n\n  insert into public.sync_signals (signal_id, updated_at) values (cfg.signal_id, now())\n  on conflict (signal_id) do update set updated_at = now();\n\n  return json_build_object('status', 'success', 'id', new_id, 'store', v_store, 'amount', amt, 'date', d_str,\n                           'category', cat[1], 'sub_category', cat[2],\n                           'card_issuer', card[1], 'card_num', card[2], 'payer', v_payer);\nend;\n$$;\n\n-- 7-0. 문자 수신 기록 (앱의 '📨 문자 수신 기록'에서 보기·다시 처리) -------------\n--    금액(…원)이 있는 문자만 저장 (개인 문자는 저장 안 함), 60일 지나면 자동 삭제\ncreate table if not exists public.sms_inbox (\n  id             bigserial primary key,\n  family_code    text not null references public.family_config(family_code)\n                   on update cascade on delete cascade,\n  received_at    timestamptz not null default now(),\n  via            text not null default '',          -- 'json'(receive_sms) / 'raw'(receive_sms_raw)\n  payer          text not null default '',\n  body           text not null,\n  status         text not null default '',          -- success / duplicate_ignored / ignored\n  reason         text not null default '',\n  expense_id     text,\n  result         jsonb,\n  reprocessed_at timestamptz\n);\ncreate index if not exists sms_inbox_family_idx on public.sms_inbox (family_code, received_at desc);\nalter table public.sms_inbox enable row level security;\ndrop policy if exists \"sms_inbox own read\"   on public.sms_inbox;\ndrop policy if exists \"sms_inbox own delete\" on public.sms_inbox;\ncreate policy \"sms_inbox own read\" on public.sms_inbox for select\n  using (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''));\ncreate policy \"sms_inbox own delete\" on public.sms_inbox for delete\n  using (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''));\ngrant select, delete on public.sms_inbox to anon, authenticated;\n\n-- 7-2a. [v1.63] 결제자 값 → 구성원 key (JSON·원문 방식 공통). 모르면 null\n--    husband·h·1·m1·남편 → 남편 / wife·w·2·m2·아내 → 아내 / 구성원 key(m3 …) 또는 구성원 이름(앱에 보이는 이름) → 그 구성원\n--    [스키마 15 · v1.64] m1·m2 별칭 추가 → 모든 폰을 m1, m2, m3 … 규칙으로 맞출 수 있음 (DB에는 그대로 '남편'·'아내'로 저장)\ncreate or replace function public.payer_key(p_fam text, p_payer text)\nreturns text\nlanguage plpgsql\nstable\nsecurity definer\nset search_path = public\nas $$\ndeclare\n  v text := lower(btrim(coalesce(p_payer, '')));\n  k text;\nbegin\n  if v = '' then return null; end if;\n  if v in ('husband', 'h', '1', 'm1', '남편') then return '남편'; end if;\n  if v in ('wife', 'w', '2', 'm2', '아내') then return '아내'; end if;\n  select m->>'key' into k\n    from public.family_config f,\n         jsonb_array_elements(case when jsonb_typeof(f.members) = 'array' then f.members else '[]'::jsonb end) m\n   where f.family_code = p_fam\n     and (lower(m->>'key') = v or lower(btrim(coalesce(m->>'name', ''))) = v)\n   limit 1;\n  return k;\nend;\n$$;\n\n-- 7-2. 해석·등록 + 기록 (기록에 실패해도 등록은 그대로)\n--    [v1.63] 결제자를 payer_key로 맞춤. 모르는 값이면 남편으로 등록하고 기록·결과에 payer_warning을 남김\n--    [v1.68] 기록(sms_inbox.payer)에는 알아보지 못한 값을 그대로 남김 → [다시 처리]로 바로잡을 수 있음\ncreate or replace function public.receive_sms_logged(p_body text, p_payer text, p_fam text, p_via text)\nreturns json\nlanguage plpgsql\nsecurity definer\nset search_path = public\nas $$\ndeclare\n  r     json;\n  s     text;\n  v_key text := public.payer_key(p_fam, p_payer);\n  raw_p text := left(btrim(coalesce(p_payer, '')), 30);\n  warn  text;\nbegin\n  if v_key is null then\n    warn := case when raw_p = '' then '결제자 값이 없어 남편으로 등록'\n                 else '결제자 ''' || raw_p || '''를 알 수 없어 남편으로 등록' end;\n  end if;\n  r := public.receive_sms_core(p_body, coalesce(v_key, '남편'), p_fam);\n  if warn is not null then r := (r::jsonb || jsonb_build_object('payer_warning', warn))::json; end if;\n  s := coalesce(r->>'status', '');\n  if s <> 'error' and coalesce(p_body, '') ~ '[0-9][0-9,]*\\s*원' then\n    begin\n      insert into public.sms_inbox (family_code, via, payer, body, status, reason, expense_id, result)\n      -- [v1.68] 알아보지 못한 결제자는 들어온 값 그대로 (나중에 구성원을 추가하고 [다시 처리]하면 맞춰짐)\n      values (p_fam, coalesce(p_via, ''), coalesce(v_key, nullif(raw_p, ''), '남편'), left(p_body, 2000),\n              s, coalesce(r->>'reason', ''), r->>'id', r::jsonb);\n      delete from public.sms_inbox where family_code = p_fam and received_at < now() - interval '60 days';\n    exception when others then\n      null;   -- 기록 실패는 무시 (문자 등록 결과는 그대로 돌려줌)\n    end;\n  end if;\n  return r;\nend;\n$$;\n\n-- 7-3. 문자 자동 등록 (SMS 포워더·아이폰 단축어가 호출, JSON 방식) — 형식 고정\ncreate or replace function public.receive_sms(\n  sms_text   text,\n  payer_name text default '남편',\n  fam_code   text default ''\n)\nreturns json\nlanguage plpgsql\nsecurity definer\nset search_path = public\nas $$\nbegin\n  return public.receive_sms_logged(sms_text, payer_name, fam_code, 'json');\nend;\n$$;\n\n-- 7-4. 기록에서 다시 처리 (해석 규칙을 고친 뒤 무시됐던 문자를 다시 돌릴 때)\ncreate or replace function public.reprocess_sms(p_id bigint)\nreturns json\nlanguage plpgsql\nsecurity definer\nset search_path = public\nas $$\ndeclare\n  fam   text := coalesce(nullif(current_setting('request.headers', true), '')::json->>'x-family-code', '');\n  rec   public.sms_inbox%rowtype;\n  cfg   public.family_config%rowtype;\n  r     json;\n  src   text;\n  k     text;\n  warn  text;\n  card  text[];\n  n     int := 0;\n  exp_id text;\nbegin\n  select * into rec from public.sms_inbox where id = p_id and family_code = fam;\n  if not found then\n    return json_build_object('status', 'error', 'reason', '기록을 찾을 수 없습니다');\n  end if;\n  select * into cfg from public.family_config where family_code = rec.family_code;\n  -- [v1.68] 결제자: 경고가 있던 기록은 경고 속 원래 값(예: 'm3')으로 다시 맞춰 봄 (v1.67까지는 기록에 '남편'으로 남았음)\n  src := case when rec.result ? 'payer_warning'\n              then coalesce(substring(rec.result->>'payer_warning' from '''([^'']*)'''), rec.payer)\n              else rec.payer end;\n  k := public.payer_key(rec.family_code, src);\n  if k is null then\n    warn := case when btrim(coalesce(src, '')) = '' then '결제자 값이 없어 남편으로 등록'\n                 else '결제자 ''' || left(btrim(src), 30) || '''를 알 수 없어 남편으로 등록' end;\n  end if;\n  -- [v1.74] 이 문자로 등록된 내역이 아직 있고(휴지통 포함) 가맹점도 제대로면 다시 해석하지 않음\n  --   (영수증과 합쳐 가맹점이 바뀐 내역을 다시 처리해도 같은 결제가 하나 더 생기지 않게)\n  if rec.expense_id is not null and exists (select 1 from public.expenses\n       where id = rec.expense_id and family_code = rec.family_code and store not in ('승인', '취소', '카드결제가맹점')) then\n    r := json_build_object('status', 'duplicate_ignored', 'id', rec.expense_id, 'reason', '이미 등록된 내역이 있음');\n  else\n    r := public.receive_sms_core(rec.body, coalesce(k, '남편'), rec.family_code);\n  end if;\n  -- 이미 등록된 결제(중복으로 나옴)인데 이제 결제자를 알아보면 → 그 내역의 결제자를 바로잡음\n  --   (카드 주인이 정해진 카드는 카드 주인이 우선이라 그대로, 처음에 기본값 '남편'으로 들어간 내역만)\n  exp_id := coalesce(r->>'id', rec.expense_id);\n  if rec.result ? 'payer_warning' and k is not null and k <> '남편' and exp_id is not null then\n    card := public.parse_card_ref(rec.body);\n    if public.card_owner(cfg.cards, card[1], card[2]) is null then\n      update public.expenses set payer = k, updated_by = 'sms_reprocess'\n       where id = exp_id and family_code = rec.family_code and payer = '남편';\n      get diagnostics n = row_count;\n      if n > 0 then\n        insert into public.sync_signals (signal_id, updated_at) values (cfg.signal_id, now())\n        on conflict (signal_id) do update set updated_at = now();\n      end if;\n    end if;\n  end if;\n  if warn is not null then r := (r::jsonb || jsonb_build_object('payer_warning', warn))::json; end if;\n  if n > 0 then r := (r::jsonb || jsonb_build_object('payer_fixed', k))::json; end if;\n  update public.sms_inbox\n     -- 이미 등록됐던 기록을 다시 돌려 '중복'이 나오면 '등록됨'을 그대로 둠\n     set status = case when rec.status = 'success' and r->>'status' = 'duplicate_ignored' then 'success'\n                       when r->>'status' = 'store_fixed' then 'success'   -- [v1.73] 가맹점만 바로잡음 = 등록됨\n                       else coalesce(r->>'status', '') end,\n         reason = case when rec.status = 'success' and r->>'status' = 'duplicate_ignored' then ''\n                       else coalesce(r->>'reason', '') end,\n         expense_id = exp_id,\n         payer = coalesce(k, nullif(left(btrim(src), 30), ''), '남편'),\n         result = r::jsonb,\n         reprocessed_at = now()\n   where id = p_id;\n  return r;\nend;\n$$;\n\n-- 7-1. 문자 원문 그대로 받기 (MacroDroid 등 자동화 앱용) ---------------------\n--    본문(Body) = 문자 원문 그대로 (Content-Type: text/plain) → 줄바꿈·따옴표가 있어도 깨지지 않음\n--    가족 코드·결제자는 헤더로: x-family-code: fam_… / x-payer: husband 또는 wife (한글 헤더는 앱에 따라 깨질 수 있어 영문)\n--    PostgREST 규칙: 이름 없는 text 인자 하나짜리 함수만 text/plain 본문을 받음\ncreate or replace function public.receive_sms_raw(text)\nreturns json\nlanguage plpgsql\nsecurity definer\nset search_path = public\nas $$\ndeclare\n  h json := coalesce(nullif(current_setting('request.headers', true), ''), '{}')::json;\nbegin\n  -- 결제자 헤더(x-payer: husband / wife / m3 …)는 receive_sms_logged에서 payer_key로 맞춤\n  return public.receive_sms_logged($1, coalesce(h->>'x-payer', ''), coalesce(h->>'x-family-code', ''), 'raw');\nend;\n$$;\n\n-- [v1.63] 예전 JSON 방식이 그대로 저장한 결제자 값(wife·husband·구성원 이름 등)을 구성원 key로 (여러 번 실행해도 안전)\nupdate public.expenses e set payer = public.payer_key(e.family_code, e.payer)\n where e.payer not in ('남편', '아내') and e.payer !~ '^m[0-9]+$' and public.payer_key(e.family_code, e.payer) is not null;\nupdate public.sms_inbox i set payer = public.payer_key(i.family_code, i.payer)\n where i.payer not in ('남편', '아내') and i.payer !~ '^m[0-9]+$' and public.payer_key(i.family_code, i.payer) is not null;\n\n-- 9. [v1.28] 예전에 앱·서버가 메모 칸에 자동으로 넣던 등록 경로 문구 지우기 (사용자가 쓴 메모는 그대로)\n--    '문자 자동등록 · 15776000', '영수증 AI 인식', '… (영수증 품목 병합)' 등 → 빈 칸. 여러 번 실행해도 안전\nupdate public.expenses\n   set memo = btrim(regexp_replace(memo, '\\s*\\(영수증 품목 병합\\)', '', 'g'))\n where memo ~ '\\(영수증 품목 병합\\)';\nupdate public.expenses\n   set memo = ''\n where memo ~ '^\\s*(문자 자동(등록|인식)( · [0-9]+)?|문자 붙여넣기|승인취소 자동반영|승인취소 상계|영수증 AI 인식|파일 일괄등록|후불교통 정산( · 문자 자동등록( · [0-9]+)?)?)\\s*$';\n\n-- 10. [v1.29] 지출 분류 정리 (6개 → 11개) — 기존 내역·영수증 품목·가족 분류 목록을 새 이름으로 옮김 (한 번만)\n--   식비›식재료 → 장보기›식재료 · 마트/장보기 → 장보기(생필품 → 생활용품) · 육아/병원 → 의료/건강(병원·약국) / 육아/교육\n--   기타/미분류›통신/공과금 → 주거/고정비(통신비·공과금·관리비) · 구독/보험 → 주거/고정비(구독·보험) · 기타/미분류 → 기타\n--   생활/미용 → 쇼핑/미용 · 직접 만든 분류·세부 분류는 그대로 남김 (이름이 바뀐 대분류 아래였으면 새 대분류로 따라감)\ncreate or replace function public.cat_map_v2(p_cat text, p_sub text, p_store text)\nreturns text[]\nlanguage sql immutable\nas $$\n  select case\n    when p_cat = '식비' and p_sub = '식재료' then array['장보기', '식재료']\n    when p_cat = '마트/장보기' then array['장보기', case when p_sub = '생필품' then '생활용품' else p_sub end]\n    when p_cat = '육아/병원' and p_sub = '소아과/병원' then array['의료/건강', '병원']\n    when p_cat = '육아/병원' and p_sub = '약국' then array['의료/건강', '약국']\n    when p_cat = '육아/병원' then array['육아/교육', p_sub]\n    when p_cat = '기타/미분류' and p_sub = '통신/공과금' then array['주거/고정비',\n      case when coalesce(p_store, '') ~ '관리비' then '관리비'\n           when coalesce(p_store, '') ~* '도시가스|한전|한국전력|수도|가스공사' then '공과금'\n           else '통신비' end]\n    when p_cat = '기타/미분류' and p_sub = '구독/보험' then array['주거/고정비',\n      case when coalesce(p_store, '') ~* '보험|생명|해상|손해|화재|라이나|메리츠' then '보험' else '구독' end]\n    when p_cat = '기타/미분류' then array['기타', p_sub]\n    when p_cat = '생활/미용' then array['쇼핑/미용', p_sub]\n    else array[p_cat, p_sub]\n  end\n$$;\nrevoke all on function public.cat_map_v2(text, text, text) from public, anon, authenticated;\n\ndo $$\ndeclare\n  f        record;\n  c        jsonb;\n  s        text;\n  m        text[];\n  newcats  jsonb;\n  pos      int;\nbegin\n  if exists (select 1 from public.schema_meta where key = 'categories_version' and value >= '2') then\n    return;   -- 이미 옮김\n  end if;\n\n  -- 지출 내역 + 영수증 품목\n  update public.expenses e\n     set category = (public.cat_map_v2(e.category, e.sub_category, e.store))[1],\n         sub_category = (public.cat_map_v2(e.category, e.sub_category, e.store))[2]\n   where e.category in ('식비', '마트/장보기', '육아/병원', '기타/미분류', '생활/미용');\n  update public.expenses e\n     set items = (\n       select coalesce(jsonb_agg(\n                case when coalesce(it->>'category', '') = '' then it\n                     else it || jsonb_build_object(\n                       'category', (public.cat_map_v2(it->>'category', it->>'sub_category', e.store))[1],\n                       'sub_category', (public.cat_map_v2(it->>'category', it->>'sub_category', e.store))[2]) end\n                order by ord), '[]'::jsonb)\n       from jsonb_array_elements(e.items) with ordinality as t(it, ord))\n   where jsonb_typeof(e.items) = 'array' and jsonb_array_length(e.items) > 0\n     and e.items::text ~ '\"(식비|마트/장보기|육아/병원|기타/미분류|생활/미용)\"';\n\n  -- 가족별 분류 목록: 새 기본 분류 + 직접 만든 분류·세부 분류\n  for f in select family_code, categories from public.family_config loop\n    newcats := '[{\"id\": \"c1\", \"name\": \"식비\", \"subs\": [\"외식/회식\", \"카페/간식\", \"배달음식\"]}, {\"id\": \"c2\", \"name\": \"장보기\", \"subs\": [\"대형마트\", \"동네마트/슈퍼\", \"편의점\", \"온라인쇼핑\", \"식재료\", \"생활용품\"]}, {\"id\": \"c7\", \"name\": \"주거/고정비\", \"subs\": [\"관리비\", \"공과금\", \"통신비\", \"보험\", \"구독\"]}, {\"id\": \"c4\", \"name\": \"교통/차량\", \"subs\": [\"주유비\", \"대중교통\", \"주차/톨게이트\", \"차량정비/부품\"]}, {\"id\": \"c8\", \"name\": \"의료/건강\", \"subs\": [\"병원\", \"약국\", \"치과\", \"건강관리\"]}, {\"id\": \"c3\", \"name\": \"육아/교육\", \"subs\": [\"분유/기저귀\", \"아기용품\", \"어린이집/학원\", \"장난감/책\"]}, {\"id\": \"c9\", \"name\": \"쇼핑/미용\", \"subs\": [\"의류/잡화\", \"미용실\", \"화장품\", \"가전/가구\"]}, {\"id\": \"c10\", \"name\": \"여가/문화\", \"subs\": [\"여행/숙박\", \"영화/공연\", \"운동/취미\", \"도서\"]}, {\"id\": \"c11\", \"name\": \"경조사/선물\", \"subs\": [\"축의금\", \"조의금\", \"가족 용돈\", \"선물\", \"모임/회비\", \"기부/후원\"]}, {\"id\": \"c5\", \"name\": \"업무/경비\", \"subs\": [\"부품/소모품\", \"회의/접대비\", \"도서/교육\", \"기타경비\"]}, {\"id\": \"c6\", \"name\": \"기타\", \"subs\": [\"미분류\", \"수수료\", \"기타\"]}]'::jsonb;\n    for c in select * from jsonb_array_elements(case when jsonb_typeof(f.categories) = 'array' then f.categories else '[]'::jsonb end) loop\n      if jsonb_array_length(coalesce(c->'subs', '[]'::jsonb)) = 0 then\n        m := public.cat_map_v2(c->>'name', '', '');\n        if not exists (select 1 from jsonb_array_elements(newcats) x where x->>'name' = m[1]) then\n          newcats := newcats || jsonb_build_array(jsonb_build_object('id', coalesce(c->>'id', 'c-' || md5(m[1])), 'name', m[1], 'subs', '[]'::jsonb));\n        end if;\n      end if;\n      for s in select * from jsonb_array_elements_text(coalesce(c->'subs', '[]'::jsonb)) loop\n        m := public.cat_map_v2(c->>'name', s, '');\n        select (t.i - 1)::int into pos from jsonb_array_elements(newcats) with ordinality as t(x, i) where t.x->>'name' = m[1] limit 1;\n        if pos is null then\n          newcats := newcats || jsonb_build_array(jsonb_build_object('id', coalesce(c->>'id', 'c-' || md5(m[1])), 'name', m[1], 'subs', jsonb_build_array(m[2])));\n        elsif not ((newcats->pos->'subs') ? m[2]) then\n          newcats := jsonb_set(newcats, array[pos::text, 'subs'], (newcats->pos->'subs') || to_jsonb(m[2]));\n        end if;\n        pos := null;\n      end loop;\n    end loop;\n    update public.family_config\n       set categories = newcats, updated_by = 'MIGRATE_V129', updated_at = now()\n     where family_code = f.family_code;\n  end loop;\n\n  insert into public.schema_meta (key, value) values ('categories_version', '2')\n  on conflict (key) do update set value = excluded.value;\nend $$;\n\n-- 8. 가족 코드 변경 (내역은 외래키 cascade로 함께 이동) --------------------\ncreate or replace function public.migrate_family_code(\n  old_code  text,\n  new_code  text,\n  device_id text default 'APP'\n)\nreturns json\nlanguage plpgsql\nsecurity definer\nset search_path = public\nas $$\ndeclare\n  moved int;\nbegin\n  if coalesce(current_setting('request.headers', true)::json->>'x-family-code', '') <> old_code then\n    return json_build_object('status', 'error', 'reason', '현재 가족 코드로 접속한 상태에서만 바꿀 수 있습니다.');\n  end if;\n  if new_code is null or new_code !~ '^fam_.{12,}$' then\n    return json_build_object('status', 'error', 'reason', '새 코드는 12자 이상이어야 합니다.');\n  end if;\n  if exists (select 1 from public.family_config where family_code = new_code) then\n    return json_build_object('status', 'error', 'reason', '이미 사용 중인 코드입니다. 다른 코드를 만들어 주세요.');\n  end if;\n  if not exists (select 1 from public.family_config where family_code = old_code) then\n    return json_build_object('status', 'error', 'reason', '현재 가족 정보를 찾을 수 없습니다.');\n  end if;\n\n  select count(*) into moved from public.expenses where family_code = old_code;\n\n  update public.family_config\n     set family_code = new_code,\n         signal_id   = replace(gen_random_uuid()::text, '-', ''),\n         updated_by  = device_id,\n         updated_at  = now()\n   where family_code = old_code;\n\n  return json_build_object('status', 'success', 'moved_count', moved);\nend;\n$$;\n\nrevoke all on function public.receive_sms(text, text, text) from public;\nrevoke all on function public.migrate_family_code(text, text, text) from public;\ngrant execute on function public.receive_sms(text, text, text) to anon, authenticated;\ngrant execute on function public.migrate_family_code(text, text, text) to anon, authenticated;\ngrant execute on function public.store_category(text) to anon, authenticated;\ngrant execute on function public.card_issuer_norm(text) to anon, authenticated;\ngrant execute on function public.card_num_match(text, text) to anon, authenticated;\ngrant execute on function public.parse_card_ref(text) to anon, authenticated;\ngrant execute on function public.card_issuer_by_sender(text) to anon, authenticated;\ngrant execute on function public.card_owner(jsonb, text, text) to anon, authenticated;\nrevoke all on function public.receive_sms_raw(text) from public;\ngrant execute on function public.receive_sms_raw(text) to anon, authenticated;\nrevoke all on function public.receive_sms_core(text, text, text) from public, anon, authenticated;\nrevoke all on function public.receive_sms_logged(text, text, text, text) from public, anon, authenticated;\nrevoke all on function public.payer_key(text, text) from public, anon, authenticated;\nrevoke all on function public.reprocess_sms(bigint) from public;\ngrant execute on function public.reprocess_sms(bigint) to anon, authenticated;\n";

            setErrorDetail(`DB 스키마 버전 ${ver} → 앱은 ${REQUIRED_SCHEMA_VERSION} 필요. [⚡자동연동/SQL]의 설정 SQL(폰에서는 짧은 업데이트 SQL${ver === 9 ? ' v1.53 → v1.54 → v1.55 → v1.60 → v1.61 → v1.64 → v1.66 → v1.68 → v1.69 → v1.71' : ver === 10 ? ' v1.54 → v1.55 → v1.60 → v1.61 → v1.64 → v1.66 → v1.68 → v1.69 → v1.71' : ver === 11 ? ' v1.55 → v1.60 → v1.61 → v1.64 → v1.66 → v1.68 → v1.69 → v1.71' : ver === 12 ? ' v1.60 → v1.61 → v1.64 → v1.66 → v1.68 → v1.69 → v1.71' : ver === 13 ? ' v1.61 → v1.64 → v1.66 → v1.68 → v1.69 → v1.71' : ver === 14 ? ' v1.64 → v1.66 → v1.68 → v1.69 → v1.71' : ver === 15 ? ' v1.66 → v1.68 → v1.69 → v1.71' : ver === 16 ? ' v1.68 → v1.69 → v1.71 (v1.68_업데이트_문자보완.sql을 안 했으면 그것부터)' : ver === 17 ? ' v1.71_업데이트_기록시간.sql' : ''})을 실행해주세요.`);
            return;
          }

          const { data: cfgData, error: cfgErr } = await supabaseClient
            .from('family_config').select('*').eq('family_code', familyCode).maybeSingle();
          if (cfgErr) throw cfgErr;
          if (!cfgData) {
            // 코드 오타로 빈 가계부가 따로 생기지 않도록, 새로 만들지 사용자에게 묻는다
            setExpenses([]);
            setSyncStatus('no_family');
            setErrorDetail('');
            return;
          }

          let allExpenses = [];
          const pageSize = 1000;
          for (let from = 0; ; from += pageSize) {
            const { data: batch, error: expErr } = await supabaseClient
              .from('expenses').select('*').eq('family_code', familyCode)
              .order('date', { ascending: false }).order('id', { ascending: true })
              .range(from, from + pageSize - 1);
            if (expErr) throw expErr;
            allExpenses = allExpenses.concat(batch || []);
            if (!batch || batch.length < pageSize) break;
          }

          // 휴지통 나누기 + 30일 지난 휴지통 내역은 영구 삭제
          const purgeBefore = Date.now() - TRASH_KEEP_DAYS * 86400000;
          const trashed = allExpenses.filter(e => e.deleted_at);
          const expired = trashed.filter(e => new Date(e.deleted_at).getTime() < purgeBefore);
          if (expired.length) {
            supabaseClient.from('expenses').delete().in('id', expired.map(e => e.id)).eq('family_code', familyCode)
              .then(({ error }) => { if (error) console.warn('휴지통 정리 실패', error.message); });
          }
          allExpenses = allExpenses.filter(e => !e.deleted_at);
          setTrash(trashed.filter(e => !expired.includes(e)).sort((a, b) => String(b.deleted_at).localeCompare(String(a.deleted_at))));
          setExpenses(allExpenses);
          try { localStorage.setItem(STORAGE_KEY_CACHE, JSON.stringify(allExpenses)); } catch (e) {}

          let cats = Array.isArray(cfgData.categories) && cfgData.categories.length > 0 ? cfgData.categories : DEFAULT_CATEGORIES;
          // 새로 생긴 기본 세부 항목(동네마트/슈퍼 등)을 기존 가계부에 한 번만 추가해 저장
          const seededCats = seedNewDefaultSubs(cats);
          if (seededCats) {
            cats = seededCats;
            supabaseClient.from('family_config')
              .update({ categories: seededCats, updated_by: MY_DEVICE_ID, updated_at: new Date().toISOString() })
              .eq('family_code', familyCode)
              .then(({ error }) => { if (!error) notifyPartner(); });
          }
          setCategories(cats);
          try { localStorage.setItem(STORAGE_KEY_CATS, JSON.stringify(cats)); } catch (e) {}
          setIncomeCategories(Array.isArray(cfgData.income_categories) && cfgData.income_categories.length > 0 ? cfgData.income_categories : DEFAULT_INCOME_CATEGORIES);
          setAllowedSenders(Array.isArray(cfgData.allowed_senders) ? cfgData.allowed_senders : []);
          setBudget(cfgData.budget && typeof cfgData.budget === 'object' && !Array.isArray(cfgData.budget) ? cfgData.budget : {});
          { const ms = normalizeMembers(cfgData.members); setMembers(ms); if (!ms.some(m => m.key === currentUser)) setCurrentUser(ms[0].key); }
          setSignalId(cfgData.signal_id || '');
          const cfgCards = Array.isArray(cfgData.cards) ? cfgData.cards : [];
          setCards(cfgCards);
          // 문자 자동등록 등으로 들어온 처음 보는 카드번호를 카드 목록에 추가
          if (registerNewCards(cfgCards, cardRefsOf(allExpenses))) {
            saveCards(cur => registerNewCards(cur, cardRefsOf(allExpenses)), { silent: true });
          }

          loadLoans(true, allExpenses);
          loadSavings(true, allExpenses);
          loadAssets(true);
          loadGifts(true);
          setSyncStatus('connected');
          setErrorDetail('');
          setLastSyncTime(new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
          if (options.showSuccessToast) showToast(`☁️ 총 ${allExpenses.length}건 동기화 완료!`);
        } catch (err) {
          const msg = err.message || '';
          if (err.code === '42P01' || err.code === 'PGRST205' || /relation|does not exist|schema cache/i.test(msg)) {
            setSyncStatus('table_missing');
            setErrorDetail('Supabase에 테이블이 없습니다. [⚡자동연동/SQL]의 초기화·설정 SQL을 실행해주세요.');
          } else {
            setSyncStatus('network_error');
            setErrorDetail(msg || '네트워크 연결을 확인해주세요.');
          }
          try {
            const cached = localStorage.getItem(STORAGE_KEY_CACHE);
            if (cached) setExpenses(JSON.parse(cached).filter(e => !e.deleted_at));
          } catch (e) {}
        }
      };

      // 이 코드로 새 가계부 만들기 (no_family 상태에서 사용자가 확인했을 때만)
      const createFamily = async () => {
        if (familyPass.length < MIN_CODE_LENGTH) return showToast(`⚠️ 가족 코드는 ${MIN_CODE_LENGTH}자 이상이어야 합니다.`);
        const { error } = await supabaseClient.from('family_config').insert({
          family_code: familyCode,
          categories: DEFAULT_CATEGORIES,
          updated_by: MY_DEVICE_ID
        });
        if (error) return showToast('⚠️ 가계부 생성 실패: ' + error.message);
        showToast('🎉 새 가계부를 만들었습니다. 배우자 폰에도 같은 코드를 입력하세요.');
        fetchFromCloud({ showSpinner: true });
      };

      // 2. 실시간 구독
      //    A. 부부 앱끼리: Broadcast 신호 (RLS 영향 없음)
      //    B. 문자 자동 등록: sync_signals에서 우리 가족 signal_id 행만 구독
      useEffect(() => {
        if (!isUnlocked) return;
        fetchFromCloud({ showSpinner: true, showSuccessToast: false });

        const onVisible = () => { if (document.visibilityState === 'visible') fetchFromCloud(); };
        document.addEventListener('visibilitychange', onVisible);
        return () => document.removeEventListener('visibilitychange', onVisible);
      }, [isUnlocked, familyCode]);

      useEffect(() => {
        if (!isUnlocked) return;

        const triggerDebouncedSync = (msg) => {
          if (syncTimerRef.current) clearTimeout(syncTimerRef.current);
          syncTimerRef.current = setTimeout(() => {
            fetchFromCloud({ showSpinner: false, showSuccessToast: false });
            if (msg) showToast(msg);
          }, 250);
        };

        let channel = supabaseClient
          .channel(`room:${familyCode}`)
          .on('broadcast', { event: 'family_sync' }, (payload) => {
            if (payload.payload?.sender !== MY_DEVICE_ID) {
              triggerDebouncedSync('🔄 상대방 스마트폰에서 변경한 내역이 실시간 반영되었습니다!');
            }
          });
        if (signalId) {
          channel = channel.on(
            'postgres_changes',
            { event: '*', schema: 'public', table: 'sync_signals', filter: `signal_id=eq.${signalId}` },
            () => triggerDebouncedSync('📩 새 카드 승인 문자가 자동 등록되었습니다!')
          );
        }
        channel.subscribe();
        broadcastChannelRef.current = channel;

        return () => {
          if (syncTimerRef.current) clearTimeout(syncTimerRef.current);
          supabaseClient.removeChannel(channel);
        };
      }, [isUnlocked, familyCode, signalId]);

      const ensureConnected = () => {
        if (syncStatus !== 'connected') {
          showToast('⚠️ 클라우드 미연결 상태입니다.');
          return false;
        }
        return true;
      };

      // 3. 가족 코드 변경: 서버 함수(migrate_family_code)로만 처리. 실패하면 아무것도 옮기지 않음
      const handleMigrateFamilyCode = async () => {
        const cleanNewPass = newPassTarget.trim();
        if (cleanNewPass.length < MIN_CODE_LENGTH) {
          return showToast(`⚠️ 새 보안 코드는 ${MIN_CODE_LENGTH}자 이상이어야 합니다.`);
        }
        if (cleanNewPass === familyPass) return showToast('ℹ️ 현재 사용 중인 코드와 같습니다.');
        if (!ensureConnected()) return;

        setIsMigrating(true);
        const newFamCode = `fam_${cleanNewPass}`;
        try {
          const { data: res, error } = await supabaseClient.rpc('migrate_family_code', {
            old_code: familyCode,
            new_code: newFamCode,
            device_id: MY_DEVICE_ID
          });
          if (error) throw error;
          if (!res || res.status !== 'success') {
            return showToast('⚠️ 코드 변경 실패: ' + (res?.reason || '알 수 없는 오류'));
          }
          try { localStorage.setItem(STORAGE_KEY_PASS, cleanNewPass); } catch (e) {}
          setFamilyPass(cleanNewPass);
          setShowCodeMigrateModal(false);
          window.alert(
            `✅ ${res.moved_count}건의 내역을 새 코드로 옮겼습니다.\n\n` +
            `⚠️ 꼭 해주세요\n` +
            `1. 배우자 폰: [🔒코드변경] → [다른 코드로 접속]에서 새 코드 입력\n` +
            `2. 문자 포워더·아이폰 단축어의 fam_code를 "${newFamCode}"로 변경\n` +
            `   (이전 코드로 오는 문자는 이제 등록되지 않습니다)`
          );
        } catch (err) {
          showToast('⚠️ 코드 변경 실패: ' + (err.message || err));
        } finally {
          setIsMigrating(false);
        }
      };

      const isDuplicateExpense = (candidate, existingList) => {
        const candNorm = normalizeDateString(candidate.date);
        const candDay = candNorm.slice(0, 10);
        const candTime = candNorm.slice(11, 16);

        return existingList.some(ex => {
          if (ex.amount !== candidate.amount) return false;

          const exNorm = normalizeDateString(ex.date);
          const exDay = exNorm.slice(0, 10);
          const exTime = exNorm.slice(11, 16);
          if (exDay !== candDay) return false;

          // 둘 다 카드번호가 있는데 서로 안 맞으면 다른 카드의 결제 → 중복 아님
          if (candidate.card_num && ex.card_num && !cardNumMatch(candidate.card_num, ex.card_num)) return false;

          // 둘 다 결제 시각이 있고 같은 분이면:
          //  · 가게 이름이 비슷하면 중복
          //  · 출처가 다르면(문자 ↔ 카드사 파일) 가게 표기가 달라도 중복 ('KTX 승차권' vs '코레일(KTX)')
          //  · 같은 출처인데 가게가 다르면 다른 결제 (부부가 같은 시각에 각자 같은 금액 결제)
          if (candTime !== '00:00' && exTime !== '00:00') {
            if (candTime !== exTime) return false;
            if (isSimilarStoreName(candidate.store, ex.store)) return true;
            const isFile = (src) => /CSV|엑셀/.test(String(src || ''));
            return isFile(candidate.source) !== isFile(ex.source);
          }

          // 한쪽이라도 시각이 없으면(카드사 파일 등) 가게 이름이 비슷할 때만 중복
          return isSimilarStoreName(candidate.store, ex.store);
        });
      };

      const insertExpenseRows = async (rowsArray) => {
        if (!ensureConnected()) return false;
        const rowsWithMeta = rowsArray.map(r => ({
          ...r,
          date: normalizeDateString(r.date),
          family_code: familyCode,
          updated_by: MY_DEVICE_ID
        }));

        const chunkSize = 500;
        for (let i = 0; i < rowsWithMeta.length; i += chunkSize) {
          const chunk = rowsWithMeta.slice(i, i + chunkSize);
          const { error } = await supabaseClient.from('expenses').insert(chunk);
          if (error) {
            showToast('⚠️ 저장 실패: ' + error.message);
            return false;
          }
        }

        setExpenses(prev => [...rowsWithMeta, ...prev].sort((a, b) => b.date.localeCompare(a.date)));
        notifyPartner();
        registerCardsFrom(rowsWithMeta);
        return true;
      };

      // ---------------------------------------------------------------------
      // 📨 문자 수신 기록: 서버가 받은 문자(금액 있는 것만, 60일 보관)와 처리 결과
      // ---------------------------------------------------------------------
      const loadInbox = async () => {
        if (!ensureConnected()) return;
        setInboxState('loading');
        const { data, error } = await supabaseClient
          .from('sms_inbox')
          .select('id,received_at,via,payer,body,status,reason,expense_id,result,reprocessed_at')
          .order('received_at', { ascending: false })
          .limit(150);
        if (error) {
          const missing = /sms_inbox|does not exist|schema cache|PGRST20[25]|42P01/i.test(`${error.code} ${error.message}`);
          setInboxState(missing ? 'missing' : '⚠️ ' + error.message);
          return;
        }
        setInbox(data || []);
        setInboxState('');
      };

      const openInbox = () => {
        setShowWebhookModal(false);
        setShowInbox(true);
        setInboxOpenId(null);
        loadInbox();
      };

      const reprocessInbox = async (row) => {
        if (!ensureConnected()) return;
        setInboxBusyId(row.id);
        const { data, error } = await supabaseClient.rpc('reprocess_sms', { p_id: row.id });
        setInboxBusyId(null);
        if (error) return showToast('⚠️ 다시 처리 실패: ' + error.message);
        const st = data?.status;
        if (data?.payer_fixed) {
          showToast(`👤 결제자를 ${mName(data.payer_fixed)}(으)로 바로잡았습니다.`);
          fetchFromCloud();
        } else if (st === 'success') {
          showToast(`✅ 등록됨: ${data.store} ${Number(data.amount).toLocaleString()}원`);
          fetchFromCloud();
        } else if (st === 'store_fixed') {
          showToast(`🏷️ 이미 들어온 결제의 가맹점을 '${data.store}'(으)로 바로잡았습니다.`);
          fetchFromCloud();
        } else if (st === 'duplicate_ignored') {
          showToast('ℹ️ 이미 등록된 결제입니다. 내역에 없으면 🗑️ 휴지통에서 복원하세요.');
        } else {
          showToast('⏭️ 이번에도 등록되지 않음: ' + (data?.reason || st || '알 수 없음'));
        }
        loadInbox();
      };

      const deleteInbox = async (row) => {
        if (!ensureConnected()) return;
        const { error } = await supabaseClient.from('sms_inbox').delete().eq('id', row.id);
        if (error) return showToast('⚠️ 기록 삭제 실패: ' + error.message);
        setInbox(prev => prev.filter(x => x.id !== row.id));
      };

      // 연결된 기록(저축·대출·부조·급여명세서)에 맞춰 내역을 다시 고칠 때: 날짜(일)는 기록에 맞추고,
      //   내역에서 직접 넣은 시간은 그대로 둠 (시간이 없으면 09:00). oldDef: 예전 기본 시간이면 새 기본으로 바꿈
      const keepTime = (oldDate, day, oldDef = null) => {
        const t = String(oldDate || '').slice(11, 16);
        return `${String(day).slice(0, 10)} ${/^\d\d:\d\d$/.test(t) && t !== oldDef ? t : '09:00'}`;
      };
      // 🕘 기록 시간 (v1.71): 'HH:MM' 또는 '' (빈 칸 = 09:00)
      const normTime = (t) => { const m = String(t || '').match(/(\d{1,2})\s*[:시]\s*(\d{2})/); return m && Number(m[1]) < 24 && Number(m[2]) < 60 ? `${m[1].padStart(2, '0')}:${m[2]}` : ''; };
      const atTime = (day, t) => `${String(day).slice(0, 10)} ${normTime(t) || '09:00'}`;
      // 기록을 다시 저장할 때 내역 날짜: 기록에 시간이 있으면 그 시간, 없으면 내역에 있던 시간 유지
      const syncDate = (oldDate, day, t, oldDef = null) => normTime(t) ? atTime(day, t) : keepTime(oldDate, day, oldDef);
      const timeTag = (t) => normTime(t) ? ` ${normTime(t)}` : '';
      const updateExpenseRow = async (id, patch) => {
        if (!ensureConnected()) return false;
        const patchWithMeta = { ...patch, updated_by: MY_DEVICE_ID };
        if (patchWithMeta.date) patchWithMeta.date = normalizeDateString(patchWithMeta.date);

        const { error } = await supabaseClient
          .from('expenses')
          .update(patchWithMeta)
          .eq('id', id)
          .eq('family_code', familyCode);

        if (error) {
          showToast('⚠️ 수정 실패: ' + error.message);
          return false;
        }
        setExpenses(prev => prev.map(e => e.id === id ? { ...e, ...patchWithMeta } : e));
        notifyPartner();
        if (patchWithMeta.card_num) registerCardsFrom([{ ...patchWithMeta, date: patchWithMeta.date || '' }]);
        return true;
      };

      // 여러 내역을 휴지통으로 (연결된 기록을 함께 지울 때)
      // backups: { 내역 id: 함께 지운 연결 기록 } → 휴지통 내역에 보관해 두었다가 복원할 때 되살림
      const trashExpenses = async (items, backups = {}) => {
        const list = items.filter(Boolean);
        if (!list.length) return true;
        const deleted_at = new Date().toISOString();
        const ids = list.map(e => e.id);
        const plain = ids.filter(id => !backups[id]);
        if (plain.length) {
          const { error } = await supabaseClient.from('expenses').update({ deleted_at, updated_by: MY_DEVICE_ID }).in('id', plain).eq('family_code', familyCode);
          if (error) { showToast('⚠️ 삭제 실패: ' + error.message); return false; }
        }
        for (const id of ids.filter(id => backups[id])) {
          const { error } = await supabaseClient.from('expenses').update({ deleted_at, linked_backup: backups[id], updated_by: MY_DEVICE_ID }).eq('id', id).eq('family_code', familyCode);
          if (error) { showToast('⚠️ 삭제 실패: ' + error.message); return false; }
        }
        setExpenses(prev => prev.filter(e => !ids.includes(e.id)));
        setTrash(prev => [...list.map(e => ({ ...e, deleted_at, linked_backup: backups[e.id] || null })), ...prev.filter(e => !ids.includes(e.id))]);
        notifyPartner();
        return true;
      };
      // 삭제 = 휴지통으로 옮기기 (deleted_at 기록). 휴지통에서 복원하거나 영구 삭제
      //   급여명세서·대출 상환 기록과 연결된 내역이면 함께 지울지 물어봄
      const deleteExpenseRow = async (item) => {
        if (!ensureConnected()) return false;
        let linkPs = null, linkPay = null;
        if (isIncome(item)) {
          const { data } = await supabaseClient.from('payslips').select('*').eq('income_id', item.id);   // 함께 지우면 휴지통에 보관하려고 전체를 읽음
          linkPs = (data || [])[0] || null;
        }
        if (item.source === '대출상환') linkPay = loanPays.find(p => p.expense_id === item.id) || null;
        // 저축 납입 지출: 내역만 지우면 납입 기록(넣은 돈)은 남음
        const linkSav = item.source === '저축' && !isIncome(item) ? savPays.find(p => p.expense_id === item.id) || null : null;
        // 💐 보낸 부조와 연결된 지출
        const linkGift = !isIncome(item) ? giftRecs.find(r => r.expense_id === item.id) || null : null;
        let both = false;
        let backup = null;   // 함께 지운 연결 기록 (휴지통에서 복원할 때 되살림)
        if (linkGift) {
          const gp = giftPerson(linkGift.person_id);
          const v = await askChoice('🗑️ 내역 삭제', `[${item.store} · ${Number(item.amount).toLocaleString()}원]\n연결된 기록: 💐 ${gp?.name || ''} ${linkGift.event_type} ${linkGift.rec_date} 부조\n\n내역은 휴지통으로 옮깁니다. 함께 지운 부조 기록은 내역을 복원할 때 같이 되살릴 수 있어요.`, [
            { value: 'both', label: '부조 기록도 함께 삭제', tone: 'danger' },
            { value: 'one', label: '이 내역만 삭제 (부조 기록은 남김)' },
            { value: null, label: '취소' }
          ]);
          if (!v) return false;
          if (v === 'both') {
            backup = { type: 'gift_record', label: `${gp?.name || ''} ${linkGift.event_type} 부조 기록`, row: stripRow(linkGift), person: gp ? stripRow(gp) : null };
            const { error: e1 } = await supabaseClient.from('gift_records').delete().eq('id', linkGift.id);
            if (e1) { showToast('⚠️ 부조 기록 삭제 실패: ' + e1.message); return false; }
            setGiftRecs(prev => prev.filter(r => r.id !== linkGift.id));
          } else {
            await supabaseClient.from('gift_records').update({ expense_id: null, updated_by: MY_DEVICE_ID }).eq('id', linkGift.id);
            setGiftRecs(prev => prev.map(r => r.id === linkGift.id ? { ...r, expense_id: null } : r));
          }
        } else if (linkSav) {
          const accName = (savings.find(a => a.id === linkSav.savings_id) || {}).name || '저축';
          const v = await askChoice('🗑️ 내역 삭제', `[${item.store} · ${Number(item.amount).toLocaleString()}원]\n연결된 기록: ${accName} ${linkSav.pay_date} 납입\n\n내역은 휴지통으로 옮깁니다. 함께 지운 납입 기록은 내역을 복원할 때 같이 되살릴 수 있어요.`, [
            { value: 'both', label: '납입 기록도 함께 삭제 (넣은 돈에서 빠짐)', tone: 'danger' },
            { value: 'one', label: '이 내역만 삭제 (납입 기록은 남김)' },
            { value: null, label: '취소' }
          ]);
          if (!v) return false;
          if (v === 'both') {
            backup = savBackupOf(linkSav);
            const { error: e1 } = await supabaseClient.from('savings_payments').delete().eq('id', linkSav.id);
            if (e1) { showToast('⚠️ 납입 기록 삭제 실패: ' + e1.message); return false; }
            const acc = savings.find(a => a.id === linkSav.savings_id);
            if (acc && linkSav.auto) {
              const row = savRowOf({ ...acc, skip_months: [...new Set([...(acc.skip_months || []), String(linkSav.pay_date).slice(0, 7)])] });
              await supabaseClient.from('savings').upsert(row);
              setSavings(prev => prev.map(x => x.id === acc.id ? row : x));
            }
            setSavPays(prev => prev.filter(x => x.id !== linkSav.id));
          }
        } else if (linkPs || linkPay) {
          const loanName = linkPay && (loans.find(l => l.id === linkPay.loan_id) || {}).name;
          const what = linkPs ? `${linkPs.pay_month} ${payslipTypeOf(linkPs.pay_type)} 급여명세서` : `${loanName || '대출'} ${linkPay.pay_date} 상환 기록`;
          const v = await askChoice('🗑️ 내역 삭제', `[${item.store} · ${Number(item.amount).toLocaleString()}원]\n연결된 기록: ${what}\n\n내역은 휴지통으로 옮기고, 연결된 기록은 내역과 함께 휴지통에 보관됩니다 (내역을 복원할 때 같이 되살릴 수 있음).`, [
            { value: 'both', label: `${linkPs ? '명세서' : '상환 기록'}도 함께 삭제`, tone: 'danger' },
            { value: 'one', label: `이 내역만 삭제 (${linkPs ? '명세서는' : '상환 기록은'} 남김)` },
            { value: null, label: '취소' }
          ]);
          if (!v) return false;
          both = v === 'both';
        } else if (!window.confirm(`[${item.store} - ${item.amount.toLocaleString()}원]\n휴지통으로 옮길까요? (${TRASH_KEEP_DAYS}일 안에 복원할 수 있습니다)`)) return false;
        if (both && linkPs) backup = psBackupOf(linkPs);
        if (both && linkPay) backup = payBackupOf(linkPay);
        if (both && linkPs) {
          const { error: e1 } = await supabaseClient.from('payslips').delete().eq('id', linkPs.id);
          if (e1) { showToast('⚠️ 명세서 삭제 실패: ' + e1.message); return false; }
          setPayslips(prev => prev.filter(x => x.id !== linkPs.id));
        }
        if (both && linkPay) {
          const { error: e1 } = await supabaseClient.from('loan_payments').delete().eq('id', linkPay.id);
          if (e1) { showToast('⚠️ 상환 기록 삭제 실패: ' + e1.message); return false; }
          setLoanPays(prev => prev.filter(x => x.id !== linkPay.id));
        }
        const deleted_at = new Date().toISOString();
        const { error } = await supabaseClient
          .from('expenses')
          .update({ deleted_at, ...(backup ? { linked_backup: backup } : {}), updated_by: MY_DEVICE_ID })
          .eq('id', item.id)
          .eq('family_code', familyCode);
        if (error) {
          showToast('⚠️ 삭제 실패: ' + error.message);
          return false;
        }
        setExpenses(prev => prev.filter(e => e.id !== item.id));
        setTrash(prev => [{ ...item, deleted_at, linked_backup: backup }, ...prev]);
        notifyPartner();
        showToast(backup ? `🗑️ 휴지통으로 옮기고 연결된 ${backup.label}도 지웠습니다. (휴지통에서 복원하면 함께 되살릴 수 있어요)` : '🗑️ 휴지통으로 옮겼습니다. (내역 탭 위 🗑️ 휴지통에서 복원)');
        return true;
      };

      // ✍️ 직접 입력
      const manualDefaults = (kind) => {
        const base = kind === 'income'
          ? incomeCategories[0]
          : (categories.find(c => c.name === '경조사/선물') || categories[0]);
        return { kind, category: base?.name || '기타', sub_category: base?.subs?.[0] || '기타', catTouched: false, pay: kind === 'income' ? 'none' : 'cash' };
      };
      const openManual = (kind = 'expense') => {
        setManual({ date: getKSTDateTimeString(), store: '', amount: '', payer: currentUser, memo: '', is_business: false, ...manualDefaults(kind) });
      };
      const saveManual = async () => {
        const amt = Math.round(Number(String(manual.amount).replace(/[^0-9.-]/g, '')) || 0);
        const inc = manual.kind === 'income';
        if (!manual.store.trim()) return showToast(inc ? '⚠️ 보낸 곳이나 내용을 입력해주세요. (예: 회사 급여)' : '⚠️ 가게나 내용을 입력해주세요. (예: 김OO 결혼식 축의금)');
        if (!amt) return showToast('⚠️ 금액을 입력해주세요.');
        const noVat = inc || manual.category === '경조사/선물';   // 수입·축의금·용돈·기부 등은 부가세 없음
        const sr = !inc && manual.smsRow;   // 붙여넣은 카드 문자 1건으로 채운 경우: 문자 자동등록과 같은 출처·부가세·중복 검사
        if (sr) {
          const x = { ...sr, date: normalizeDateString(manual.date), store: manual.store.trim().slice(0, 60), amount: amt, ...payFieldsOf(manual.pay) };
          const dup = expenses.find(e => !isIncome(e) && isDuplicateExpense(x, [e]));
          if (dup) return showToast(`ℹ️ 이미 등록된 결제입니다: ${dup.store} ${Number(dup.amount).toLocaleString()}원`);
          const bin = trash.find(t => isDuplicateExpense(x, [t]));
          if (bin) {
            const tr = await askRestoreFromTrash([bin]);
            if (tr.restored) { showToast(`↩️ 휴지통에서 다시 등록했습니다: ${bin.store}`); setManual(null); setActiveTab('list'); }
            else showToast('ℹ️ 휴지통에 있는 결제라 등록하지 않았습니다.');
            return;
          }
        }
        const ok = await insertExpenseRows([{
          id: sr ? sr.id : (inc ? 'inc-' : 'man-') + Date.now(),
          kind: inc ? 'income' : 'expense',
          date: manual.date,
          store: manual.store.trim().slice(0, 60),
          category: manual.category,
          sub_category: manual.sub_category,
          amount: amt,
          tax: sr ? (amt === sr.amount ? sr.tax : Math.round(amt / 11)) : noVat ? 0 : Math.round(amt / 11),
          payer: manual.payer,
          ...payFieldsOf(inc ? 'none' : manual.pay),
          is_business: !inc && manual.is_business,
          source: sr ? sr.source : '직접입력',
          verified: true,
          memo: manual.memo.trim().slice(0, 200),
          items: []
        }]);
        if (ok) { showToast(`${inc ? '💰 수입' : '✍️ 지출'} 등록: ${manual.store.trim()} ${amt.toLocaleString()}원`); showRegistered([manual.date]); setManual(null); setActiveTab('list'); }
      };
      // 📋 붙여넣은 카드 문자: 문자마다 읽어 새 결제 · 이미 있음 · 휴지통에 있음으로 나누고, 광고·안내 문자는 셈만
      const parseSmsPaste = (text) => {
        const blocks = String(text || '').split(/(?=\[Web발신\])|\n\s*\n/).map(b => b.trim()).filter(Boolean);
        const rows = [];
        let spam = 0;
        for (const block of blocks) {
          const row = parseSingleSmsBlock(block, categories, currentUser, cards);
          if (!row) { spam++; continue; }
          const dup = isDuplicateExpense(row, [...expenses, ...rows.filter(r => r.status === 'new').map(r => r.row)]);
          const bin = !dup && trash.find(t => isDuplicateExpense(row, [t]));
          rows.push({ row, status: dup ? 'dup' : bin ? 'trash' : 'new' });
        }
        return { rows, spam };
      };
      // 직접 입력 창의 문자 칸: 1건이면 아래 칸을 채우고(확인 후 등록), 여러 건이면 목록으로
      const onManualSms = (text) => {
        const { rows } = parseSmsPaste(text);
        if (rows.length === 1) {
          const r = rows[0].row;
          setManual(m => ({ ...m, ...manualDefaults('expense'), sms: text, smsRow: r,
            store: r.store, amount: String(r.amount), date: normalizeDateString(r.date), pay: payValueOf(r), payer: r.payer,
            category: r.category, sub_category: r.sub_category, catTouched: true }));
        } else {
          setManual(m => ({ ...m, sms: text, smsRow: null }));
        }
      };

      // ---------------------------------------------------------------------
      // 💼 급여명세서
      // ---------------------------------------------------------------------
      const loadPayslips = async () => {
        if (!ensureConnected()) return;
        setPsState('loading');
        const { data, error } = await supabaseClient.from('payslips').select('*').order('pay_month', { ascending: false });
        if (error) {
          setPsState(/payslips|does not exist|schema cache|PGRST20[25]|42P01/i.test(`${error.code} ${error.message}`) ? 'missing' : '⚠️ ' + error.message);
          return;
        }
        setPayslips((data || []).slice().sort((x, y) => y.pay_month.localeCompare(x.pay_month)));   // 최근 달 먼저 (전달 대비 계산)
        setPsState('');
      };
      const openPayslips = () => { setInputReturn(null); setPsOwner(currentUser); setShowPayslips(true); setPsEdit(null); loadPayslips(); };
      const newPayslipDraft = (over = {}) => ({
        id: null, owner: psOwner, pay_month: getKSTDateTimeString().slice(0, 7), pay_date: '', pay_type: '월급여', company: '',
        earnings: [{ name: '기본급', amount: 0 }],
        deductions: ['국민연금', '건강보험', '장기요양', '고용보험', '소득세', '지방소득세'].map(n => ({ name: n, amount: 0, group: payslipGroupOf(n) })),
        refs: [], read: null, linkIncome: true, income_id: null, memo: '', ...over
      });
      // 서버가 읽은 명세서들 → 편집 화면용. 서로 다른 명세서는 따로 (오래된 달부터). 예전 서버(payslip 하나)도 그대로 받음
      const payslipDraftsFrom = (data, owner = psOwner) => {
        const list = Array.isArray(data.payslips) && data.payslips.length ? data.payslips : [data.payslip];
        return list.map((ps, i) => newPayslipDraft({
          owner,
          pay_month: ps.pay_month || getKSTDateTimeString().slice(0, 7),
          pay_date: ps.pay_date || '',
          pay_type: payslipTypeOf(ps.pay_type),
          company: ps.company || '',
          earnings: (ps.earnings || []).map(e => ({ name: e.name, amount: e.amount })),
          deductions: (ps.deductions || []).map(x => ({ ...x, group: payslipGroupOf(x.name) })),
          refs: ps.refs || [],
          read: { gross: ps.gross, deduction_total: ps.deduction_total, net: ps.net, model: data.model, monthMissing: !ps.pay_month, pos: i + 1, total: list.length, photos: ps.photos || [] }
        }));
      };
      const showPayslipDrafts = (drafts) => {
        setPsEdit(drafts[0]);
        setPsQueue(drafts.slice(1));
        if (drafts.length > 1) showToast(`💼 명세서 ${drafts.length}개를 읽었습니다. 하나씩 확인해 저장하세요.`);
      };
      // 사진(여러 장 가능)을 AI로 읽어 편집 화면에
      const readPayslipPhotos = async (fileList, owner = psOwner) => {
        const files = Array.from(fileList || []).slice(0, 10);
        if (files.length === 0 || !ensureConnected()) return;
        setPsBusy('reading');
        try {
          const photos = await Promise.all(files.map(resizeImage));
          let timer;
          const limitMs = Math.min(SCAN_TIMEOUT_MS + (photos.length - 1) * SCAN_EXTRA_MS, SCAN_LIMIT_MAX_MS);   // 사진이 많으면 더 기다림 (영수증과 같게)
          const timeout = new Promise((_, rej) => { timer = setTimeout(() => rej(new Error('⏱️ AI 응답이 너무 늦습니다. 잠시 후 다시 시도해주세요.')), limitMs); });
          const { data, error } = await Promise.race([
            supabaseClient.functions.invoke('scan-receipt', { body: {
              ...(photos.length === 1 ? { image: photos[0].base64, mimeType: photos[0].mimeType }
                : { images: photos.map(ph => ({ image: ph.base64, mimeType: ph.mimeType })) }),
              mode: 'payslip'
            } }),
            timeout
          ]).finally(() => clearTimeout(timer));
          if (error) throw new Error(await describeScanError(error));
          if (data?.status === 'not_receipt') throw new Error('급여명세서가 아닌 사진 같습니다. 지급·공제 내역이 보이게 다시 찍어주세요.');
          if (data?.status !== 'success' || !data.payslip) throw new Error(data?.message || '명세서를 읽지 못했습니다.');
          showPayslipDrafts(payslipDraftsFrom(data, owner));
        } catch (err) {
          showToast('⚠️ ' + (err.message || String(err)));
        } finally {
          setPsBusy('');
        }
      };
      const editPayslip = (p) => setPsEdit({
        ...p, pay_type: payslipTypeOf(p.pay_type), earnings: (p.earnings || []).map(e => ({ name: e.name, amount: e.amount })), deductions: (p.deductions || []).map(d => ({ ...d, group: d.group && d.group !== '상계' ? d.group : payslipGroupOf(d.name) })),
        read: null, linkIncome: !!p.income_id   // 저장할 때 상태 그대로 (연결 안 했던 명세서를 고쳐도 수입이 새로 생기지 않게)
      });
      // 저장: 명세서 + 실수령액을 수입(급여 › 월급 또는 상여/성과급)으로 (이미 입금 캡처로 넣은 같은 금액 수입이 있으면 그것과 연결)
      const savePayslip = async () => {
        const d = psEdit;
        if (!/^\d{4}-\d{2}$/.test(d.pay_month || '')) return showToast('⚠️ 귀속월을 골라주세요.');
        const ptype = payslipTypeOf(d.pay_type);
        const clean = (arr) => arr.map(x => ({ ...x, name: String(x.name || '').trim(), amount: Math.round(Number(x.amount) || 0) })).filter(x => x.name && x.amount !== 0);
        const earnings = clean(d.earnings).map(e => ({ name: e.name, amount: e.amount }));
        const deductions = clean(d.deductions).map(x => ({ name: x.name, amount: x.amount, group: x.group || payslipGroupOf(x.name) }));
        const t = payslipTotals({ earnings, deductions });
        if (!t.gross) return showToast('⚠️ 지급 항목 금액을 입력해주세요.');
        if (!ensureConnected()) return;
        let id = d.id;
        let income_id = d.income_id || null;
        if (!id) {   // 같은 사람·같은 달·같은 유형이 이미 있으면 바꿀지 물어봄 (같은 명세서 두 번 저장 방지)
          const dup = payslips.find(p => p.owner === d.owner && p.pay_month === d.pay_month && payslipTypeOf(p.pay_type) === ptype);
          if (dup) {
            if (!window.confirm(`${mName(d.owner)} ${d.pay_month} ${ptype} 명세서가 이미 있습니다 (실지급 ${Number(dup.net).toLocaleString()}원).\n이 내용으로 바꿀까요?`)) return;
            id = dup.id;
            income_id = dup.income_id || null;
          }
        }
        id = id || 'ps-' + Date.now();
        setPsBusy('saving');
        try {
          if (d.linkIncome) {
            const payDay = d.pay_date || `${d.pay_month}-25`;
            const date = `${payDay} 09:00`;
            const incCat = incomeCategories.find(c => c.name === '급여') || incomeCategories[0];
            const incSub = isBonusType(ptype) && incCat.subs.includes('상여/성과급') ? '상여/성과급' : incCat.subs.includes('월급') ? '월급' : (incCat.subs[0] || '기타');
            const label = ptype === '월급여' ? '급여' : ptype;
            const fields = {
              date, amount: t.net, payer: d.owner,
              store: d.company ? `${d.company} ${label}` : label,
              memo: `${d.pay_month} ${label} 명세서${t.yearEnd < 0 ? ' · 연말정산 환급 포함' : t.yearEnd > 0 ? ' · 연말정산 추가 납부' : ''}`
            };
            const linked = income_id && expenses.find(e => e.id === income_id);
            if (linked) {
              await updateExpenseRow(income_id, { ...fields, date: keepTime(linked.date, payDay), category: incCat.name, sub_category: incSub });
            } else {
              const near = (e) => Math.abs(Date.parse(String(e.date).slice(0, 10)) - Date.parse(payDay)) <= 7 * 86400000;
              const cand = expenses.find(e => isIncome(e) && e.amount === t.net && near(e) && !payslips.some(p => p.income_id === e.id && p.id !== id));
              if (cand) {
                income_id = cand.id;
                await updateExpenseRow(cand.id, { category: incCat.name, sub_category: incSub, memo: [userMemo(cand.memo), fields.memo].filter(Boolean).join(' / ') });
                showToast('🔗 이미 등록된 같은 금액의 입금 내역과 연결했습니다.');
              } else {
                income_id = 'inc-ps-' + id;
                await insertExpenseRows([{
                  id: income_id, kind: 'income', ...fields,
                  category: incCat.name, sub_category: incSub,
                  tax: 0, ...payFieldsOf('none'), is_business: false, source: '급여명세서', verified: true, items: []
                }]);
              }
            }
          } else if (income_id) {
            // '수입으로 등록'을 끔: 명세서가 만든 수입은 휴지통으로, 직접 넣은 입금 내역(입금 캡처 등)은 연결만 끊음
            const inc = expenses.find(e => e.id === income_id);
            if (inc && (inc.source === '급여명세서' || String(inc.id).startsWith('inc-ps-'))) {
              const deleted_at = new Date().toISOString();
              const { error: e2 } = await supabaseClient.from('expenses').update({ deleted_at, updated_by: MY_DEVICE_ID }).eq('id', inc.id).eq('family_code', familyCode);
              if (e2) throw e2;
              setExpenses(prev => prev.filter(e => e.id !== inc.id));
              setTrash(prev => [{ ...inc, deleted_at }, ...prev]);
              notifyPartner();
              showToast('🗑️ 연결된 수입 내역을 휴지통으로 옮겼습니다.');
            }
            income_id = null;
          }
          const row = {

      const renderInputKinds = (cur) => (

      const saveLoan = async () => {

        // 이미 있는 납입(자동 납입 등)인데 시간이 없던 기록: 사진에서 읽은 시간만 채움 (연결된 지출 시간도)
        const timeFill = R.pays.filter(p => p.dup && p.dupId && p.pay_time).map(p => ({ p, x: savPays.find(x => x.id === p.dupId) })).filter(({ x }) => x && !normTime(x.pay_time));
        for (const { p, x } of timeFill) {
          const { error: e3 } = await supabaseClient.from('savings_payments').update({ pay_time: p.pay_time, updated_by: MY_DEVICE_ID }).eq('id', x.id).eq('family_code', familyCode);
          if (e3) continue;
          rows.push({ ...x, pay_time: p.pay_time });
          const ex = x.expense_id && expenses.find(e => e.id === x.expense_id);
          if (ex) await updateExpenseRow(ex.id, { date: atTime(x.pay_date, p.pay_time) });
        }
        const merged = [...rows, ...savPays.filter(x => !rows.some(r => r.id === x.id))].sort((a, b) => b.pay_date.localeCompare(a.pay_date));
        setSavPays(merged);
        await autoFillSavings(accs, merged, [...expenses, ...newEx]);
        notifyPartner();
        setSavBusy('');
        const nx = nextSavRead(R, accs, merged);
        setSavRead(nx);
        if (!nx) setSavOpenId(row.id);   // 다음 저축 확인이 남아 있으면 뒤에 자세히 창을 미리 열지 않음
        showToast(`🏦 ${row.name}: ${R.targetId ? '정보 반영' : '새 저축 등록'}${rows.length ? ` · 납입 ${rows.length}건${newEx.length ? ` (지출 ${newEx.length}건)` : ''}` : ''}${nx ? ` · 다음 저축 확인 (${nx.pos}/${nx.total})` : ''}`);
      };

      const exportLoan = (loan) => {
        const rows = loanPays.filter(p => p.loan_id === loan.id).sort((a, b) => a.pay_date.localeCompare(b.pay_date));
        if (rows.length === 0) return showToast('ℹ️ 저장할 상환 기록이 없습니다.');
        const header = ['날짜', '회차', '구분', '합계', '원금', '이자', '조기상환수수료', '지연배상금', '메모'];
        const data = rows.map(p => [p.pay_date, p.seq || '', p.kind, Number(p.total), Number(p.principal), Number(p.interest), Number(p.fee), Number(p.late_fee), p.memo || '']);
        const sumRow = ['합계', '', '', ...[3, 4, 5, 6, 7].map(k => data.reduce((s2, r) => s2 + r[k], 0)), ''];
        const fileBase = `대출상환_${loan.name || '대출'}`;
        if (window.XLSX) {
          const ws = window.XLSX.utils.aoa_to_sheet([header, ...data, sumRow]);
          const wb = window.XLSX.utils.book_new();
          window.XLSX.utils.book_append_sheet(wb, ws, '상환내역');
          downloadBlob(new Blob([window.XLSX.write(wb, { bookType: 'xlsx', type: 'array' })], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `${fileBase}.xlsx`);
        } else {
          const esc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
          downloadBlob(new Blob(['﻿' + [header, ...data, sumRow].map(r => r.map(esc).join(',')).join('\n')], { type: 'text/csv;charset=utf-8;' }), `${fileBase}.csv`);
        }
      };

      // 함께 지운 연결 기록 보관 (휴지통 내역의 linked_backup)
      const josaEul = (w) => { const c = String(w || '').charCodeAt(String(w || '').length - 1); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 ? '을' : '를'; };
      const stripRow = (r) => { const { created_at, ...rest } = r || {}; return rest; };
      const PS_COLS = ['id', 'owner', 'pay_month', 'pay_date', 'pay_type', 'company', 'earnings', 'deductions', 'refs', 'gross', 'deduction_total', 'net', 'income_id', 'memo'];
      const pickCols = (r, cols) => Object.fromEntries(cols.filter(k => r && r[k] !== undefined).map(k => [k, r[k]]));
      // 편집 화면의 값(읽은 내용 표시용 칸 등)이 아니라 저장된 행을 보관
      const psBackupOf = (ps) => { const r = payslips.find(x => x.id === ps.id) || ps; return { type: 'payslip', label: `${r.pay_month} ${payslipTypeOf(r.pay_type)} 급여명세서`, row: pickCols(r, PS_COLS) }; };
      const payBackupOf = (p) => { const r = loanPays.find(x => x.id === p.id) || p;
        return { type: 'loan_payment', label: `${(loans.find(l => l.id === r.loan_id) || {}).name || '대출'} ${r.pay_date} 상환 기록`,
          row: { ...pickCols(r, ['id', 'loan_id', 'pay_date', 'pay_time', 'seq', 'kind', 'memo', 'expense_id']), ...Object.fromEntries(['total', 'principal', 'interest', 'fee', 'late_fee'].map(k => [k, numOf(r[k])])) } }; };
      const savBackupOf = (p) => ({ type: 'savings_payment', label: `${(savings.find(a => a.id === p.savings_id) || {}).name || '저축'} ${p.pay_date} 납입 기록`, row: stripRow(p),
        skip_month: p.auto ? String(p.pay_date).slice(0, 7) : null });
      // 보관해 둔 연결 기록 되살리기 → 결과 문구 ('' = 성공)
      const restoreLinked = async (item, b) => {
        const row = { ...b.row, family_code: familyCode, updated_by: MY_DEVICE_ID };
        if (b.type === 'payslip') {
          const { data: all } = await supabaseClient.from('payslips').select('id,pay_type').eq('owner', row.owner).eq('pay_month', row.pay_month);
          if ((all || []).some(x => x.id !== row.id && payslipTypeOf(x.pay_type) === payslipTypeOf(row.pay_type))) return `같은 달 ${payslipTypeOf(row.pay_type)} 명세서를 이미 다시 넣어서 명세서는 복구하지 않았어요`;
          const { error } = await supabaseClient.from('payslips').upsert({ ...row, income_id: item.id });
          if (error) return '명세서 복구 실패: ' + error.message;
          if (showPayslips) loadPayslips(); else setPayslips(prev => [{ ...row, income_id: item.id }, ...prev.filter(x => x.id !== row.id)].sort((x, y) => y.pay_month.localeCompare(x.pay_month)));
          return '';
        }
        if (b.type === 'loan_payment') {
          if (!loans.some(l => l.id === row.loan_id)) return '대출이 지워져서 상환 기록은 복구하지 못했어요';
          // 같은 날·같은 합계라도 회차가 둘 다 있고 다르면 다른 상환 (같은 날 두 번 조기상환)
          if (loanPays.some(x => x.id !== row.id && x.loan_id === row.loan_id && x.pay_date === row.pay_date && Number(x.total) === Number(row.total)
            && (!x.seq || !row.seq || Number(x.seq) === Number(row.seq)))) return '같은 상환 기록을 이미 다시 넣어서 복구하지 않았어요';
          const r = { ...row, expense_id: item.id };
          const { error } = await supabaseClient.from('loan_payments').upsert(r);
          if (error) return '상환 기록 복구 실패: ' + error.message;
          setLoanPays(prev => [r, ...prev.filter(x => x.id !== r.id)].sort((x, y) => y.pay_date.localeCompare(x.pay_date)));
          return '';
        }
        if (b.type === 'gift_record') {
          if (giftRecs.some(x => x.id === row.id)) return '';
          if (!giftPeople.some(p => p.id === row.person_id)) {
            if (!b.person) return '사람이 지워져서 부조 기록은 복구하지 못했어요';
            const pr = { ...b.person, family_code: familyCode, updated_by: MY_DEVICE_ID };
            const { error: pe } = await supabaseClient.from('gift_people').upsert(pr);
            if (pe) return '부조 기록 복구 실패: ' + pe.message;
            setGiftPeople(prev => [...prev, pr]);
          }
          const r = { ...row, expense_id: item.id };
          const { error } = await supabaseClient.from('gift_records').upsert(r);
          if (error) return '부조 기록 복구 실패: ' + error.message;
          setGiftRecs(prev => [r, ...prev.filter(x => x.id !== r.id)]);
          return '';
        }
        if (b.type === 'savings_payment') {
          const acc = savings.find(a => a.id === row.savings_id);
          if (!acc) return '저축이 지워져서 납입 기록은 복구하지 못했어요';
          if (savPays.some(x => x.id === row.id)) return '';
          const r = { ...row, expense_id: item.id };
          const { error } = await supabaseClient.from('savings_payments').upsert(r);
          if (error) return '납입 기록 복구 실패: ' + error.message;
          if (b.skip_month && (acc.skip_months || []).includes(b.skip_month)) {   // 자동 납입에서 뺐던 달을 되돌림
            const ar = savRowOf({ ...acc, skip_months: (acc.skip_months || []).filter(m => m !== b.skip_month) });
            await supabaseClient.from('savings').upsert(ar);
            setSavings(prev => prev.map(x => x.id === acc.id ? ar : x));
          }
          setSavPays(prev => [r, ...prev.filter(x => x.id !== r.id)].sort((x, y) => y.pay_date.localeCompare(x.pay_date)));
          return '';
        }
        return '';
      };
      const restoreExpenseRow = async (item) => {
        if (!ensureConnected()) return;
        const b = item.linked_backup && typeof item.linked_backup === 'object' && item.linked_backup.row ? item.linked_backup : null;
        let withLinked = false;
        if (b) {
          const v = await askChoice('↩️ 복원', `[${item.store} · ${Number(item.amount).toLocaleString()}원]\n삭제할 때 함께 지운 ${b.label}${josaEul(b.label)} 보관해 두었어요.`, [
            { value: 'both', label: `${b.label}도 함께 복구` },
            { value: 'one', label: '내역만 복구' },
            { value: null, label: '취소' }
          ]);
          if (!v) return;
          withLinked = v === 'both';
        }
        const { error } = await supabaseClient.from('expenses')
          .update({ deleted_at: null, ...(b ? { linked_backup: null } : {}), updated_by: MY_DEVICE_ID })
          .eq('id', item.id).eq('family_code', familyCode);
        if (error) return showToast('⚠️ 복원 실패: ' + error.message);
        setTrash(prev => prev.filter(e => e.id !== item.id));
        setExpenses(prev => [...prev, { ...item, deleted_at: null, linked_backup: null }].sort((a, b) => b.date.localeCompare(a.date)));
        const msg = withLinked ? await restoreLinked(item, b) : '';
        notifyPartner();
        showToast(withLinked && !msg ? `↩️ 복원했습니다: ${item.store} + ${b.label}` : `↩️ 복원했습니다: ${item.store} ${Number(item.amount).toLocaleString()}원${msg ? ` · ⚠️ ${msg}` : ''}`, msg ? 6000 : 3800);
      };

      // 문자 붙여넣기·카드사 파일에 휴지통에 버린 결제와 같은 내역이 있으면: 알려주고 다시 등록(휴지통에서 꺼내기)할지 물어봄
      //   → { total: 휴지통과 겹친 건수, restored: 꺼낸 건수 }
      const askRestoreFromTrash = async (hits) => {
        const uniq = [...new Map(hits.filter(Boolean).map(e => [e.id, e])).values()];
        if (uniq.length === 0) return { total: 0, restored: 0 };
        const lines = uniq.slice(0, 5).map(e => `· ${normalizeDateString(e.date).slice(0, 16)} ${e.store} ${Number(e.amount).toLocaleString()}원`).join('\n');
        const more = uniq.length > 5 ? `\n… 외 ${uniq.length - 5}건` : '';
        if (!window.confirm(`🗑️ 휴지통에 버린 결제와 같은 내역이 ${uniq.length}건 있습니다.\n${lines}${more}\n\n휴지통에서 꺼내 다시 등록할까요?\n(취소를 누르면 등록하지 않고 휴지통에 그대로 둡니다)`)) {
          return { total: uniq.length, restored: 0 };
        }
        const ids = uniq.map(e => e.id);
        const { error } = await supabaseClient.from('expenses').update({ deleted_at: null, linked_backup: null, updated_by: MY_DEVICE_ID }).in('id', ids).eq('family_code', familyCode);
        if (error) { showToast('⚠️ 휴지통에서 꺼내기 실패: ' + error.message); return { total: uniq.length, restored: 0 }; }
        setTrash(prev => prev.filter(e => !ids.includes(e.id)));
        setExpenses(prev => [...prev, ...uniq.map(e => ({ ...e, deleted_at: null, linked_backup: null }))].sort((a, b) => b.date.localeCompare(a.date)));
        notifyPartner();
        return { total: uniq.length, restored: uniq.length };
      };

      const purgeExpenseRows = async (items) => {
        if (!ensureConnected() || items.length === 0) return;
        const msg = items.length === 1
          ? `[${items[0].store} - ${Number(items[0].amount).toLocaleString()}원]\n영구 삭제할까요? 되돌릴 수 없습니다.`
          : `휴지통의 ${items.length}건을 모두 영구 삭제할까요? 되돌릴 수 없습니다.`;
        if (!window.confirm(msg)) return;
        const ids = items.map(e => e.id);
        const { error } = await supabaseClient.from('expenses').delete().in('id', ids).eq('family_code', familyCode);
        if (error) return showToast('⚠️ 영구 삭제 실패: ' + error.message);
        setTrash(prev => prev.filter(e => !ids.includes(e.id)));
        notifyPartner();
        showToast(`🧹 ${items.length}건을 영구 삭제했습니다.`);
      };

      // 내역의 대표 분류 바꾸기: 대표 분류와 같던 품목도 따라가고, 다른 분류 품목이 남으면 알려 줌
      const changeRowCategory = async (item, newCat, newSub) => {
        const patch = { category: newCat, sub_category: newSub };
        if (hasItemCategories(item.items)) patch.items = retargetItems(item.items, item.category, item.sub_category, newCat, newSub);
        const ok = await updateExpenseRow(item.id, patch);
        if (ok && patch.items && patch.items.some(it => it.category && (it.category !== newCat || it.sub_category !== newSub))) {
          showToast('ℹ️ 다른 분류의 품목은 그대로예요. 모두 바꾸려면 품목을 펼쳐 [모든 품목을 대표 분류로]');
        }
      };

      const saveEditForm = async (id) => {
        const amt = Number(editForm.amount) || 0;
        // 품목을 고쳤으면 같이 저장 (금액은 숫자로, 이름·금액이 빈 줄은 뺌)
        const before = expenses.find(e => e.id === id);
        const newItems = (editForm.items || []).map(it => ({ ...it, name: String(it.name || '').trim(), price: Math.round(Number(String(it.price ?? '').replace(/[^0-9-]/g, '')) || 0) }))
          .filter(it => it.name || it.price);
        const itemsChanged = before && JSON.stringify(newItems.map(x => [x.name, x.price])) !== JSON.stringify((before.items || []).map(x => [x.name, Number(x.price) || 0]));
        const itemsPatch = itemsChanged ? { items: newItems, verified: newItems.length === 0 || newItems.reduce((t, x) => t + x.price, 0) === amt } : {};
        // 부가세: 금액을 안 바꿨으면 그대로 (영수증에서 읽은 실제 부가세 유지),
        //         바꿨으면 원래 비율대로 (면세 품목이 섞인 영수증도 비율 유지, 취소로 바꾸면 음수)
        const orig = expenses.find(e => e.id === id);
        const tax = !orig ? Math.round(amt / 11)
          : amt === orig.amount ? (orig.tax ?? Math.round(amt / 11))
          : orig.amount ? Math.round((orig.tax ?? orig.amount / 11) * amt / orig.amount)
          : Math.round(amt / 11);
        // 날짜·금액을 바꾼 내역이 저축·대출·부조·급여명세서 기록과 연결돼 있으면 기록도 같이 바꿀지 물어봄
        const newDate = normalizeDateString(editForm.date);
        let link = null, linkTime = null;   // linkTime: 시간만 고친 경우 → 묻지 않고 기록 시간도 맞춤
        const t1 = newDate.slice(11, 16);
        if (orig && (String(orig.date).slice(0, 10) !== newDate.slice(0, 10) || amt !== Number(orig.amount))) {
          link = await linkedRecordOf(orig, newDate.slice(0, 10), amt, t1);
          if (link && (link.date || link.amount || link.note)) {
            const day0 = String(orig.date).slice(0, 10), day1 = newDate.slice(0, 10);
            const lines = [
              `[${orig.store} · ${Number(orig.amount).toLocaleString()}원]`,
              day0 !== day1 ? `날짜: ${String(orig.date).slice(0, 16)} → ${newDate.slice(0, 16)}` : '',
              amt !== Number(orig.amount) ? `금액: ${Number(orig.amount).toLocaleString()} → ${amt.toLocaleString()}원` : '',
              `연결된 기록: ${link.label}`,
              link.date || link.amount ? `\n연결된 기록에 반영: ${[link.date && `날짜 → ${day1}`, link.time && `시간 → ${t1}`, link.amount && `금액 → ${amt.toLocaleString()}원`].filter(Boolean).join(' · ')}` : '',
              link.note ? `ℹ️ ${link.note}` : '',
              link.date || link.amount ? '이 내역만 바꾸면, 나중에 그 기록을 다시 저장할 때 내역이 기록의 날짜·금액으로 돌아갑니다.' : ''
            ].filter(Boolean).join('\n');
            const v = await askChoice('🔗 연결된 기록', lines, link.date || link.amount ? [
              { value: 'both', label: '연결된 기록도 같이 바꾸기' },
              { value: 'one', label: '이 내역만 바꾸기' },
              { value: null, label: '취소' }
            ] : [{ value: 'one', label: '확인 (이 내역만 바꾸기)' }, { value: null, label: '취소' }]);
            if (!v) return;
            if (v !== 'both') { if (!(link.date || link.amount) && link.time) linkTime = link; link = null; }
          } else { if (link && link.time) linkTime = link; link = null; }
        } else if (orig && String(orig.date).slice(11, 16) !== t1) {
          const l = await linkedRecordOf(orig, String(orig.date).slice(0, 10), Number(orig.amount), t1);
          if (l && l.time) linkTime = l;
        }
        const ok = await updateExpenseRow(id, {
          store: editForm.store.trim() || '미상가맹점',
          amount: amt,
          tax,
          date: newDate,
          memo: editForm.memo.trim(),
          payer: editForm.payer,
          ...payFieldsOf(editForm.pay),
          ...itemsPatch
        });
        if (ok) {
          setEditingId(null);
          const linkedOk = link ? await link.apply() : false;
          const timeOk = !link && linkTime ? await linkTime.applyTime() : false;
          showToast(linkedOk ? `✏️ 내역과 연결된 기록(${link.short})을 함께 수정했습니다!` : timeOk ? `✏️ 내역이 수정되었습니다! (연결된 ${linkTime.short} 기록 시간도 ${t1})` : '✏️ 내역이 수정되었습니다!');
        }
      };
      // 내역 ↔ 연결된 기록 찾기: { label, short, date(날짜를 같이 바꿀 수 있나), amount(금액을 같이 바꿀 수 있나), time(시간을 같이 바꿀 수 있나), note, apply(), applyTime() }
      //   tm: 내역의 새 시간 'HH:MM' → 시간 칸이 있는 기록(저축 납입·대출 상환·보낸 부조·우리 경조사)은 시간도 같이
      const linkedRecordOf = async (item, day, amt, tm = '') => {
        const day0 = String(item.date).slice(0, 10);
        const dayCh = day0 !== day, amtCh = amt !== Number(item.amount);
        const won = (n) => `${Number(n).toLocaleString()}원`;
        const run = async (table, id, patch, after) => {
          const { error } = await supabaseClient.from(table).update({ ...patch, updated_by: MY_DEVICE_ID }).eq('id', id).eq('family_code', familyCode);
          if (error) { showToast('⚠️ 연결된 기록 수정 실패: ' + error.message); return false; }
          after(patch); notifyPartner(); return true;
        };
        // 기록 1건: patch(날짜·금액) + 시간 칸(tcol)이 있으면 시간도
        const linkOf = ({ table, rec, tcol, patch, setter, ...info }) => {
          const time = !!(tcol && normTime(tm) && normTime(tm) !== normTime(rec[tcol]));
          const tp = time ? { [tcol]: normTime(tm) } : {};
          return { ...info, time,
            apply: () => run(table, rec.id, { ...patch, ...tp }, setter),
            applyTime: () => run(table, rec.id, tp, setter) };
        };
        // 🏦 대출 상환 (금액은 원금·이자로 나뉘어 있어 상환 기록에서 고쳐야 함)
        const lp = loanPays.find(p => p.expense_id === item.id);
        if (lp) {
          const loan = loans.find(l => l.id === lp.loan_id) || {};
          const okDate = lp.pay_date !== day && loanWantsExpense(loan, { ...lp, pay_date: day });
          return linkOf({ table: 'loan_payments', rec: lp, tcol: 'pay_time', patch: okDate ? { pay_date: day } : {},
            setter: (pt) => setLoanPays(prev => prev.map(x => x.id === lp.id ? { ...x, ...pt } : x).sort((a, b) => b.pay_date.localeCompare(a.pay_date))),
            label: `🏦 ${loan.name || '대출'} 상환 기록 (${lp.pay_date}${timeTag(lp.pay_time)})`, short: '대출 상환', date: okDate, amount: false,
            note: [lp.pay_date !== day && !okDate ? '이 날짜는 상환 지출을 넣는 시작 달 전이라 상환 기록 날짜는 바꾸지 않습니다.' : '', amtCh ? '금액은 원금·이자로 나뉘어 있어 대출 › 상환 기록에서 고쳐야 다시 저장해도 유지됩니다.' : ''].filter(Boolean).join('\n') });
        }
        // 💰 저축 납입
        const sp = !isIncome(item) && savPays.find(p => p.expense_id === item.id);
        if (sp) {
          const a = savings.find(x => x.id === sp.savings_id) || {};
          const okDate = sp.pay_date !== day && savWantsExpense(a, { ...sp, pay_date: day });
          const okAmt = Number(sp.amount) !== amt && amt > 0;
          return linkOf({ table: 'savings_payments', rec: sp, tcol: 'pay_time', patch: { ...(okDate ? { pay_date: day } : {}), ...(okAmt ? { amount: amt } : {}) },
            setter: (pt) => setSavPays(prev => prev.map(x => x.id === sp.id ? { ...x, ...pt } : x).sort((p, q) => q.pay_date.localeCompare(p.pay_date))),
            label: `💰 ${a.name || '저축'} 납입 기록 (${sp.pay_date}${timeTag(sp.pay_time)} · ${won(sp.amount)})`, short: '저축 납입', date: okDate, amount: okAmt,
            note: sp.pay_date !== day && !okDate ? '이 날짜는 납입 지출을 넣는 시작 달 전이라 납입 기록 날짜는 바꾸지 않습니다.' : '' });
        }
        // 💰 저축 만기·해지 수입 (시간 칸 없음)
        const sa = isIncome(item) && savings.find(a => a.payout_income_id === item.id);
        if (sa) {
          const okDate = sa.closed_date !== day, okAmt = Number(sa.payout) !== amt;
          return linkOf({ table: 'savings', rec: sa, patch: { ...(okDate ? { closed_date: day } : {}), ...(okAmt ? { payout: amt } : {}) },
            setter: (pt) => setSavings(prev => prev.map(x => x.id === sa.id ? { ...x, ...pt } : x)),
            label: `💰 ${sa.name} ${sa.status} (${sa.closed_date || '-'} · ${won(sa.payout || 0)})`, short: `저축 ${sa.status}`, date: okDate, amount: okAmt });
        }
        // 💐 보낸 부조
        const gr = !isIncome(item) && giftRecs.find(r => r.expense_id === item.id);
        if (gr) {
          const gp = giftPerson(gr.person_id);
          const okDate = gr.rec_date !== day, okAmt = Number(gr.amount) !== amt && amt > 0;
          return linkOf({ table: 'gift_records', rec: gr, tcol: 'rec_time', patch: { ...(okDate ? { rec_date: day } : {}), ...(okAmt ? { amount: amt } : {}) },
            setter: (pt) => setGiftRecs(prev => prev.map(x => x.id === gr.id ? { ...x, ...pt } : x)),
            label: `💐 ${gp?.name || ''} ${gr.event_type} 보냄 (${gr.rec_date}${timeTag(gr.rec_time)} · ${won(gr.amount)})`, short: '부조', date: okDate, amount: okAmt });
        }
        // 💐 받은 부조 수입 (행사·달마다 합계 1건) → 행사 달의 수입이면 행사 날짜·시간
        if (String(item.id).startsWith('gifti-')) {
          const ev = giftEvents.find(e => String(item.id).startsWith(`gifti-${e.id}-`));
          if (!ev) return null;
          const evRow = ev.event_date === day0;
          const okDate = dayCh && evRow && day.slice(0, 7) === day0.slice(0, 7);
          return linkOf({ table: 'gift_events', rec: ev, tcol: evRow ? 'event_time' : null, patch: okDate ? { event_date: day } : {},
            setter: (pt) => setGiftEvents(prev => prev.map(x => x.id === ev.id ? { ...x, ...pt } : x)),
            label: `💐 ${ev.title || ev.event_type} 받은 부조 합계`, short: '경조사', date: okDate, amount: false,
            note: [okDate ? `행사 날짜(${ev.event_date})도 ${day}로 바뀝니다.` : dayCh ? '받은 부조는 행사·달마다 합계라 날짜가 행사 기록으로 정해집니다. 바꾸려면 경조사 장부에서 행사·기록 날짜를 고치세요.' : '',
              amtCh ? '금액은 받은 부조 기록들의 합계라, 경조사 장부에서 기록을 고쳐야 유지됩니다.' : ''].filter(Boolean).join('\n') });
        }
        // 📄 급여명세서 수입 (시간 칸 없음 · 명세서 목록은 자산 탭을 열 때 읽으므로 없으면 서버에서 찾음)
        if (isIncome(item)) {
          let ps = payslips.find(p => p.income_id === item.id);
          if (!ps) { const { data } = await supabaseClient.from('payslips').select('*').eq('income_id', item.id); ps = (data || [])[0] || null; }
          if (ps) {
            return linkOf({ table: 'payslips', rec: ps, patch: { pay_date: day },
              setter: (pt) => setPayslips(prev => prev.map(x => x.id === ps.id ? { ...x, ...pt } : x)),
              label: `📄 ${mName(ps.owner)} ${ps.pay_month} ${payslipTypeOf(ps.pay_type)} 명세서 (지급일 ${ps.pay_date || `${ps.pay_month}-25`})`, short: '급여명세서', date: (ps.pay_date || `${ps.pay_month}-25`) !== day, amount: false,
              note: amtCh ? '금액은 명세서의 실지급액이라, 급여명세서에서 고쳐야 다시 저장해도 유지됩니다.' : '' });
          }
        }
        return null;
      };
      const saveBudget = async (b) => {
        if (!ensureConnected()) return false;
        const clean = {};
        for (const k of ['total', ...memberKeys]) { const v = numOf(b[k]); if (v > 0) clean[k] = v; }
        const { error } = await supabaseClient.from('family_config').update({ budget: clean, updated_by: MY_DEVICE_ID, updated_at: new Date().toISOString() }).eq('family_code', familyCode);
        if (error) { showToast('⚠️ 예산 저장 실패: ' + error.message); return false; }
        setBudget(clean);
        notifyPartner();
        showToast(Object.keys(clean).length ? '🎯 월 예산을 저장했습니다.' : '🎯 월 예산을 지웠습니다.');
        return true;
      };

      const saveCategories = async (newCats) => {
        if (!ensureConnected()) return false;
        const { error } = await supabaseClient.from('family_config').update({
          categories: newCats,
          updated_by: MY_DEVICE_ID,
          updated_at: new Date().toISOString()
        }).eq('family_code', familyCode);
        if (error) {
          showToast('⚠️ 카테고리 저장 실패: ' + error.message);
          return false;
        }
        setCategories(newCats);
        try { localStorage.setItem(STORAGE_KEY_CATS, JSON.stringify(newCats)); } catch (e) {}
        notifyPartner();
        return true;
      };

      // =====================================================================
      // ★ 카드 목록 저장: 저장 직전에 서버의 최신 목록을 다시 읽어 그 위에 바꿈
      //   (두 폰이 동시에 고쳐도 상대가 바꾼 이름·주인이 덮어써지지 않도록)
      // =====================================================================
      const cardRefsOf = (rows) => rows.filter(r => r.card_num).map(r => ({ issuer: r.card_issuer || '', num: r.card_num, date: r.date }));

      const saveCards = async (mutator, opts = {}) => {
        const { data, error: readErr } = await supabaseClient
