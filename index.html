  <!-- 라이브러리 버전 고정: 오프라인 캐시가 엉뚱한 새 버전으로 바뀌지 않도록 -->

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>

</head>
<body class="bg-slate-950 text-slate-100 select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const SUPABASE_URL = 'https://lkmhimcvtevmpnzoccax.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_dLOvYlQtvmUEzVpU89jxmw_RT62v5NL';

    const APP_VERSION = 'v1.2';
    // ★ 이 앱이 필요로 하는 DB 스키마 버전 (Supabase의 schema_meta.schema_version과 비교)
    const REQUIRED_SCHEMA_VERSION = 1;
    // ★ 가족 보안 코드 최소 길이 (DB에서도 같은 규칙으로 막음)
    const MIN_CODE_LENGTH = 12;

    // ★ 폰 저장 키는 버전 번호 없이 고정 (앞으로 버전이 올라가도 코드·캐시 유지)
    const STORAGE_KEY_CACHE = 'COUPLE_CACHE';
    const STORAGE_KEY_CATS = 'COUPLE_CATS';
    const STORAGE_KEY_PASS = 'COUPLE_PASS';

    const MY_DEVICE_ID = (() => {
      try {
        let id = localStorage.getItem('COUPLE_DEVICE_ID');
        if (!id) {
          id = 'dev-' + Math.random().toString(36).substring(2, 10);
          localStorage.setItem('COUPLE_DEVICE_ID', id);
        }
        return id;
      } catch (e) {
        return 'dev-local';
      }
    })();

    const generateSecureFamilyPass = () => {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
      const arr = new Uint32Array(12);
      window.crypto.getRandomValues(arr);
      return Array.from(arr, n => chars[n % chars.length]).join('');
    };

    const createSecuredClient = (famCode) => {
      return window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        global: {
          headers: { 'x-family-code': famCode }
        },
        auth: { persistSession: false, autoRefreshToken: false }
      });
    };

    const getKSTDateTimeString = () => {
      const now = new Date();
      const kstDate = new Date(now.getTime() + 9 * 3600 * 1000);
      return kstDate.toISOString().slice(0, 16).replace('T', ' ');
    };

    const normalizeStoreName = (s) => {
      return String(s || '')
        .replace(/\(\s*주\s*\)|\(\s*유\s*\)|주식회사|유한회사|지점|점$|\s+|[^가-힣a-zA-Z0-9]/g, '')
        .toLowerCase();
    };

    const isSimilarStoreName = (a, b) => {
      const na = normalizeStoreName(a);
      const nb = normalizeStoreName(b);
      if (!na || !nb) return false;
      if (na === nb) return true;
      // 한쪽이 다른 쪽을 포함하면 같은 가게로 봄 ('이마트연수' ⊂ '주이마트연수').
      // 짧은 쪽이 3글자 미만이면 우연히 겹칠 수 있어 같은 가게로 보지 않음 (예: 'gs' vs 'gs칼텍스')
      const [shorter, longer] = na.length <= nb.length ? [na, nb] : [nb, na];
      return shorter.length >= 3 && longer.includes(shorter);
    };

    const normalizeDateString = (raw) => {
      const nowKstStr = getKSTDateTimeString();
      const todayYmd = nowKstStr.slice(0, 10);
      const currentYear = parseInt(todayYmd.slice(0, 4), 10);

      if (!raw && raw !== 0) return nowKstStr;

      if (typeof raw === 'number' && raw > 35000 && raw < 60000) {
        const utcDays = Math.floor(raw - 25569);
        const dateObj = new Date(utcDays * 86400 * 1000);
        return `${dateObj.toISOString().slice(0, 10)} 00:00`;
      }

      const str = String(raw)
        .trim()
        .replace('T', ' ')
        .replace(/\s*([\.\-\/])\s*/g, '$1')
        .replace(/\s+/g, ' ');

      const m4 = str.match(/^(\d{4})[\-\.\/](\d{1,2})[\-\.\/](\d{1,2})\.?(\s+(\d{1,2}):(\d{1,2}))?/);
      if (m4) {
        return `${m4[1]}-${m4[2].padStart(2, '0')}-${m4[3].padStart(2, '0')} ${(m4[5] || '00').padStart(2, '0')}:${(m4[6] || '00').padStart(2, '0')}`;
      }

      const m2 = str.match(/^(\d{2})[\-\.\/](\d{1,2})[\-\.\/](\d{1,2})\.?(\s+(\d{1,2}):(\d{1,2}))?/);
      if (m2 && parseInt(m2[2], 10) <= 12) {
        return `20${m2[1]}-${m2[2].padStart(2, '0')}-${m2[3].padStart(2, '0')} ${(m2[5] || '00').padStart(2, '0')}:${(m2[6] || '00').padStart(2, '0')}`;
      }

      const m8 = str.match(/^(20\d{2})(\d{2})(\d{2})(?:\s*(\d{2}):?(\d{2}))?/);
      if (m8) {
        return `${m8[1]}-${m8[2]}-${m8[3]} ${m8[4] || '00'}:${m8[5] || '00'}`;
      }

      const m6 = str.match(/^(\d{2})(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])$/);
      if (m6) {
        return `20${m6[1]}-${m6[2]}-${m6[3]} 00:00`;
      }

      const mShort = str.match(/^(\d{1,2})[\-\.\/](\d{1,2})(?:\s+(\d{1,2}):(\d{1,2}))?/);
      if (mShort) {
        const m = mShort[1].padStart(2, '0');
        const d = mShort[2].padStart(2, '0');
        const hh = (mShort[3] || '00').padStart(2, '0');
        const mm = (mShort[4] || '00').padStart(2, '0');
        let y = currentYear;
        if (`${y}-${m}-${d}` > todayYmd) y -= 1;
        return `${y}-${m}-${d} ${hh}:${mm}`;
      }

      return nowKstStr;
    };

    const DEFAULT_CATEGORIES = [
      { id: 'c1', name: '식비', subs: ['외식/회식', '카페/간식', '배달음식', '식재료'] },
      { id: 'c2', name: '마트/장보기', subs: ['대형마트', '편의점', '온라인쇼핑', '생필품'] },
      { id: 'c3', name: '육아/병원', subs: ['분유/기저귀', '아기용품', '소아과/병원', '약국'] },
      { id: 'c4', name: '교통/차량', subs: ['주유비', '차량정비/부품', '대중교통', '주차/톨게이트'] },
      { id: 'c5', name: '업무/경비', subs: ['부품/소모품', '회의/접대비', '도서/교육', '기타경비'] },
      { id: 'c6', name: '기타/미분류', subs: ['미분류', '통신/공과금', '구독/보험', '기타'] }
    ];

    // =====================================================================
    // ★ 가맹점 분류 규칙 — 위에서부터 먼저 맞는 규칙 하나만 적용
    //   Supabase 설정 SQL의 store_category() 함수와 같은 순서·같은 규칙이어야 합니다.
    //   (규칙을 바꾸면 SQL 쪽도 같이 바꾸세요)
    // =====================================================================
    const CLASSIFY_RULES = [
      { test: s => /주차|하이패스|톨게이트/i.test(s), cat: '교통/차량', sub: '주차/톨게이트' },
      { test: s => /택시|카카오T|코레일|KTX|SRT|철도|승차권|버스|지하철|티머니/i.test(s), cat: '교통/차량', sub: '대중교통' },
      { test: s => /주유|칼텍스|SK에너지|SK엔크린|S-OIL|오일뱅크/i.test(s), cat: '교통/차량', sub: '주유비' },
      { test: s => /편의점|GS25|(^|[^A-Z])CU([^A-Z]|$)|세븐일레븐|이마트24|미니스톱/i.test(s), cat: '마트/장보기', sub: '편의점' },
      { test: s => /배달의민족|배민|요기요|쿠팡이츠/i.test(s), cat: '식비', sub: '배달음식' },
      { test: s => /쿠팡|네이버페이|스마트스토어|11번가|G마켓|지마켓|옥션|컬리|SSG|무신사/i.test(s), cat: '마트/장보기', sub: '온라인쇼핑' },
      { test: s => /이마트|홈플러스|롯데마트|하나로|코스트코|트레이더스|다이소/i.test(s) || (/마트/.test(s) && !/스마트/.test(s)), cat: '마트/장보기', sub: '대형마트' },
      { test: s => /약국/i.test(s), cat: '육아/병원', sub: '약국' },
      { test: s => /병원|의원|소아과|치과|산부인과|내과|이비인후과|피부과|안과/i.test(s), cat: '육아/병원', sub: '소아과/병원' },
      { test: s => /스타벅스|투썸|카페|커피|베이커리|파리바게|뚜레쥬르|성심당|메가MGC|빽다방|이디야|컴포즈/i.test(s), cat: '식비', sub: '카페/간식' },
      { test: s => /한우|갈비|식당|회관|김밥|분식|국밥|돈까스|피자|치킨|버거|맥도날드|롯데리아|명가/i.test(s), cat: '식비', sub: '외식/회식' },
      { test: s => /SK브로드밴드|SK텔레콤|SKT|케이티|LG유플러스|LGU\+|통신요금|도시가스|한전|관리비/i.test(s) || /(^|[^A-Z])KT([^A-Z]|$)/i.test(s), cat: '기타/미분류', sub: '통신/공과금' }
    ];

    // 가맹점 이름으로 분류. 사용자가 그 분류를 지웠으면 '기타/미분류'(없으면 첫 분류)로
    function classifyStoreAndText(store, categories) {
      const rule = CLASSIFY_RULES.find(r => r.test(String(store || '')));
      const fallback = categories.find(c => c.name === '기타/미분류') || categories.find(c => /미분류|기타/.test(c.name)) || categories[0];
      if (rule) {
        const cat = categories.find(c => c.name === rule.cat);
        if (cat) return { category: cat.name, sub_category: cat.subs.includes(rule.sub) ? rule.sub : (cat.subs[0] || '미분류') };
      }
      return { category: fallback?.name || '기타/미분류', sub_category: fallback?.subs?.[0] || '미분류' };
    }

    // =====================================================================
    // ★ 카드 문자 파서 — Supabase 설정 SQL의 receive_sms()와 같은 규칙
    //   ① 광고·설문 문구가 없고 ② '승인/취소'가 있고 ③ 결제 일시(10/29 14:20)가 있어야 등록
    // =====================================================================
    const SMS_AD_PATTERN = /\(광고\)|무료\s*수신\s*거부|수신거부|설문|실태조사|당첨|경품|추첨/;
    const SMS_DATETIME_PATTERN = /\d{1,2}\s*[\/.\-]\s*\d{1,2}\s+\d{1,2}:\d{2}/;
    const SMS_CANCEL_PATTERN = /(승인|결제|매출|체크|할부|카드(\(\d+\))?)\s*취소|취소\s*(승인|완료|접수)/;

    function isCardApprovalSms(text) {
      return !SMS_AD_PATTERN.test(text) && /승인|취소/.test(text) && SMS_DATETIME_PATTERN.test(text);
    }

    function parseSingleSmsBlock(blockText, categories, currentUser) {
      const body = String(blockText || '');
      if (!isCardApprovalSms(body)) return null;

      const isCancel = SMS_CANCEL_PATTERN.test(body);

      const amtMatch = body.match(/([0-9][0-9,]*)\s*원/);
      if (!amtMatch) return null;
      let amount = parseInt(amtMatch[1].replace(/,/g, ''), 10);
      if (!amount || amount <= 0) return null;
      if (isCancel) amount = -amount;

      // 결제 일시: 연도가 없으면 올해, 오늘보다 미래면 작년
      let dateStr = getKSTDateTimeString();
      const dm = body.match(/(?:(20\d{2})\s*[\/.\-]\s*)?(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s+(\d{1,2}):(\d{2})/);
      if (dm) {
        const m = parseInt(dm[2], 10), d = parseInt(dm[3], 10);
        const today = getKSTDateTimeString().slice(0, 10);
        let y = dm[1] ? parseInt(dm[1], 10) : parseInt(today.slice(0, 4), 10);
        const ymd = (yy) => `${yy}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const valid = m >= 1 && m <= 12 && d >= 1 && d <= new Date(y, m, 0).getDate();
        if (valid) {
          if (!dm[1] && ymd(y) > today) y -= 1;
          dateStr = `${ymd(y)} ${dm[4].padStart(2, '0')}:${dm[5]}`;
        }
      }

      // 가맹점: 안내 줄을 걸러낸 마지막 줄, 없으면 금액 뒤 텍스트
      let store = '';
      for (const raw of body.split(/\r?\n/)) {
        const line = raw.trim().replace(/\s*(승인|취소)$/, '').trim();   // 'KTX 승차권 승인' → 'KTX 승차권'
        if (
          !line ||
          /카드|체크\s*\(|https?:\/\/|www\./.test(line) ||
          /Web발신|승인|취소|누적|일시불|할부|보낸\s*사람|발신|수신|잔액|적립|안내|문의/.test(line) ||
          /[0-9][0-9,]*\s*원/.test(line) ||
          /^[0-9+\-\s:\/.]+$/.test(line) ||
          /^[*■▶•\-]/.test(line) ||
          /^\[.*\]$/.test(line) ||
          /^[가-힣A-Za-z]{1,3}\*[가-힣A-Za-z]{0,3}님?$/.test(line) ||
          /(01[016789]|02|0[3-8][0-9]|15[0-9]{2}|16[0-9]{2}|18[0-9]{2})[-\s]?[0-9]{3,4}[-\s]?[0-9]{4}/.test(line)
        ) continue;
        store = line;
      }
      if (!store) {
        const tailMatch = body.match(/[0-9][0-9,]*\s*원([^\n]*)/);
        if (tailMatch) {
          store = tailMatch[1]
            .replace(/^\s*\(?(일시불|할부|[0-9]+개월)\)?\s*/, '')
            .replace(/^\s*(?:20\d{2}\s*[\/.\-]\s*)?\d{1,2}\s*[\/.\-]\s*\d{1,2}\s+\d{1,2}:\d{2}\s*/, '')
            .replace(/^\s*\(?(일시불|할부|[0-9]+개월)\)?\s*/, '')
            .replace(/\s*(누적|잔액|보낸\s*사람).*$/, '')
            .trim();
        }
      }
      if (!store) store = '카드결제가맹점';

      const { category, sub_category } = classifyStoreAndText(store, categories);

      return {
        id: 'sms-' + Date.now() + '-' + Math.random().toString(36).substring(2, 7),
        date: dateStr,
        store,
        category,
        sub_category,
        amount,
        tax: Math.round(amount / 11),
        payer: currentUser,
        is_business: false,
        source: isCancel ? '승인취소문자' : '카드문자',
        verified: true,
        memo: isCancel ? '승인취소 자동반영' : '문자 붙여넣기',
        items: []
      };
    }

    function splitCsvLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') inQuotes = !inQuotes;
        else if (ch === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else current += ch;
      }
      result.push(current.trim());
      return result;
    }

    const DOWNLOAD_CLEAN_HTML_FILE = () => {
      const clone = document.documentElement.cloneNode(true);
      const rootDiv = clone.querySelector('#root');
      if (rootDiv) rootDiv.innerHTML = '';
      // 실행 중에 브라우저가 덧붙인 것 제거: Babel이 변환해 넣은 스크립트(남겨두면 다시 열 때 앱이 두 번 실행됨),
      // Tailwind가 만든 스타일(다시 열면 자동으로 새로 만듦)
      clone.querySelectorAll('script:not([src]):not([type="text/babel"]):not(#sw-register)').forEach(el => el.remove());
      clone.querySelectorAll('style:not(#app-style)').forEach(el => el.remove());
      const cleanHtml = '<!DOCTYPE html>\n' + clone.outerHTML;
      const blob = new Blob([cleanHtml], { type: 'text/html;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `부부가계부_${APP_VERSION}.html`;
      link.click();
    };

    // =====================================================================
    // ▼▼▼ [내장 SQL 스크립트 붙여넣는 공간 시작] ▼▼▼
    // =====================================================================
    const EMBEDDED_SQL_SCRIPT = "-- =====================================================================\n--  부부 AI 가계부 — 설정 SQL (스키마 버전 1)\n--  Supabase SQL Editor에 붙여넣고 [Run]. 여러 번 실행해도 안전합니다.\n--  처음 설치할 때는 먼저 부부가계부_v1.1_reset.sql을 한 번 실행하세요.\n--\n--  [앞으로의 업데이트 규칙]\n--  · 이 파일은 스키마 버전 1의 기준입니다. 다음 버전은 바뀐 부분만 담은\n--    별도 업데이트 SQL로 만들고, 마지막에 schema_version 값을 올립니다.\n--  · 열(column)은 추가만 하고 삭제·이름 변경은 하지 않습니다.\n--  · receive_sms(sms_text, payer_name, fam_code) 형식은 바꾸지 않습니다.\n--  · 분류 규칙(store_category)은 앱의 CLASSIFY_RULES와 같아야 합니다.\n-- =====================================================================\n\n-- 1. 스키마 버전 -------------------------------------------------------\ncreate table if not exists public.schema_meta (\n  key   text primary key,\n  value text not null\n);\ninsert into public.schema_meta (key, value) values ('schema_version', '1')\non conflict (key) do update set value = excluded.value;\n\n-- 2. 가족 설정 ---------------------------------------------------------\n--    family_code = 'fam_' + 12자 이상 보안 코드\n--    signal_id   = 문자 도착 알림용 무작위 ID (가족 코드를 노출하지 않기 위함)\n--    allowed_senders = 받을 카드사 발신번호 목록 (비어 있으면 번호 검사 안 함)\ncreate table if not exists public.family_config (\n  family_code     text primary key check (char_length(family_code) >= 16),\n  categories      jsonb not null default '[]'::jsonb,\n  allowed_senders jsonb not null default '[]'::jsonb,\n  signal_id       text not null default replace(gen_random_uuid()::text, '-', ''),\n  updated_by      text,\n  updated_at      timestamptz not null default now()\n);\n\n-- 3. 지출 내역 (1건 = 1행) ---------------------------------------------\ncreate table if not exists public.expenses (\n  id           text primary key,\n  family_code  text not null references public.family_config(family_code)\n                 on update cascade on delete cascade,\n  date         text not null,                     -- 'YYYY-MM-DD HH:mm' (KST)\n  store        text not null,\n  category     text not null default '기타/미분류',\n  sub_category text not null default '미분류',\n  amount       integer not null,                  -- 취소는 음수\n  tax          integer not null default 0,\n  payer        text not null default '남편',\n  is_business  boolean not null default false,\n  source       text not null default '직접입력',\n  verified     boolean not null default true,\n  memo         text not null default '',\n  items        jsonb not null default '[]'::jsonb,\n  updated_by   text,\n  created_at   timestamptz not null default now()\n);\ncreate index if not exists expenses_family_date_idx on public.expenses (family_code, date desc);\n\n-- 4. 문자 도착 신호 (앱 실시간 갱신용) ---------------------------------\ncreate table if not exists public.sync_signals (\n  signal_id  text primary key,\n  updated_at timestamptz not null default now()\n);\n\n-- 5. 보안 정책: 요청 헤더 x-family-code와 같은 가족 데이터만 접근 ---------\nalter table public.schema_meta   enable row level security;\nalter table public.family_config enable row level security;\nalter table public.expenses      enable row level security;\nalter table public.sync_signals  enable row level security;\n\ndrop policy if exists \"schema_meta read\"   on public.schema_meta;\ndrop policy if exists \"family_config own\"  on public.family_config;\ndrop policy if exists \"expenses own\"       on public.expenses;\ndrop policy if exists \"sync_signals read\"  on public.sync_signals;\n\ncreate policy \"schema_meta read\" on public.schema_meta for select using (true);\n\ncreate policy \"family_config own\" on public.family_config for all\n  using      (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''))\n  with check (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''));\n\ncreate policy \"expenses own\" on public.expenses for all\n  using      (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''))\n  with check (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''));\n\n-- 신호 테이블은 읽기만 허용 (쓰기는 receive_sms 함수만)\ncreate policy \"sync_signals read\" on public.sync_signals for select using (true);\n\ndo $$\nbegin\n  if exists (select 1 from pg_publication where pubname = 'supabase_realtime')\n     and not exists (select 1 from pg_publication_tables\n                     where pubname = 'supabase_realtime' and tablename = 'sync_signals') then\n    alter publication supabase_realtime add table public.sync_signals;\n  end if;\nend $$;\n\n-- 6. 가맹점 분류 규칙 (앱의 CLASSIFY_RULES와 같은 순서·같은 규칙) ---------\ncreate or replace function public.store_category(p_store text)\nreturns text[]\nlanguage sql immutable\nas $$\n  select case\n    when p_store ~* '주차|하이패스|톨게이트'                                        then array['교통/차량','주차/톨게이트']\n    when p_store ~* '택시|카카오T|코레일|KTX|SRT|철도|승차권|버스|지하철|티머니'      then array['교통/차량','대중교통']\n    when p_store ~* '주유|칼텍스|SK에너지|SK엔크린|S-OIL|오일뱅크'                  then array['교통/차량','주유비']\n    when p_store ~* '편의점|GS25|(^|[^A-Z])CU([^A-Z]|$)|세븐일레븐|이마트24|미니스톱' then array['마트/장보기','편의점']\n    when p_store ~* '배달의민족|배민|요기요|쿠팡이츠'                               then array['식비','배달음식']\n    when p_store ~* '쿠팡|네이버페이|스마트스토어|11번가|G마켓|지마켓|옥션|컬리|SSG|무신사' then array['마트/장보기','온라인쇼핑']\n    when p_store ~* '이마트|홈플러스|롯데마트|하나로|코스트코|트레이더스|다이소'\n      or (p_store ~ '마트' and p_store !~ '스마트')                                then array['마트/장보기','대형마트']\n    when p_store ~* '약국'                                                         then array['육아/병원','약국']\n    when p_store ~* '병원|의원|소아과|치과|산부인과|내과|이비인후과|피부과|안과'      then array['육아/병원','소아과/병원']\n    when p_store ~* '스타벅스|투썸|카페|커피|베이커리|파리바게|뚜레쥬르|성심당|메가MGC|빽다방|이디야|컴포즈' then array['식비','카페/간식']\n    when p_store ~* '한우|갈비|식당|회관|김밥|분식|국밥|돈까스|피자|치킨|버거|맥도날드|롯데리아|명가' then array['식비','외식/회식']\n    when p_store ~* 'SK브로드밴드|SK텔레콤|SKT|케이티|LG유플러스|LGU\\+|통신요금|도시가스|한전|관리비'\n      or p_store ~* '(^|[^A-Z])KT([^A-Z]|$)'                                       then array['기타/미분류','통신/공과금']\n    else array['기타/미분류','미분류']\n  end\n$$;\n\n-- 7. 문자 자동 등록 (SMS 포워더·아이폰 단축어가 호출) --------------------\n--    sms_text에 '보낸사람 : 번호' 줄이 있으면 발신번호 목록과 대조합니다.\ncreate or replace function public.receive_sms(\n  sms_text   text,\n  payer_name text default '남편',\n  fam_code   text default ''\n)\nreturns json\nlanguage plpgsql\nsecurity definer\nset search_path = public\nas $$\ndeclare\n  cfg       public.family_config%rowtype;\n  body      text := coalesce(sms_text, '');\n  sender    text;\n  is_cancel boolean;\n  amt       integer;\n  dm        text[];\n  y int; m int; d int;\n  kst_now   timestamp := now() at time zone 'Asia/Seoul';\n  d_str     text;\n  v_store   text := '';\n  ln        text;\n  tail      text;\n  cat       text[];\n  new_id    text;\nbegin\n  select * into cfg from public.family_config where family_code = coalesce(fam_code, '');\n  if not found then\n    return json_build_object('status', 'error', 'reason', '등록되지 않은 가족 코드');\n  end if;\n\n  -- (1) 발신번호 검사\n  sender := regexp_replace(coalesce((regexp_match(body, '보낸\\s*사람\\s*[:：]?\\s*([0-9][0-9\\- ]{6,})'))[1], ''), '[^0-9]', '', 'g');\n  if jsonb_array_length(cfg.allowed_senders) > 0 and sender <> ''\n     and not exists (select 1 from jsonb_array_elements_text(cfg.allowed_senders) s\n                     where regexp_replace(s, '[^0-9]', '', 'g') = sender) then\n    return json_build_object('status', 'ignored', 'reason', '등록되지 않은 발신번호', 'sender', sender);\n  end if;\n\n  -- (2) 카드 승인/취소 문자인지 검사: 광고 문구 없음 + '승인/취소' + 결제 일시\n  if body ~ '\\(광고\\)|무료\\s*수신\\s*거부|수신거부|설문|실태조사|당첨|경품|추첨'\n     or body !~ '승인|취소'\n     or body !~ '\\d{1,2}\\s*[/.\\-]\\s*\\d{1,2}\\s+\\d{1,2}:\\d{2}' then\n    return json_build_object('status', 'ignored', 'reason', '카드 승인 문자 아님');\n  end if;\n\n  is_cancel := body ~ '(승인|결제|매출|체크|할부|카드(\\(\\d+\\))?)\\s*취소|취소\\s*(승인|완료|접수)';\n\n  -- (3) 금액\n  amt := nullif(replace((regexp_match(body, '([0-9][0-9,]*)\\s*원'))[1], ',', ''), '')::integer;\n  if amt is null or amt <= 0 then\n    return json_build_object('status', 'ignored', 'reason', '금액 없음');\n  end if;\n  if is_cancel then amt := -amt; end if;\n\n  -- (4) 결제 일시 (연도 없으면 올해, 오늘보다 미래면 작년)\n  dm := regexp_match(body, '(?:(20\\d{2})\\s*[/.\\-]\\s*)?(\\d{1,2})\\s*[/.\\-]\\s*(\\d{1,2})\\s+(\\d{1,2}):(\\d{2})');\n  begin\n    m := dm[2]::int; d := dm[3]::int;\n    y := coalesce(dm[1]::int, extract(year from kst_now)::int);\n    if dm[1] is null and make_date(y, m, d) > kst_now::date then y := y - 1; end if;\n    d_str := to_char(make_date(y, m, d), 'YYYY-MM-DD') || ' ' || lpad(dm[4], 2, '0') || ':' || dm[5];\n  exception when others then\n    d_str := to_char(kst_now, 'YYYY-MM-DD HH24:MI');\n  end;\n\n  -- (5) 가맹점: 안내 줄을 걸러낸 마지막 줄, 없으면 금액 뒤 텍스트\n  foreach ln in array string_to_array(replace(body, chr(13), ''), chr(10)) loop\n    ln := btrim(regexp_replace(btrim(ln), '\\s*(승인|취소)$', ''));   -- 'KTX 승차권 승인' → 'KTX 승차권'\n    continue when ln = ''\n      or ln ~ '카드|체크\\s*\\(|https?://|www\\.'\n      or ln ~ 'Web발신|승인|취소|누적|일시불|할부|보낸\\s*사람|발신|수신|잔액|적립|안내|문의'\n      or ln ~ '[0-9][0-9,]*\\s*원'\n      or ln ~ '^[0-9+\\-\\s:/.]+$'\n      or ln ~ '^[*■▶•\\-]'\n      or ln ~ '^\\[.*\\]$'\n      or ln ~ '^[가-힣A-Za-z]{1,3}\\*[가-힣A-Za-z]{0,3}님?$'\n      or ln ~ '(01[016789]|02|0[3-8][0-9]|15[0-9]{2}|16[0-9]{2}|18[0-9]{2})[-\\s]?[0-9]{3,4}[-\\s]?[0-9]{4}';\n    v_store := ln;\n  end loop;\n\n  if v_store = '' then\n    tail := (regexp_match(body, '[0-9][0-9,]*\\s*원([^\\n]*)'))[1];\n    if tail is not null then\n      tail := regexp_replace(tail, '^\\s*\\(?(일시불|할부|[0-9]+개월)\\)?\\s*', '');\n      tail := regexp_replace(tail, '^\\s*(?:20\\d{2}\\s*[/.\\-]\\s*)?\\d{1,2}\\s*[/.\\-]\\s*\\d{1,2}\\s+\\d{1,2}:\\d{2}\\s*', '');\n      tail := regexp_replace(tail, '^\\s*\\(?(일시불|할부|[0-9]+개월)\\)?\\s*', '');\n      tail := regexp_replace(tail, '\\s*(누적|잔액|보낸\\s*사람).*$', '');\n      v_store := btrim(tail);\n    end if;\n  end if;\n  if v_store = '' then v_store := '카드결제가맹점'; end if;\n\n  -- (6) 재전송 중복 방지\n  if exists (select 1 from public.expenses\n             where family_code = cfg.family_code and date = d_str and amount = amt and expenses.store = v_store) then\n    return json_build_object('status', 'duplicate_ignored', 'store', v_store, 'amount', amt, 'date', d_str);\n  end if;\n\n  -- (7) 저장 + 알림 신호\n  cat := public.store_category(v_store);\n  new_id := 'auto-' || replace(gen_random_uuid()::text, '-', '');\n  insert into public.expenses (id, family_code, date, store, category, sub_category,\n                               amount, tax, payer, source, memo, updated_by)\n  values (new_id, cfg.family_code, d_str, v_store, cat[1], cat[2],\n          amt, round(amt / 11.0), coalesce(nullif(payer_name, ''), '남편'),\n          case when is_cancel then '승인취소문자' else '자동문자수신' end,\n          '문자 자동등록' || case when sender <> '' then ' · ' || sender else '' end,\n          'AUTO_WEBHOOK');\n\n  insert into public.sync_signals (signal_id, updated_at) values (cfg.signal_id, now())\n  on conflict (signal_id) do update set updated_at = now();\n\n  return json_build_object('status', 'success', 'store', v_store, 'amount', amt, 'date', d_str,\n                           'category', cat[1], 'sub_category', cat[2]);\nend;\n$$;\n\n-- 8. 가족 코드 변경 (내역은 외래키 cascade로 함께 이동) --------------------\ncreate or replace function public.migrate_family_code(\n  old_code  text,\n  new_code  text,\n  device_id text default 'APP'\n)\nreturns json\nlanguage plpgsql\nsecurity definer\nset search_path = public\nas $$\ndeclare\n  moved int;\nbegin\n  if coalesce(current_setting('request.headers', true)::json->>'x-family-code', '') <> old_code then\n    return json_build_object('status', 'error', 'reason', '현재 가족 코드로 접속한 상태에서만 바꿀 수 있습니다.');\n  end if;\n  if new_code is null or new_code !~ '^fam_.{12,}$' then\n    return json_build_object('status', 'error', 'reason', '새 코드는 12자 이상이어야 합니다.');\n  end if;\n  if exists (select 1 from public.family_config where family_code = new_code) then\n    return json_build_object('status', 'error', 'reason', '이미 사용 중인 코드입니다. 다른 코드를 만들어 주세요.');\n  end if;\n  if not exists (select 1 from public.family_config where family_code = old_code) then\n    return json_build_object('status', 'error', 'reason', '현재 가족 정보를 찾을 수 없습니다.');\n  end if;\n\n  select count(*) into moved from public.expenses where family_code = old_code;\n\n  update public.family_config\n     set family_code = new_code,\n         signal_id   = replace(gen_random_uuid()::text, '-', ''),\n         updated_by  = device_id,\n         updated_at  = now()\n   where family_code = old_code;\n\n  return json_build_object('status', 'success', 'moved_count', moved);\nend;\n$$;\n\nrevoke all on function public.receive_sms(text, text, text) from public;\nrevoke all on function public.migrate_family_code(text, text, text) from public;\ngrant execute on function public.receive_sms(text, text, text) to anon, authenticated;\ngrant execute on function public.migrate_family_code(text, text, text) to anon, authenticated;\ngrant execute on function public.store_category(text) to anon, authenticated;\n";

          '[문자알림] 가족 코드 대신 무작위 신호 ID로 우리 가족 문자만 실시간 반영',
          '[취소상계] 카드사 파일의 취소 건은 60일 안의 짝 승인 건을 찾아 한 번만 상계',
          '[중복판정] 가게 이름 앞 두 글자 비교 제거 (GS25 ≠ GS칼텍스, 스타벅스 ≠ 스타필드)',
          '[분류] 쿠팡이츠는 배달음식, 링크·카드명 줄은 가맹점에서 제외, 분류는 가맹점 이름 기준'
        ]
      },
      {
        version: 'v1.0',
        date: '2026-10-29',
        title: '이전 개발 버전 (v0.1 ~ v1.0)',
        changes: ['v1.1부터 호환되지 않음. 기록은 이전 파일 참고']
      }
    ];
    // =====================================================================
    // ▲▲▲ [버전 히스토리 붙여넣는 공간 끝] ▲▲▲
    // =====================================================================

    function App() {
      const [familyPass, setFamilyPass] = useState(() => {
        try { return localStorage.getItem(STORAGE_KEY_PASS) || ''; } catch (e) { return ''; }
      });
      const [isUnlocked, setIsUnlocked] = useState(() => {
        try { return (localStorage.getItem(STORAGE_KEY_PASS) || '').length >= MIN_CODE_LENGTH; } catch (e) { return false; }
      });
      const [passInput, setPassInput] = useState('');

      const [showCodeMigrateModal, setShowCodeMigrateModal] = useState(false);
      const [newPassTarget, setNewPassTarget] = useState('');
      const [isMigrating, setIsMigrating] = useState(false);

      const [expenses, setExpenses] = useState([]);
      const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
      const [activeTab, setActiveTab] = useState('list');
      const [currentUser, setCurrentUser] = useState('남편');
      const [filterUser, setFilterUser] = useState('전체');
      const [selectedMonth, setSelectedMonth] = useState(() => getKSTDateTimeString().slice(0, 7));

      const [syncStatus, setSyncStatus] = useState('connecting');
      const [lastSyncTime, setLastSyncTime] = useState('');
      const [errorDetail, setErrorDetail] = useState('');

      const [showVersionModal, setShowVersionModal] = useState(false);
      const [showWebhookModal, setShowWebhookModal] = useState(false);
      const [toastMsg, setToastMsg] = useState('');

      const [editingId, setEditingId] = useState(null);
      const [editForm, setEditForm] = useState({ store: '', amount: 0, date: '', memo: '', payer: '남편' });

      const [isScanning, setIsScanning] = useState(false);
      const [scanResult, setScanResult] = useState(null);
      const [smsText, setSmsText] = useState('');

      const [newCatName, setNewCatName] = useState('');
      const [selectedCatId, setSelectedCatId] = useState('c1');
      const [newSubName, setNewSubName] = useState('');

      // 문자 알림 ID(가족 코드 대신 쓰는 무작위 값)와 카드사 발신번호 목록
      const [signalId, setSignalId] = useState('');
      const [allowedSenders, setAllowedSenders] = useState([]);
      const [senderInput, setSenderInput] = useState('');
      const [dbSchemaVersion, setDbSchemaVersion] = useState(null);

      // 안드로이드 크롬: 설치 가능하면 이벤트를 받아 두었다가 [📲앱 설치] 버튼으로 띄움
      const [installPrompt, setInstallPrompt] = useState(null);
      useEffect(() => {
        const onPrompt = (e) => { e.preventDefault(); setInstallPrompt(e); };
        const onInstalled = () => setInstallPrompt(null);
        window.addEventListener('beforeinstallprompt', onPrompt);
        window.addEventListener('appinstalled', onInstalled);
        return () => {
          window.removeEventListener('beforeinstallprompt', onPrompt);
          window.removeEventListener('appinstalled', onInstalled);
        };
      }, []);
      const handleInstall = async () => {
        if (!installPrompt) return;
        installPrompt.prompt();
        await installPrompt.userChoice.catch(() => null);
        setInstallPrompt(null);
      };

      const familyCode = `fam_${familyPass}`;
      const supabaseClient = useMemo(() => createSecuredClient(familyCode), [familyCode]);
      const syncTimerRef = useRef(null);
      const broadcastChannelRef = useRef(null);

      // 이전 알림의 타이머가 새 알림을 일찍 지우지 않도록 타이머를 하나만 유지
      const toastTimerRef = useRef(null);
      const showToast = (msg) => {
        setToastMsg(msg);
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        toastTimerRef.current = setTimeout(() => setToastMsg(''), 3800);
      };

      // ★ content:// (로컬 파일) 환경에서도 100% 작동하는 클립보드 복사 함수 (폴백 지원)
      const copyToClipboard = (text, label) => {
        const fallbackCopy = (str) => {
          try {
            const ta = document.createElement('textarea');
            ta.value = str;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast(`📋 [${label}] 복사 완료!`);
          } catch (err) {
            showToast('⚠️ 복사에 실패했습니다. 직접 선택해 복사해주세요.');
          }
        };

        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text)
            .then(() => showToast(`📋 [${label}] 복사 완료!`))
            .catch(() => fallbackCopy(text));
        } else {
          fallbackCopy(text);
        }
      };

      const moveMonth = (delta) => {
        if (selectedMonth === 'ALL') {
          setSelectedMonth(getKSTDateTimeString().slice(0, 7));
          return;
        }
        const [y, m] = selectedMonth.split('-').map(Number);
        const d = new Date(y, m - 1 + delta, 1);
        setSelectedMonth(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
      };

      const notifyPartner = () => {
        if (broadcastChannelRef.current) {
          broadcastChannelRef.current.send({
            type: 'broadcast',
            event: 'family_sync',
            payload: { sender: MY_DEVICE_ID, time: Date.now() }
          });
        }
      };

      // 1. 클라우드 데이터 불러오기
      //    순서: DB 스키마 버전 확인 → 가족 설정 확인(없으면 자동 생성하지 않고 확인 요청) → 내역 전부(1,000건씩)
      const fetchFromCloud = async (options = { showSpinner: false, showSuccessToast: false }) => {
        try {
          if (options.showSpinner) setSyncStatus('connecting');

          const { data: meta, error: metaErr } = await supabaseClient
            .from('schema_meta').select('value').eq('key', 'schema_version').maybeSingle();
          if (metaErr) throw metaErr;
          const ver = parseInt(meta?.value || '0', 10);
          setDbSchemaVersion(ver);
          if (ver < REQUIRED_SCHEMA_VERSION) {
            setSyncStatus('schema_old');
            setErrorDetail(`DB 스키마 버전 ${ver} → 앱은 ${REQUIRED_SCHEMA_VERSION} 필요. [⚡자동연동/SQL]의 설정 SQL을 실행해주세요.`);
            return;
          }

          const { data: cfgData, error: cfgErr } = await supabaseClient
            .from('family_config').select('*').eq('family_code', familyCode).maybeSingle();
          if (cfgErr) throw cfgErr;
          if (!cfgData) {
            // 코드 오타로 빈 가계부가 따로 생기지 않도록, 새로 만들지 사용자에게 묻는다
            setExpenses([]);
            setSyncStatus('no_family');
            setErrorDetail('');
            return;
          }

          let allExpenses = [];
          const pageSize = 1000;
          for (let from = 0; ; from += pageSize) {
            const { data: batch, error: expErr } = await supabaseClient
              .from('expenses').select('*').eq('family_code', familyCode)
              .order('date', { ascending: false }).order('id', { ascending: true })
              .range(from, from + pageSize - 1);
            if (expErr) throw expErr;
            allExpenses = allExpenses.concat(batch || []);
            if (!batch || batch.length < pageSize) break;
          }

          setExpenses(allExpenses);
          try { localStorage.setItem(STORAGE_KEY_CACHE, JSON.stringify(allExpenses)); } catch (e) {}

          const cats = Array.isArray(cfgData.categories) && cfgData.categories.length > 0 ? cfgData.categories : DEFAULT_CATEGORIES;
          setCategories(cats);
          try { localStorage.setItem(STORAGE_KEY_CATS, JSON.stringify(cats)); } catch (e) {}
          setAllowedSenders(Array.isArray(cfgData.allowed_senders) ? cfgData.allowed_senders : []);
          setSignalId(cfgData.signal_id || '');

          setSyncStatus('connected');
          setErrorDetail('');
          setLastSyncTime(new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
          if (options.showSuccessToast) showToast(`☁️ 총 ${allExpenses.length}건 동기화 완료!`);
        } catch (err) {
          const msg = err.message || '';
          if (err.code === '42P01' || err.code === 'PGRST205' || /relation|does not exist|schema cache/i.test(msg)) {
            setSyncStatus('table_missing');
            setErrorDetail('Supabase에 테이블이 없습니다. [⚡자동연동/SQL]의 초기화·설정 SQL을 실행해주세요.');
          } else {
            setSyncStatus('network_error');
            setErrorDetail(msg || '네트워크 연결을 확인해주세요.');
          }
          try {
            const cached = localStorage.getItem(STORAGE_KEY_CACHE);
            if (cached) setExpenses(JSON.parse(cached));
          } catch (e) {}
        }
      };

      // 이 코드로 새 가계부 만들기 (no_family 상태에서 사용자가 확인했을 때만)
      const createFamily = async () => {
        if (familyPass.length < MIN_CODE_LENGTH) return showToast(`⚠️ 가족 코드는 ${MIN_CODE_LENGTH}자 이상이어야 합니다.`);
        const { error } = await supabaseClient.from('family_config').insert({
          family_code: familyCode,
          categories: DEFAULT_CATEGORIES,
          updated_by: MY_DEVICE_ID
        });
        if (error) return showToast('⚠️ 가계부 생성 실패: ' + error.message);
        showToast('🎉 새 가계부를 만들었습니다. 배우자 폰에도 같은 코드를 입력하세요.');
        fetchFromCloud({ showSpinner: true });
      };

      // 2. 실시간 구독
      //    A. 부부 앱끼리: Broadcast 신호 (RLS 영향 없음)
      //    B. 문자 자동 등록: sync_signals에서 우리 가족 signal_id 행만 구독
      useEffect(() => {
        if (!isUnlocked) return;
        fetchFromCloud({ showSpinner: true, showSuccessToast: false });

        const onVisible = () => { if (document.visibilityState === 'visible') fetchFromCloud(); };
        document.addEventListener('visibilitychange', onVisible);
        return () => document.removeEventListener('visibilitychange', onVisible);
      }, [isUnlocked, familyCode]);

      useEffect(() => {
        if (!isUnlocked) return;

        const triggerDebouncedSync = (msg) => {
          if (syncTimerRef.current) clearTimeout(syncTimerRef.current);
          syncTimerRef.current = setTimeout(() => {
            fetchFromCloud({ showSpinner: false, showSuccessToast: false });
            if (msg) showToast(msg);
          }, 250);
        };

        let channel = supabaseClient
          .channel(`room:${familyCode}`)
          .on('broadcast', { event: 'family_sync' }, (payload) => {
            if (payload.payload?.sender !== MY_DEVICE_ID) {
              triggerDebouncedSync('🔄 상대방 스마트폰에서 변경한 내역이 실시간 반영되었습니다!');
            }
          });
        if (signalId) {
          channel = channel.on(
            'postgres_changes',
            { event: '*', schema: 'public', table: 'sync_signals', filter: `signal_id=eq.${signalId}` },
            () => triggerDebouncedSync('📩 새 카드 승인 문자가 자동 등록되었습니다!')
          );
        }
        channel.subscribe();
        broadcastChannelRef.current = channel;

        return () => {
          if (syncTimerRef.current) clearTimeout(syncTimerRef.current);
          supabaseClient.removeChannel(channel);
        };
      }, [isUnlocked, familyCode, signalId]);

      const ensureConnected = () => {
        if (syncStatus !== 'connected') {
          showToast('⚠️ 클라우드 미연결 상태입니다.');
          return false;
        }
        return true;
      };

      // 3. 가족 코드 변경: 서버 함수(migrate_family_code)로만 처리. 실패하면 아무것도 옮기지 않음
      const handleMigrateFamilyCode = async () => {
        const cleanNewPass = newPassTarget.trim();
        if (cleanNewPass.length < MIN_CODE_LENGTH) {
          return showToast(`⚠️ 새 보안 코드는 ${MIN_CODE_LENGTH}자 이상이어야 합니다.`);
        }
        if (cleanNewPass === familyPass) return showToast('ℹ️ 현재 사용 중인 코드와 같습니다.');
        if (!ensureConnected()) return;

        setIsMigrating(true);
        const newFamCode = `fam_${cleanNewPass}`;
        try {
          const { data: res, error } = await supabaseClient.rpc('migrate_family_code', {
            old_code: familyCode,
            new_code: newFamCode,
            device_id: MY_DEVICE_ID
          });
          if (error) throw error;
          if (!res || res.status !== 'success') {
            return showToast('⚠️ 코드 변경 실패: ' + (res?.reason || '알 수 없는 오류'));
          }
          try { localStorage.setItem(STORAGE_KEY_PASS, cleanNewPass); } catch (e) {}
          setFamilyPass(cleanNewPass);
          setShowCodeMigrateModal(false);
          window.alert(
            `✅ ${res.moved_count}건의 내역을 새 코드로 옮겼습니다.\n\n` +
            `⚠️ 꼭 해주세요\n` +
            `1. 배우자 폰: [🔒코드변경] → [다른 코드로 접속]에서 새 코드 입력\n` +
            `2. 문자 포워더·아이폰 단축어의 fam_code를 "${newFamCode}"로 변경\n` +
            `   (이전 코드로 오는 문자는 이제 등록되지 않습니다)`
          );
        } catch (err) {
          showToast('⚠️ 코드 변경 실패: ' + (err.message || err));
        } finally {
          setIsMigrating(false);
        }
      };

      const isDuplicateExpense = (candidate, existingList) => {
        const candNorm = normalizeDateString(candidate.date);
        const candDay = candNorm.slice(0, 10);
        const candTime = candNorm.slice(11, 16);

        return existingList.some(ex => {
          if (ex.amount !== candidate.amount) return false;

          const exNorm = normalizeDateString(ex.date);
          const exDay = exNorm.slice(0, 10);
          const exTime = exNorm.slice(11, 16);
          if (exDay !== candDay) return false;

          // 둘 다 결제 시각이 있으면: 같은 날·같은 금액·같은 분이면 가게 이름 표기가 달라도 중복
          // (문자 'KTX 승차권' vs 카드사 파일 '코레일(KTX)' 같은 경우)
          if (candTime !== '00:00' && exTime !== '00:00') return candTime === exTime;

          // 한쪽이라도 시각이 없으면(카드사 파일 등) 가게 이름이 비슷할 때만 중복
          return isSimilarStoreName(candidate.store, ex.store);
        });
      };

      const insertExpenseRows = async (rowsArray) => {
        if (!ensureConnected()) return false;
        const rowsWithMeta = rowsArray.map(r => ({
          ...r,
          date: normalizeDateString(r.date),
          family_code: familyCode,
          updated_by: MY_DEVICE_ID
        }));

        const chunkSize = 500;
        for (let i = 0; i < rowsWithMeta.length; i += chunkSize) {
          const chunk = rowsWithMeta.slice(i, i + chunkSize);
          const { error } = await supabaseClient.from('expenses').insert(chunk);
          if (error) {
            showToast('⚠️ 저장 실패: ' + error.message);
            return false;
          }
        }

        setExpenses(prev => [...rowsWithMeta, ...prev].sort((a, b) => b.date.localeCompare(a.date)));
        notifyPartner();
        return true;
      };

      const updateExpenseRow = async (id, patch) => {
        if (!ensureConnected()) return false;
        const patchWithMeta = { ...patch, updated_by: MY_DEVICE_ID };
        if (patchWithMeta.date) patchWithMeta.date = normalizeDateString(patchWithMeta.date);

        const { error } = await supabaseClient
          .from('expenses')
          .update(patchWithMeta)
          .eq('id', id)
          .eq('family_code', familyCode);

        if (error) {
          showToast('⚠️ 수정 실패: ' + error.message);
          return false;
        }
        setExpenses(prev => prev.map(e => e.id === id ? { ...e, ...patchWithMeta } : e));
        notifyPartner();
        return true;
      };

      const deleteExpenseRow = async (item) => {
        if (!ensureConnected()) return false;
        if (!window.confirm(`[${item.store} - ${item.amount.toLocaleString()}원]\n정말 삭제하시겠습니까?`)) return false;

        const { error } = await supabaseClient
          .from('expenses')
          .delete()
          .eq('id', item.id)
          .eq('family_code', familyCode);

        if (error) {
          showToast('⚠️ 삭제 실패: ' + error.message);
          return false;
        }
        setExpenses(prev => prev.filter(e => e.id !== item.id));
        notifyPartner();
        showToast('🗑️ 삭제되었습니다.');
        return true;
      };

      const saveEditForm = async (id) => {
        const amt = Number(editForm.amount) || 0;
        const ok = await updateExpenseRow(id, {
          store: editForm.store.trim() || '미상가맹점',
          amount: amt,
          tax: Math.round(amt / 11),
          date: normalizeDateString(editForm.date),
          memo: editForm.memo.trim(),
          payer: editForm.payer
        });
        if (ok) {
          setEditingId(null);
          showToast('✏️ 내역이 수정되었습니다!');
        }
      };

      const saveCategories = async (newCats) => {
        if (!ensureConnected()) return false;
        const { error } = await supabaseClient.from('family_config').update({
          categories: newCats,
          updated_by: MY_DEVICE_ID,
          updated_at: new Date().toISOString()
        }).eq('family_code', familyCode);
        if (error) {
          showToast('⚠️ 카테고리 저장 실패: ' + error.message);
          return false;
        }
        setCategories(newCats);
        try { localStorage.setItem(STORAGE_KEY_CATS, JSON.stringify(newCats)); } catch (e) {}
        notifyPartner();
        return true;
      };

      // 카드사 발신번호 목록 저장 (비어 있으면 receive_sms가 번호 검사를 하지 않음)
      const saveAllowedSenders = async (list) => {
        if (!ensureConnected()) return false;
        const { error } = await supabaseClient.from('family_config').update({
          allowed_senders: list,
          updated_by: MY_DEVICE_ID,
          updated_at: new Date().toISOString()
        }).eq('family_code', familyCode);
        if (error) {
          showToast('⚠️ 발신번호 저장 실패: ' + error.message);
          return false;
        }
        setAllowedSenders(list);
        notifyPartner();
        return true;
      };

      const handleAddSender = async () => {
        const digits = senderInput.replace(/[^0-9]/g, '');
        if (digits.length < 7) return showToast('⚠️ 발신번호를 숫자로 입력해주세요 (예: 1544-7000).');
        if (allowedSenders.some(x => String(x).replace(/[^0-9]/g, '') === digits)) return showToast('ℹ️ 이미 등록된 번호입니다.');
        if (await saveAllowedSenders([...allowedSenders, senderInput.trim()])) {
          setSenderInput('');
          showToast('✅ 발신번호가 등록되었습니다.');
        }
      };

      const handleAddCategory = async () => {
        if (!newCatName.trim()) return;
        const newCat = { id: 'c-' + Date.now(), name: newCatName.trim(), subs: ['기타'] };
        const updated = [...categories, newCat];
        const ok = await saveCategories(updated);
        if (ok) {
          setSelectedCatId(newCat.id);
          setNewCatName('');
          showToast(`✅ [${newCat.name}] 대분류 추가됨`);
        }
      };

      const handleDeleteCategory = async (id, name) => {
        if (categories.length <= 1) return showToast('⚠️ 최소 1개는 유지해야 합니다.');
        if (!window.confirm(`[${name}] 대분류를 삭제하시겠습니까?`)) return;
        const updated = categories.filter(c => c.id !== id);
        const ok = await saveCategories(updated);
        if (ok) setSelectedCatId(updated[0].id);
      };

      const handleAddSubCategory = async () => {
        if (!newSubName.trim()) return;
        const updated = categories.map(c => {
          if (c.id === selectedCatId && !c.subs.includes(newSubName.trim())) {
            return { ...c, subs: [...c.subs, newSubName.trim()] };
          }
          return c;
        });
        const ok = await saveCategories(updated);
        if (ok) setNewSubName('');
      };

      const handleDeleteSubCategory = async (catId, subName) => {
        if (!window.confirm(`[${subName}] 세부 카테고리를 삭제하시겠습니까?`)) return;
        const updated = categories.map(c => {
          if (c.id === catId) return { ...c, subs: c.subs.filter(s => s !== subName) };
          return c;
        });
        await saveCategories(updated);
      };

      const handleScan = (type) => {
        setIsScanning(true);
        setScanResult(null);
        setTimeout(() => {
          setIsScanning(false);
          const todayKST = getKSTDateTimeString().slice(0, 10);
          let mock;
          if (type === 'mart') {
            mock = {
              date: `${todayKST} 14:20`,
              store: '이마트 연수점',
              category: '마트/장보기',
              sub_category: '대형마트',
              amount: 50000,
              tax: 4545,
              is_business: false,
              memo: '주말 장보기',
              items: [
                { name: '유기농 우유 900ml', price: 4500 },
                { name: '한돈 삼겹살 600g', price: 18500 },
                { name: '아기 물티슈 기획팩', price: 15000 },
                { name: '제주 감귤 1박스', price: 12000 }
              ]
            };
          } else {
            mock = {
              date: getKSTDateTimeString(),
              store: '투썸플레이스 송도점',
              category: '식비',
              sub_category: '카페/간식',
              amount: 16500,
              tax: 1500,
              is_business: true,
              memo: '미팅 다과비',
              items: [
                { name: '아메리카노 2잔', price: 9000 },
                { name: '생크림 케이크', price: 7500 }
              ]
            };
          }
          mock.verified = true;
          setScanResult(mock);
        }, 500);
      };

      const confirmScan = async () => {
        if (!scanResult) return;
        const scanDay = scanResult.date.slice(0, 10);
        const dupItem = expenses.find(
          e => e.amount === scanResult.amount &&
               ['카드문자', '자동문자수신', 'CSV일괄등록', '엑셀일괄등록'].includes(e.source) &&
               (!e.items || e.items.length === 0) &&
               (e.date || '').slice(0, 10) === scanDay
        );

        if (dupItem) {
          const ok = await updateExpenseRow(dupItem.id, {
            store: scanResult.store,
            category: scanResult.category,
            sub_category: scanResult.sub_category,
            items: scanResult.items,
            source: '영수증+내역병합',
            memo: (dupItem.memo || '') + ' (영수증 품목 병합)'
          });
          if (ok) {
            showToast('✨ 동일 날짜·금액의 기존 내역에 영수증 품목이 병합되었습니다!');
            setScanResult(null);
            setActiveTab('list');
          }
        } else {
          const ok = await insertExpenseRows([{
            id: 'exp-' + Date.now(),
            ...scanResult,
            payer: currentUser,
            source: '영수증스캔'
          }]);
          if (ok) {
            showToast('☁️ 영수증 내역이 등록되었습니다.');
            setScanResult(null);
            setActiveTab('list');
          }
        }
      };

      const handleBulkParseSMS = async () => {
        if (!smsText.trim()) return;
        const rawBlocks = smsText
          .split(/(?=\[Web발신\])|\n\s*\n/)
          .map(b => b.trim())
          .filter(Boolean);

        const parsedRows = [];
        let duplicateCount = 0;
        let spamIgnoredCount = 0;

        for (const block of rawBlocks) {
          const parsed = parseSingleSmsBlock(block, categories, currentUser);
          if (parsed) {
            if (isDuplicateExpense(parsed, [...expenses, ...parsedRows])) {
              duplicateCount++;
            } else {
              parsedRows.push(parsed);
            }
          } else {
            spamIgnoredCount++;
          }
        }

        if (parsedRows.length === 0) {
          if (duplicateCount > 0) return showToast(`ℹ️ 이미 등록된 중복 내역(${duplicateCount}건)입니다.`);
          return showToast('⚠️ 카드 결제 승인 문자가 없습니다 (광고/설문/비결제 문자 자동 무시됨).');
        }

        const ok = await insertExpenseRows(parsedRows);
        if (ok) {
          setSmsText('');
          const extra = [
            duplicateCount > 0 ? `중복 ${duplicateCount}건 제외` : '',
            spamIgnoredCount > 0 ? `광고/설문 ${spamIgnoredCount}건 차단` : ''
          ].filter(Boolean).join(', ');
          showToast(`🎉 총 ${parsedRows.length}건 등록 완료!${extra ? ` (${extra})` : ''}`);
          setActiveTab('list');
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const fileName = file.name.toLowerCase();

        const reader = new FileReader();
        reader.onload = async (evt) => {
          const buffer = evt.target.result;
          let rows2D = [];

          try {
            if (fileName.endsWith('.xls') || fileName.endsWith('.xlsx')) {
              const uint8 = new Uint8Array(buffer);
              const sampleText = new TextDecoder('utf-8').decode(uint8.slice(0, 500));
              if (/<html|<table/i.test(sampleText)) {
                let htmlStr = new TextDecoder('utf-8').decode(uint8);
                if (htmlStr.includes('\uFFFD')) htmlStr = new TextDecoder('euc-kr').decode(uint8);
                const wb = window.XLSX.read(htmlStr, { type: 'string' });
                const firstSheet = wb.Sheets[wb.SheetNames[0]];
                rows2D = window.XLSX.utils.sheet_to_json(firstSheet, { header: 1, raw: false, defval: '' });
              } else {
                const wb = window.XLSX.read(uint8, { type: 'array', codepage: 949 });
                const firstSheet = wb.Sheets[wb.SheetNames[0]];
                rows2D = window.XLSX.utils.sheet_to_json(firstSheet, { header: 1, raw: false, defval: '' });
              }
            } else {
              let text = new TextDecoder('utf-8').decode(buffer);
              if (text.includes('\uFFFD')) text = new TextDecoder('euc-kr').decode(buffer);
              rows2D = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(splitCsvLine);
            }
          } catch (parseErr) {
            return showToast('⚠️ 파일을 읽는 중 오류가 발생했습니다.');
          }

          if (!rows2D || rows2D.length < 2) {
            return showToast('⚠️ 파일에서 유효한 표 데이터를 찾지 못했습니다.');
          }

          let headerIdx = 0;
          let dateCol = -1, timeCol = -1, storeCol = -1, amountCol = -1;

          for (let i = 0; i < Math.min(20, rows2D.length); i++) {
            const row = rows2D[i];
            if (!Array.isArray(row) || row.length < 2) continue;

            let hitCount = 0;
            let tmpDate = -1, tmpTime = -1, tmpStore = -1, tmpAmt = -1;

            row.forEach((cell, idx) => {
              const cClean = String(cell || '').replace(/\s+/g, '');
              if (cClean.length > 15 || cClean.includes(':')) return;

              if (/이용일|승인일|결제일|거래일|매출일|일자|날짜|일시/.test(cClean) && tmpDate === -1) {
                tmpDate = idx; hitCount++;
              } else if (/시간|시각/.test(cClean) && tmpTime === -1) {
                tmpTime = idx;
              } else if (/가맹점|상호|이용처|내역|내용/.test(cClean) && tmpStore === -1) {
                tmpStore = idx; hitCount++;
              } else if (/이용금액|승인금액|결제금액|매출금액|거래금액|원금|^금액$/.test(cClean) && !/취소|할인|포인트|잔액|혜택/.test(cClean) && tmpAmt === -1) {
                tmpAmt = idx; hitCount++;
              }
            });

            if (hitCount >= 2) {
              headerIdx = i;
              dateCol = tmpDate;
              timeCol = tmpTime;
              storeCol = tmpStore;
              amountCol = tmpAmt;
              break;
            }
          }

          const headerCols = rows2D[headerIdx] || [];
          const rawExtracted = [];

          for (let i = headerIdx + 1; i < rows2D.length; i++) {
            const cols = rows2D[i].map(c => String(c ?? '').trim());
            if (cols.length < 2) continue;
            if (cols.some(c => /^합계$|^총계$|^소계$/.test(c))) continue;

            const isCancelRow = cols.some(c => /취소/.test(c));
            let dateVal = '';
            let storeVal = '';
            let amountVal = 0;

            if (dateCol !== -1 && cols[dateCol]) {
              const rawDatePart = timeCol !== -1 && cols[timeCol] ? `${cols[dateCol]} ${cols[timeCol]}` : cols[dateCol];
              dateVal = normalizeDateString(rawDatePart);
            }
            if (storeCol !== -1 && cols[storeCol]) {
              storeVal = cols[storeCol];
            }
            if (amountCol !== -1 && cols[amountCol]) {
              const cleanedAmt = cols[amountCol].replace(/[^0-9\-]/g, '');
              if (cleanedAmt) amountVal = parseInt(cleanedAmt, 10);
            }

            if (amountVal === 0 || !storeVal || !dateVal) {
              cols.forEach((col, idx) => {
                const hName = String(headerCols[idx] || '');
                if (/승인번호|카드번호|사업자|연락처|전화|할부|번호/.test(hName)) return;

                if (!dateVal && /^(?:20\d{2}|\d{2})\s*[\-\.\/]?\s*\d{1,2}\s*[\-\.\/]?\s*\d{1,2}/.test(col) && col.replace(/[^0-9]/g, '').length >= 6) {
                  dateVal = normalizeDateString(col);
                } else if (amountVal === 0 && /^-?[0-9,]+원?$/.test(col)) {
                  const rawDigits = col.replace(/[^0-9]/g, '');
                  if (!col.includes(',') && rawDigits.length === 8) return;
                  const num = parseInt(col.replace(/[^0-9\-]/g, ''), 10);
                  if (Math.abs(num) >= 100) amountVal = num;
                } else if (
                  !storeVal &&
                  col.length >= 2 &&
                  !/승인|일시불|할부|정상|본인|가족|체크|신용|취소|국내|해외/.test(col) &&
                  isNaN(Number(col.replace(/[,.\-\/:\s]/g, '')))
                ) {
                  storeVal = col;
                }
              });
            }

            if (amountVal !== 0 && !isNaN(amountVal)) {
              rawExtracted.push({
                rowIdx: i,
                isCancelRow: isCancelRow || amountVal < 0,
                absAmount: Math.abs(amountVal),
                date: dateVal || getKSTDateTimeString(),
                store: storeVal || '카드사가맹점'
              });
            }
          }

          const normalItems = rawExtracted.filter(r => !r.isCancelRow);
          const cancelItems = rawExtracted.filter(r => r.isCancelRow);

          const newRows = [];
          let dupCount = 0;
          let autoIgnoredCancelCount = 0;

          for (const item of normalItems) {
            const { category, sub_category } = classifyStoreAndText(item.store, categories);
            const candidate = {
              id: 'xls-' + Date.now() + '-' + item.rowIdx,
              date: item.date,
              store: item.store,
              category,
              sub_category,
              amount: item.absAmount,
              tax: Math.round(item.absAmount / 11),
              payer: currentUser,
              is_business: false,
              source: fileName.endsWith('.csv') ? 'CSV일괄등록' : '엑셀일괄등록',
              verified: true,
              memo: '파일 일괄등록',
              items: []
            };

            if (isDuplicateExpense(candidate, [...expenses, ...newRows])) {
              dupCount++;
            } else {
              newRows.push(candidate);
            }
          }

          // ★ 취소 상계: 취소일 기준 60일 안(취소일 포함 이전)의 짝 승인 건을 찾아 한 번만 상계.
          //   짝 승인 건이 없으면(카드사가 원래 승인 행을 '취소'로 표시만 한 경우) 등록하지 않음
          const CANCEL_LOOKBACK_DAYS = 60;
          const dayNum = (ymd) => Date.UTC(+ymd.slice(0, 4), +ymd.slice(5, 7) - 1, +ymd.slice(8, 10)) / 86400000;
          const pairedApprovalIds = new Set();
          // 이미 등록된 취소(음수) 건이 상계한 승인 건은 다시 쓰지 않도록 먼저 표시
          const markPaired = (cancelRow, pool) => {
            const cDay = dayNum(normalizeDateString(cancelRow.date).slice(0, 10));
            const match = pool
              .filter(ex => ex.amount === Math.abs(cancelRow.amount) && !pairedApprovalIds.has(ex.id))
              .filter(ex => {
                const diff = cDay - dayNum(normalizeDateString(ex.date).slice(0, 10));
                return diff >= 0 && diff <= CANCEL_LOOKBACK_DAYS && isSimilarStoreName(cancelRow.store, ex.store);
              })
              .sort((x, y) => normalizeDateString(y.date).localeCompare(normalizeDateString(x.date)))[0];
            if (match) pairedApprovalIds.add(match.id);
            return match;
          };
          const approvalsPool = () => [...expenses, ...newRows].filter(ex => ex.amount > 0);
          expenses.filter(ex => ex.amount < 0).forEach(ex => markPaired(ex, approvalsPool()));

          for (const cItem of cancelItems) {
            const { category, sub_category } = classifyStoreAndText(cItem.store, categories);
            const cancelCandidate = {
              id: 'xls-cancel-' + Date.now() + '-' + cItem.rowIdx,
              date: cItem.date,
              store: cItem.store,
              category,
              sub_category,
              amount: -cItem.absAmount,
              tax: -Math.round(cItem.absAmount / 11),
              payer: currentUser,
              is_business: false,
              source: fileName.endsWith('.csv') ? 'CSV일괄등록' : '엑셀일괄등록',
              verified: true,
              memo: '승인취소 상계',
              items: []
            };

            // 같은 취소가 이미 등록돼 있으면(예: 취소 문자) 건너뜀
            if (isDuplicateExpense(cancelCandidate, [...expenses, ...newRows])) {
              dupCount++;
              continue;
            }
            if (!markPaired(cancelCandidate, approvalsPool())) {
              autoIgnoredCancelCount++;
              continue;
            }
            newRows.push(cancelCandidate);
          }

          e.target.value = '';
          if (newRows.length === 0) {
            if (dupCount > 0 || autoIgnoredCancelCount > 0) {
              return showToast(`ℹ️ 신규 내역 없음 (중복 ${dupCount}건, 단독취소 ${autoIgnoredCancelCount}건 제외)`);
            }
            return showToast('⚠️ 파일에서 등록할 결제 내역을 찾지 못했습니다.');
          }

          const ok = await insertExpenseRows(newRows);
          if (ok) {
            const extraMsg = [
              dupCount > 0 ? `중복 ${dupCount}건 제외` : '',
              autoIgnoredCancelCount > 0 ? `단독취소 ${autoIgnoredCancelCount}건 자동제외` : ''
            ].filter(Boolean).join(', ');
            showToast(`📥 총 ${newRows.length}건 등록 완료!${extraMsg ? ` (${extraMsg})` : ''}`);
            setActiveTab('list');
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const exportCSV = (onlyBiz) => {
        const list = onlyBiz ? monthFiltered.filter(e => e.is_business) : monthFiltered;
        const headers = ['결제일시(KST)', '결제자', '상호명', '대분류', '세부카테고리', '공급가액', '부가세', '총금액', '구분', '품목', '메모'];
        const rows = list.map(e => [
          e.date, e.payer, `"${e.store}"`, e.category, e.sub_category || '-',
          e.amount - (e.tax || 0), e.tax || 0, e.amount,
          e.is_business ? '업무경비' : '개인',
          `"${(e.items || []).map(i => i.name).join('/')}"`,
          `"${e.memo || ''}"`
        ].join(','));
        const csv = '\uFEFF' + [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `부부가계부_${selectedMonth}_${APP_VERSION}.csv`;
        link.click();
      };

      const monthFiltered = expenses.filter(e => {
        if (selectedMonth !== 'ALL' && !(e.date || '').startsWith(selectedMonth)) return false;
        if (filterUser === '남편') return e.payer === '남편';
        if (filterUser === '아내') return e.payer === '아내';
        if (filterUser === '업무용') return e.is_business;
        return true;
      });

      const totalAmount = monthFiltered.reduce((s, e) => s + e.amount, 0);
      const knownCatNames = categories.map(c => c.name);
      const uncategorizedSum = monthFiltered.filter(e => !knownCatNames.includes(e.category)).reduce((s, e) => s + e.amount, 0);

      return (
        <div className="min-h-screen pb-24 safe-page max-w-xl mx-auto bg-slate-950">
          {toastMsg && (
            <div style={{ marginBottom: 'env(safe-area-inset-bottom)' }} className="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-indigo-600 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-xl whitespace-nowrap">
              {toastMsg}
            </div>
          )}

          {!isUnlocked ? (
            <div className="min-h-screen flex items-center justify-center p-4 bg-slate-950">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full space-y-4 text-center">
                <div className="text-3xl">🛡️</div>
                <h2 className="text-lg font-bold text-white">부부 전용 가계부 보안 잠금 ({APP_VERSION})</h2>
                <p className="text-xs text-slate-400 leading-relaxed">
                  부부가 함께 쓰는 <b>가족 보안 코드({MIN_CODE_LENGTH}자 이상)</b>를 입력하세요. 처음이면 아래 버튼으로 코드를 만들고, 배우자 폰에도 같은 코드를 입력하면 됩니다.
                </p>
                <div className="space-y-2">
                  <input
                    type="text"
                    value={passInput}
                    onChange={e => setPassInput(e.target.value)}
                    placeholder="가족 보안 코드 입력"
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-center text-white font-bold tracking-wider text-sm"
                  />
                  <button
                    onClick={() => {
                      const code = generateSecureFamilyPass();
                      setPassInput(code);
                      copyToClipboard(code, '12자리 보안 코드');
                    }}
                    className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-emerald-300 font-bold rounded-xl text-xs border border-slate-700"
                  >
                    🎲 12자리 고강도 보안 코드 자동 생성 & 복사
                  </button>
                </div>
                <button
                  onClick={() => {
                    if (passInput.trim().length < MIN_CODE_LENGTH) {
                      showToast(`⚠️ 가족 보안 코드는 ${MIN_CODE_LENGTH}자 이상이어야 합니다.`);
                      return;
                    }
                    try { localStorage.setItem(STORAGE_KEY_PASS, passInput.trim()); } catch (e) {}
                    setFamilyPass(passInput.trim());
                    setIsUnlocked(true);
                  }}
                  className="w-full py-2.5 bg-indigo-600 text-white font-bold rounded-xl text-sm"
                >
                  잠금 해제 및 실시간 연결
                </button>
              </div>
            </div>
          ) : (
            <>
              <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 px-3 py-2.5 safe-top space-y-2">
                <div className="flex justify-between items-center gap-1">
                  <div className="flex items-center gap-1.5 shrink-0">
                    <span className="bg-emerald-600 text-white text-[11px] font-extrabold px-2 py-0.5 rounded-full whitespace-nowrap">
                      {APP_VERSION}
                    </span>
                    <h1 className="font-bold text-sm sm:text-base text-white whitespace-nowrap">
                      부부 AI 가계부
                    </h1>
                  </div>

                  {/* 버튼이 많아 좁은 화면에서 잘리지 않도록 가로 스크롤 */}
                  <div className="flex items-center gap-1 min-w-0 overflow-x-auto">
                    {installPrompt && (
                      <button
                        onClick={handleInstall}
                        className="text-[11px] bg-amber-500 text-slate-950 px-2 py-1 rounded-lg font-bold whitespace-nowrap"
                      >
                        📲앱 설치
                      </button>
                    )}
                    <button
                      onClick={DOWNLOAD_CLEAN_HTML_FILE}
                      className="text-[11px] bg-emerald-950 text-emerald-300 px-2 py-1 rounded-lg border border-emerald-700 font-bold whitespace-nowrap"
                    >
                      💾파일저장
                    </button>
                    <button
                      onClick={() => setShowWebhookModal(true)}
                      className="text-[11px] bg-indigo-950 text-indigo-300 px-2 py-1 rounded-lg border border-indigo-700/70 whitespace-nowrap font-bold"
                    >
                      ⚡자동연동/SQL
                    </button>
                    <button
                      onClick={() => {
                        setNewPassTarget('');
                        setShowCodeMigrateModal(true);
                      }}
                      className="text-[11px] bg-slate-800 text-slate-200 px-2 py-1 rounded-lg border border-slate-700 whitespace-nowrap"
                    >
                      🔒코드변경
                    </button>
                    <button
                      onClick={() => fetchFromCloud({ showSpinner: true, showSuccessToast: true })}
                      className="text-[11px] bg-slate-800 text-slate-200 px-2 py-1 rounded-lg border border-slate-700 whitespace-nowrap"
                    >
                      🔄
                    </button>
                    <button
                      onClick={() => setShowVersionModal(true)}
                      className="text-[11px] bg-slate-800 text-slate-200 px-2 py-1 rounded-lg border border-slate-700 whitespace-nowrap"
                    >
                      🕓버전
                    </button>
                  </div>
                </div>

                <div className="flex justify-between items-center bg-slate-950 px-2.5 py-1.5 rounded-xl border border-slate-800 text-[11px] gap-2">
