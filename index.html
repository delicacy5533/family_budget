          return [p.pay_month, payslipTypeOf(p.pay_type), p.pay_date, p.company, ...eNames.map(n => val(p.earnings, n)), p.gross, ...dNames.map(n => val(p.deductions, n)), p.deduction_total, p.net, t.insurance, t.tax, t.yearEnd, t.other];
        });
        const sumRow = ['합계', '', '', '', ...eNames.map((_, i) => data.reduce((s2, r) => s2 + (Number(r[4 + i]) || 0), 0)),
          data.reduce((s2, r) => s2 + r[4 + eNames.length], 0), ...dNames.map((_, i) => data.reduce((s2, r) => s2 + (Number(r[5 + eNames.length + i]) || 0), 0)),
          ...[0, 1, 2, 3, 4, 5].map(k => data.reduce((s2, r) => s2 + (Number(r[5 + eNames.length + dNames.length + k]) || 0), 0))];   // 공제계·실지급액·4대보험·세금·연말정산·기타공제
        const fileBase = `급여명세서_${psYear}_${psOwner}`;
        if (window.XLSX) {
          const ws = window.XLSX.utils.aoa_to_sheet([header, ...data, sumRow]);
          const wb = window.XLSX.utils.book_new();
          window.XLSX.utils.book_append_sheet(wb, ws, '급여명세서');
          downloadBlob(new Blob([window.XLSX.write(wb, { bookType: 'xlsx', type: 'array' })], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `${fileBase}.xlsx`);
        } else {
          const esc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
          downloadBlob(new Blob(['\uFEFF' + [header, ...data, sumRow].map(r => r.map(esc).join(',')).join('\n')], { type: 'text/csv;charset=utf-8;' }), `${fileBase}.csv`);
        }
      };


      // ---------------------------------------------------------------------
      // 🏠 대출 (주택담보대출 등): 대출정보·상환내역 캡처를 AI로 읽거나 직접 입력
      //   상환 1회 합계(원금+이자+수수료)를 지출 1건(주거/고정비 › 대출상환)으로 등록. (원금을 지출에서 뺄지는 자산 탭 때 검토) 등록
      // ---------------------------------------------------------------------
      const loadLoans = async (silent = false, exList = null) => {
        if (!supabaseClient) return;
        if (!silent) setLoanState('loading');
        const [l, p] = await Promise.all([
          supabaseClient.from('loans').select('*').order('created_at', { ascending: true }),
          supabaseClient.from('loan_payments').select('*').order('pay_date', { ascending: false })
        ]);
        const error = l.error || p.error;
        if (error) {
          if (!silent) setLoanState(/loans|loan_payments|does not exist|schema cache|PGRST20[25]|42P01/i.test(`${error.code} ${error.message}`) ? 'missing' : '⚠️ ' + error.message);
          return;
        }
        setLoans(l.data || []);
        setLoanPays(p.data || []);
        setLoanState('');
        // v1.34는 이자·수수료만 지출로 넣었음 → 상환 합계(원금 포함)로 맞춤 (그때 넣은 금액 그대로인 줄만)
        const exs = exList || expenses;
        let fixed = 0;
        for (const pay of p.data || []) {
          const ex = pay.expense_id && exs.find(e => e.id === pay.expense_id);
          const loan = ex && (l.data || []).find(x => x.id === pay.loan_id);
          if (!loan || ex.source !== '대출상환' || Number(pay.principal) <= 0) continue;
          const oldAmt = (Number(pay.interest) || 0) + (Number(pay.fee) || 0) + (Number(pay.late_fee) || 0);
          if (ex.amount !== oldAmt) continue;
          const row = loanExpenseRow(loan, pay);
          const patch = { amount: row.amount, store: row.store, items: row.items, ...(ex.sub_category === '대출이자' ? { sub_category: row.sub_category } : {}), updated_by: MY_DEVICE_ID };
          const { error: upErr } = await supabaseClient.from('expenses').update(patch).eq('id', pay.expense_id).eq('family_code', familyCode);
          if (!upErr) { setExpenses(prev => prev.map(e => e.id === pay.expense_id ? { ...e, ...patch } : e)); fixed++; }
        }
        if (fixed) notifyPartner();
      };
      const openLoans = () => { setShowLoans(true); setLoanOpenId(null); setLoanEdit(null); setLoanRead(null); setPayEdit(null); loadLoans(); };
      // 이자를 지출에 넣기 시작하는 달: 가계부를 쓰기 시작한 달 (대출 이자 말고 가장 오래된 내역)
      const defaultExpenseFrom = () => {
        const months = expenses.filter(e => !isIncome(e) && e.source !== '대출상환').map(e => String(e.date || '').slice(0, 7)).filter(m => /^\d{4}-\d{2}$/.test(m)).sort();
        return months[0] || getKSTDateTimeString().slice(0, 7);
      };
      const newLoanDraft = (over = {}) => ({
        id: null, owner: currentUser, name: '', lender: '', principal: '', balance: '', balance_date: getKSTDateTimeString().slice(0, 10),
        rate: '', rate_type: '고정금리', repay_method: '', start_date: '', maturity_date: '', term_months: '', next_due: {},
        expense_from: defaultExpenseFrom(), memo: '', ...over
      });
      const loanInterestCat = () => {
        const cat = categories.find(c => c.name === '주거/고정비') || categories.find(c => c.name === '기타') || categories[0];
        return { category: cat?.name || '기타', sub_category: cat?.subs?.includes('대출상환') ? '대출상환' : cat?.subs?.includes('대출이자') ? '대출이자' : (cat?.subs?.[0] || '기타') };
      };
      const loanCost = (p) => (Number(p.principal) || 0) + (Number(p.interest) || 0) + (Number(p.fee) || 0) + (Number(p.late_fee) || 0);
      const loanWantsExpense = (loan, p) => !!loan.expense_from && String(p.pay_date).slice(0, 7) >= loan.expense_from && loanCost(p) > 0;
      const loanExpenseRow = (loan, p) => {
        const cat = loanInterestCat();
        const parts = [['원금', p.principal], ['이자', p.interest], ['조기상환수수료', p.fee], ['지연배상금', p.late_fee]].filter(([, v]) => Number(v) > 0);
        return {
          id: p.expense_id, kind: 'expense', date: `${p.pay_date} 09:00`,
          store: `${loan.name || '대출'} ${p.kind === '조기상환' ? '조기상환' : '상환'}`.slice(0, 60),
          ...cat, amount: loanCost(p), tax: 0, payer: loan.owner || '남편', ...payFieldsOf('transfer'), is_business: false,
          source: '대출상환', verified: true, memo: '',
          items: parts.length > 1 ? parts.map(([name, price]) => ({ name, price: Number(price), ...cat })) : []
        };
      };
      // 상환 기록 저장 (새로 넣기·고치기) + 상환 지출 맞추기
      const saveLoanPayments = async (loan, rows) => {
        const fresh = [];
        const out = rows.map(r => {
          const p = { ...r, family_code: familyCode, loan_id: loan.id, updated_by: MY_DEVICE_ID };
          const want = loanWantsExpense(loan, p);
          if (want && !p.expense_id) { p.expense_id = 'loanint-' + p.id; fresh.push(p); }
          return p;
        });
        if (fresh.length && !(await insertExpenseRows(fresh.map(p => loanExpenseRow(loan, p))))) return false;
        // 날짜를 지출 시작 달 이전으로 옮기거나 금액이 0이 되면 자동으로 넣은 지출은 지움
        const dropIds = out.filter(p => p.expense_id && !loanWantsExpense(loan, p)).map(p => p.expense_id);
        if (dropIds.length) {
          await supabaseClient.from('expenses').delete().in('id', dropIds).eq('family_code', familyCode);
          setExpenses(prev => prev.filter(e => !dropIds.includes(e.id)));
          setTrash(prev => prev.filter(e => !dropIds.includes(e.id)));
          out.forEach(p => { if (dropIds.includes(p.expense_id)) p.expense_id = null; });
          notifyPartner();
        }
        // 이미 있던 상환 지출은 금액·날짜를 맞춤
        for (const p of out) {
          if (fresh.includes(p) || !p.expense_id) continue;
          const ex = expenses.find(e => e.id === p.expense_id);
          if (!ex) continue;
          const row = loanExpenseRow(loan, p);
          if (ex.amount !== row.amount || String(ex.date).slice(0, 10) !== p.pay_date) {
            await updateExpenseRow(p.expense_id, { date: row.date, amount: row.amount, store: row.store, items: row.items });
          }
        }
        for (let i = 0; i < out.length; i += 200) {
          const { error } = await supabaseClient.from('loan_payments').upsert(out.slice(i, i + 200));
          if (error) { showToast('⚠️ 상환 기록 저장 실패: ' + error.message); return false; }
        }
        setLoanPays(prev => [...out, ...prev.filter(x => !out.some(o => o.id === x.id))].sort((a, b) => b.pay_date.localeCompare(a.pay_date)));
        return true;
      };
      // 이자 지출 시작 달을 바꾸면: 새로 들어가는 달은 만들고, 빠지는 달은 지움 (자동으로 만든 줄이라 휴지통에 남기지 않음)
      const syncLoanExpenses = async (loan) => {
        const mine = loanPays.filter(p => p.loan_id === loan.id);
        const add = mine.filter(p => loanWantsExpense(loan, p) && !p.expense_id);
        const drop = mine.filter(p => !loanWantsExpense(loan, p) && p.expense_id);
        if (add.length) await saveLoanPayments(loan, add);
        if (drop.length) {
          const ids = drop.map(p => p.expense_id);
          await supabaseClient.from('expenses').delete().in('id', ids).eq('family_code', familyCode);
          const cleared = drop.map(p => ({ ...p, expense_id: null, updated_by: MY_DEVICE_ID }));
          await supabaseClient.from('loan_payments').upsert(cleared);
          setExpenses(prev => prev.filter(e => !ids.includes(e.id)));
          setTrash(prev => prev.filter(e => !ids.includes(e.id)));
          setLoanPays(prev => prev.map(p => cleared.find(c => c.id === p.id) || p));
          notifyPartner();
        }
      };
      const loanRowOf = (d) => ({
        id: d.id, family_code: familyCode, owner: d.owner || '남편', name: String(d.name || '').trim().slice(0, 40), lender: String(d.lender || '').trim().slice(0, 30),
        principal: numOf(d.principal), balance: numOf(d.balance), balance_date: d.balance_date || '',
        rate: Number(String(d.rate ?? '').replace(/[^0-9.]/g, '')) || 0, rate_type: d.rate_type || '', repay_method: String(d.repay_method || '').trim().slice(0, 30),
        start_date: d.start_date || '', maturity_date: d.maturity_date || '', term_months: numOf(d.term_months),
        next_due: d.next_due || {}, expense_from: d.expense_from || '', memo: String(d.memo || '').trim().slice(0, 200), updated_by: MY_DEVICE_ID
      });
      const saveLoan = async () => {
        const d = loanEdit;
        if (!String(d.name || '').trim()) return showToast('⚠️ 대출 이름을 입력해주세요. (예: 아낌e보금자리론)');
        if (!ensureConnected()) return;
        setLoanBusy('saving');
        const row = loanRowOf({ ...d, id: d.id || 'loan-' + Date.now() });
        const before = loans.find(l => l.id === row.id);
        const { error } = await supabaseClient.from('loans').upsert(row);
        if (error) { setLoanBusy(''); return showToast('⚠️ 저장 실패: ' + error.message); }
        setLoans(prev => [...prev.filter(l => l.id !== row.id), row]);
        if (before && (before.expense_from !== row.expense_from || before.name !== row.name || before.owner !== row.owner)) {
          if (before.name !== row.name || before.owner !== row.owner) {
            for (const p of loanPays.filter(x => x.loan_id === row.id && x.expense_id && expenses.some(e => e.id === x.expense_id))) {
              const r = loanExpenseRow(row, p);
              await updateExpenseRow(p.expense_id, { store: r.store, payer: r.payer });
            }
          }
          await syncLoanExpenses(row);
        }
        setLoanBusy('');
        setLoanEdit(null);
        setLoanOpenId(row.id);
        showToast(`🏠 ${row.name} 저장`);
      };
      const deleteLoan = async (loan) => {
        const pays = loanPays.filter(p => p.loan_id === loan.id);
        if (!window.confirm(`${loan.name} 대출을 삭제할까요?\n상환 기록 ${pays.length}건과 자동으로 넣은 상환 지출도 함께 지웁니다.`)) return;
        if (!ensureConnected()) return;
        const ids = pays.map(p => p.expense_id).filter(Boolean);
        if (ids.length) await supabaseClient.from('expenses').delete().in('id', ids).eq('family_code', familyCode);
        const { error } = await supabaseClient.from('loans').delete().eq('id', loan.id);
        if (error) return showToast('⚠️ 삭제 실패: ' + error.message);
        setExpenses(prev => prev.filter(e => !ids.includes(e.id)));
        setTrash(prev => prev.filter(e => !ids.includes(e.id)));
        setLoans(prev => prev.filter(l => l.id !== loan.id));
        setLoanPays(prev => prev.filter(p => p.loan_id !== loan.id));
        notifyPartner();
        setLoanEdit(null); setLoanOpenId(null);
        showToast('🗑️ 대출을 삭제했습니다.');
      };
      // 상환 1건 직접 입력·고치기
      const newPayDraft = (loan) => {
        const nd = loan.next_due || {};
        const today = getKSTDateTimeString().slice(0, 10);
        const useNext = nd.date && nd.date <= today && !loanPays.some(p => p.loan_id === loan.id && p.pay_date === nd.date);
        return { id: null, loan_id: loan.id, pay_date: useNext ? nd.date : today, seq: '', kind: '정기',
          principal: useNext ? nd.principal : '', interest: useNext ? nd.interest : '', fee: '', late_fee: useNext && nd.late_fee ? nd.late_fee : '', memo: '' };
      };
      const savePay = async () => {
        const d = payEdit;
        const loan = loans.find(l => l.id === d.loan_id);
        if (!loan) return setPayEdit(null);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(d.pay_date || '')) return showToast('⚠️ 날짜를 골라주세요.');
        const r = { principal: numOf(d.principal), interest: numOf(d.interest), fee: numOf(d.fee), late_fee: numOf(d.late_fee) };
        const total = r.principal + r.interest + r.fee + r.late_fee;
        if (!total) return showToast('⚠️ 원금이나 이자를 입력해주세요.');
        if (!ensureConnected()) return;
        setLoanBusy('saving');
        const old = loanPays.find(p => p.id === d.id);
        const row = { id: d.id || 'lp-' + Date.now(), pay_date: d.pay_date, seq: numOf(d.seq) || null, kind: d.kind || '정기', total, ...r,
          memo: String(d.memo || '').trim().slice(0, 100), expense_id: old?.expense_id || null };
        const ok = await saveLoanPayments(loan, [row]);
        setLoanBusy('');
        if (ok) { setPayEdit(null); showToast(`🏠 ${row.pay_date} 상환 ${total.toLocaleString()}원 저장`); }
      };
      const deletePay = async (p) => {
        if (!window.confirm(`${p.pay_date} 상환 기록(${Number(p.total).toLocaleString()}원)을 지울까요?${p.expense_id ? '\n자동으로 넣은 상환 지출도 함께 지웁니다.' : ''}`)) return;
        if (!ensureConnected()) return;
        if (p.expense_id) await supabaseClient.from('expenses').delete().eq('id', p.expense_id).eq('family_code', familyCode);
        const { error } = await supabaseClient.from('loan_payments').delete().eq('id', p.id);
        if (error) return showToast('⚠️ 삭제 실패: ' + error.message);
        setExpenses(prev => prev.filter(e => e.id !== p.expense_id));
        setTrash(prev => prev.filter(e => e.id !== p.expense_id));
        setLoanPays(prev => prev.filter(x => x.id !== p.id));
        notifyPartner();
        setPayEdit(null);
      };
      // 📷 캡처 읽기 (대출정보 조회·상환내역 조회 화면, 여러 장)
      const readLoanPhotos = async (fileList, targetId = null) => {
        const files = Array.from(fileList || []).slice(0, 10);
        if (files.length === 0 || !ensureConnected()) return;
        setLoanBusy('reading');
        try {
          const photos = await Promise.all(files.map(resizeImage));
          let timer;
          const limitMs = Math.min(SCAN_TIMEOUT_MS + (photos.length - 1) * SCAN_EXTRA_MS, SCAN_LIMIT_MAX_MS);
          const timeout = new Promise((_, rej) => { timer = setTimeout(() => rej(new Error('⏱️ AI 응답이 너무 늦습니다. 사진을 나눠서 다시 올려주세요.')), limitMs); });
          const { data, error } = await Promise.race([
            supabaseClient.functions.invoke('scan-receipt', { body: {
              ...(photos.length === 1 ? { image: photos[0].base64, mimeType: photos[0].mimeType }
                : { images: photos.map(ph => ({ image: ph.base64, mimeType: ph.mimeType })) }),
              mode: 'loan'
            } }),
            timeout
          ]).finally(() => clearTimeout(timer));
          if (error) throw new Error(await describeScanError(error));
          if (data?.status === 'not_receipt') throw new Error('대출 화면이 아닌 사진 같습니다. 대출정보 조회·상환내역 조회 화면을 캡처해주세요.');
          if (data?.status !== 'success' || !data.loan) throw new Error(data?.message || '대출 화면을 읽지 못했습니다.');
          const r = data.loan;
          const norm = (s) => String(s || '').replace(/[\s()（）]/g, '').toLowerCase();
          const target = loans.find(l => l.id === targetId)
            || (r.loan?.name && loans.find(l => norm(l.name) === norm(r.loan.name)))
            || (!r.loan?.name && loans.length === 1 ? loans[0] : null);
          const info = r.loan || {};
          const hasInfo = !!(info.balance || info.principal || info.rate || info.maturity_date);
          const base = target ? { ...target } : newLoanDraft();
          const draft = { ...base };
          for (const k of ['name', 'lender', 'principal', 'rate', 'rate_type', 'repay_method', 'start_date', 'maturity_date', 'term_months']) {
            if (info[k] !== null && info[k] !== undefined && info[k] !== '') draft[k] = info[k];
          }
          if (info.balance) { draft.balance = info.balance; draft.balance_date = getKSTDateTimeString().slice(0, 10); }
          if (r.next_due) draft.next_due = r.next_due;
          else if (info.next_pay_date && (!draft.next_due || draft.next_due.date !== info.next_pay_date)) draft.next_due = { date: info.next_pay_date };
          const existing = target ? loanPays.filter(p => p.loan_id === target.id) : [];
          const pays = (r.payments || []).map((p, i) => {
            // 같은 날·같은 합계라도 회차가 둘 다 있고 다르면 다른 상환 (같은 날 두 번 조기상환)
            const dup = existing.find(x => x.pay_date === p.date && Number(x.total) === Number(p.total) && (!x.seq || !p.seq || Number(x.seq) === Number(p.seq)));
            return { key: i, seq: p.seq, pay_date: p.date, total: p.total, principal: p.principal, interest: p.interest, fee: p.fee || 0, late_fee: p.late_fee || 0,
              kind: loanPayKind(p), dup: !!dup, on: !dup };
          });
          setLoanRead({ targetId: target?.id || null, draft, hasInfo, info, pays, summary: r.summary || null, model: data.model, photos: photos.length });
        } catch (err) {
          showToast('⚠️ ' + (err.message || String(err)));
        } finally {
          setLoanBusy('');
        }
      };
      const saveLoanRead = async () => {
        const R = loanRead;
        if (!String(R.draft.name || '').trim()) return showToast('⚠️ 대출 이름을 입력해주세요.');
        if (!ensureConnected()) return;
        setLoanBusy('saving');
        const row = loanRowOf({ ...R.draft, id: R.targetId || 'loan-' + Date.now() });
        const { error } = await supabaseClient.from('loans').upsert(row);
        if (error) { setLoanBusy(''); return showToast('⚠️ 저장 실패: ' + error.message); }
        setLoans(prev => [...prev.filter(l => l.id !== row.id), row]);
        const picked = R.pays.filter(p => p.on && !p.dup);
        const stamp = Date.now();
        const rows = picked.map((p, i) => ({ id: `lp-${stamp}-${i}`, pay_date: p.pay_date, seq: p.seq || null, kind: p.kind, total: p.total,
          principal: p.principal, interest: p.interest, fee: p.fee, late_fee: p.late_fee, memo: '', expense_id: null }));
        const ok = rows.length ? await saveLoanPayments(row, rows) : true;
        setLoanBusy('');
        if (!ok) return;
        const nExp = rows.filter(p => loanWantsExpense(row, p)).length;
        showToast(`🏠 ${row.name}: ${R.hasInfo ? '대출 정보 · ' : ''}상환 ${rows.length}건 저장${nExp ? ` (지출 ${nExp}건)` : ''}`);
        setLoanRead(null);
        setLoanOpenId(row.id);
      };
      const exportLoan = (loan) => {
        const rows = loanPays.filter(p => p.loan_id === loan.id).sort((a, b) => a.pay_date.localeCompare(b.pay_date));
        if (rows.length === 0) return showToast('ℹ️ 저장할 상환 기록이 없습니다.');
        const header = ['날짜', '회차', '구분', '합계', '원금', '이자', '조기상환수수료', '지연배상금', '메모'];
        const data = rows.map(p => [p.pay_date, p.seq || '', p.kind, Number(p.total), Number(p.principal), Number(p.interest), Number(p.fee), Number(p.late_fee), p.memo || '']);
        const sumRow = ['합계', '', '', ...[3, 4, 5, 6, 7].map(k => data.reduce((s2, r) => s2 + r[k], 0)), ''];
        const fileBase = `대출상환_${loan.name || '대출'}`;
        if (window.XLSX) {
          const ws = window.XLSX.utils.aoa_to_sheet([header, ...data, sumRow]);
          const wb = window.XLSX.utils.book_new();
          window.XLSX.utils.book_append_sheet(wb, ws, '상환내역');
          downloadBlob(new Blob([window.XLSX.write(wb, { bookType: 'xlsx', type: 'array' })], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `${fileBase}.xlsx`);
        } else {
          const esc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
          downloadBlob(new Blob(['﻿' + [header, ...data, sumRow].map(r => r.map(esc).join(',')).join('\n')], { type: 'text/csv;charset=utf-8;' }), `${fileBase}.csv`);
        }
      };

      const restoreExpenseRow = async (item) => {
        if (!ensureConnected()) return;
        const { error } = await supabaseClient.from('expenses')
          .update({ deleted_at: null, updated_by: MY_DEVICE_ID })
          .eq('id', item.id).eq('family_code', familyCode);
        if (error) return showToast('⚠️ 복원 실패: ' + error.message);
        setTrash(prev => prev.filter(e => e.id !== item.id));
        setExpenses(prev => [...prev, { ...item, deleted_at: null }].sort((a, b) => b.date.localeCompare(a.date)));
        notifyPartner();
        showToast(`↩️ 복원했습니다: ${item.store} ${Number(item.amount).toLocaleString()}원`);
      };

      // 문자 붙여넣기·카드사 파일에 휴지통에 버린 결제와 같은 내역이 있으면: 알려주고 다시 등록(휴지통에서 꺼내기)할지 물어봄
      //   → { total: 휴지통과 겹친 건수, restored: 꺼낸 건수 }
      const askRestoreFromTrash = async (hits) => {
        const uniq = [...new Map(hits.filter(Boolean).map(e => [e.id, e])).values()];
        if (uniq.length === 0) return { total: 0, restored: 0 };
        const lines = uniq.slice(0, 5).map(e => `· ${normalizeDateString(e.date).slice(0, 16)} ${e.store} ${Number(e.amount).toLocaleString()}원`).join('\n');
        const more = uniq.length > 5 ? `\n… 외 ${uniq.length - 5}건` : '';
        if (!window.confirm(`🗑️ 휴지통에 버린 결제와 같은 내역이 ${uniq.length}건 있습니다.\n${lines}${more}\n\n휴지통에서 꺼내 다시 등록할까요?\n(취소를 누르면 등록하지 않고 휴지통에 그대로 둡니다)`)) {
          return { total: uniq.length, restored: 0 };
        }
        const ids = uniq.map(e => e.id);
        const { error } = await supabaseClient.from('expenses').update({ deleted_at: null, updated_by: MY_DEVICE_ID }).in('id', ids).eq('family_code', familyCode);
        if (error) { showToast('⚠️ 휴지통에서 꺼내기 실패: ' + error.message); return { total: uniq.length, restored: 0 }; }
        setTrash(prev => prev.filter(e => !ids.includes(e.id)));
        setExpenses(prev => [...prev, ...uniq.map(e => ({ ...e, deleted_at: null }))].sort((a, b) => b.date.localeCompare(a.date)));
        notifyPartner();
        return { total: uniq.length, restored: uniq.length };
      };

      const purgeExpenseRows = async (items) => {
        if (!ensureConnected() || items.length === 0) return;
        const msg = items.length === 1
          ? `[${items[0].store} - ${Number(items[0].amount).toLocaleString()}원]\n영구 삭제할까요? 되돌릴 수 없습니다.`
          : `휴지통의 ${items.length}건을 모두 영구 삭제할까요? 되돌릴 수 없습니다.`;
        if (!window.confirm(msg)) return;
        const ids = items.map(e => e.id);
        const { error } = await supabaseClient.from('expenses').delete().in('id', ids).eq('family_code', familyCode);
        if (error) return showToast('⚠️ 영구 삭제 실패: ' + error.message);
        setTrash(prev => prev.filter(e => !ids.includes(e.id)));
        notifyPartner();
        showToast(`🧹 ${items.length}건을 영구 삭제했습니다.`);
      };

      // 내역의 대표 분류 바꾸기: 대표 분류와 같던 품목도 따라가고, 다른 분류 품목이 남으면 알려 줌
      const changeRowCategory = async (item, newCat, newSub) => {
        const patch = { category: newCat, sub_category: newSub };
        if (hasItemCategories(item.items)) patch.items = retargetItems(item.items, item.category, item.sub_category, newCat, newSub);
        const ok = await updateExpenseRow(item.id, patch);
        if (ok && patch.items && patch.items.some(it => it.category && (it.category !== newCat || it.sub_category !== newSub))) {
          showToast('ℹ️ 다른 분류의 품목은 그대로예요. 모두 바꾸려면 품목을 펼쳐 [모든 품목을 대표 분류로]');
        }
      };

      const saveEditForm = async (id) => {
        const amt = Number(editForm.amount) || 0;
        // 품목을 고쳤으면 같이 저장 (금액은 숫자로, 이름·금액이 빈 줄은 뺌)
        const before = expenses.find(e => e.id === id);
        const newItems = (editForm.items || []).map(it => ({ ...it, name: String(it.name || '').trim(), price: Math.round(Number(String(it.price ?? '').replace(/[^0-9-]/g, '')) || 0) }))
          .filter(it => it.name || it.price);
        const itemsChanged = before && JSON.stringify(newItems.map(x => [x.name, x.price])) !== JSON.stringify((before.items || []).map(x => [x.name, Number(x.price) || 0]));
        const itemsPatch = itemsChanged ? { items: newItems, verified: newItems.length === 0 || newItems.reduce((t, x) => t + x.price, 0) === amt } : {};
        // 부가세: 금액을 안 바꿨으면 그대로 (영수증에서 읽은 실제 부가세 유지),
        //         바꿨으면 원래 비율대로 (면세 품목이 섞인 영수증도 비율 유지, 취소로 바꾸면 음수)
        const orig = expenses.find(e => e.id === id);
        const tax = !orig ? Math.round(amt / 11)
          : amt === orig.amount ? (orig.tax ?? Math.round(amt / 11))
          : orig.amount ? Math.round((orig.tax ?? orig.amount / 11) * amt / orig.amount)
          : Math.round(amt / 11);
        const ok = await updateExpenseRow(id, {
          store: editForm.store.trim() || '미상가맹점',
          amount: amt,
          tax,
          date: normalizeDateString(editForm.date),
          memo: editForm.memo.trim(),
          payer: editForm.payer,
          ...payFieldsOf(editForm.pay),
          ...itemsPatch
        });
        if (ok) {
          setEditingId(null);
          showToast('✏️ 내역이 수정되었습니다!');
        }
      };

      const saveBudget = async (b) => {
        if (!ensureConnected()) return false;
        const clean = {};
        for (const k of ['total', '남편', '아내']) { const v = numOf(b[k]); if (v > 0) clean[k] = v; }
        const { error } = await supabaseClient.from('family_config').update({ budget: clean, updated_by: MY_DEVICE_ID, updated_at: new Date().toISOString() }).eq('family_code', familyCode);
        if (error) { showToast('⚠️ 예산 저장 실패: ' + error.message); return false; }
        setBudget(clean);
        notifyPartner();
        showToast(clean.total || clean['남편'] || clean['아내'] ? '🎯 월 예산을 저장했습니다.' : '🎯 월 예산을 지웠습니다.');
        return true;
      };

      const saveCategories = async (newCats) => {
        if (!ensureConnected()) return false;
        const { error } = await supabaseClient.from('family_config').update({
          categories: newCats,
          updated_by: MY_DEVICE_ID,
          updated_at: new Date().toISOString()
        }).eq('family_code', familyCode);
        if (error) {
          showToast('⚠️ 카테고리 저장 실패: ' + error.message);
          return false;
        }
        setCategories(newCats);
        try { localStorage.setItem(STORAGE_KEY_CATS, JSON.stringify(newCats)); } catch (e) {}
        notifyPartner();
        return true;
      };

      // =====================================================================
      // ★ 카드 목록 저장: 저장 직전에 서버의 최신 목록을 다시 읽어 그 위에 바꿈
      //   (두 폰이 동시에 고쳐도 상대가 바꾼 이름·주인이 덮어써지지 않도록)
      // =====================================================================
      const cardRefsOf = (rows) => rows.filter(r => r.card_num).map(r => ({ issuer: r.card_issuer || '', num: r.card_num, date: r.date }));

      const saveCards = async (mutator, opts = {}) => {
        const { data, error: readErr } = await supabaseClient
          .from('family_config').select('cards').eq('family_code', familyCode).maybeSingle();
        if (readErr || !data) {
          if (!opts.silent) showToast('⚠️ 카드 목록을 읽지 못했습니다: ' + (readErr?.message || '가족 정보 없음'));
          return false;
        }
        const fresh = Array.isArray(data.cards) ? data.cards : [];
        const next = mutator(fresh);
        if (!next) { setCards(fresh); return true; }
        const { error } = await supabaseClient.from('family_config').update({
          cards: next,
          updated_by: MY_DEVICE_ID,
          updated_at: new Date().toISOString()
        }).eq('family_code', familyCode);
        if (error) {
          if (!opts.silent) showToast('⚠️ 카드 목록 저장 실패: ' + error.message);
          return false;
        }
        setCards(next);
        notifyPartner();
        return true;
      };

      const registerCardsFrom = (rows) => {
        const refs = cardRefsOf(rows);
        if (refs.length && registerNewCards(cards, refs)) saveCards(cur => registerNewCards(cur, refs), { silent: true });
      };

      const updateCard = (id, patch) => saveCards(cur => cur.map(c => c.id === id ? { ...c, ...patch } : c));

      // 카드 A(묶음 전체)를 카드 B의 묶음으로 합침. 이름·주인은 B에 없을 때만 A 것을 가져감
      const mergeCardInto = (id, targetId) => saveCards(cur => {
        const a = cur.find(c => c.id === id), t = cur.find(c => c.id === targetId);
        if (!a || !t) return null;
        const rootA = cardRoot(cur, a).id, rootT = cardRoot(cur, t).id;
        if (rootA === rootT) return null;
        const ra = cur.find(c => c.id === rootA);
        return cur.map(c => {
          if (c.id === rootT) return { ...c, name: c.name || ra.name || '', owner: c.owner || ra.owner || '' };
          if (cardRoot(cur, c).id === rootA) return { ...c, link_to: rootT, auto_linked: false };
          return c;
        });
      });

      const unlinkCard = (id) => saveCards(cur => cur.map(c => c.id === id ? { ...c, link_to: null, auto_linked: false } : c));

      const deleteCard = (id) => saveCards(cur => cur.filter(c => c.id !== id).map(c => c.link_to === id ? { ...c, link_to: null } : c));

      // 카드 주인과 결제자가 다른 내역을 한꺼번에 주인으로 맞춤
      const alignPayers = async (ids, owner) => {
        if (!ensureConnected() || ids.length === 0) return;
        const { error } = await supabaseClient.from('expenses')
          .update({ payer: owner, updated_by: MY_DEVICE_ID })
          .in('id', ids).eq('family_code', familyCode);
        if (error) return showToast('⚠️ 결제자 변경 실패: ' + error.message);
        setExpenses(prev => prev.map(e => ids.includes(e.id) ? { ...e, payer: owner } : e));
        notifyPartner();
        showToast(`✅ ${ids.length}건의 결제자를 ${owner}(으)로 맞췄습니다.`);
      };

      // 카드사 발신번호 목록 저장 (비어 있으면 receive_sms가 번호 검사를 하지 않음)
      const saveAllowedSenders = async (list) => {
        if (!ensureConnected()) return false;
        const { error } = await supabaseClient.from('family_config').update({
          allowed_senders: list,
          updated_by: MY_DEVICE_ID,
          updated_at: new Date().toISOString()
        }).eq('family_code', familyCode);
        if (error) {
          showToast('⚠️ 발신번호 저장 실패: ' + error.message);
          return false;
        }
        setAllowedSenders(list);
        notifyPartner();
        return true;
      };

      const handleAddSender = async () => {
        const digits = senderInput.replace(/[^0-9]/g, '');
        if (digits.length < 7) return showToast('⚠️ 발신번호를 숫자로 입력해주세요 (예: 1544-7000).');
        if (allowedSenders.some(x => String(x).replace(/[^0-9]/g, '') === digits)) return showToast('ℹ️ 이미 등록된 번호입니다.');
        if (await saveAllowedSenders([...allowedSenders, senderInput.trim()])) {
          setSenderInput('');
          showToast('✅ 발신번호가 등록되었습니다.');
        }
      };

      // 분류 바로 추가: 대분류가 없으면 새로 만들고, 있으면 세부 분류만 더함. 성공하면 {category, sub_category}
      const addCategoryQuick = async (catName, subName) => {
        const cn = (catName || '').trim().slice(0, 20);
        let sn = (subName || '').trim().slice(0, 20);
        if (!cn) { showToast('⚠️ 대분류 이름을 입력해주세요.'); return null; }
        if (cn.includes('|') || sn.includes('|')) { showToast('⚠️ 이름에 | 기호는 쓸 수 없습니다.'); return null; }
        const exist = categories.find(c => c.name === cn);
        let updated, msg;
        if (exist) {
          if (!sn) sn = exist.subs[0] || '기타';
          if (exist.subs.includes(sn)) return { category: cn, sub_category: sn };   // 이미 있으면 고르기만
          updated = categories.map(c => c.id === exist.id ? { ...c, subs: [...c.subs, sn] } : c);
          msg = `✅ [${cn} › ${sn}] 세부 분류 추가됨`;
        } else {
          if (!sn) sn = '기타';
          updated = [...categories, { id: 'c-' + Date.now(), name: cn, subs: [sn] }];
          msg = `✅ [${cn} › ${sn}] 새 분류 추가됨`;
        }
        if (!(await saveCategories(updated))) return null;
        showToast(msg);
        return { category: cn, sub_category: sn };
      };

      // 분류 고르는 칸에서 '＋ 새 …'를 고르면 입력창을 엶. 아니면 false
      const openCatAdder = (value, where, curCat) => {
        if (value === '__new_cat__') { setCatAdder({ where, kind: 'cat', cat: '', name: '', sub: '' }); return true; }
        if (value === '__new_sub__') { setCatAdder({ where, kind: 'sub', cat: curCat, name: curCat, sub: '' }); return true; }
        return false;
      };

      const renderCatAdder = (where, onAdded) => {
        if (!catAdder || catAdder.where !== where) return null;
        const submit = async () => {
          const r = await addCategoryQuick(catAdder.kind === 'cat' ? catAdder.name : catAdder.cat, catAdder.sub);
          if (r) { setCatAdder(null); onAdded(r); }
        };
        const onKey = e => { if (e.key === 'Enter') submit(); };
        return (
          <div className="mt-1.5 p-2 bg-slate-950 border border-indigo-700/60 rounded-lg space-y-1.5 text-xs">
            <p className="text-[10px] text-indigo-300 font-bold">
              {catAdder.kind === 'cat' ? '＋ 새 대분류 만들기' : `＋ [${catAdder.cat}]에 세부 분류 추가`}
            </p>
            {catAdder.kind === 'cat' && (
              <input
                autoFocus
                value={catAdder.name}
                onChange={e => setCatAdder({ ...catAdder, name: e.target.value })}
                onKeyDown={onKey}
                placeholder="대분류 이름 (예: 생활/미용)"
                className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-slate-200"
              />
            )}
            <input
              autoFocus={catAdder.kind === 'sub'}
              value={catAdder.sub}
              onChange={e => setCatAdder({ ...catAdder, sub: e.target.value })}
              onKeyDown={onKey}
              placeholder={catAdder.kind === 'cat' ? '세부 분류 (예: 미용실 · 비우면 기타)' : '세부 분류 이름 (예: 미용실)'}
              className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-slate-200"
            />
            <div className="flex gap-1.5">
              <button onClick={submit} className="flex-1 py-1.5 bg-indigo-600 text-white font-bold rounded-lg">추가하고 고르기</button>
              <button onClick={() => setCatAdder(null)} className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded-lg">취소</button>
            </div>
            <p className="text-[10px] text-slate-500">추가한 분류는 두 사람 모두에게 바로 보이고, 다음 영수증부터 AI도 이 분류를 고를 수 있어요.</p>
          </div>
        );
      };

      const handleAddCategory = async () => {
        if (!newCatName.trim()) return;
        const newCat = { id: 'c-' + Date.now(), name: newCatName.trim(), subs: ['기타'] };
        const updated = [...categories, newCat];
        const ok = await saveCategories(updated);
        if (ok) {
          setSelectedCatId(newCat.id);
          setNewCatName('');
          showToast(`✅ [${newCat.name}] 대분류 추가됨`);
        }
      };

      const handleDeleteCategory = async (id, name) => {
        if (categories.length <= 1) return showToast('⚠️ 최소 1개는 유지해야 합니다.');
        if (!window.confirm(`[${name}] 대분류를 삭제하시겠습니까?`)) return;
        const updated = categories.filter(c => c.id !== id);
        const ok = await saveCategories(updated);
        if (ok) setSelectedCatId(updated[0].id);
      };

      const handleAddSubCategory = async () => {
        if (!newSubName.trim()) return;
        const updated = categories.map(c => {
          if (c.id === selectedCatId && !c.subs.includes(newSubName.trim())) {
            return { ...c, subs: [...c.subs, newSubName.trim()] };
          }
          return c;
        });
        const ok = await saveCategories(updated);
        if (ok) setNewSubName('');
      };

      const handleDeleteSubCategory = async (catId, subName) => {
        if (!window.confirm(`[${subName}] 세부 카테고리를 삭제하시겠습니까?`)) return;
        const updated = categories.map(c => {
          if (c.id === catId) return { ...c, subs: c.subs.filter(s => s !== subName) };
          return c;
        });
        await saveCategories(updated);
      };

      // =====================================================================
      // ★ AI 영수증 인식: 사진을 줄여서 Supabase 서버 함수(scan-receipt)로 보내고,
      //   Gemini가 읽은 가게·날짜·총액·품목을 확인·수정한 뒤 등록
      // =====================================================================
      const SCAN_MAX_SIDE = 1600;   // 긴 변 최대 픽셀 (글씨는 충분히 보이고 전송은 가볍게)
      // 이 시간 안에 답이 없으면 중단. 서버는 정확 모델이 35초 넘게 걸리면 보조 모델로 바꿔 읽으므로 그 시간까지 포함
      const SCAN_TIMEOUT_MS = 90000;
      const SCAN_EXTRA_MS = 15000;   // 사진이 한 장 늘 때마다 더 기다리는 시간
      const SCAN_MAX_PHOTOS = 4;     // 긴 영수증 이어 찍기 최대 장수
      const SCAN_MAX_AUTO = 10;      // 앨범에서 한 번에 보내는 최대 장수 (서버 함수 한도와 같게)
      const SCAN_LIMIT_MAX_MS = 160000;   // 사진이 많아도 이 이상은 기다리지 않음 (서버 함수 최대 처리 시간 150초 + 여유)
      const scanRequestRef = useRef(0); // 늦게 도착한 이전 요청의 답은 무시하기 위한 번호

      const resizeImage = (file) => new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, SCAN_MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
          resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg', preview: dataUrl });
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('사진을 열 수 없습니다.')); };
        img.src = url;
      });

      // 서버 함수 오류를 사람이 읽을 수 있는 문장으로
      const describeScanError = async (error) => {
        try {
          const ctx = error?.context;
          if (ctx && typeof ctx.json === 'function') {
            const body = await ctx.json().catch(() => null);
            // 우리 함수가 보낸 오류(code 있음)는 그 문장을, Supabase 자체 오류는 한국어 안내를
            if (body?.code && body?.status === 'error' && body?.message) return body.message;
            if (ctx.status === 404) return '영수증 인식 서버 함수(scan-receipt)가 아직 배포되지 않았습니다.';
            if (ctx.status === 401) return '서버 함수 설정에서 JWT 확인(Verify JWT)을 꺼주세요.';
            if (body?.message) return body.message;
            return `서버 함수 오류 (${ctx.status})`;
          }
        } catch (e) {}
        return '서버 함수에 연결할 수 없습니다. 인터넷 연결과 함수 배포 상태를 확인해주세요.';
      };

      // 사진 고르기: 보통은 고른 사진(여러 장이면 한 영수증으로)을 바로 읽고, 긴 영수증 모드면 모아 둠
      const handleReceiptFile = async (e) => {
        const files = Array.from(e.target.files || []);
        e.target.value = '';
        if (files.length === 0) return;
        if (!ensureConnected()) return;
        try {
          if (longMode) {
            const room = SCAN_MAX_PHOTOS - scanTray.length;
            if (room <= 0) return showToast(`⚠️ 한 영수증은 ${SCAN_MAX_PHOTOS}장까지 찍을 수 있어요.`);
            if (files.length > room) showToast(`ℹ️ ${SCAN_MAX_PHOTOS}장까지만 담았습니다.`);
            const added = await Promise.all(files.slice(0, room).map(resizeImage));
            setScanResult(null);
            setScanError('');
            setScanTray(prev => [...prev, ...added].slice(0, SCAN_MAX_PHOTOS));
            return;
          }
          // 보통 모드: 고른 사진을 한 번에 보내면 AI가 같은 영수증 사진끼리 묶고 다른 결제는 나눔
          //   (긴 영수증 3장 + 앱 화면 2장 → 결제 3건) → 확인 화면에서 한 건씩 등록
          // 한도를 넘으면 일부만 보내지 않음 (긴 영수증의 아랫부분만 빠져 합계 없이 읽히는 일을 막음)
          if (files.length > SCAN_MAX_AUTO) {
            setScanResult(null);
            setScanError(`사진 ${files.length}장을 골랐습니다. 한 번에 ${SCAN_MAX_AUTO}장까지 읽을 수 있어요. 영수증 단위로 나눠서 (같은 영수증 사진은 같은 묶음에) 다시 골라주세요.`);
            return;
          }
          const photos = await Promise.all(files.map(resizeImage));
          await readReceipt(photos, { auto: photos.length > 1 });
        } catch (err) {
          setScanError(err.message || String(err));
        }
      };

      // 서버가 읽은 영수증 1건(r) → 확인 화면용 데이터
      const buildScanResult = (r, data, photoCount) => {
          const meta = {
            model: data.model || '',
            fallback: !!data.fallback,
            fallbackReason: (data.skipped || []).some(x => /시간초과/.test(x)) ? 'slow' : 'quota',
            photos: photoCount,
            ...(r.date ? (() => { const c = checkReceiptDate(normalizeDateString(r.date)); return { date: c.date, dateSwappedFrom: c.swappedFrom, dateOdd: c.odd }; })()
                       : { date: getKSTDateTimeString() }),
            dateMissing: !r.date
          };
          // 입금(받은 돈) 화면 → 수입. 보낸 사람·적요로 분류 추천
          if (r.is_income === true) {
            const store = String(r.store || '입금').trim();
            const ic = classifyIncome(`${store} ${r.memo || ''}`, incomeCategories);
            return {
              ...meta, kind: 'income', pay: 'none', payer: currentUser, store, memo: String(r.memo || '').trim().slice(0, 200),
              amount: Math.abs(Number(r.total) || 0), tax: 0, isCancel: false, taxFromReceipt: false,
              items: [], itemsSum: 0, category: ic.category, sub_category: ic.sub_category, is_business: false
            };
          }
          // 취소·환불 내역(영수증이나 앱 화면)은 음수로: 금액·부가세·품목 모두
          const isCancel = r.is_cancel === true;
          const sign = isCancel ? -1 : 1;
          // 취소·반품: AI가 품목을 정상 결제 부호(반품 상품 +, 쿠폰 −)로 주면 뒤집고,
          //           영수증에 찍힌 그대로(반품 상품 −, 쿠폰 +) 주면 그대로 둠 → 품목 합계가 항상 −금액
          const rawItems = (r.items || []).filter(it => it.name);
          const rawSum = rawItems.reduce((sum, it) => sum + (Number(it.price) || 0), 0);
          const itemSign = isCancel && rawSum > 0 ? -1 : 1;
          const items = rawItems.map(it => cleanItemCategory({ ...it, price: itemSign * (Number(it.price) || 0) }, categories));
          const itemsSum = items.reduce((sum, it) => sum + (Number(it.price) || 0), 0);
          const amount = r.total != null ? sign * Math.abs(r.total) : itemsSum;
          const store = r.store || '영수증가맹점';
          // 대표 분류: ① 가게 이름이 규칙에 맞으면(주유소·푸드코트 등) 규칙
          //           ② 아니면 품목 금액이 가장 큰 분류(AI가 품목마다 고른 것)
          //           ③ 그것도 없으면 가게 이름 + 품목 이름으로 규칙 (가게 이름이 잘린 주유소 '…열우물주' + '보통휘발유' 등)
          //   할인 품목(음수, 예: '제휴할인(KT)')의 이름은 보지 않음 → 'KT' 때문에 통신요금으로 가는 일 없게
          const storeHit = CLASSIFY_RULES.some(rule => rule.test(store));
          const itemText = items.filter(it => Number(it.price) > 0).map(it => it.name).join(' ');
          const { category, sub_category } = (storeHit && classifyStoreAndText(store, categories))
            || dominantItemCategory(items)
            || classifyStoreAndText(`${store} ${itemText}`, categories);
          // 결제 수단: 현금 / 카드(카드사·뒤 4자리) / 모름. 카드 주인이 정해져 있으면 결제자도 그 사람
          // 할인·적립용 멤버십·포인트 카드(KT 멤버십, OK캐쉬백 …)는 결제 카드가 아님 → 카드로 등록하지 않음
          const isMembership = /멤버십|멤버쉽|membership|포인트|캐쉬백|캐시백|적립|CJ\s*ONE|L\.?\s*POINT/i.test(String(r.card_issuer || ''));
          const cardIssuer = isMembership ? '' : normalizeCardIssuer(r.card_issuer);
          const cardNum = isMembership ? '' : normalizeCardNum(r.card_number);
          const pay = r.pay_method === '현금' ? 'cash'
            : (cardNum || cardIssuer || (r.pay_method === '카드' && !isMembership)) ? `card:${cardIssuer}|${cardNum}` : 'none';
          const payFields = payFieldsOf(pay);
          return {
            ...meta,
            kind: 'expense',
            pay,
            payer: cardOwner(cards, payFields.card_issuer, payFields.card_num) || currentUser,
            store,
            amount: amount || 0,
            // 영수증의 부가세 (면세 품목이 있으면 금액÷11과 다름). 없으면 금액÷11로 추정
            tax: r.tax != null ? sign * Math.abs(r.tax) : Math.round((amount || 0) / 11),
            isCancel,
            taxFromReceipt: r.tax !== null && r.tax !== undefined,
            items,
            itemsSum,
            category,
            sub_category,
            is_business: false
          };
      };

      // 사진들을 서버 함수로 보내 읽기. opts.auto: 여러 결제가 섞였을 수 있음 → AI가 묶어서 여러 건으로
      const readReceipt = async (photos, opts = {}) => {
        if (!photos || photos.length === 0) return;
        if (!ensureConnected()) return;
        setScanResult(null);
        setScanError('');
        setIsScanning(true);
        const requestId = ++scanRequestRef.current;
        const isCurrent = () => scanRequestRef.current === requestId;
        const limitMs = Math.min(SCAN_TIMEOUT_MS + (photos.length - 1) * SCAN_EXTRA_MS, SCAN_LIMIT_MAX_MS);
        try {
          setScanPreview(photos.map(p => p.preview));
          let timer;
          const timeout = new Promise((_, reject) => { timer = setTimeout(() => reject(new Error('SCAN_TIMEOUT')), limitMs); });
          let response;
          try {
            response = await Promise.race([
              supabaseClient.functions.invoke('scan-receipt', {
                body: {
                  ...(photos.length === 1
                    ? { image: photos[0].base64, mimeType: photos[0].mimeType }
                    : { images: photos.map(p => ({ image: p.base64, mimeType: p.mimeType })) }),
                  ...(opts.auto ? { mode: 'auto' } : {}),
                  // 품목마다 이 목록에서 분류를 고르게 함
                  categories: categories.map(c => ({ name: c.name, subs: c.subs }))
                }
              }),
              timeout
            ]);
          } finally {
            clearTimeout(timer);
          }
          if (!isCurrent()) return;   // 그 사이 취소했거나 새 사진을 보냈으면 이 답은 버림
          const { data, error } = response;
          if (error) { setScanError(await describeScanError(error)); return; }
          if (data?.status === 'not_receipt') {
            setScanError(data.reason === 'list'
              ? '결제 여러 건이 나열된 목록 화면입니다. 앱에서 결제 1건을 눌러 상세 화면을 캡처해주세요.'
              : '영수증이나 결제 상세 화면이 아닌 사진 같습니다. 전체가 보이게 다시 찍어주세요.');
            return;
          }
          if (data?.status !== 'success') { setScanError(data?.message || '영수증을 읽지 못했습니다.'); return; }
          setScanTray([]);   // 다 읽었으면 모아 둔 사진 비움

          if (data.grouped) {
            // 여러 장 자동 묶기 결과: 결제마다 확인 화면을 차례로
            const groups = (data.receipts || []).map(r => r.is_receipt
              ? { result: buildScanResult(r, data, (r.photos || []).length || 1), previews: (r.photos || []).map(n => photos[n - 1]?.preview).filter(Boolean) }
              : null);
            const okGroups = groups.filter(Boolean);
            const notReceipt = groups.length - okGroups.length;
            if (okGroups.length === 0) { setScanError('영수증이나 결제 상세 화면을 찾지 못했습니다. 전체가 보이게 다시 찍어주세요.'); return; }
            if (notReceipt > 0) showToast(`ℹ️ 영수증이 아닌 사진 ${notReceipt}장은 건너뜁니다.`);
            setScanQueue(okGroups.slice(1));
            setQueueInfo({ pos: 1, total: okGroups.length });
            setScanPreview(okGroups[0].previews.length ? okGroups[0].previews : photos.map(p => p.preview));
            setScanResult(okGroups[0].result);
            return;
          }
          if (!data.receipt) { setScanError(data?.message || '영수증을 읽지 못했습니다.'); return; }
          setScanQueue([]);
          setQueueInfo({ pos: 0, total: 0 });
          // 앱만 새 버전이고 서버 함수가 옛 버전이면 여러 장을 한 영수증으로 합쳐 읽음 → 알려줌
          if (opts.auto && photos.length > 1) showToast('⚠️ 서버 함수가 옛 버전이라 여러 장을 한 영수증으로 읽었습니다. scan-receipt를 다시 배포해주세요.');
          setScanResult(buildScanResult(data.receipt, data, photos.length));
        } catch (err) {
          if (!isCurrent()) return;
          setScanError(err.message === 'SCAN_TIMEOUT'
            ? `⏱️ ${Math.round(limitMs / 1000)}초 동안 답이 없어 중단했습니다. 인터넷 연결을 확인하고 다시 시도해주세요.`
            : (err.message || String(err)));
        } finally {
          if (isCurrent()) setIsScanning(false);
        }
      };

      // 여러 장을 한 번에 읽은 결과 중 다음 결제를 확인 화면에. 남은 게 없으면 false
      const readNextInQueue = () => {
        if (scanQueue.length === 0) { setQueueInfo({ pos: 0, total: 0 }); return false; }
        const [next, ...rest] = scanQueue;
        setCatAdder(null);
        setScanQueue(rest);
        setQueueInfo(q => ({ ...q, pos: q.pos + 1 }));
        setScanError('');
        setScanPreview(next.previews || []);
        setScanResult(next.result);
        return true;
      };

      // 읽는 중에 사용자가 그만두기
      const cancelScan = () => {
        setCatAdder(null);
        setScanQueue([]);
        setQueueInfo({ pos: 0, total: 0 });
        scanRequestRef.current++;
        setIsScanning(false);
        setScanPreview([]);
        setScanError('');
      };

      // 같은 결제로 보이는 기존 내역 (카드 문자·카드사 파일, 아직 품목이 없는 것)
      const findScanMergeTarget = (sr) => {
        if (!sr || sr.kind === 'income') return null;
        const day = normalizeDateString(sr.date).slice(0, 10);
        const time = normalizeDateString(sr.date).slice(11, 16);
        const srCard = payFieldsOf(sr.pay || 'none');
        const candidates = expenses.filter(e => {
          if (e.amount !== Number(sr.amount)) return false;
          if (!['카드문자', '자동문자수신', '승인취소문자', 'CSV일괄등록', '엑셀일괄등록'].includes(e.source)) return false;
          if (e.items && e.items.length > 0) return false;
          // 둘 다 카드번호가 있는데 서로 안 맞으면 다른 결제 (카드사 표기는 문자·영수증마다 달라 번호만 비교)
          if (srCard.card_num && e.card_num && !cardNumMatch(srCard.card_num, e.card_num)) return false;
          if (srCard.pay_method === '현금' && e.pay_method === '카드') return false;
          const en = normalizeDateString(e.date);
          if (en.slice(0, 10) !== day) return false;
          const et = en.slice(11, 16);
          if (time !== '00:00' && et !== '00:00') return et === time || isSimilarStoreName(sr.store, e.store);
          return true;
        });
        // 같은 날 같은 금액이 여러 건이면 카드번호가 맞는 내역을 먼저
        return candidates.sort((a, b) => (cardNumMatch(srCard.card_num, b.card_num) ? 1 : 0) - (cardNumMatch(srCard.card_num, a.card_num) ? 1 : 0))[0] || null;
      };

      // 날짜가 이상할 때(못 읽음·오래됨·월일 바꿈): 금액·시각이 같은 최근 카드 문자/파일 내역 → 그 날짜를 제안
      //   (영수증 날짜가 '1/01/2026'처럼 잘려 인쇄돼 AI가 엉뚱한 날짜로 읽은 경우)
      const findDateHint = (sr) => {
        if (sr.kind === 'income' || !(sr.dateOdd || sr.dateMissing || sr.dateSwappedFrom)) return null;
        const time = normalizeDateString(sr.date).slice(11, 16);
        const today = getKSTDateTimeString().slice(0, 10);
        return expenses
          .filter(e => e.amount === Number(sr.amount) && !(e.items && e.items.length > 0))
          .filter(e => ['카드문자', '자동문자수신', '승인취소문자', 'CSV일괄등록', '엑셀일괄등록'].includes(e.source))
          .filter(e => { const d = (Date.parse(today) - Date.parse(normalizeDateString(e.date).slice(0, 10))) / 86400000; return d >= -1 && d <= RECEIPT_PAST_DAYS; })
          .filter(e => normalizeDateString(e.date) !== normalizeDateString(sr.date))
          .sort((a, b) => (normalizeDateString(b.date).slice(11, 16) === time) - (normalizeDateString(a.date).slice(11, 16) === time) || b.date.localeCompare(a.date))[0] || null;
      };

      // 영수증·앱 화면으로 이미 등록된 같은 결제 (카드번호는 실물·모바일카드가 달라 비교하지 않음)
      const findScanDuplicate = (sr) => {
        const d = normalizeDateString(sr.date);
        return expenses.find(e => {
          if (e.amount !== Number(sr.amount)) return false;
          if (isIncome(e) !== (sr.kind === 'income')) return false;
          const en = normalizeDateString(e.date);
          if (en.slice(0, 10) !== d.slice(0, 10)) return false;
          const t1 = d.slice(11, 16), t2 = en.slice(11, 16);
          if (t1 !== '00:00' && t2 !== '00:00') return t1 === t2 || isSimilarStoreName(sr.store, e.store);
          return isSimilarStoreName(sr.store, e.store);
        }) || null;
      };

      // 확인 화면에서 품목을 고치거나 지우면 품목 합계도 다시 계산
      const setScanItems = (items) => setScanResult(sr => ({ ...sr, items, itemsSum: items.reduce((t, x) => t + (Number(x.price) || 0), 0) }));
      const confirmScan = async () => {
        if (!scanResult) return;
        const amount = Number(scanResult.amount) || 0;
        if (amount === 0 || (amount < 0 && !scanResult.isCancel)) return showToast('⚠️ 결제 금액을 확인해주세요.');
        // 고친 품목 정리: 금액은 숫자로, 이름·금액이 모두 빈 줄은 뺌
        const cleanItems = (scanResult.items || []).map(it => ({ ...it, name: String(it.name || '').trim(), price: Math.round(Number(String(it.price ?? '').replace(/[^0-9-]/g, '')) || 0) }))
          .filter(it => it.name || it.price);
        const sr = { ...scanResult, amount, date: normalizeDateString(scanResult.date), items: cleanItems, itemsSum: cleanItems.reduce((t, x) => t + x.price, 0) };
        const target = findScanMergeTarget(sr);
        const payFields = payFieldsOf(sr.kind === 'income' ? 'none' : sr.pay);
        let ok;
        if (sr.kind === 'income') {
          ok = await insertExpenseRows([{
            id: 'inc-' + Date.now(),
            kind: 'income',
            date: sr.date,
            store: sr.store,
            category: sr.category,
            sub_category: sr.sub_category,
            amount: Math.abs(amount),
            tax: 0,
            payer: sr.payer,
            ...payFields,
            is_business: false,
            source: '입금캡처',
            verified: true,
            memo: (sr.memo || '').trim(),
            items: []
          }]);
          if (ok) showToast('💰 수입이 등록되었습니다.');
        } else if (target) {
          // 카드번호는 숫자가 더 많이 보이는 쪽을 남김 (문자 '1*3*' + 영수증 '1234' → '1234')
          const digits = (n) => (String(n || '').match(/[0-9]/g) || []).length;
          const keepTargetCard = target.card_num && digits(target.card_num) >= digits(payFields.card_num);
          ok = await updateExpenseRow(target.id, {
            store: sr.store,
            category: sr.category,
            sub_category: sr.sub_category,
            items: sr.items,
            // 문자에는 부가세가 없어 금액÷11로 넣어 둔 값 → 영수증의 부가세로 바로잡음 (면세 품목이 있으면 크게 다름)
            ...(sr.taxFromReceipt ? { tax: Number(sr.tax) || 0 } : {}),
            payer: sr.payer,
            is_business: sr.is_business || !!target.is_business,
            ...(keepTargetCard || !payFields.pay_method ? {} : payFields),
            source: '영수증+내역병합',
            memo: [userMemo(target.memo), (sr.memo || '').trim()].filter(Boolean).join(' / ')
          });
          if (ok) showToast('✨ 같은 결제의 카드 내역에 영수증 품목을 합쳤습니다.');
        } else {
          ok = await insertExpenseRows([{
            id: 'rcpt-' + Date.now(),
            date: sr.date,
            store: sr.store,
            category: sr.category,
            sub_category: sr.sub_category,
            amount,
            tax: Number(sr.tax) || Math.round(amount / 11),
            payer: sr.payer,
            ...payFields,
            is_business: sr.is_business,
            source: '영수증스캔',
            verified: sr.items.length === 0 || sr.itemsSum === amount,
            memo: (sr.memo || '').trim(),
            items: sr.items
          }]);
          if (ok) showToast('☁️ 영수증 내역이 등록되었습니다.');
        }
        if (ok) {
          setScanResult(null);
          setScanPreview([]);
          setSelectedMonth(sr.date.slice(0, 7));
          if (!readNextInQueue()) setActiveTab('list');   // 남은 결제가 있으면 다음 확인 화면
        }
      };

      const handleBulkParseSMS = async () => {
        if (!smsText.trim()) return;
        const rawBlocks = smsText
          .split(/(?=\[Web발신\])|\n\s*\n/)
          .map(b => b.trim())
          .filter(Boolean);

        const parsedRows = [];
        let duplicateCount = 0;
        let spamIgnoredCount = 0;
        const trashHits = [];     // 휴지통에 버린 결제와 같은 문자 → 다시 등록할지 물어봄

        for (const block of rawBlocks) {
          const parsed = parseSingleSmsBlock(block, categories, currentUser, cards);
          if (parsed) {
            if (isDuplicateExpense(parsed, [...expenses, ...parsedRows])) {
              duplicateCount++;
            } else if (isDuplicateExpense(parsed, trash)) {
              trashHits.push(trash.find(t => isDuplicateExpense(parsed, [t])));
            } else {
              parsedRows.push(parsed);
            }
          } else {
            spamIgnoredCount++;
          }
        }

        const tr = await askRestoreFromTrash(trashHits);
        const trashSkipCount = tr.total - tr.restored;
        if (parsedRows.length === 0) {
          if (tr.restored > 0) { setSmsText(''); setActiveTab('list'); return showToast(`↩️ 휴지통에서 ${tr.restored}건을 다시 등록했습니다.${duplicateCount ? ` (중복 ${duplicateCount}건 제외)` : ''}`); }
          if (duplicateCount > 0 || trashSkipCount > 0) return showToast(`ℹ️ 새 내역 없음 (중복 ${duplicateCount}건${trashSkipCount ? `, 휴지통에 있는 ${trashSkipCount}건` : ''} 제외)`);
          return showToast('⚠️ 카드 결제 승인 문자가 없습니다 (광고/설문/비결제 문자 자동 무시됨).');
        }

        const ok = await insertExpenseRows(parsedRows);
        if (ok) {
          setSmsText('');
          const extra = [
            duplicateCount > 0 ? `중복 ${duplicateCount}건 제외` : '',
            tr.restored > 0 ? `휴지통에서 ${tr.restored}건 다시 등록` : '',
            trashSkipCount > 0 ? `휴지통에 있는 ${trashSkipCount}건 제외` : '',
            spamIgnoredCount > 0 ? `광고/설문 ${spamIgnoredCount}건 차단` : ''
          ].filter(Boolean).join(', ');
          showToast(`🎉 총 ${parsedRows.length}건 등록 완료!${extra ? ` (${extra})` : ''}`);
          setActiveTab('list');
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const fileName = file.name.toLowerCase();

        const reader = new FileReader();
        reader.onload = async (evt) => {
          const buffer = evt.target.result;
          let rows2D = [];

          try {
            if (fileName.endsWith('.xls') || fileName.endsWith('.xlsx')) {
              const uint8 = new Uint8Array(buffer);
              const sampleText = new TextDecoder('utf-8').decode(uint8.slice(0, 500));
              if (/<html|<table/i.test(sampleText)) {
                let htmlStr = new TextDecoder('utf-8').decode(uint8);
                if (htmlStr.includes('\uFFFD')) htmlStr = new TextDecoder('euc-kr').decode(uint8);
                const wb = window.XLSX.read(htmlStr, { type: 'string' });
                const firstSheet = wb.Sheets[wb.SheetNames[0]];
                rows2D = window.XLSX.utils.sheet_to_json(firstSheet, { header: 1, raw: false, defval: '' });
              } else {
                const wb = window.XLSX.read(uint8, { type: 'array', codepage: 949 });
                const firstSheet = wb.Sheets[wb.SheetNames[0]];
                rows2D = window.XLSX.utils.sheet_to_json(firstSheet, { header: 1, raw: false, defval: '' });
              }
            } else {
              let text = new TextDecoder('utf-8').decode(buffer);
              if (text.includes('\uFFFD')) text = new TextDecoder('euc-kr').decode(buffer);
              rows2D = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(splitCsvLine);
            }
          } catch (parseErr) {
            return showToast('⚠️ 파일을 읽는 중 오류가 발생했습니다.');
          }

          if (!rows2D || rows2D.length < 2) {
            return showToast('⚠️ 파일에서 유효한 표 데이터를 찾지 못했습니다.');
          }

          let headerIdx = 0;
          let dateCol = -1, timeCol = -1, storeCol = -1, amountCol = -1, cardCol = -1;

          for (let i = 0; i < Math.min(20, rows2D.length); i++) {
            const row = rows2D[i];
            if (!Array.isArray(row) || row.length < 2) continue;

            let hitCount = 0;
            let tmpDate = -1, tmpTime = -1, tmpStore = -1, tmpAmt = -1, tmpCard = -1;

            row.forEach((cell, idx) => {
              const cClean = String(cell || '').replace(/\s+/g, '');
              if (cClean.length > 15 || cClean.includes(':')) return;

              if (/이용일|승인일|결제일|거래일|매출일|일자|날짜|일시/.test(cClean) && tmpDate === -1) {
                tmpDate = idx; hitCount++;
              } else if (/시간|시각/.test(cClean) && tmpTime === -1) {
                tmpTime = idx;
              } else if (/가맹점|상호|이용처|내역|내용/.test(cClean) && tmpStore === -1) {
                tmpStore = idx; hitCount++;
              } else if (/이용금액|승인금액|결제금액|매출금액|거래금액|원금|^금액$/.test(cClean) && !/취소|할인|포인트|잔액|혜택/.test(cClean) && tmpAmt === -1) {
                tmpAmt = idx; hitCount++;
              } else if (/카드번호|이용카드|카드명/.test(cClean) && tmpCard === -1) {
                tmpCard = idx;
              }
            });

            if (hitCount >= 2) {
              headerIdx = i;
              dateCol = tmpDate;
              timeCol = tmpTime;
              storeCol = tmpStore;
              amountCol = tmpAmt;
              cardCol = tmpCard;
              break;
            }
          }

          const headerCols = rows2D[headerIdx] || [];
          const rawExtracted = [];

          for (let i = headerIdx + 1; i < rows2D.length; i++) {
            const cols = rows2D[i].map(c => String(c ?? '').trim());
            if (cols.length < 2) continue;
            if (cols.some(c => /^합계$|^총계$|^소계$/.test(c))) continue;

            const isCancelRow = cols.some(c => /취소/.test(c));
            let dateVal = '';
            let storeVal = '';
            let amountVal = 0;

            if (dateCol !== -1 && cols[dateCol]) {
              const rawDatePart = timeCol !== -1 && cols[timeCol] ? `${cols[dateCol]} ${cols[timeCol]}` : cols[dateCol];
              dateVal = normalizeDateString(rawDatePart);
            }
            if (storeCol !== -1 && cols[storeCol]) {
              storeVal = cols[storeCol];
            }
            if (amountCol !== -1 && cols[amountCol]) {
              const cleanedAmt = cols[amountCol].replace(/[^0-9\-]/g, '');
              if (cleanedAmt) amountVal = parseInt(cleanedAmt, 10);
            }

            if (amountVal === 0 || !storeVal || !dateVal) {
              cols.forEach((col, idx) => {
                const hName = String(headerCols[idx] || '');
                if (/승인번호|카드번호|사업자|연락처|전화|할부|번호/.test(hName)) return;

                if (!dateVal && /^(?:20\d{2}|\d{2})\s*[\-\.\/]?\s*\d{1,2}\s*[\-\.\/]?\s*\d{1,2}/.test(col) && col.replace(/[^0-9]/g, '').length >= 6) {
                  dateVal = normalizeDateString(col);
                } else if (amountVal === 0 && /^-?[0-9,]+원?$/.test(col)) {
                  const rawDigits = col.replace(/[^0-9]/g, '');
                  if (!col.includes(',') && rawDigits.length === 8) return;
                  const num = parseInt(col.replace(/[^0-9\-]/g, ''), 10);
                  if (Math.abs(num) >= 100) amountVal = num;
                } else if (
                  !storeVal &&
                  col.length >= 2 &&
                  !/승인|일시불|할부|정상|본인|가족|체크|신용|취소|국내|해외/.test(col) &&
                  isNaN(Number(col.replace(/[,.\-\/:\s]/g, '')))
                ) {
                  storeVal = col;
                }
              });
            }

            // 결제 카드: 파일의 카드번호 칸 → 없으면 화면에서 고른 '이 파일의 카드'
            let rowPay = { pay_method: '카드', card_issuer: '', card_num: '' };
            const chosen = importPay !== 'auto' ? payFieldsOf(importPay) : null;
            if (cardCol !== -1 && normalizeCardNum(cols[cardCol])) {
              rowPay = { pay_method: '카드', card_issuer: normalizeCardIssuer(cols[cardCol]) || chosen?.card_issuer || '', card_num: normalizeCardNum(cols[cardCol]) };
            } else if (chosen) {
              rowPay = chosen;
            }

            if (amountVal !== 0 && !isNaN(amountVal)) {
              rawExtracted.push({
                rowIdx: i,
                isCancelRow: isCancelRow || amountVal < 0,
                absAmount: Math.abs(amountVal),
                date: dateVal || getKSTDateTimeString(),
                store: storeVal || '카드사가맹점',
                pay: rowPay
              });
            }
          }

          const normalItems = rawExtracted.filter(r => !r.isCancelRow);
          const cancelItems = rawExtracted.filter(r => r.isCancelRow);

          const newRows = [];
          let dupCount = 0;
          const trashHits = [];     // 휴지통에 버린 결제와 같은 행 → 다시 등록할지 물어봄
          let autoIgnoredCancelCount = 0;

          for (const item of normalItems) {
            const { category, sub_category } = classifyStoreAndText(item.store, categories);
            const candidate = {
              id: 'xls-' + Date.now() + '-' + item.rowIdx,
              date: item.date,
              store: item.store,
              category,
              sub_category,
              amount: item.absAmount,
              tax: Math.round(item.absAmount / 11),
              payer: cardOwner(cards, item.pay.card_issuer, item.pay.card_num) || currentUser,
              ...item.pay,
              is_business: false,
              source: fileName.endsWith('.csv') ? 'CSV일괄등록' : '엑셀일괄등록',
              verified: true,
              memo: '',
              items: []
            };

            if (isDuplicateExpense(candidate, [...expenses, ...newRows])) {
              dupCount++;
            } else if (isDuplicateExpense(candidate, trash)) {
              trashHits.push(trash.find(t => isDuplicateExpense(candidate, [t])));
            } else {
              newRows.push(candidate);
            }
          }

          // ★ 취소 상계: 취소일 기준 60일 안(취소일 포함 이전)의 짝 승인 건을 찾아 한 번만 상계.
          //   짝 승인 건이 없으면(카드사가 원래 승인 행을 '취소'로 표시만 한 경우) 등록하지 않음
          const CANCEL_LOOKBACK_DAYS = 60;
          const dayNum = (ymd) => Date.UTC(+ymd.slice(0, 4), +ymd.slice(5, 7) - 1, +ymd.slice(8, 10)) / 86400000;
          const pairedApprovalIds = new Set();
          // 이미 등록된 취소(음수) 건이 상계한 승인 건은 다시 쓰지 않도록 먼저 표시
          const markPaired = (cancelRow, pool) => {
            const cDay = dayNum(normalizeDateString(cancelRow.date).slice(0, 10));
            const match = pool
              .filter(ex => ex.amount === Math.abs(cancelRow.amount) && !pairedApprovalIds.has(ex.id))
              .filter(ex => {
                const diff = cDay - dayNum(normalizeDateString(ex.date).slice(0, 10));
                return diff >= 0 && diff <= CANCEL_LOOKBACK_DAYS && isSimilarStoreName(cancelRow.store, ex.store);
              })
              .sort((x, y) => normalizeDateString(y.date).localeCompare(normalizeDateString(x.date)))[0];
            if (match) pairedApprovalIds.add(match.id);
            return match;
          };
          const approvalsPool = () => [...expenses, ...newRows].filter(ex => ex.amount > 0);
          expenses.filter(ex => ex.amount < 0).forEach(ex => markPaired(ex, approvalsPool()));

          for (const cItem of cancelItems) {
            const { category, sub_category } = classifyStoreAndText(cItem.store, categories);
            const cancelCandidate = {
              id: 'xls-cancel-' + Date.now() + '-' + cItem.rowIdx,
              date: cItem.date,
              store: cItem.store,
              category,
              sub_category,
              amount: -cItem.absAmount,
              tax: -Math.round(cItem.absAmount / 11),
              payer: cardOwner(cards, cItem.pay.card_issuer, cItem.pay.card_num) || currentUser,
              ...cItem.pay,
              is_business: false,
              source: fileName.endsWith('.csv') ? 'CSV일괄등록' : '엑셀일괄등록',
              verified: true,
              memo: '',
              items: []
            };

            // 같은 취소가 이미 등록돼 있으면(예: 취소 문자) 건너뜀
            if (isDuplicateExpense(cancelCandidate, [...expenses, ...newRows])) {
              dupCount++;
              continue;
            }
            if (isDuplicateExpense(cancelCandidate, trash)) {
              trashHits.push(trash.find(t => isDuplicateExpense(cancelCandidate, [t])));
              continue;
            }
            if (!markPaired(cancelCandidate, approvalsPool())) {
              autoIgnoredCancelCount++;
              continue;
            }
            newRows.push(cancelCandidate);
          }

          e.target.value = '';
          const tr = await askRestoreFromTrash(trashHits);
          const trashSkipCount = tr.total - tr.restored;
          if (newRows.length === 0) {
            if (tr.restored > 0) { setActiveTab('list'); return showToast(`↩️ 휴지통에서 ${tr.restored}건을 다시 등록했습니다.${dupCount ? ` (중복 ${dupCount}건 제외)` : ''}`); }
            if (dupCount > 0 || trashSkipCount > 0 || autoIgnoredCancelCount > 0) {
              return showToast(`ℹ️ 신규 내역 없음 (중복 ${dupCount}건${trashSkipCount ? `, 휴지통에 있는 ${trashSkipCount}건` : ''}, 단독취소 ${autoIgnoredCancelCount}건 제외)`);
            }
            return showToast('⚠️ 파일에서 등록할 결제 내역을 찾지 못했습니다.');
          }

          const ok = await insertExpenseRows(newRows);
          if (ok) {
            const extraMsg = [
              dupCount > 0 ? `중복 ${dupCount}건 제외` : '',
              tr.restored > 0 ? `휴지통에서 ${tr.restored}건 다시 등록` : '',
              trashSkipCount > 0 ? `휴지통에 있는 ${trashSkipCount}건 제외` : '',
              autoIgnoredCancelCount > 0 ? `단독취소 ${autoIgnoredCancelCount}건 자동제외` : ''
            ].filter(Boolean).join(', ');
            showToast(`📥 총 ${newRows.length}건 등록 완료!${extraMsg ? ` (${extraMsg})` : ''}`);
            setActiveTab('list');
          }
        };
        reader.readAsArrayBuffer(file);
      };

      // =====================================================================
      // ★ 엑셀 저장 (.xlsx): 내역 단위(결제 1건 = 1줄) 또는 품목별(영수증 품목 1개 = 1줄)
      //   품목별은 품목 합계와 결제 금액의 차이를 '(영수증 차액)' 줄로 넣어 두 방식의 합계가 같음
      // =====================================================================
      // 파일 내려받기 (링크를 화면에 붙였다 떼야 일부 브라우저에서 파일 이름이 지켜짐)
      const downloadBlob = (blob, filename) => {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        setTimeout(() => { document.body.removeChild(link); URL.revokeObjectURL(url); }, 1000);
      };

      const exportExcel = (onlyBiz) => {
        const list = onlyBiz ? monthFiltered.filter(e => e.is_business && !isIncome(e)) : monthFiltered;
        if (list.length === 0) return showToast('ℹ️ 저장할 내역이 없습니다.');
        const payName = (e) => payLabel(cards, e).replace(/^\S+\s/, '');
        const kind = (e) => isIncome(e) ? '수입' : e.is_business ? '업무경비' : '개인';
        let header, rows, sheetName;
        if (exportMode === 'item') {
          sheetName = '품목별';
          header = ['결제일시(KST)', '결제자', '결제수단', '상호명', '품목', '대분류', '세부카테고리', '금액', '구분', '메모'];
          rows = [];
          for (const e of list) {
            const its = e.items || [];
            if (its.length === 0) {
              rows.push([e.date, e.payer, payName(e), e.store, '(품목 없음)', e.category, e.sub_category || '', e.amount, kind(e), userMemo(e.memo)]);
              continue;
            }
            for (const it of its) {
              rows.push([e.date, e.payer, payName(e), e.store, it.name, it.category || e.category, it.sub_category || e.sub_category || '', Number(it.price) || 0, kind(e), userMemo(e.memo)]);
            }
            const rest = e.amount - its.reduce((sum, it) => sum + (Number(it.price) || 0), 0);
            if (rest !== 0) rows.push([e.date, e.payer, payName(e), e.store, '(영수증 차액)', e.category, e.sub_category || '', rest, kind(e), '품목 합계와 결제 금액의 차이']);
          }
        } else {
          sheetName = '내역';
          header = ['결제일시(KST)', '결제자', '결제수단', '상호명', '대분류', '세부카테고리', '공급가액', '부가세', '총금액', '구분', '품목수', '품목', '메모'];
          rows = list.map(e => [
            e.date, e.payer, payName(e), e.store, e.category, e.sub_category || '',

      const userFilterOk = (e) => {
