    const generateSecureFamilyPass = () => {

    const getKSTDateTimeString = () => {
      const now = new Date();
      const kstDate = new Date(now.getTime() + 9 * 3600 * 1000);
      return kstDate.toISOString().slice(0, 16).replace('T', ' ');
    };

    const normalizeStoreName = (s) => {
      return String(s || '')
        .replace(/\(\s*주\s*\)|\(\s*유\s*\)|주식회사|유한회사|지점|점$|\s+|[^가-힣a-zA-Z0-9]/g, '')
        .toLowerCase();
    };

    const isSimilarStoreName = (a, b) => {
      const na = normalizeStoreName(a);
      const nb = normalizeStoreName(b);
      if (!na || !nb) return false;
      if (na === nb) return true;
      // 한쪽이 다른 쪽을 포함하면 같은 가게로 봄 ('이마트연수' ⊂ '주이마트연수').
      // 짧은 쪽이 3글자 미만이면 우연히 겹칠 수 있어 같은 가게로 보지 않음 (예: 'gs' vs 'gs칼텍스')
      const [shorter, longer] = na.length <= nb.length ? [na, nb] : [nb, na];
      return shorter.length >= 3 && longer.includes(shorter);
    };

    const normalizeDateString = (raw) => {
      const nowKstStr = getKSTDateTimeString();
      const todayYmd = nowKstStr.slice(0, 10);
      const currentYear = parseInt(todayYmd.slice(0, 4), 10);

      if (!raw && raw !== 0) return nowKstStr;

      if (typeof raw === 'number' && raw > 35000 && raw < 60000) {
        const utcDays = Math.floor(raw - 25569);
        const dateObj = new Date(utcDays * 86400 * 1000);
        return `${dateObj.toISOString().slice(0, 10)} 00:00`;
      }

      const str = String(raw)
        .trim()
        .replace('T', ' ')
        .replace(/\s*([\.\-\/])\s*/g, '$1')
        .replace(/\s+/g, ' ');

      const m4 = str.match(/^(\d{4})[\-\.\/](\d{1,2})[\-\.\/](\d{1,2})\.?(\s+(\d{1,2}):(\d{1,2}))?/);
      if (m4) {
        return `${m4[1]}-${m4[2].padStart(2, '0')}-${m4[3].padStart(2, '0')} ${(m4[5] || '00').padStart(2, '0')}:${(m4[6] || '00').padStart(2, '0')}`;
      }

      const m2 = str.match(/^(\d{2})[\-\.\/](\d{1,2})[\-\.\/](\d{1,2})\.?(\s+(\d{1,2}):(\d{1,2}))?/);
      if (m2 && parseInt(m2[2], 10) <= 12) {
        return `20${m2[1]}-${m2[2].padStart(2, '0')}-${m2[3].padStart(2, '0')} ${(m2[5] || '00').padStart(2, '0')}:${(m2[6] || '00').padStart(2, '0')}`;
      }

      const m8 = str.match(/^(20\d{2})(\d{2})(\d{2})(?:\s*(\d{2}):?(\d{2}))?/);
      if (m8) {
        return `${m8[1]}-${m8[2]}-${m8[3]} ${m8[4] || '00'}:${m8[5] || '00'}`;
      }

      const m6 = str.match(/^(\d{2})(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])$/);
      if (m6) {
        return `20${m6[1]}-${m6[2]}-${m6[3]} 00:00`;
      }

      const mShort = str.match(/^(\d{1,2})[\-\.\/](\d{1,2})(?:\s+(\d{1,2}):(\d{1,2}))?/);
      if (mShort) {
        const m = mShort[1].padStart(2, '0');
        const d = mShort[2].padStart(2, '0');
        const hh = (mShort[3] || '00').padStart(2, '0');
        const mm = (mShort[4] || '00').padStart(2, '0');
        let y = currentYear;
        if (`${y}-${m}-${d}` > todayYmd) y -= 1;
        return `${y}-${m}-${d} ${hh}:${mm}`;
      }

      return nowKstStr;
    };

    const DEFAULT_CATEGORIES = [

    //   선급금·복지포인트처럼 지급과 공제에 같은 금액이 있어도 실제로 받은(세금도 붙는) 돈이므로 따로 빼지 않음
    // =====================================================================
    const PS_GROUPS = ['4대보험', '세금', '연말정산', '기타'];
    // 명세서 유형 (급여유형 칸). 빈 값(v1.32 이전 저장분)은 월급여
    const PS_TYPES = ['월급여', '상여', '성과급', '연말정산', '기타'];
    function payslipTypeOf(t) {
      const s = String(t || '').replace(/\s+/g, '');
      if (!s) return '월급여';
      if (PS_TYPES.includes(s)) return s;
      if (/성과|인센티브|PS|PI/i.test(s)) return '성과급';
      if (/상여|보너스|명절/.test(s)) return '상여';
      if (/연말정산/.test(s)) return '연말정산';
      if (/월급|급여|정기|기본/.test(s)) return '월급여';
      return '기타';
    }
    const isBonusType = (t) => ['상여', '성과급'].includes(payslipTypeOf(t));

    // 🏠 대출 도우미
    const numOf = (v) => Math.round(Number(String(v ?? '').replace(/[^0-9.-]/g, '')) || 0);
    // 조기상환: 수수료가 붙었거나, 원금이 100만원 이상이면서 이자의 2배를 넘음 (정기 납부는 이자가 대부분)
    const loanPayKind = (p) => (Number(p.fee) > 0 || (Number(p.principal) >= 1000000 && Number(p.principal) > Number(p.interest) * 2)) ? '조기상환' : '정기';
    // 지금 잔액 = 기준일 잔액 − 그 뒤에 갚은 원금 (기준일이 없으면 최초 금액 − 저장된 원금 합)
    function loanBalanceNow(loan, pays) {
      const mine = (pays || []).filter(p => p.loan_id === loan.id);
      if (loan.balance_date && Number(loan.balance) > 0) {
        return Math.max(0, Number(loan.balance) - mine.filter(p => p.pay_date > loan.balance_date).reduce((t, p) => t + (Number(p.principal) || 0), 0));
      }
      return Math.max(0, Number(loan.principal || 0) - mine.reduce((t, p) => t + (Number(p.principal) || 0), 0));
    }
    // 🏦 저축(적금·예금) 도우미
    const SAV_TAX = { '일반': 0.154, '세금우대': 0.095, '비과세': 0 };
    const monthsBetweenYmd = (a, b) => {   // a~b 사이 개월 수 (같은 날짜 기준, 모자라면 내림)
      if (!/^\d{4}-\d{2}-\d{2}$/.test(a || '') || !/^\d{4}-\d{2}-\d{2}$/.test(b || '')) return 0;
      let n = (Number(b.slice(0, 4)) - Number(a.slice(0, 4))) * 12 + Number(b.slice(5, 7)) - Number(a.slice(5, 7));
      if (Number(b.slice(8)) < Number(a.slice(8))) n -= 1;
      return Math.max(0, n);
    };
    // 만기 예상 (단리): 적금 = 월납입 × 금리 × n(n+1)/2 ÷ 12, 예금 = 원금 × 금리 × 일수 ÷ 365
    function savingsExpected(a) {
      const rate = Number(a.rate) || 0;
      const tax = SAV_TAX[a.tax_type] ?? 0.154;
      if (a.kind === '적금') {
        const n = monthsBetweenYmd(a.start_date, a.maturity_date);
        const principal = (Number(a.monthly) || 0) * n;
        const interest = Math.floor((Number(a.monthly) || 0) * rate / 100 * n * (n + 1) / 2 / 12);
        return { n, principal, interest, afterTax: principal + interest - Math.floor(interest * tax) };
      }
      if (a.kind === '예금') {
        const days = /^\d{4}-\d{2}-\d{2}$/.test(a.start_date || '') && /^\d{4}-\d{2}-\d{2}$/.test(a.maturity_date || '')
          ? Math.max(0, Math.round((Date.UTC(+a.maturity_date.slice(0, 4), +a.maturity_date.slice(5, 7) - 1, +a.maturity_date.slice(8)) - Date.UTC(+a.start_date.slice(0, 4), +a.start_date.slice(5, 7) - 1, +a.start_date.slice(8))) / 86400000)) : 0;
        const principal = Number(a.principal) || 0;
        const interest = Math.floor(principal * rate / 100 * days / 365);
        return { n: 1, principal, interest, afterTax: principal + interest - Math.floor(interest * tax) };
      }
      return null;   // 자유 입금(청약·연금·투자 등): 예상액 계산 안 함
    }
    // 자동으로 넣을 납입: 적금은 시작 달부터 매달 납입일(첫 달은 시작일)에, 예금은 시작일에 원금 한 번. 오늘까지·만기 전까지
    function savingsDueRows(a, todayYmd) {
      if (a.status !== '진행' || !/^\d{4}-\d{2}-\d{2}$/.test(a.start_date || '') || a.start_date > todayYmd) return [];
      if (a.kind === '예금') return Number(a.principal) > 0 && !(a.skip_months || []).includes(a.start_date.slice(0, 7)) ? [{ id: `sv-${a.id}-dep`, pay_date: a.start_date, amount: Number(a.principal), seq: 1 }] : [];
      if (a.kind !== '적금' || !a.auto || !(Number(a.monthly) > 0)) return [];
      const out = [];
      const skip = Array.isArray(a.skip_months) ? a.skip_months : [];
      let y = Number(a.start_date.slice(0, 4)), m = Number(a.start_date.slice(5, 7));
      for (let k = 1; k <= 600; k++) {
        const ym = `${y}-${String(m).padStart(2, '0')}`;
        const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
        const day = k === 1 ? Number(a.start_date.slice(8)) : Math.min(Number(a.pay_day) || Number(a.start_date.slice(8)), last);
        const d = `${ym}-${String(day).padStart(2, '0')}`;
        if (d > todayYmd || (a.maturity_date && d >= a.maturity_date)) break;
        if (!skip.includes(ym)) out.push({ id: `sv-${a.id}-${ym.replace('-', '')}`, pay_date: d, amount: Number(a.monthly), seq: k });
        m += 1; if (m > 12) { m = 1; y += 1; }
      }
      return out;
    }

    // 남은 납부 횟수: 오늘 다음 납부일부터 만기까지 (매달 만기일과 같은 날 납부)
    function monthsLeft(todayYmd, maturity) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(maturity || ''), t = /^(\d{4})-(\d{2})-(\d{2})$/.exec(todayYmd || '');
      if (!m || !t) return null;
      let first = (+t[1]) * 12 + (+t[2] - 1) + (+t[3] >= +m[3] ? 1 : 0);
      const last = (+m[1]) * 12 + (+m[2] - 1);
      return Math.max(0, last - first + 1);
    }
    function payslipGroupOf(name) {
      const n = String(name || '');
      if (/연말정산|정산(소득|지방)/.test(n)) return '연말정산';
      if (/건강|국민연금|연금|고용|장기요양|산재/.test(n)) return '4대보험';
      if (/소득세|지방소득|주민세|농특세/.test(n)) return '세금';
      return '기타';
    }
    function payslipTotals(p) {
      const sum = (arr, f = () => true) => (arr || []).filter(f).reduce((t, x) => t + (Number(x.amount) || 0), 0);
      const grp = (x) => (x.group && x.group !== '상계' ? x.group : payslipGroupOf(x.name));   // v1.31의 '상계' 표시는 이름으로 다시 묶음
      const gross = sum(p.earnings), ded = sum(p.deductions);
      return {
        gross, ded, net: gross - ded,
        insurance: sum(p.deductions, x => grp(x) === '4대보험'),
        tax: sum(p.deductions, x => grp(x) === '세금'),
        yearEnd: sum(p.deductions, x => grp(x) === '연말정산'),
        other: sum(p.deductions, x => grp(x) === '기타')
      };
    }

    // =====================================================================
    // ★ 가맹점 분류 규칙 — 위에서부터 먼저 맞는 규칙 하나만 적용
    //   Supabase 설정 SQL의 store_category() 함수와 같은 순서·같은 규칙이어야 합니다.
    //   (규칙을 바꾸면 SQL 쪽도 같이 바꾸세요)
    // =====================================================================
    const CLASSIFY_RULES = [
      { test: s => /주차|하이패스|톨게이트/i.test(s), cat: '교통/차량', sub: '주차/톨게이트' },
      { test: s => /택시|카카오T|코레일|KTX|SRT|철도|승차권|버스|지하철|티머니|후불교통/i.test(s), cat: '교통/차량', sub: '대중교통' },
      { test: s => /주유|칼텍스|에너지|엔크린|S-OIL|오일뱅크|휘발유|경유|LPG|충전소/i.test(s), cat: '교통/차량', sub: '주유비' },
      { test: s => /현대자동차|기아자동차|오토큐|블루핸즈|카센터|정비|공업사|타이어|스피드메이트|오토오아시스|카포스|자동차부품/i.test(s), cat: '교통/차량', sub: '차량정비/부품' },
      { test: s => /푸드코트|푸드\s*코트|FOOD\s*COURT/i.test(s), cat: '식비', sub: '외식/회식' },
      { test: s => /편의점|GS25|(^|[^A-Z])CU([^A-Z]|$)|세븐일레븐|이마트24|미니스톱/i.test(s), cat: '장보기', sub: '편의점' },
      { test: s => /배달의민족|배민|우아한형제들|요기요|위대한상상|쿠팡이츠/i.test(s), cat: '식비', sub: '배달음식' },
      { test: s => /넷플릭스|NETFLIX|유튜브|YOUTUBE|멜론|지니뮤직|스포티파이|SPOTIFY|디즈니|DISNEY|티빙|웨이브|쿠팡와우|와우멤버십|네이버플러스|애플뮤직|ICLOUD|APPLE\.COM/i.test(s), cat: '주거/고정비', sub: '구독' },
      { test: s => /CGV|메가박스|롯데시네마|영화|티켓링크|인터파크|공연|뮤지컬/i.test(s), cat: '여가/문화', sub: '영화/공연' },
      { test: s => /호텔|리조트|펜션|모텔|야놀자|여기어때|에어비앤비|AIRBNB|아고다|AGODA|대한항공|아시아나|제주항공|진에어|티웨이|에어부산|하나투어|모두투어/i.test(s), cat: '여가/문화', sub: '여행/숙박' },
      { test: s => /헬스|피트니스|필라테스|요가|골프|볼링|수영장|클라이밍|스포츠센터/i.test(s), cat: '여가/문화', sub: '운동/취미' },
      { test: s => /교보문고|영풍문고|알라딘|예스24|YES24|서점/i.test(s), cat: '여가/문화', sub: '도서' },
      { test: s => /무신사|지그재그|에이블리|29CM|W컨셉|유니클로|UNIQLO|ZARA|H&M|탑텐|스파오|에잇세컨즈|나이키|NIKE|아디다스|뉴발란스/i.test(s), cat: '쇼핑/미용', sub: '의류/잡화' },
      { test: s => /올리브영|아리따움|이니스프리|세포라|롭스/i.test(s), cat: '쇼핑/미용', sub: '화장품' },
      { test: s => /하이마트|전자랜드|디지털프라자|LG전자|삼성전자|애플스토어|이케아|IKEA|한샘|오늘의집|까사미아/i.test(s), cat: '쇼핑/미용', sub: '가전/가구' },
      { test: s => /미용실|미용원|헤어|바버|BARBER|이발|네일|국화살롱/i.test(s), cat: '쇼핑/미용', sub: '미용실' },
      { test: s => /쿠팡|네이버페이|스마트스토어|11번가|G마켓|지마켓|옥션|컬리|SSG|알리익스프레스|테무/i.test(s), cat: '장보기', sub: '온라인쇼핑' },
      { test: s => /다이소|모던하우스/i.test(s), cat: '장보기', sub: '생활용품' },
      { test: s => /이마트|홈플러스|롯데마트|하나로|코스트코|트레이더스|빅마켓|메가마트/i.test(s), cat: '장보기', sub: '대형마트' },
      { test: s => /마트|슈퍼|식자재|할인점/.test(s) && !/스마트/.test(s), cat: '장보기', sub: '동네마트/슈퍼' },   // 동네 마트·슈퍼 (성광주할인마트 등)
      { test: s => /어린이집|유치원|학원|공부방|키즈클럽/i.test(s), cat: '육아/교육', sub: '어린이집/학원' },
      { test: s => /토이저러스|장난감|완구|아이들나라/i.test(s), cat: '육아/교육', sub: '장난감/책' },
      { test: s => /베이비|유아용품|분유|기저귀/i.test(s), cat: '육아/교육', sub: '아기용품' },
      { test: s => /약국/i.test(s), cat: '의료/건강', sub: '약국' },
      { test: s => /치과/i.test(s), cat: '의료/건강', sub: '치과' },
      { test: s => /병원|의원|소아과|산부인과|내과|이비인후과|피부과|안과|정형외과|한의원|검진/i.test(s), cat: '의료/건강', sub: '병원' },
      { test: s => /꽃집|플라워|FLOWER|화원/i.test(s), cat: '경조사/선물', sub: '선물' },
      { test: s => /스타벅스|STARBUCKS|투썸|카페|커피|베이커리|파리바게|뚜레쥬르|성심당|메가MGC|빽다방|이디야|컴포즈|배스킨|던킨/i.test(s), cat: '식비', sub: '카페/간식' },
      { test: s => /한우|갈비|식당|회관|김밥|분식|국밥|돈까스|피자|치킨|버거|맥도날드|롯데리아|명가|맘스터치|서브웨이/i.test(s), cat: '식비', sub: '외식/회식' },
      { test: s => /관리비/i.test(s), cat: '주거/고정비', sub: '관리비' },
      { test: s => /도시가스|한전|한국전력|수도요금|상수도|가스공사/i.test(s), cat: '주거/고정비', sub: '공과금' },
      { test: s => /보험|삼성생명|한화생명|교보생명|라이나|메리츠|현대해상|삼성화재|흥국화재|DB손해|KB손해|한화손해|롯데손해/i.test(s), cat: '주거/고정비', sub: '보험' },
      { test: s => /SK브로드밴드|SK텔레콤|SKT|케이티|LG유플러스|LGU\+|통신요금/i.test(s) || /(^|[^A-Z])KT([^A-Z]|$)/i.test(s), cat: '주거/고정비', sub: '통신비' },
      { test: s => /백화점|롯데쇼핑|갤러리아|AK플라자|아울렛|아웃렛/i.test(s), cat: '쇼핑/미용', sub: '의류/잡화' },   // v1.73
    ];

    // 새 버전에서 기본 분류에 추가된 세부 항목: 기존 가계부에도 한 번만 넣어 줌
    //   (seeded에 기록해 두어, 사용자가 지우면 다시 넣지 않음)
    const NEW_DEFAULT_SUBS = [{ cat: '주거/고정비', sub: '대출상환', after: '공과금' }];   // v1.34~: 대출 상환(원금+이자)
    // 새 버전에서 기본 분류에 추가된 대분류: 기존 가계부에도 한 번만 넣어 줌 ('기타' 앞에. 표시는 '기타'의 seeded에 'cat:이름')
    const NEW_DEFAULT_CATS = ['저축/투자'];   // v1.53~: 적금·예금 납입을 지출로
    function seedNewDefaultSubs(cats) {
      let changed = false;
      let list = cats;
      for (const name of NEW_DEFAULT_CATS) {
        const markHolder = list.find(c => c.name === '기타') || list[0];
        const mark = 'cat:' + name;
        if (!markHolder || (markHolder.seeded || []).includes(mark)) continue;
        const def = DEFAULT_CATEGORIES.find(c => c.name === name);
        const has = list.some(c => c.name === name);
        const withMark = list.map(c => c === markHolder ? { ...c, seeded: [...(c.seeded || []), mark] } : c);
        if (!has && def) {
          const i = withMark.findIndex(c => c.name === '기타');
          withMark.splice(i >= 0 ? i : withMark.length, 0, { ...def, id: list.some(c => c.id === def.id) ? 'c-' + Date.now() : def.id });
        }
        list = withMark;
        changed = true;
      }
      const next = list.map(c => {
        const adds = NEW_DEFAULT_SUBS.filter(x => x.cat === c.name && !c.subs.includes(x.sub) && !(c.seeded || []).includes(x.sub));
        const marks = NEW_DEFAULT_SUBS.filter(x => x.cat === c.name && c.subs.includes(x.sub) && !(c.seeded || []).includes(x.sub));
        if (adds.length === 0 && marks.length === 0) return c;
        changed = true;
        const subs = [...c.subs];
        for (const a of adds) { const i = subs.indexOf(a.after); subs.splice(i >= 0 ? i + 1 : subs.length, 0, a.sub); }
        return { ...c, subs, seeded: [...(c.seeded || []), ...adds.map(a => a.sub), ...marks.map(a => a.sub)] };
      });
      return changed ? next : null;
    }

    // 가맹점 이름으로 분류. 사용자가 그 분류를 지웠으면 '기타'(없으면 첫 분류)로
    function classifyStoreAndText(store, categories) {
      const rule = CLASSIFY_RULES.find(r => r.test(String(store || '')));
      const fallback = categories.find(c => c.name === '기타') || categories.find(c => /미분류|기타/.test(c.name)) || categories[0];
      if (rule) {
        const cat = categories.find(c => c.name === rule.cat);
        if (cat) return { category: cat.name, sub_category: cat.subs.includes(rule.sub) ? rule.sub : (cat.subs[0] || '미분류') };
      }
      return { category: fallback?.name || '기타', sub_category: fallback?.subs?.[0] || '미분류' };
    }

    // =====================================================================
    // ★ 카드 구분 — 설정 SQL의 card_issuer_norm / parse_card_ref / card_num_match / card_owner와 같은 규칙
    //   카드번호는 뒤 4자리만 다루고, 가려진 자리는 '*'로 둡니다 (예: 롯데 1*3*)
    // =====================================================================
    const CARD_ISSUER_SRC = 'KB국민|국민|KB|신한|삼성|현대|롯데|하나|외환|우리|NH농협|농협|NH|IBK기업|IBK|기업|비씨|BC|씨티|시티|카카오뱅크|카카오|토스뱅크|토스|케이뱅크|K뱅크|수협|광주|전북|제주|부산|경남|DGB|대구|BNK|SC제일|SC|우체국|저축은행|새마을|MG|신협';
    const CARD_ISSUER_RE = new RegExp(CARD_ISSUER_SRC);
    const CARD_NAME_LINE_RE = new RegExp(`^(${CARD_ISSUER_SRC})\\S*카드|^(체크|신용|법인|선불|기프트)?카드(\\s|$)|카드\\s*[(\\[]|체크\\s*\\(|https?:\\/\\/|www\\.`);
    const CARD_ID_LINE_RE = new RegExp(`^(${CARD_ISSUER_SRC})\\S{0,6}\\s*[(\\[]?[0-9*]{4}[)\\]]?$`);
    const ISSUER_NORM_RULES = [
      [/KB|국민/i, 'KB국민'], [/NH|농협/i, 'NH농협'], [/IBK|기업/i, 'IBK기업'], [/BC|비씨/i, 'BC'],
      [/씨티|시티/, '씨티'], [/하나|외환/, '하나'], [/카카오/, '카카오뱅크'], [/토스/, '토스뱅크'],
      [/케이뱅크|K뱅크/i, '케이뱅크'], [/SC/i, 'SC제일'], [/DGB|대구/i, 'DGB대구'], [/MG|새마을/i, 'MG새마을'],
      [/신한/, '신한'], [/삼성/, '삼성'], [/현대/, '현대'], [/롯데/, '롯데'], [/우리/, '우리'], [/수협/, '수협'],
      [/광주/, '광주'], [/전북/, '전북'], [/제주/, '제주'], [/부산/, '부산'], [/경남/, '경남'], [/BNK/i, 'BNK'],
      [/우체국/, '우체국'], [/저축은행/, '저축은행'], [/신협/, '신협']
    ];
    // 카드사 이름 통일: '하나(구외한)', '하나카드' → '하나', '비씨카드사' → 'BC', '저축은행체크' → '저축은행'
    function normalizeCardIssuer(raw) {
      const p = String(raw || '');
      if (!p.trim()) return '';
      const rule = ISSUER_NORM_RULES.find(([re]) => re.test(p));
      if (rule) return rule[1];
      return p.replace(/\(.*?\)|(신용|체크)?카드(사)?|체크|신용|\s+/g, '').trim().slice(0, 12);
    }
    // 영수증·파일의 카드번호 → 뒤 4자리 ('5181-85**-****-0625' → '0625', '1*3*' 그대로). 숫자가 없으면 ''
    function normalizeCardNum(raw) {
      const t = String(raw || '').replace(/[＊xX#•●]/g, '*').replace(/[^0-9*]/g, '');
      const last4 = t.slice(-4);
      return last4.length === 4 && /[0-9]/.test(last4) ? last4 : '';
    }
    // 카드사 대표 발신번호 → 카드사 (문자에 카드사 이름이 없을 때만. 예: 롯데카드 'KT LOCA X구독 3*2*')
    const CARD_SENDER_ISSUER = {
      '15881688': 'KB국민', '15447000': '신한', '15888700': '삼성', '15776000': '현대', '15888100': '롯데',
      '18001111': '하나', '15889955': '우리', '16444000': 'NH농협', '15884000': 'BC'
    };
    // 문자에서 카드사·번호
    //   카드사: 금액(…원) 앞부분의 첫 카드사 이름 → 없으면 발신번호로
    //   번호: 금액 앞부분에서 숫자가 섞인 4자리 → 없으면 문자 전체에서 별표가 섞인 4자리 ('3*2*')
    function extractCardFromSms(body) {
      const TOKEN = /(^|[^0-9*,.\/:\-])([0-9*]{4})($|[^0-9*,.\/:\-])/g;
      const fullT = String(body || '').replace(/＊/g, '*').replace(/보낸\s*사람[^\n]*/g, '');
      const head = fullT.split(/[0-9][0-9,]*\s*원/)[0];
      const im = head.match(CARD_ISSUER_RE);
      let num = '';
      for (const m of head.matchAll(TOKEN)) {
        if (/[0-9]/.test(m[2])) { num = m[2]; break; }
      }
      if (!num) {
        for (const m of fullT.matchAll(TOKEN)) {
          if (/[0-9]/.test(m[2]) && m[2].includes('*')) { num = m[2]; break; }
        }
      }
      let issuer = normalizeCardIssuer(im ? im[0] : '');
      if (!issuer) {
        const sm = String(body || '').match(/보낸\s*사람\s*[:：]?\s*([0-9][0-9\- ]{6,})/);
        issuer = CARD_SENDER_ISSUER[(sm ? sm[1] : '').replace(/[^0-9]/g, '')] || '';
      }
      if (!issuer) {   // RCS 알림처럼 보낸사람이 '롯데카드' 같은 이름이면 그 이름에서
        const nm = String(body || '').match(/보낸\s*사람\s*[:：]?\s*([^\n]+)/);
        const im2 = nm ? nm[1].match(CARD_ISSUER_RE) : null;
        issuer = normalizeCardIssuer(im2 ? im2[0] : '');
      }
      return { issuer, num };
    }
    // 뒤 4자리 비교 (*는 아무 숫자)
    function cardNumMatch(a, b) {
      if (!a || !b || a.length !== 4 || b.length !== 4) return false;
      for (let i = 0; i < 4; i++) if (a[i] !== b[i] && a[i] !== '*' && b[i] !== '*') return false;
      return true;
    }
    const cardKey = (issuer, num) => `${issuer || ''}|${num || ''}`;
    // 같은 카드로 연결된 대표 카드까지 따라감 (최대 5단계)
    function cardRoot(cards, entry) {
      let cur = entry;
      for (let i = 0; i < 5 && cur && cur.link_to; i++) {
        const next = cards.find(c => c.id === cur.link_to);
        if (!next) break;
        cur = next;
      }
      return cur;
    }
    // ① 카드사·번호가 똑같은 카드 ② 없으면 번호가 맞는 같은 카드사 카드들이 모두 한 대표 카드일 때
    // ③ 번호가 없으면('현대 kt M할인형 승인') 그 카드사 카드들이 모두 한 대표 카드일 때 → 대표 카드
    function resolveCard(cards, issuer, num) {
      if (!Array.isArray(cards) || (!issuer && !num)) return null;
      if (num) {
        const exact = cards.find(c => c.issuer === issuer && c.num === num);
        if (exact) return cardRoot(cards, exact);
      }
      const roots = [...new Set(cards.filter(c => c.issuer === issuer && (!num || cardNumMatch(c.num, num))).map(c => cardRoot(cards, c).id))];
      return roots.length === 1 ? cards.find(c => c.id === roots[0]) : null;
    }
    // 결제자 자동 지정은 카드번호가 맞을 때만. 번호 없는 문자('현대 kt M할인형')는 카드사만으로 정하지 않음
    //   (아직 등록 안 된 배우자의 같은 카드사 카드일 수 있음 → 문자를 보낸 폰의 사람이 결제자)
    const cardOwner = (cards, issuer, num) => {
      if (!num) return null;
      const root = resolveCard(cards, issuer, num);
      return root && root.owner ? root.owner : null;   // 카드 주인 = 구성원 key ('남편', '아내', 'm3' …)
    };
    // 카드 이름: 붙인 이름 → 없으면 묶음 안에서 번호가 다 보이는 카드 기준 ('롯데 1*3*' 묶음에 1234가 있으면 '롯데 1234')
    const cardDisplayName = (c, cards = []) => {
      if (!c) return '';
      if (c.name) return c.name;
      const full = cards.find(m => m.num && !m.num.includes('*') && cardRoot(cards, m).id === c.id);
      const shown = full && c.num.includes('*') ? full : c;
      return `${shown.issuer || c.issuer || '카드'} ${shown.num}`.trim();
    };
    // 내역 한 줄의 결제 수단 이름
    // =====================================================================
    // ★ 품목별 분류: 영수증 한 건 안에서 품목마다 분류가 다를 수 있음 (코스트코: 식재료 + 생필품 …)
    //   items[i] = { name, price, category?, sub_category? }
    // =====================================================================
    // 분류 목록에 있는 이름인지 확인해 맞는 것만 남김
    function cleanItemCategory(it, categories) {
      const cat = categories.find(c => c.name === it.category);
      if (!cat) { const { category, sub_category, ...rest } = it; return rest; }
      return { ...it, category: cat.name, sub_category: cat.subs.includes(it.sub_category) ? it.sub_category : (cat.subs[0] || '') };
    }
    // 품목 금액이 가장 큰 분류 (영수증 전체의 대표 분류). 품목에 분류가 없으면 null
    function dominantItemCategory(items) {
      const sums = new Map();
      for (const it of items || []) {
        if (!it.category) continue;
        const key = `${it.category}|${it.sub_category || ''}`;
        sums.set(key, (sums.get(key) || 0) + (Number(it.price) || 0));
      }
      if (sums.size === 0) return null;
      const catTotals = new Map();
      for (const [key, v] of sums) { const c = key.split('|')[0]; catTotals.set(c, (catTotals.get(c) || 0) + v); }
      // 금액 크기(절댓값)로 비교: 취소 영수증은 품목이 모두 음수라 그냥 비교하면 가장 작은 품목이 뽑힘
      const topCat = [...catTotals].sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]))[0][0];
      const topSub = [...sums].filter(([k]) => k.split('|')[0] === topCat).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]))[0][0].split('|')[1];
      return { category: topCat, sub_category: topSub };
    }
    // 대표 분류를 바꿀 때: 예전 대표 분류와 같던 품목들도 새 분류로 따라감
    function retargetItems(items, oldCat, oldSub, newCat, newSub) {
      return (items || []).map(it => it.category === oldCat && (it.sub_category || '') === (oldSub || '')
        ? { ...it, category: newCat, sub_category: newSub } : it);
    }
    // 품목 분류를 모두 지움 → 품목이 내역의 대표 분류를 따름 (통계도 대표 분류로)
    const clearItemCategories = (items) => (items || []).map(({ category, sub_category, ...rest }) => rest);
    const hasItemCategories = (items) => (items || []).some(it => it.category);

    // 통계용: 내역 한 건을 품목 분류대로 나눔. 분류 없는 품목·차액(부가세 반올림 등)은 내역의 분류로
    function splitExpenseByCategory(e) {
      const its = (e.items || []).filter(it => it.category);
      if (its.length === 0) return [{ category: e.category, sub_category: e.sub_category, amount: e.amount }];
      const parts = its.map(it => ({ category: it.category, sub_category: it.sub_category || '', amount: Number(it.price) || 0, name: it.name || '' }));
      const rest = e.amount - parts.reduce((sum, x) => sum + x.amount, 0);
      if (rest !== 0) parts.push({ category: e.category, sub_category: e.sub_category, amount: rest });
      return parts;
    }

    // 영수증 날짜 점검: 오늘과 너무 먼데 월·일을 바꾸면 최근 날짜가 되면 바꿈
    //   (코스트코 '11/01/2026'을 AI가 1월 11일로 읽는 경우 등). 바꿨는지·이상한지도 알려 줌
    const RECEIPT_PAST_DAYS = 45;   // 이보다 오래된 영수증 날짜는 확인 요청
    function checkReceiptDate(dateStr) {
      const today = getKSTDateTimeString().slice(0, 10);
      const dayDiff = (ymd) => (Date.parse(ymd) - Date.parse(today)) / 86400000;
      const plausible = (ymd) => { const d = dayDiff(ymd); return !isNaN(d) && d <= 1 && d >= -RECEIPT_PAST_DAYS; };
      const ymd = dateStr.slice(0, 10), rest = dateStr.slice(10);
      if (plausible(ymd)) return { date: dateStr, swappedFrom: '', odd: false };
      const [y, m, d] = ymd.split('-');
      const swapped = `${y}-${d}-${m}`;
      if (m !== d && +d >= 1 && +d <= 12 && plausible(swapped)) return { date: swapped + rest, swappedFrom: ymd, odd: false };
      return { date: dateStr, swappedFrom: '', odd: true };
    }

    function payLabel(cards, e) {
      if (e.pay_method === '현금') return '💵 현금';
      if (e.pay_method === '계좌이체') return '🏦 계좌이체';
      if (!e.card_issuer && !e.card_num) return e.pay_method === '카드' ? '💳 카드' : '';
      const root = resolveCard(cards, e.card_issuer, e.card_num);
      return '💳 ' + (root ? cardDisplayName(root, cards) : `${e.card_issuer || '카드'} ${e.card_num}`.trim());
    }
    // 처음 보는 카드번호를 카드 목록에 자동 등록. 바뀐 게 없으면 null
    //   번호가 맞는(* 포함) 같은 카드사 카드가 한 대표 카드로만 모이면 '같은 카드'로 자동 연결
    function registerNewCards(cards, refs) {
      let next = Array.isArray(cards) ? [...cards] : [];
      let changed = false;
      // 번호가 다 보이는 카드(1234)를 먼저 등록해야 그 카드가 대표가 되고 가려진 번호(1*3*)가 밑으로 붙음
      const ordered = [...refs].sort((a, b) => String(a?.num || '').includes('*') - String(b?.num || '').includes('*'));
      for (const r of ordered) {
        if (!r || !r.num || !/[0-9]/.test(r.num)) continue;
        const id = cardKey(r.issuer, r.num);
        if (next.some(c => c.id === id || (c.issuer === r.issuer && c.num === r.num))) continue;
        // 후보 대표 카드: 번호가 맞는 카드가 있고, 그 묶음 안의 전체 번호(별표 없는)와도 모두 맞아야 함
        //   (예: 1*3*·1234 묶음에 1534는 넣지 않음)
        const roots = [...new Set(next.filter(c => c.issuer === r.issuer && cardNumMatch(c.num, r.num)).map(c => cardRoot(next, c).id))]
          .filter(rootId => next.filter(c => cardRoot(next, c).id === rootId && !c.num.includes('*')).every(c => cardNumMatch(c.num, r.num)));
        next.push({
          id, issuer: r.issuer || '', num: r.num, name: '', owner: '',
          link_to: roots.length === 1 ? roots[0] : null,
          auto_linked: roots.length === 1,
          first_seen: String(r.date || '').slice(0, 10)
        });
        changed = true;
      }
      return changed ? next : null;
    }
    // 결제 수단 선택값 ↔ 내역 필드: 'card:하나|0625', 'cash', 'transfer'(계좌이체·자동이체), 'none'
    const payValueOf = (e) => e.pay_method === '현금' ? 'cash' : e.pay_method === '계좌이체' ? 'transfer' : (e.card_issuer || e.card_num) ? `card:${e.card_issuer || ''}|${e.card_num || ''}` : (e.pay_method === '카드' ? 'card:|' : 'none');
    function payFieldsOf(value) {
      if (value === 'cash') return { pay_method: '현금', card_issuer: '', card_num: '' };
      if (value === 'transfer') return { pay_method: '계좌이체', card_issuer: '', card_num: '' };
      if (value && value.startsWith('card:')) {
        const [issuer, num] = value.slice(5).split('|');
        return { pay_method: '카드', card_issuer: issuer || '', card_num: num || '' };
      }
      return { pay_method: '', card_issuer: '', card_num: '' };
    }

    // =====================================================================
    // ★ 메모 = 사용자가 쓰는 칸 (예: 부모님과 함께 식사). 등록 경로는 source로 따로 표시
    //   예전 버전이 메모 칸에 자동으로 넣던 문구는 메모로 보지 않음 (SQL v1.28이 서버에서도 지움)
    // =====================================================================
    const SYSTEM_MEMO_RE = /^\s*(문자 자동(등록|인식)( · [0-9]+)?|문자 붙여넣기|승인취소 자동반영|승인취소 상계|영수증 AI 인식|파일 일괄등록|후불교통 정산( · 문자 자동등록( · [0-9]+)?)?)\s*$/;
    function userMemo(memo) {
      const m = String(memo || '').replace(/\s*\(영수증 품목 병합\)/g, '').trim();
      return SYSTEM_MEMO_RE.test(m) ? '' : m;
    }
    const SOURCE_LABELS = {
      '자동문자수신': '📩 문자', '카드문자': '📩 문자', '승인취소문자': '↩️ 취소 문자',
      '영수증스캔': '📷 영수증', '영수증+내역병합': '📩📷 문자+영수증',
      'CSV일괄등록': '📄 파일', '엑셀일괄등록': '📄 파일', '직접입력': '✍️ 직접', '대출상환': '🏠 대출', '급여명세서': '💼 급여', '저축': '🏦 저축'
    };
    const sourceLabel = (src) => SOURCE_LABELS[src] || src || '';

    // =====================================================================
    // ★ 구성원: 내역·카드·급여·대출·저축·예산에는 key를 저장하고 화면에는 이름을 보여줌
    //   처음 두 명의 key는 예전 그대로 '남편'·'아내' (이름만 바꿈) → 기존 내역을 옮기지 않아도 됨
    //   새 구성원 key는 'm3'·'m4' … (문자 자동연동 헤더 x-payer에도 그대로 씀)
    // =====================================================================
    const MEMBER_MAX = 6;
    const MEMBER_COLORS = {
      blue:    { on: 'bg-blue-600 text-white',    badge: 'bg-blue-500/20 text-blue-300' },
      pink:    { on: 'bg-pink-600 text-white',    badge: 'bg-pink-500/20 text-pink-300' },
      emerald: { on: 'bg-emerald-600 text-white', badge: 'bg-emerald-500/20 text-emerald-300' },
      amber:   { on: 'bg-amber-600 text-white',   badge: 'bg-amber-500/20 text-amber-300' },
      violet:  { on: 'bg-violet-600 text-white',  badge: 'bg-violet-500/20 text-violet-300' },
      cyan:    { on: 'bg-cyan-600 text-white',    badge: 'bg-cyan-500/20 text-cyan-300' }
    };
    const DEFAULT_MEMBERS = [
      { key: '남편', name: '남편', emoji: '👨', color: 'blue' },
      { key: '아내', name: '아내', emoji: '👩', color: 'pink' }
    ];
    // 서버 값 정리: 처음 두 명은 늘 있음 (이름·이모지·색만 바꿀 수 있음)
    function normalizeMembers(list) {
      const arr = Array.isArray(list) ? list.filter(m => m && typeof m.key === 'string' && m.key) : [];
      const out = DEFAULT_MEMBERS.map(d => ({ ...d, ...(arr.find(m => m.key === d.key) || {}) }));
      for (const m of arr) if (!out.some(o => o.key === m.key) && out.length < MEMBER_MAX) out.push({ emoji: '🙂', color: 'emerald', ...m });
      return out.map(m => ({ key: m.key, name: String(m.name || m.key).trim().slice(0, 10) || m.key, emoji: String(m.emoji || '🙂').slice(0, 4), color: MEMBER_COLORS[m.color] ? m.color : 'emerald' }));
    }

    // =====================================================================
    // ★ 카드 문자 파서 — Supabase 설정 SQL의 receive_sms()와 같은 규칙
    //   ① 광고·설문 문구가 없고 ② '승인/취소'가 있고 ③ 결제 일시(10/29 14:20)가 있어야 등록
    // =====================================================================
    const SMS_AD_PATTERN = /\(광고\)|무료\s*수신\s*거부|수신거부|설문|실태조사|당첨|경품|추첨/;
    const SMS_DATETIME_PATTERN = /\d{1,2}\s*[\/.\-]\s*\d{1,2}\s+\d{1,2}:\d{2}/;
    const SMS_CANCEL_PATTERN = /(승인|결제|매출|체크|할부|카드(\(\d+\))?)\s*취소|취소\s*(승인|완료|접수)|[0-9]\s*원\s*취소|(^|\s)취소(\s|$)/;   // '6,500원 취소'(롯데), '현대 kt M할인형 취소'(현대)

    function isCardApprovalSms(text) {
      return !SMS_AD_PATTERN.test(text) && /승인|취소/.test(text) && SMS_DATETIME_PATTERN.test(text);
    }

    // ★ 후불 교통대금 문자 — receive_sms()의 (1-1)과 같은 규칙
    //   교통카드 기능이 있는 카드는 탈 때마다 문자가 오지 않고, 모아서 이 문자 한 통이 옴 → 대중교통으로 등록
    //   '[KB국민체크]이*재님 교통대금 23,200원 11/04 체크결제계좌(607)에서 출금예정 (11/03기준)'
    //   날짜는 '기준'일(이용분 정산일), '출금 완료' 안내처럼 예정·기준이 없는 문자는 같은 돈이라 등록하지 않음
    const TRANSIT_CHARGE_RE = /교통\s*(?:대금|요금)\s*([0-9][0-9,]*)\s*원/;
    function parseTransitChargeSms(body, currentUser, cards = []) {
      if (SMS_AD_PATTERN.test(body)) return null;
      const am = body.match(TRANSIT_CHARGE_RE);
      if (!am || !/예정|기준/.test(body)) return null;
      const amount = parseInt(am[1].replace(/,/g, ''), 10);
      if (!amount || amount <= 0) return null;
      const today = getKSTDateTimeString().slice(0, 10);
      let date = today;
      const bm = body.match(/(\d{1,2})\s*[\/.]\s*(\d{1,2})\s*기준/);
      if (bm) {
        const m = parseInt(bm[1], 10), d = parseInt(bm[2], 10);
        let y = parseInt(today.slice(0, 4), 10);
        if (m >= 1 && m <= 12 && d >= 1 && d <= new Date(y, m, 0).getDate()) {
          const ymd = (yy) => `${yy}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          if (ymd(y) > today) y -= 1;
          date = ymd(y);
        }
      }
      const card = extractCardFromSms(body);
      return {
        id: 'sms-' + Date.now() + '-' + Math.random().toString(36).substring(2, 7),
        date: date + ' 00:00',
        store: '후불교통대금',
        category: '교통/차량',
        sub_category: '대중교통',
        amount,
        tax: 0,   // 대중교통 요금은 부가세 면세
        payer: cardOwner(cards, card.issuer, card.num) || currentUser,
        card_issuer: card.issuer,
        card_num: card.num,
        pay_method: '카드',
        is_business: false,
        source: '카드문자',
        verified: true,
        memo: '',
        items: []
      };
    }

    // 가맹점 줄로 쓸 수 있는지 (서버 sms_store_line_ok와 같은 규칙)
    function smsStoreLineOk(line) {
      return !!line && !(
        CARD_NAME_LINE_RE.test(line) ||   // 카드 이름 줄만 거름 ('현대카드 ZERO', '체크카드'). '스타벅스카드충전'은 남김
        /Web발신|승인|취소|누적|일시불|할부|보낸\s*사람|발신|수신|잔액|적립|안내|문의/.test(line) ||
        /[0-9][0-9,]*\s*원/.test(line) ||
        /^[0-9+\-\s:\/.]+$/.test(line) ||
        /^[*■▶•\-]/.test(line) ||
        /^\[.*\]$/.test(line) ||
        /^[가-힣A-Za-z]{1,3}\*[가-힣A-Za-z]{0,3}님?$/.test(line) ||
        /[가-힣]\*[가-힣]/.test(line) ||   // 가려진 이름이 든 줄 ('이*재 KT LOCA X구독 3*2*')
        CARD_ID_LINE_RE.test(line) ||
        /(01[016789]|02|0[3-8][0-9]|15[0-9]{2}|16[0-9]{2}|18[0-9]{2})[-\s]?[0-9]{3,4}[-\s]?[0-9]{4}/.test(line)
      );
    }

    function parseSingleSmsBlock(blockText, categories, currentUser, cards = []) {
      // 줄바꿈 없는 공백(NBSP)·전각 공백은 보통 공백으로, 폭 없는 공백은 지움
      const body = String(blockText || '').replace(/[\u00a0\u3000]/g, ' ').replace(/[\u200b\ufeff]/g, '');
      const transit = parseTransitChargeSms(body, currentUser, cards);
      if (transit) return transit;
      if (!isCardApprovalSms(body)) return null;

      const isCancel = SMS_CANCEL_PATTERN.test(body);

      const amtMatch = body.match(/([0-9][0-9,]*)\s*원/);
      if (!amtMatch) return null;
      let amount = parseInt(amtMatch[1].replace(/,/g, ''), 10);
      if (!amount || amount <= 0) return null;
      if (isCancel) amount = -amount;

      // 결제 일시: 연도가 없으면 올해, 오늘보다 미래면 작년
      let dateStr = getKSTDateTimeString();
      const dm = body.match(/(?:(20\d{2})\s*[\/.\-]\s*)?(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s+(\d{1,2}):(\d{2})/);
      if (dm) {
        const m = parseInt(dm[2], 10), d = parseInt(dm[3], 10);
        const today = getKSTDateTimeString().slice(0, 10);
        let y = dm[1] ? parseInt(dm[1], 10) : parseInt(today.slice(0, 4), 10);
        const ymd = (yy) => `${yy}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const valid = m >= 1 && m <= 12 && d >= 1 && d <= new Date(y, m, 0).getDate();
        if (valid) {
          if (!dm[1] && ymd(y) > today) y -= 1;
          dateStr = `${ymd(y)} ${dm[4].padStart(2, '0')}:${dm[5]}`;
        }
      }

      // 가맹점: 안내 줄을 걸러낸 마지막 줄, 없으면 금액 뒤 텍스트
      let store = '', pre = '';
      for (const raw of body.split(/\r?\n/)) {
        // 줄 앞의 '[Web발신]'은 떼고 봄 ('[Web발신] 롯데쇼핑㈜ 인천점 VISA' → 가맹점 줄)
        const line = raw.trim().replace(/^[\[(]?\s*Web\s*발신\s*[\])]?\s*/i, '').replace(/\s*(승인|취소)$/, '').trim();   // 'KTX 승차권 승인' → 'KTX 승차권'
        // '롯데쇼핑㈜ 인천점 VISA 191,860원 승인'처럼 가맹점과 금액이 한 줄이면 금액 앞부분 (가맹점 줄이 따로 없을 때만)
        if (!pre) { const pm = line.match(/^(.*\S)\s+[0-9][0-9,]*\s*원$/); if (pm && smsStoreLineOk(pm[1].trim())) pre = pm[1].trim(); }
        if (!smsStoreLineOk(line)) continue;
        store = line;
      }
      if (!store) store = pre;
      if (!store) {
        const tailMatch = body.match(/[0-9][0-9,]*\s*원([^\n]*)/);
        if (tailMatch) {
          store = tailMatch[1]
            .replace(/^\s*(승인|취소)(\s|$)/, ' ')   // '191,860원  승인' 뒤에 가맹점이 없으면 '승인'이 가맹점이 되지 않게
            .replace(/^\s*\(?(일시불|할부|[0-9]+개월)\)?\s*/, '')
            .replace(/^\s*(?:20\d{2}\s*[\/.\-]\s*)?\d{1,2}\s*[\/.\-]\s*\d{1,2}\s+\d{1,2}:\d{2}\s*/, '')
            .replace(/^\s*\(?(일시불|할부|[0-9]+개월)\)?\s*/, '')
            .replace(/\s*(누적|잔액|보낸\s*사람).*$/, '')
            .trim();
        }
      }
      // 끝에 붙은 카드 브랜드는 뺌 ('롯데쇼핑㈜ 인천점 VISA' → '롯데쇼핑㈜ 인천점')
      store = store.replace(/(\S)\s+(VISA|Visa|MASTER|Master|MasterCard|MASTERCARD|AMEX|Amex|JCB|UnionPay|UPI)$/, '$1').trim();
      if (!store) store = '카드결제가맹점';

      const { category, sub_category } = classifyStoreAndText(store, categories);
      const card = extractCardFromSms(body);

      return {
        id: 'sms-' + Date.now() + '-' + Math.random().toString(36).substring(2, 7),
        date: dateStr,
        store,
        category,
        sub_category,
        amount,
        tax: Math.round(amount / 11),
        payer: cardOwner(cards, card.issuer, card.num) || currentUser,
        card_issuer: card.issuer,
        card_num: card.num,
        pay_method: '카드',
        is_business: false,
        source: isCancel ? '승인취소문자' : '카드문자',
        verified: true,
        memo: '',
        items: []
      };
    }

    function splitCsvLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') inQuotes = !inQuotes;
        else if (ch === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else current += ch;
      }
      result.push(current.trim());
      return result;
    }

    const DOWNLOAD_CLEAN_HTML_FILE = () => {
      const clone = document.documentElement.cloneNode(true);
      const rootDiv = clone.querySelector('#root');
      if (rootDiv) rootDiv.innerHTML = '';
      // 실행 중에 브라우저가 덧붙인 것 제거: Babel이 변환해 넣은 스크립트(남겨두면 다시 열 때 앱이 두 번 실행됨),
      // Tailwind가 만든 스타일(다시 열면 자동으로 새로 만듦)
      clone.querySelectorAll('script:not([src]):not([type="text/babel"]):not(#sw-register):not(#ui-size)').forEach(el => el.remove());
      clone.querySelectorAll('style:not(#app-style)').forEach(el => el.remove());
      const cleanHtml = '<!DOCTYPE html>\n' + clone.outerHTML;
      const blob = new Blob([cleanHtml], { type: 'text/html;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `밑빠진독_${APP_VERSION}.html`;
      link.click();
    };

    // =====================================================================
    // ▼▼▼ [내장 SQL 스크립트 붙여넣는 공간 시작] ▼▼▼
    // =====================================================================
    const EMBEDDED_SQL_SCRIPT = "-- =====================================================================\n--  부부 AI 가계부 — 설정 SQL (스키마 버전 18, 앱 v1.74)\n--  Supabase SQL Editor에 붙여넣고 [Run]. 여러 번 실행해도 안전합니다.\n--  · 새로 설치할 때: 이 파일만 실행 (처음 한 번은 초기화 SQL을 먼저 실행해도 됨)\n--  · 스키마 1(앱 v1.1~v1.4)에서 올릴 때: 이 파일만 실행 → 기존 내역은 그대로 유지\n--\n--  [업데이트 규칙]\n--  · 열(column)은 추가만 하고 삭제·이름 변경은 하지 않습니다 (add column if not exists).\n--  · 스키마가 바뀌면 schema_version 값을 올리고, 앱의 REQUIRED_SCHEMA_VERSION도 같이 올립니다.\n--  · receive_sms(sms_text, payer_name, fam_code) 형식은 바꾸지 않습니다.\n--  · 분류 규칙(store_category)은 앱의 CLASSIFY_RULES와 같아야 합니다.\n-- =====================================================================\n\n-- 1. 스키마 버전 -------------------------------------------------------\ncreate table if not exists public.schema_meta (\n  key   text primary key,\n  value text not null\n);\ninsert into public.schema_meta (key, value) values ('schema_version', '18')\non conflict (key) do update set value = excluded.value;\n\n-- 2. 가족 설정 ---------------------------------------------------------\n--    family_code = 'fam_' + 12자 이상 보안 코드\n--    signal_id   = 문자 도착 알림용 무작위 ID (가족 코드를 노출하지 않기 위함)\n--    allowed_senders = 받을 카드사 발신번호 목록 (비어 있으면 번호 검사 안 함)\ncreate table if not exists public.family_config (\n  family_code     text primary key check (char_length(family_code) >= 16),\n  categories      jsonb not null default '[]'::jsonb,\n  allowed_senders jsonb not null default '[]'::jsonb,\n  signal_id       text not null default replace(gen_random_uuid()::text, '-', ''),\n  updated_by      text,\n  updated_at      timestamptz not null default now()\n);\n-- [스키마 2] 카드 목록: [{id, issuer, num, name, owner, link_to, auto_linked, first_seen}]\n--   num은 카드번호 뒤 4자리(가려진 자리는 *), link_to는 '같은 카드'로 연결한 대표 카드 id\nalter table public.family_config add column if not exists cards jsonb not null default '[]'::jsonb;\n-- [스키마 5] 수입 분류 목록 (비어 있으면 앱의 기본 수입 분류: 급여·부수입·금융·환급/지원·용돈/기타)\nalter table public.family_config add column if not exists income_categories jsonb not null default '[]'::jsonb;\n-- [스키마 9] 월 예산 {total: 부부 합산, 남편, 아내} (원, 지출 전체 기준 · 매달 같은 금액). 빈 값 = 예산 없음\nalter table public.family_config add column if not exists budget jsonb not null default '{}'::jsonb;\n-- [스키마 11] 구성원 [{key, name, emoji, color}]. 처음 두 명의 key는 '남편'·'아내'(이름만 바꿈), 새 구성원은 'm3'·'m4' …\n--   내역의 payer, 카드·대출·저축·명세서의 owner, 예산의 각자 금액은 이 key로 저장. 비어 있으면 앱의 기본(남편·아내)\nalter table public.family_config add column if not exists members jsonb not null default '[]'::jsonb;\n\n-- 3. 지출 내역 (1건 = 1행) ---------------------------------------------\ncreate table if not exists public.expenses (\n  id           text primary key,\n  family_code  text not null references public.family_config(family_code)\n                 on update cascade on delete cascade,\n  date         text not null,                     -- 'YYYY-MM-DD HH:mm' (KST)\n  store        text not null,\n  category     text not null default '기타/미분류',\n  sub_category text not null default '미분류',\n  amount       integer not null,                  -- 취소는 음수\n  tax          integer not null default 0,\n  payer        text not null default '남편',\n  is_business  boolean not null default false,\n  source       text not null default '직접입력',\n  verified     boolean not null default true,\n  memo         text not null default '',\n  items        jsonb not null default '[]'::jsonb,\n  updated_by   text,\n  created_at   timestamptz not null default now()\n);\ncreate index if not exists expenses_family_date_idx on public.expenses (family_code, date desc);\n-- [스키마 2] 결제 수단: 카드사(통일된 이름), 카드번호 뒤 4자리(별표 그대로), '카드'/'현금'/''\nalter table public.expenses add column if not exists card_issuer text not null default '';\nalter table public.expenses add column if not exists card_num    text not null default '';\nalter table public.expenses add column if not exists pay_method  text not null default '';\n-- [스키마 3] 휴지통: 삭제하면 지우지 않고 삭제 시각만 기록 (앱에서 복원·영구 삭제, 30일 뒤 자동 삭제)\n--   문자 중복 검사는 휴지통 내역도 포함 → 지운 결제가 같은 문자 재전송으로 되살아나지 않음\nalter table public.expenses add column if not exists deleted_at timestamptz;\n-- [스키마 5] 수입: kind = 'expense'(지출, 기본) / 'income'(수입). 수입 분류 목록은 family_config.income_categories\nalter table public.expenses add column if not exists kind text not null default 'expense';\n-- [스키마 12] 휴지통 보관: 내역을 지울 때 함께 지운 연결 기록 {type: payslip|loan_payment|savings_payment, label, row, skip_month}\n--   휴지통에서 복원할 때 되살림. 휴지통이 아닌 내역은 null\nalter table public.expenses add column if not exists linked_backup jsonb;\n\n-- 4. 문자 도착 신호 (앱 실시간 갱신용) ---------------------------------\ncreate table if not exists public.sync_signals (\n  signal_id  text primary key,\n  updated_at timestamptz not null default now()\n);\n\n-- 4-1. [스키마 6] 급여명세서 (1장 = 1행). 실수령액은 수입 내역(expenses, kind='income')으로도 등록되어 income_id로 연결\ncreate table if not exists public.payslips (\n  id              text primary key,\n  family_code     text not null references public.family_config(family_code)\n                    on update cascade on delete cascade,\n  owner           text not null default '남편',        -- 받는 사람 (남편/아내)\n  pay_month       text not null,                       -- 귀속월 'YYYY-MM'\n  pay_date        text not null default '',            -- 지급일 'YYYY-MM-DD'\n  company         text not null default '',\n  earnings        jsonb not null default '[]'::jsonb,  -- 지급 항목 [{name, amount}] (명세서에 찍힌 그대로)\n  deductions      jsonb not null default '[]'::jsonb,  -- 공제 항목 [{name, amount, group}]   group: 4대보험/세금/연말정산/기타\n  refs            jsonb not null default '[]'::jsonb,  -- 참조 [{name, value}] (근무일수 등)\n  gross           integer not null default 0,          -- 총지급계\n  deduction_total integer not null default 0,          -- 공제계 (연말정산 환급이 크면 음수)\n  net             integer not null default 0,          -- 실지급액\n  income_id       text,                                -- 연결된 수입 내역 id\n  memo            text not null default '',\n  updated_by      text,\n  created_at      timestamptz not null default now()\n);\n-- [스키마 7] 급여유형 (월급여/상여/성과급/연말정산/기타). 빈 값은 월급여로 봄\nalter table public.payslips add column if not exists pay_type text not null default '';\ncreate index if not exists payslips_family_month_idx on public.payslips (family_code, pay_month desc);\nalter table public.payslips enable row level security;\ndrop policy if exists \"payslips own\" on public.payslips;\ncreate policy \"payslips own\" on public.payslips for all\n  using      (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''))\n  with check (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''));\ngrant select, insert, update, delete on public.payslips to anon, authenticated;\n\n-- 4-2. [스키마 8] 대출 (주택담보대출 등). 1건 = 1행. 잔액은 balance_date 기준값 (그 뒤 상환한 원금은 앱이 빼서 보여줌)\n--      계좌번호·주소·담당자는 저장하지 않음\ncreate table if not exists public.loans (\n  id              text primary key,\n  family_code     text not null references public.family_config(family_code)\n                    on update cascade on delete cascade,\n  owner           text not null default '남편',        -- 이자 지출을 누구 이름으로 (남편/아내)\n  name            text not null default '',            -- 상품명 (예: 아낌e보금자리론)\n  lender          text not null default '',            -- 취급기관\n  principal       bigint not null default 0,           -- 최초 대출금액\n  balance         bigint not null default 0,           -- 대출 잔액 (balance_date 기준)\n  balance_date    text not null default '',            -- 'YYYY-MM-DD'\n  rate            numeric not null default 0,          -- 현재 적용금리 (%)\n  rate_type       text not null default '',            -- 고정금리/변동금리\n  repay_method    text not null default '',            -- 원리금체증식상환 등\n  start_date      text not null default '',\n  maturity_date   text not null default '',\n  term_months     integer not null default 0,\n  next_due        jsonb not null default '{}'::jsonb,  -- 차회 납부 {date, principal, interest, late_fee, total}\n  expense_from    text not null default '',            -- 이 달('YYYY-MM')부터 상환액을 지출 내역에 넣음. 빈 값 = 넣지 않음\n  memo            text not null default '',\n  updated_by      text,\n  created_at      timestamptz not null default now()\n);\n-- [스키마 14] 대출 계좌번호 (그 대출 자신의 번호. 자동이체 출금 계좌가 아님)\nalter table public.loans add column if not exists account_no text not null default '';\n-- 상환 1회 = 1행. 상환 합계(원금+이자+수수료)는 지출 내역(주거/고정비 › 대출상환)으로도 등록되어 expense_id로 연결\ncreate table if not exists public.loan_payments (\n  id              text primary key,\n  family_code     text not null references public.family_config(family_code)\n                    on update cascade on delete cascade,\n  loan_id         text not null references public.loans(id) on delete cascade,\n  pay_date        text not null,                       -- 'YYYY-MM-DD'\n  seq             integer,                             -- 은행 화면의 회차\n  kind            text not null default '정기',         -- 정기 / 조기상환\n  total           bigint not null default 0,           -- 합계\n  principal       bigint not null default 0,           -- 원금\n  interest        bigint not null default 0,           -- 이자\n  fee             bigint not null default 0,           -- 조기상환수수료\n  late_fee        bigint not null default 0,           -- 지연배상금\n  expense_id      text,\n  memo            text not null default '',\n  updated_by      text,\n  created_at      timestamptz not null default now()\n);\ncreate index if not exists loan_payments_loan_idx on public.loan_payments (family_code, loan_id, pay_date);\nalter table public.loan_payments add column if not exists pay_time text not null default '';   -- [스키마 18] 'HH:MM' (빈 칸이면 09:00)\nalter table public.loans enable row level security;\nalter table public.loan_payments enable row level security;\ndrop policy if exists \"loans own\" on public.loans;\ncreate policy \"loans own\" on public.loans for all\n  using      (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''))\n  with check (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''));\ndrop policy if exists \"loan_payments own\" on public.loan_payments;\ncreate policy \"loan_payments own\" on public.loan_payments for all\n  using      (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''))\n  with check (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''));\ngrant select, insert, update, delete on public.loans to anon, authenticated;\ngrant select, insert, update, delete on public.loan_payments to anon, authenticated;\n\n-- 4-3. [스키마 10] 저축 (적금 · 예금 · 청약·연금·투자 같은 자유 입금). 1개 = 1행. [스키마 13] 계좌번호(account_no)\ncreate table if not exists public.savings (\n  id               text primary key,\n  family_code      text not null references public.family_config(family_code)\n                     on update cascade on delete cascade,\n  owner            text not null default '남편',        -- 누구 돈 (납입 지출의 결제자)\n  kind             text not null default '적금',        -- 적금 / 예금 / 자유\n  name             text not null default '',            -- 상품 이름\n  bank             text not null default '',            -- 은행·증권사\n  monthly          bigint not null default 0,           -- 적금 월 납입액\n  principal        bigint not null default 0,           -- 예금 원금\n  pay_day          integer not null default 1,          -- 적금 납입일 (매달)\n  start_date       text not null default '',            -- 가입일 'YYYY-MM-DD'\n  maturity_date    text not null default '',            -- 만기일\n  rate             numeric not null default 0,          -- 금리 (%)\n  tax_type         text not null default '일반',         -- 일반 15.4% / 세금우대 9.5% / 비과세\n  auto             boolean not null default false,      -- 적금: 매달 납입일에 자동으로 납입 기록\n  expense_from     text not null default '',            -- 이 달('YYYY-MM')부터 납입액을 지출(저축/투자)로. 빈 값 = 넣지 않음\n  sub_category     text not null default '',            -- 자유 입금의 세부 분류 (청약·연금·투자 …)\n  skip_months      jsonb not null default '[]'::jsonb,  -- 자동 납입에서 뺀 달 ['YYYY-MM']\n  status           text not null default '진행',         -- 진행 / 만기 / 해지\n  closed_date      text not null default '',\n  payout           bigint not null default 0,           -- 만기·해지 때 받은 돈\n  payout_income_id text,                                -- 받은 돈을 넣은 수입 내역 id\n  memo             text not null default '',\n  updated_by       text,\n  created_at       timestamptz not null default now()\n);\n-- [스키마 13] 저축 계좌번호 (그 저축 통장의 번호. 자동이체 출금 계좌·만기 입금 계좌가 아님)\nalter table public.savings add column if not exists account_no text not null default '';\n-- 납입 1회 = 1행. 지출 내역(저축/투자)으로도 등록되면 expense_id로 연결. 자동 납입 id는 'sv-<저축 id>-<YYYYMM>'\ncreate table if not exists public.savings_payments (\n  id              text primary key,\n  family_code     text not null references public.family_config(family_code)\n                    on update cascade on delete cascade,\n  savings_id      text not null references public.savings(id) on delete cascade,\n  pay_date        text not null,                       -- 'YYYY-MM-DD'\n  amount          bigint not null default 0,\n  seq             integer,                             -- 회차\n  auto            boolean not null default false,      -- 자동으로 넣은 납입\n  expense_id      text,\n  memo            text not null default '',\n  updated_by      text,\n  created_at      timestamptz not null default now()\n);\ncreate index if not exists savings_payments_idx on public.savings_payments (family_code, savings_id, pay_date);\nalter table public.savings_payments add column if not exists pay_time text not null default '';   -- [스키마 18] 'HH:MM' (빈 칸이면 09:00)\nalter table public.savings enable row level security;\nalter table public.savings_payments enable row level security;\ndrop policy if exists \"savings own\" on public.savings;\ncreate policy \"savings own\" on public.savings for all\n  using      (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''))\n  with check (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''));\ndrop policy if exists \"savings_payments own\" on public.savings_payments;\ncreate policy \"savings_payments own\" on public.savings_payments for all\n  using      (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''))\n  with check (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''));\ngrant select, insert, update, delete on public.savings to anon, authenticated;\ngrant select, insert, update, delete on public.savings_payments to anon, authenticated;\n\n-- 4-4. [스키마 16] 자산 (부동산 · 자동차 · 기타 동산 · 통장·현금). 1개 = 1행. 값은 사용자가 직접 넣은 평가액·잔액\ncreate table if not exists public.assets (\n  id              text primary key,\n  family_code     text not null references public.family_config(family_code)\n                    on update cascade on delete cascade,\n  kind            text not null default '부동산',        -- 부동산 / 자동차 / 동산 / 통장\n  sub_kind        text not null default '',              -- 부동산: 아파트·주택·오피스텔·토지·전세보증금·기타 / 동산: 금·귀금속·회원권·기타 / 통장: 입출금·파킹·CMA·현금\n  name            text not null default '',\n  owner           text not null default '공동',          -- 명의: 구성원 key 또는 '공동'\n  value           bigint not null default 0,             -- 지금 평가액(통장은 잔액)\n  value_date      text not null default '',              -- 평가·잔액 기준일 'YYYY-MM-DD'\n  purchase_price  bigint not null default 0,             -- 산 값 (선택)\n  purchase_date   text not null default '',\n  bank            text not null default '',              -- 통장: 은행\n  account_no      text not null default '',              -- 통장: 계좌번호\n  loan_id         text,                                  -- 연결 대출 (주택담보대출 등) → 순가치 = 평가액 − 대출 잔액\n  history         jsonb not null default '[]'::jsonb,    -- 평가 기록 [{date, value}] (값을 고칠 때마다)\n  status          text not null default '보유',          -- 보유 / 처분\n  sold_date       text not null default '',\n  sold_price      bigint not null default 0,\n  memo            text not null default '',\n  updated_by      text,\n  created_at      timestamptz not null default now()\n);\ncreate index if not exists assets_family_idx on public.assets (family_code);\nalter table public.assets enable row level security;\ndrop policy if exists \"assets own\" on public.assets;\ncreate policy \"assets own\" on public.assets for all\n  using      (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''))\n  with check (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''));\ngrant select, insert, update, delete on public.assets to anon, authenticated;\n\n-- 4-5. [스키마 17] 💐 경조사 장부: 사람 · 우리 경조사(받은 부조를 묶는 행사) · 부조 기록(보냄/받음)\n--   보낸 부조는 지출(경조사/선물) 'giftx-<기록 id>'로, 받은 부조는 행사·달마다 수입 1건 'gifti-<행사 id>-<YYYYMM>'로 가계부에 들어감\ncreate table if not exists public.gift_people (\n  id           text primary key,\n  family_code  text not null references public.family_config(family_code)\n                 on update cascade on delete cascade,\n  name         text not null default '',\n  grp          text not null default '기타',     -- 소속: 친구·현직장·전직장·협력사·친척·모임·이웃·기타 (직접 추가 가능)\n  side         text not null default '공동',     -- 누구 쪽 인맥: 구성원 key 또는 '공동'\n  memo         text not null default '',\n  updated_by   text,\n  created_at   timestamptz not null default now()\n);\ncreate table if not exists public.gift_events (\n  id           text primary key,\n  family_code  text not null references public.family_config(family_code)\n                 on update cascade on delete cascade,\n  title        text not null default '',         -- 예: 우리 결혼식, 아버지 칠순\n  event_type   text not null default '결혼식',\n  event_date   text not null default '',          -- 'YYYY-MM-DD'\n  owner        text not null default '공동',      -- 누구 경조사(받은 돈 수입의 이름): 구성원 key 또는 '공동'\n  to_income    boolean not null default true,     -- 받은 부조를 행사·달마다 수입 1건으로\n  memo         text not null default '',\n  updated_by   text,\n  created_at   timestamptz not null default now()\n);\ncreate table if not exists public.gift_records (\n  id           text primary key,\n  family_code  text not null references public.family_config(family_code)\n                 on update cascade on delete cascade,\n  person_id    text not null,\n  direction    text not null default '보냄',      -- 보냄(그쪽 경조사) / 받음(우리 경조사)\n  event_id     text,                              -- 받음: gift_events.id\n  event_type   text not null default '결혼식',\n  rec_date     text not null default '',           -- 'YYYY-MM-DD'\n  amount       bigint not null default 0,\n  method       text not null default '봉투',      -- 직접 / 봉투 / 이체 / 화환\n  who          text not null default '',          -- 보냄: 누가 갔나(구성원 key 또는 '같이')\n  status       text not null default '완료',      -- 예정 / 완료\n  expense_id   text,                              -- 보냄: 연결된 지출 내역\n  memo         text not null default '',\n  updated_by   text,\n  created_at   timestamptz not null default now()\n);\ncreate index if not exists gift_people_family_idx on public.gift_people (family_code);\ncreate index if not exists gift_events_family_idx on public.gift_events (family_code);\ncreate index if not exists gift_records_family_idx on public.gift_records (family_code, person_id);\nalter table public.gift_events add column if not exists event_time text not null default '';   -- [스키마 18] 'HH:MM' (빈 칸이면 시간 없음)\nalter table public.gift_records add column if not exists rec_time text not null default '';   -- [스키마 18] 'HH:MM' (빈 칸이면 09:00)\nalter table public.gift_people enable row level security;\nalter table public.gift_events enable row level security;\nalter table public.gift_records enable row level security;\ndrop policy if exists \"gift_people own\" on public.gift_people;\ncreate policy \"gift_people own\" on public.gift_people for all\n  using      (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''))\n  with check (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''));\ndrop policy if exists \"gift_events own\" on public.gift_events;\ncreate policy \"gift_events own\" on public.gift_events for all\n  using      (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''))\n  with check (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''));\ndrop policy if exists \"gift_records own\" on public.gift_records;\ncreate policy \"gift_records own\" on public.gift_records for all\n  using      (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''))\n  with check (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''));\ngrant select, insert, update, delete on public.gift_people to anon, authenticated;\ngrant select, insert, update, delete on public.gift_events to anon, authenticated;\ngrant select, insert, update, delete on public.gift_records to anon, authenticated;\n\n-- 5. 보안 정책: 요청 헤더 x-family-code와 같은 가족 데이터만 접근 ---------\nalter table public.schema_meta   enable row level security;\nalter table public.family_config enable row level security;\nalter table public.expenses      enable row level security;\nalter table public.sync_signals  enable row level security;\n\ndrop policy if exists \"schema_meta read\"   on public.schema_meta;\ndrop policy if exists \"family_config own\"  on public.family_config;\ndrop policy if exists \"expenses own\"       on public.expenses;\ndrop policy if exists \"sync_signals read\"  on public.sync_signals;\n\ncreate policy \"schema_meta read\" on public.schema_meta for select using (true);\n\ncreate policy \"family_config own\" on public.family_config for all\n  using      (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''))\n  with check (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''));\n\ncreate policy \"expenses own\" on public.expenses for all\n  using      (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''))\n  with check (family_code = coalesce(current_setting('request.headers', true)::json->>'x-family-code', ''));\n\n-- 신호 테이블은 읽기만 허용 (쓰기는 receive_sms 함수만)\ncreate policy \"sync_signals read\" on public.sync_signals for select using (true);\n\ndo $$\nbegin\n  if exists (select 1 from pg_publication where pubname = 'supabase_realtime')\n     and not exists (select 1 from pg_publication_tables\n                     where pubname = 'supabase_realtime' and tablename = 'sync_signals') then\n    alter publication supabase_realtime add table public.sync_signals;\n  end if;\nend $$;\n\n-- 6. 가맹점 분류 규칙 (앱의 CLASSIFY_RULES와 같은 순서·같은 규칙) ---------\ncreate or replace function public.store_category(p_store text)\nreturns text[]\nlanguage sql immutable\nas $$\n  select case\n    when p_store ~* '주차|하이패스|톨게이트' then array['교통/차량','주차/톨게이트']\n    when p_store ~* '택시|카카오T|코레일|KTX|SRT|철도|승차권|버스|지하철|티머니|후불교통' then array['교통/차량','대중교통']\n    when p_store ~* '주유|칼텍스|에너지|엔크린|S-OIL|오일뱅크|휘발유|경유|LPG|충전소' then array['교통/차량','주유비']\n    when p_store ~* '현대자동차|기아자동차|오토큐|블루핸즈|카센터|정비|공업사|타이어|스피드메이트|오토오아시스|카포스|자동차부품' then array['교통/차량','차량정비/부품']\n    when p_store ~* '푸드코트|푸드\\s*코트|FOOD\\s*COURT' then array['식비','외식/회식']\n    when p_store ~* '편의점|GS25|(^|[^A-Z])CU([^A-Z]|$)|세븐일레븐|이마트24|미니스톱' then array['장보기','편의점']\n    when p_store ~* '배달의민족|배민|우아한형제들|요기요|위대한상상|쿠팡이츠' then array['식비','배달음식']\n    when p_store ~* '넷플릭스|NETFLIX|유튜브|YOUTUBE|멜론|지니뮤직|스포티파이|SPOTIFY|디즈니|DISNEY|티빙|웨이브|쿠팡와우|와우멤버십|네이버플러스|애플뮤직|ICLOUD|APPLE\\.COM' then array['주거/고정비','구독']\n    when p_store ~* 'CGV|메가박스|롯데시네마|영화|티켓링크|인터파크|공연|뮤지컬' then array['여가/문화','영화/공연']\n    when p_store ~* '호텔|리조트|펜션|모텔|야놀자|여기어때|에어비앤비|AIRBNB|아고다|AGODA|대한항공|아시아나|제주항공|진에어|티웨이|에어부산|하나투어|모두투어' then array['여가/문화','여행/숙박']\n    when p_store ~* '헬스|피트니스|필라테스|요가|골프|볼링|수영장|클라이밍|스포츠센터' then array['여가/문화','운동/취미']\n    when p_store ~* '교보문고|영풍문고|알라딘|예스24|YES24|서점' then array['여가/문화','도서']\n    when p_store ~* '무신사|지그재그|에이블리|29CM|W컨셉|유니클로|UNIQLO|ZARA|H&M|탑텐|스파오|에잇세컨즈|나이키|NIKE|아디다스|뉴발란스' then array['쇼핑/미용','의류/잡화']\n    when p_store ~* '올리브영|아리따움|이니스프리|세포라|롭스' then array['쇼핑/미용','화장품']\n    when p_store ~* '하이마트|전자랜드|디지털프라자|LG전자|삼성전자|애플스토어|이케아|IKEA|한샘|오늘의집|까사미아' then array['쇼핑/미용','가전/가구']\n    when p_store ~* '미용실|미용원|헤어|바버|BARBER|이발|네일|국화살롱' then array['쇼핑/미용','미용실']\n    when p_store ~* '쿠팡|네이버페이|스마트스토어|11번가|G마켓|지마켓|옥션|컬리|SSG|알리익스프레스|테무' then array['장보기','온라인쇼핑']\n    when p_store ~* '다이소|모던하우스' then array['장보기','생활용품']\n    when p_store ~* '이마트|홈플러스|롯데마트|하나로|코스트코|트레이더스|빅마켓|메가마트' then array['장보기','대형마트']\n    when p_store ~ '마트|슈퍼|식자재|할인점' and p_store !~ '스마트' then array['장보기','동네마트/슈퍼']\n    when p_store ~* '어린이집|유치원|학원|공부방|키즈클럽' then array['육아/교육','어린이집/학원']\n    when p_store ~* '토이저러스|장난감|완구|아이들나라' then array['육아/교육','장난감/책']\n    when p_store ~* '베이비|유아용품|분유|기저귀' then array['육아/교육','아기용품']\n    when p_store ~* '약국' then array['의료/건강','약국']\n    when p_store ~* '치과' then array['의료/건강','치과']\n    when p_store ~* '병원|의원|소아과|산부인과|내과|이비인후과|피부과|안과|정형외과|한의원|검진' then array['의료/건강','병원']\n    when p_store ~* '꽃집|플라워|FLOWER|화원' then array['경조사/선물','선물']\n    when p_store ~* '스타벅스|STARBUCKS|투썸|카페|커피|베이커리|파리바게|뚜레쥬르|성심당|메가MGC|빽다방|이디야|컴포즈|배스킨|던킨' then array['식비','카페/간식']\n    when p_store ~* '한우|갈비|식당|회관|김밥|분식|국밥|돈까스|피자|치킨|버거|맥도날드|롯데리아|명가|맘스터치|서브웨이' then array['식비','외식/회식']\n    when p_store ~* '관리비' then array['주거/고정비','관리비']\n    when p_store ~* '도시가스|한전|한국전력|수도요금|상수도|가스공사' then array['주거/고정비','공과금']\n    when p_store ~* '보험|삼성생명|한화생명|교보생명|라이나|메리츠|현대해상|삼성화재|흥국화재|DB손해|KB손해|한화손해|롯데손해' then array['주거/고정비','보험']\n    when p_store ~* 'SK브로드밴드|SK텔레콤|SKT|케이티|LG유플러스|LGU\\+|통신요금'\n      or p_store ~* '(^|[^A-Z])KT([^A-Z]|$)' then array['주거/고정비','통신비']\n    when p_store ~* '백화점|롯데쇼핑|갤러리아|AK플라자|아울렛|아웃렛' then array['쇼핑/미용','의류/잡화']   -- [v1.73]\n    else array['기타','미분류']\n  end\n$$;\n\n-- 6-1. 카드 구분 (앱의 normalizeCardIssuer / extractCardFromSms / resolveCard와 같은 규칙) ----\n-- 카드사 이름 통일: '하나(구외한)', '하나카드' → '하나', '비씨카드사' → 'BC'\ncreate or replace function public.card_issuer_norm(p text)\nreturns text\nlanguage sql immutable\nas $$\n  select case\n    when p is null or btrim(p) = ''         then ''\n    when p ~* 'KB|국민'                     then 'KB국민'\n    when p ~* 'NH|농협'                     then 'NH농협'\n    when p ~* 'IBK|기업'                    then 'IBK기업'\n    when p ~* 'BC|비씨'                     then 'BC'\n    when p ~  '씨티|시티'                   then '씨티'\n    when p ~  '하나|외환'                   then '하나'\n    when p ~  '카카오'                      then '카카오뱅크'\n    when p ~  '토스'                        then '토스뱅크'\n    when p ~* '케이뱅크|K뱅크'              then '케이뱅크'\n    when p ~* 'SC'                          then 'SC제일'\n    when p ~* 'DGB|대구'                    then 'DGB대구'\n    when p ~* 'MG|새마을'                   then 'MG새마을'\n    when p ~  '신한'   then '신한'    when p ~ '삼성'   then '삼성'\n    when p ~  '현대'   then '현대'    when p ~ '롯데'   then '롯데'\n    when p ~  '우리'   then '우리'    when p ~ '수협'   then '수협'\n    when p ~  '광주'   then '광주'    when p ~ '전북'   then '전북'\n    when p ~  '제주'   then '제주'    when p ~ '부산'   then '부산'\n    when p ~  '경남'   then '경남'    when p ~* 'BNK'   then 'BNK'\n    when p ~  '우체국' then '우체국'  when p ~ '저축은행' then '저축은행'\n    when p ~  '신협'   then '신협'\n    else left(btrim(regexp_replace(p, '\\(.*?\\)|(신용|체크)?카드(사)?|체크|신용|\\s+', '', 'g')), 12)\n  end\n$$;\n\n-- 카드번호 뒤 4자리 비교 (*는 아무 숫자): '1*3*' ↔ '1234' 같음\ncreate or replace function public.card_num_match(a text, b text)\nreturns boolean\nlanguage sql immutable\nas $$\n  select coalesce(char_length(a) = 4 and char_length(b) = 4\n    and (substr(a,1,1) = substr(b,1,1) or substr(a,1,1) = '*' or substr(b,1,1) = '*')\n    and (substr(a,2,1) = substr(b,2,1) or substr(a,2,1) = '*' or substr(b,2,1) = '*')\n    and (substr(a,3,1) = substr(b,3,1) or substr(a,3,1) = '*' or substr(b,3,1) = '*')\n    and (substr(a,4,1) = substr(b,4,1) or substr(a,4,1) = '*' or substr(b,4,1) = '*'), false)\n$$;\n\n-- 카드사 대표 발신번호 → 카드사 (문자에 카드사 이름이 없을 때만 사용. 예: 롯데카드 'KT LOCA X구독 3*2*')\ncreate or replace function public.card_issuer_by_sender(p_sender text)\nreturns text\nlanguage sql immutable\nas $$\n  select case regexp_replace(coalesce(p_sender, ''), '[^0-9]', '', 'g')\n      when '15881688' then 'KB국민' when '15447000' then '신한' when '15888700' then '삼성'\n      when '15776000' then '현대'   when '15888100' then '롯데' when '18001111' then '하나'\n      when '15889955' then '우리'   when '16444000' then 'NH농협' when '15884000' then 'BC'\n      else '' end\n$$;\n\n-- 문자에서 카드사·번호 찾기\n--   카드사: 금액(…원) 앞부분의 첫 카드사 이름 → 없으면 발신번호로\n--   번호: 금액 앞부분에서 숫자가 섞인 4자리([0-9*]) → 없으면 문자 전체에서 별표가 섞인 4자리 ('3*2*')\n--   '신한카드(1234)승인', 'KB국민카드1*3*승인', '하나(0625) 승인', '삼성1234승인' → {신한,1234} …\ncreate or replace function public.parse_card_ref(p_body text)\nreturns text[]\nlanguage plpgsql immutable\nas $$\ndeclare\n  full_t text;\n  head   text;\n  mm     text[];\n  iss    text := '';\n  num    text := '';\nbegin\n  full_t := replace(coalesce(p_body, ''), '＊', '*');\n  head := regexp_replace(full_t, '보낸\\s*사람[^\\n]*', '', 'g');\n  full_t := head;\n  head := (regexp_split_to_array(head, '[0-9][0-9,]*\\s*원'))[1];\n  iss := public.card_issuer_norm((regexp_match(head,\n    'KB국민|국민|KB|신한|삼성|현대|롯데|하나|외환|우리|NH농협|농협|NH|IBK기업|IBK|기업|비씨|BC|씨티|시티|카카오뱅크|카카오|토스뱅크|토스|케이뱅크|K뱅크|수협|광주|전북|제주|부산|경남|DGB|대구|BNK|SC제일|SC|우체국|저축은행|새마을|MG|신협'))[1]);\n  for mm in select regexp_matches(head, '(^|[^0-9*,./:\\-])([0-9*]{4})($|[^0-9*,./:\\-])', 'g') loop\n    if mm[2] ~ '[0-9]' then num := mm[2]; exit; end if;\n  end loop;\n  if num = '' then\n    for mm in select regexp_matches(full_t, '(^|[^0-9*,./:\\-])([0-9*]{4})($|[^0-9*,./:\\-])', 'g') loop\n      if mm[2] ~ '[0-9]' and mm[2] ~ '\\*' then num := mm[2]; exit; end if;\n    end loop;\n  end if;\n  if coalesce(iss, '') = '' then\n    iss := public.card_issuer_by_sender((regexp_match(coalesce(p_body, ''), '보낸\\s*사람\\s*[:：]?\\s*([0-9][0-9\\- ]{6,})'))[1]);\n  end if;\n  -- [v1.68] RCS 알림처럼 보낸사람이 번호가 아니라 '롯데카드' 같은 이름이면 그 이름에서 카드사\n  if coalesce(iss, '') = '' then\n    iss := public.card_issuer_norm((regexp_match((regexp_match(coalesce(p_body, ''), '보낸\\s*사람\\s*[:：]?\\s*([^\\n]+)'))[1],\n      'KB국민|국민|KB|신한|삼성|현대|롯데|하나|외환|우리|NH농협|농협|NH|IBK기업|IBK|기업|비씨|BC|씨티|시티|카카오뱅크|카카오|토스뱅크|토스|케이뱅크|K뱅크|수협|광주|전북|제주|부산|경남|DGB|대구|BNK|SC제일|SC|우체국|저축은행|새마을|MG|신협'))[1]);\n  end if;\n  return array[coalesce(iss, ''), num];\nend;\n$$;\n\n-- 카드 목록에서 그 카드의 대표 카드 찾기 → 주인(남편/아내) 반환\n--   ① 카드사·번호가 똑같은 카드 ② 없으면 번호가 맞는(* 포함) 같은 카드사 카드들이 모두 한 대표 카드일 때\n--   (번호가 없는 문자는 카드사만으로 주인을 정하지 않음 → 문자를 보낸 폰의 사람이 결제자)\ncreate or replace function public.card_owner(p_cards jsonb, p_issuer text, p_num text)\nreturns text\nlanguage plpgsql immutable\nas $$\ndeclare\n  hit   jsonb;\n  roots text[];\n  cur   jsonb;\n  i     int;\nbegin\n  if coalesce(p_num, '') = '' or p_cards is null or jsonb_typeof(p_cards) <> 'array' then return null; end if;\n\n  select e into hit from jsonb_array_elements(p_cards) e\n   where e->>'issuer' = p_issuer and e->>'num' = p_num limit 1;\n\n  if hit is null then\n    select array_agg(distinct r) into roots from (\n      select (\n        with recursive chain(c, depth) as (\n          select e, 0\n          union all\n          select (select x from jsonb_array_elements(p_cards) x where x->>'id' = chain.c->>'link_to' limit 1), depth + 1\n            from chain where coalesce(chain.c->>'link_to', '') <> '' and depth < 5\n        )\n        select c->>'id' from chain where c is not null order by depth desc limit 1\n      ) r\n      from jsonb_array_elements(p_cards) e\n      where e->>'issuer' = p_issuer and public.card_num_match(e->>'num', p_num)\n    ) t;\n    if roots is null or array_length(roots, 1) <> 1 then return null; end if;\n    select e into hit from jsonb_array_elements(p_cards) e where e->>'id' = roots[1] limit 1;\n  end if;\n\n  cur := hit;\n  for i in 1..5 loop\n    exit when cur is null or coalesce(cur->>'link_to', '') = '';\n    hit := cur;\n    select e into cur from jsonb_array_elements(p_cards) e where e->>'id' = hit->>'link_to' limit 1;\n  end loop;\n  if cur is null then cur := hit; end if;\n\n  -- 카드 주인 = 구성원 key (남편·아내·m3 …). 비어 있으면 미지정\n  if coalesce(cur->>'owner', '') <> '' then return cur->>'owner'; end if;\n  return null;\nend;\n$$;\n\n-- 7. 문자 해석·등록 본체 (직접 부르지 않음 → receive_sms / receive_sms_raw / reprocess_sms가 부름) ----\n--    sms_text에 '보낸사람 : 번호' 줄이 있으면 발신번호 목록과 대조합니다.\n-- [v1.73] 가맹점 줄로 쓸 수 있는지 (안내·카드 이름·가려진 이름·금액·전화번호 줄이 아니면 true)\ncreate or replace function public.sms_store_line_ok(p text)\nreturns boolean\nlanguage sql\nimmutable\nas $$\n  select btrim(coalesce(p, '')) <> '' and not (\n    -- 카드 이름 줄만 거름 ('현대카드 ZERO', '체크카드', '카드(1234)'). '스타벅스카드충전' 같은 가맹점은 남김\n    p ~ '^(KB국민|국민|KB|신한|삼성|현대|롯데|하나|외환|우리|NH농협|농협|NH|IBK기업|IBK|기업|비씨|BC|씨티|시티|카카오뱅크|카카오|토스뱅크|토스|케이뱅크|K뱅크|수협|광주|전북|제주|부산|경남|DGB|대구|BNK|SC제일|SC|우체국|저축은행|새마을|MG|신협)\\S*카드|^(체크|신용|법인|선불|기프트)?카드(\\s|$)|카드\\s*[(\\[]|체크\\s*\\(|https?://|www\\.'\n    or p ~ 'Web발신|승인|취소|누적|일시불|할부|보낸\\s*사람|발신|수신|잔액|적립|안내|문의'\n    or p ~ '[0-9][0-9,]*\\s*원'\n    or p ~ '^[0-9+\\-\\s:/.]+$'\n    or p ~ '^[*■▶•\\-]'\n    or p ~ '^\\[.*\\]$'\n    or p ~ '^[가-힣A-Za-z]{1,3}\\*[가-힣A-Za-z]{0,3}님?$'\n    or p ~ '[가-힣]\\*[가-힣]'                         -- 가려진 이름이 든 줄 ('이*재 KT LOCA X구독 3*2*')\n    or p ~ '^(KB국민|국민|KB|신한|삼성|현대|롯데|하나|외환|우리|NH농협|농협|NH|IBK기업|IBK|기업|비씨|BC|씨티|시티|카카오뱅크|카카오|토스뱅크|토스|케이뱅크|K뱅크|수협|광주|전북|제주|부산|경남|DGB|대구|BNK|SC제일|SC|우체국|저축은행|새마을|MG|신협)\\S{0,6}\\s*[(\\[]?[0-9*]{4}[)\\]]?$'\n    or p ~ '(01[016789]|02|0[3-8][0-9]|15[0-9]{2}|16[0-9]{2}|18[0-9]{2})[-\\s]?[0-9]{3,4}[-\\s]?[0-9]{4}'\n  );\n$$;\n\ncreate or replace function public.receive_sms_core(\n  sms_text   text,\n  payer_name text default '남편',\n  fam_code   text default ''\n)\nreturns json\nlanguage plpgsql\nsecurity definer\nset search_path = public\nas $$\ndeclare\n  cfg       public.family_config%rowtype;\n  body      text := coalesce(sms_text, '');\n  sender    text;\n  is_cancel boolean;\n  amt       integer;\n  dm        text[];\n  y int; m int; d int;\n  kst_now   timestamp := now() at time zone 'Asia/Seoul';\n  d_str     text;\n  v_store   text := '';\n  v_pre     text := '';\n  fixed_id  text;\n  fixed_n   int := 0;\n  ln        text;\n  tail      text;\n  cat       text[];\n  new_id    text;\n  card      text[];\n  v_payer   text;\nbegin\n  select * into cfg from public.family_config where family_code = coalesce(fam_code, '');\n  if not found then\n    return json_build_object('status', 'error', 'reason', '등록되지 않은 가족 코드');\n  end if;\n  -- [v1.73] 줄바꿈 없는 공백(NBSP)·전각 공백은 보통 공백으로, 폭 없는 공백은 지움\n  body := translate(body, E'\\u00a0\\u3000\\u200b\\ufeff', '  ');\n\n  -- (1) 발신번호 검사\n  sender := regexp_replace(coalesce((regexp_match(body, '보낸\\s*사람\\s*[:：]?\\s*([0-9][0-9\\- ]{6,})'))[1], ''), '[^0-9]', '', 'g');\n  if jsonb_array_length(cfg.allowed_senders) > 0 and sender <> ''\n     and not exists (select 1 from jsonb_array_elements_text(cfg.allowed_senders) s\n                     where regexp_replace(s, '[^0-9]', '', 'g') = sender) then\n    return json_build_object('status', 'ignored', 'reason', '등록되지 않은 발신번호', 'sender', sender);\n  end if;\n\n  -- (1-1) 후불 교통대금 문자: 교통카드 기능이 있는 카드는 탈 때마다 문자가 없고, 모아서 이 문자 한 통이 옴\n  --   '[KB국민체크]이*재님 교통대금 23,200원 11/04 체크결제계좌(607)에서 출금예정 (11/03기준)'\n  --   → 교통/차량 › 대중교통, 날짜는 기준일, 부가세 0. '출금 완료'처럼 예정·기준이 없는 문자는 같은 돈이라 등록 안 함\n  if body !~ '\\(광고\\)|무료\\s*수신\\s*거부|수신거부|설문|실태조사|당첨|경품|추첨'\n     and body ~ '교통\\s*(대금|요금)\\s*[0-9][0-9,]*\\s*원' and body ~ '예정|기준' then\n    amt := nullif(replace((regexp_match(body, '교통\\s*(?:대금|요금)\\s*([0-9][0-9,]*)\\s*원'))[1], ',', ''), '')::integer;\n    if amt is null or amt <= 0 then\n      return json_build_object('status', 'ignored', 'reason', '금액 없음');\n    end if;\n    dm := regexp_match(body, '(\\d{1,2})\\s*[/.]\\s*(\\d{1,2})\\s*기준');\n    begin\n      m := dm[1]::int; d := dm[2]::int;\n      y := extract(year from kst_now)::int;\n      if make_date(y, m, d) > kst_now::date then y := y - 1; end if;\n      d_str := to_char(make_date(y, m, d), 'YYYY-MM-DD') || ' 00:00';\n    exception when others then\n      d_str := to_char(kst_now, 'YYYY-MM-DD') || ' 00:00';\n    end;\n    v_store := '후불교통대금';\n    if exists (select 1 from public.expenses\n               where family_code = cfg.family_code and date = d_str and amount = amt and expenses.store = v_store) then\n      return json_build_object('status', 'duplicate_ignored', 'store', v_store, 'amount', amt, 'date', d_str);\n    end if;\n    card := public.parse_card_ref(body);\n    v_payer := coalesce(public.card_owner(cfg.cards, card[1], card[2]), nullif(payer_name, ''), '남편');\n    new_id := 'auto-' || replace(gen_random_uuid()::text, '-', '');\n    insert into public.expenses (id, family_code, date, store, category, sub_category,\n                                 amount, tax, payer, source, memo, updated_by,\n                                 card_issuer, card_num, pay_method)\n    values (new_id, cfg.family_code, d_str, v_store, '교통/차량', '대중교통',\n            amt, 0, v_payer, '자동문자수신',\n            '',   -- 메모는 사용자가 쓰는 칸 (등록 경로는 source, 원문·발신번호는 문자 수신 기록에)\n            'AUTO_WEBHOOK', card[1], card[2], '카드');\n    insert into public.sync_signals (signal_id, updated_at) values (cfg.signal_id, now())\n    on conflict (signal_id) do update set updated_at = now();\n    return json_build_object('status', 'success', 'id', new_id, 'store', v_store, 'amount', amt, 'date', d_str,\n                             'category', '교통/차량', 'sub_category', '대중교통',\n                             'card_issuer', card[1], 'card_num', card[2], 'payer', v_payer);\n  end if;\n\n  -- (2) 카드 승인/취소 문자인지 검사: 광고 문구 없음 + '승인/취소' + 결제 일시\n  if body ~ '\\(광고\\)|무료\\s*수신\\s*거부|수신거부|설문|실태조사|당첨|경품|추첨'\n     or body !~ '승인|취소'\n     or body !~ '\\d{1,2}\\s*[/.\\-]\\s*\\d{1,2}\\s+\\d{1,2}:\\d{2}' then\n    return json_build_object('status', 'ignored', 'reason', '카드 승인 문자 아님');\n  end if;\n\n  is_cancel := body ~ '(승인|결제|매출|체크|할부|카드(\\(\\d+\\))?)\\s*취소|취소\\s*(승인|완료|접수)|[0-9]\\s*원\\s*취소|(^|\\s)취소(\\s|$)';   -- '6,500원 취소'(롯데), '현대 kt M할인형 취소'(현대)\n\n  -- (3) 금액\n  amt := nullif(replace((regexp_match(body, '([0-9][0-9,]*)\\s*원'))[1], ',', ''), '')::integer;\n  if amt is null or amt <= 0 then\n    return json_build_object('status', 'ignored', 'reason', '금액 없음');\n  end if;\n  if is_cancel then amt := -amt; end if;\n\n  -- (4) 결제 일시 (연도 없으면 올해, 오늘보다 미래면 작년)\n  dm := regexp_match(body, '(?:(20\\d{2})\\s*[/.\\-]\\s*)?(\\d{1,2})\\s*[/.\\-]\\s*(\\d{1,2})\\s+(\\d{1,2}):(\\d{2})');\n  begin\n    m := dm[2]::int; d := dm[3]::int;\n    y := coalesce(dm[1]::int, extract(year from kst_now)::int);\n    if dm[1] is null and make_date(y, m, d) > kst_now::date then y := y - 1; end if;\n    d_str := to_char(make_date(y, m, d), 'YYYY-MM-DD') || ' ' || lpad(dm[4], 2, '0') || ':' || dm[5];\n  exception when others then\n    d_str := to_char(kst_now, 'YYYY-MM-DD HH24:MI');\n  end;\n\n  -- (5) 가맹점: 안내 줄을 걸러낸 마지막 줄, 없으면 금액 뒤 텍스트\n  foreach ln in array string_to_array(replace(body, chr(13), ''), chr(10)) loop\n    -- [v1.74] 줄 앞의 '[Web발신]'은 떼고 봄 ('[Web발신] 롯데쇼핑㈜ 인천점 VISA' → 가맹점 줄. 예전에는 Web발신 줄로 보고 버렸음)\n    ln := regexp_replace(btrim(ln), '^[\\[(]?\\s*Web\\s*발신\\s*[\\])]?\\s*', '', 'i');\n    ln := btrim(regexp_replace(btrim(ln), '\\s*(승인|취소)$', ''));   -- 'KTX 승차권 승인' → 'KTX 승차권'\n    -- [v1.73] '롯데쇼핑㈜ 인천점 VISA 191,860원 승인'처럼 가맹점과 금액이 한 줄이면 금액 앞부분 (가맹점 줄이 따로 없을 때만 씀)\n    if v_pre = '' and ln ~ '\\S\\s+[0-9][0-9,]*\\s*원$' then\n      tail := btrim((regexp_match(ln, '^(.*\\S)\\s+[0-9][0-9,]*\\s*원$'))[1]);\n      if public.sms_store_line_ok(tail) then v_pre := tail; end if;\n    end if;\n    continue when not public.sms_store_line_ok(ln);\n    v_store := ln;\n  end loop;\n  if v_store = '' then v_store := v_pre; end if;\n\n  if v_store = '' then\n    tail := (regexp_match(body, '[0-9][0-9,]*\\s*원([^\\n]*)'))[1];\n    if tail is not null then\n      tail := regexp_replace(tail, '^\\s*(승인|취소)(\\s|$)', ' ');   -- [v1.73] '191,860원  승인' 뒤에 가맹점이 없으면 '승인'이 가맹점이 되지 않게\n      tail := regexp_replace(tail, '^\\s*\\(?(일시불|할부|[0-9]+개월)\\)?\\s*', '');\n      tail := regexp_replace(tail, '^\\s*(?:20\\d{2}\\s*[/.\\-]\\s*)?\\d{1,2}\\s*[/.\\-]\\s*\\d{1,2}\\s+\\d{1,2}:\\d{2}\\s*', '');\n      tail := regexp_replace(tail, '^\\s*\\(?(일시불|할부|[0-9]+개월)\\)?\\s*', '');\n      tail := regexp_replace(tail, '\\s*(누적|잔액|보낸\\s*사람).*$', '');\n      v_store := btrim(tail);\n    end if;\n  end if;\n  -- [v1.73] 끝에 붙은 카드 브랜드는 뺌 ('롯데쇼핑㈜ 인천점 VISA' → '롯데쇼핑㈜ 인천점')\n  if v_store ~ '\\S\\s+(VISA|Visa|MASTER|Master|MasterCard|MASTERCARD|AMEX|Amex|JCB|UnionPay|UPI)$' then\n    v_store := btrim(regexp_replace(v_store, '\\s+(VISA|Visa|MASTER|Master|MasterCard|MASTERCARD|AMEX|Amex|JCB|UnionPay|UPI)$', ''));\n  end if;\n  if v_store = '' then v_store := '카드결제가맹점'; end if;\n\n  -- (5-1) [v1.73] 같은 결제가 가맹점을 못 읽은 채('승인'·'취소'·'카드결제가맹점') 이미 들어와 있으면 → 새로 넣지 않고 가맹점만 바로잡음\n  --   (해석 규칙을 고친 뒤 📨 기록에서 [다시 처리]할 때)\n  if v_store <> '카드결제가맹점' then\n    cat := public.store_category(v_store);\n    with u as (\n      update public.expenses e\n         set store = v_store,\n             category = case when coalesce(e.category, '') in ('', '기타') then cat[1] else e.category end,\n             sub_category = case when coalesce(e.category, '') in ('', '기타') then cat[2] else e.sub_category end,\n             updated_by = 'sms_reprocess'\n       where e.family_code = cfg.family_code and e.date = d_str and e.amount = amt\n         and e.store in ('승인', '취소', '카드결제가맹점') and e.source in ('자동문자수신', '승인취소문자')\n       returning e.id\n    ) select min(id), count(*) into fixed_id, fixed_n from u;\n    if fixed_n > 0 then\n      insert into public.sync_signals (signal_id, updated_at) values (cfg.signal_id, now())\n      on conflict (signal_id) do update set updated_at = now();\n      return json_build_object('status', 'store_fixed',
